<svg xmlns="http://www.w3.org/2000/svg" width="620" height="164" viewBox="0 0 620 164" role="img" aria-labelledby="title desc">
  <title id="title">Visual and Accessibility Quality Engineering</title>
  <desc id="desc">Selected engineering system. Visual-diff and accessibility oracles with explicit baseline and evidence boundaries.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28D7FF"/>
      <stop offset="0.52" stop-color="#00FBCC"/>
      <stop offset="1" stop-color="#A020F0"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28D7FF" stop-opacity=".07"/>
      <stop offset=".5" stop-color="#00FBCC" stop-opacity=".035"/>
      <stop offset="1" stop-color="#A020F0" stop-opacity=".07"/>
    </linearGradient>
  </defs>
  <style>
    .surface{fill:#FFFFFF;stroke:#D0D7DE}.ink{fill:#1F2328}.muted{fill:#57606A}.chip{fill:#F6F8FA;stroke:#D8DEE4}.chiptext{fill:#3D444D}.topology{fill:none;stroke-linecap:round;stroke-linejoin:round}.node{fill:#FFFFFF}
    @media (prefers-color-scheme: dark){.surface{fill:#0D1117;stroke:#30363D}.ink{fill:#F0F6FC}.muted{fill:#8B949E}.chip{fill:#161B22;stroke:#30363D}.chiptext{fill:#C9D1D9}.node{fill:#0D1117}}
  </style>
  <rect x="1" y="1" width="618" height="162" rx="16" class="surface"/>
  <rect x="2" y="2" width="616" height="160" rx="15" fill="url(#wash)"/>
  <path d="M356 18h52l18 22h54l22-18h96" class="topology" stroke="#28D7FF" stroke-opacity=".16"/>
  <path d="M360 143h56l20-18h66l22 16h74" class="topology" stroke="#00FBCC" stroke-opacity=".15"/>
  <path d="M454 20c18 16 28 35 18 54s2 42 28 64" class="topology" stroke="#A020F0" stroke-opacity=".14"/>
  <g stroke-width="1.5">
    <circle cx="426" cy="40" r="3.5" class="node" stroke="#28D7FF"/><circle cx="502" cy="22" r="3.5" class="node" stroke="#A020F0"/><circle cx="436" cy="125" r="3.5" class="node" stroke="#00FBCC"/><circle cx="524" cy="141" r="3.5" class="node" stroke="#28D7FF"/>
  </g>
