<svg xmlns="http://www.w3.org/2000/svg" width="620" height="190" viewBox="0 0 620 190" role="img" aria-labelledby="title desc" data-system-card="selected-engineering-systems-v3">
  <title id="title">Visual and Accessibility Quality Engineering</title>
  <desc id="desc">Selected engineering system. Visual-diff and accessibility oracles with explicit baseline and evidence boundaries.</desc>
  <defs>
