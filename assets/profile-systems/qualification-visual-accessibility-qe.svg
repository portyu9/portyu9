  <text x="40" y="92" class="ink" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="550">Visual evidence · accessibility oracle discipline</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing=".25">
