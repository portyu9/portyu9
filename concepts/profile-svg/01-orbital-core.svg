<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Ƴunior Ƥortal — Orbital Core</title>
<desc id="desc">Wide pure-vector Quality Engineering profile banner with an orbital proof core and evidence-driven positioning.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02030A"/>
    <stop offset=".55" stop-color="#06091A"/>
    <stop offset="1" stop-color="#021227"/>
  </linearGradient>
  <linearGradient id="spectral" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF3DF2"/>
    <stop offset=".34" stop-color="#B64CFF"/>
    <stop offset=".68" stop-color="#4B86FF"/>
    <stop offset="1" stop-color="#00E5FF"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#00E5FF" stop-opacity=".26"/>
    <stop offset=".55" stop-color="#7C4DFF" stop-opacity=".10"/>
    <stop offset="1" stop-color="#02030A" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#6E9DFF" stroke-opacity=".045"/>
  </pattern>
  
</defs>
<rect width="1600" height="520" rx="28" fill="url(#bg)"/>
<rect width="1600" height="520" rx="28" fill="url(#grid)"/>

<rect x="4" y="4" width="1592" height="512" rx="26" fill="none" stroke="url(#spectral)" stroke-opacity=".46" stroke-width="2"/>
<path d="M38 72H520l28 28h250" fill="none" stroke="#B64CFF" stroke-opacity=".56" stroke-width="2"/>
<circle cx="38" cy="72" r="4" fill="#FF3DF2" filter="url(#glow)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="76" y="118" fill="#CFC5FF" font-size="24" font-weight="760" letter-spacing="4">QUALITY ENGINEERING // ORBITAL CORE</text>
  <text x="74" y="205" fill="url(#spectral)" font-size="70" font-weight="850">Ƴunior Ƥortal</text>
  <text x="76" y="266" fill="#F5F8FF" font-size="34" font-weight="800" letter-spacing="1.5">ENGINEER CHANGE INTO EVIDENCE</text>
  <text x="76" y="310" fill="#B5C6DB" font-size="24" font-weight="620">Then turn attributable evidence into decision-grade confidence.</text>
  <path d="M76 348H790" stroke="#4268B5" stroke-opacity=".35"/>
  <text x="76" y="392" fill="#D9E7F8" font-size="22" font-weight="700" letter-spacing="1.2">AI  •  WEB  •  API  •  GRAPHQL  •  MOBILE  •  PERFORMANCE  •  ACCESSIBILITY</text>
  <text x="76" y="438" fill="#7F96B5" font-size="20" font-weight="650">Reason deliberately  •  Execute deterministically  •  Prove what the evidence supports</text>
</g>
<g transform="translate(1242 258)">
  <circle r="205" fill="url(#halo)"/>
  <circle r="158" fill="#050A19" stroke="#395FC8" stroke-opacity=".55" stroke-width="2"/>
  <circle r="128" fill="none" stroke="#B64CFF" stroke-opacity=".55" stroke-width="10" stroke-dasharray="190 615" transform="rotate(-55)"/>
  <circle r="104" fill="none" stroke="#00E5FF" stroke-opacity=".75" stroke-width="8" stroke-dasharray="160 500" transform="rotate(35)"/>
  <circle r="74" fill="#081126" stroke="url(#spectral)" stroke-width="2"/>
  <text y="-8" text-anchor="middle" fill="#F5F8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="850">QE</text>
  <text y="30" text-anchor="middle" fill="#8EEFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" letter-spacing="2">PROOF CORE</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760">
    <rect x="-210" y="-188" width="150" height="48" rx="14" fill="#071020" stroke="#C54CFF" stroke-opacity=".6"/>
    <text x="-135" y="-157" text-anchor="middle" fill="#F0C8FF">EVIDENCE</text>
    <rect x="62" y="-188" width="165" height="48" rx="14" fill="#071020" stroke="#707BFF" stroke-opacity=".6"/>
    <text x="145" y="-157" text-anchor="middle" fill="#D3D7FF">ATTRIBUTION</text>
    <rect x="62" y="140" width="165" height="48" rx="14" fill="#071020" stroke="#00DFFF" stroke-opacity=".6"/>
    <text x="145" y="171" text-anchor="middle" fill="#B5F7FF">CONFIDENCE</text>
  </g>
</g>
</svg>