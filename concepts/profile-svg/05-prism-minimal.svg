  <text x="72" y="203" fill="url(#spectral)" font-size="76" font-weight="860">Ƴunior Ƥortal</text>
  <text x="74" y="265" fill="#F7FAFF" font-size="34" font-weight="820">ENGINEERED CONFIDENCE</text>
  <text x="74" y="316" fill="#B3C4D9" font-size="24" font-weight="620">Evidence that can be traced. Oracles that can be explained.</text>
  <text x="74" y="354" fill="#B3C4D9" font-size="24" font-weight="620">Automation that preserves attribution.</text>
  <path d="M74 392H855" stroke="#4563A8" stroke-opacity=".34"/>
  <text x="74" y="438" fill="#879CB8" font-size="21" font-weight="680">AI  •  WEB  •  API  •  GRAPHQL  •  MOBILE  •  PERFORMANCE  •  ACCESSIBILITY</text>
</g>
<g transform="translate(1280 260)" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
  <text y="-12" fill="#F5F8FF" font-size="34" font-weight="850">CHANGE</text>
  <text y="34" fill="#8EEFFF" font-size="26" font-weight="820">→ PROOF →</text>
  <text y="76" fill="#F2CCFF" font-size="26" font-weight="820">DECISION</text>
