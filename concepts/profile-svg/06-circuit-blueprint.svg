  <path d="M1325 360H1395" stroke="#00DFFF" stroke-width="3" stroke-opacity=".72"/><path d="M1378 348l18 12-18 12" fill="none" stroke="#00DFFF" stroke-width="3"/>
  <rect x="1410" y="328" width="146" height="64" rx="18" fill="#071020" stroke="#00DFFF" stroke-opacity=".6"/>
