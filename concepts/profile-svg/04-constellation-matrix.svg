  <text y="-4" text-anchor="middle" fill="#F7FBFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="850">QE</text>
  <text y="27" text-anchor="middle" fill="#8EEFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760">CORE</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">
