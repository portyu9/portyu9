    <g transform="translate(22 -158)"><circle r="42" fill="#0A1024" stroke="#A35CFF"/><text y="6" fill="#E3D0FF">WEB</text></g>
    <g transform="translate(132 -108)"><circle r="42" fill="#0A1024" stroke="#6C75FF"/><text y="6" fill="#D4D8FF">API</text></g>
    <g transform="translate(162 58)"><circle r="42" fill="#0A1024" stroke="#2D9CFF"/><text y="6" fill="#C4E6FF">MOBILE</text></g>
    <g transform="translate(76 154)"><circle r="42" fill="#0A1024" stroke="#00DFFF"/><text y="6" fill="#B2F6FF">PERF</text></g>
    <g transform="translate(-108 112)"><circle r="42" fill="#0A1024" stroke="#4D87FF"/><text y="6" fill="#CBE9FF">A11Y</text></g>
