name: One-shot Dependabot PR list advisory trust measurement
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.13.16"
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout immutable accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9cc6779752b817340f57db7e67029b183a8c31d9
          fetch-depth: 0
          persist-credentials: false
      - name: Set up trusted Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Measure frozen protected-source diff without authorization
        env:
          TRUSTED_BASE: 9cc6779752b817340f57db7e67029b183a8c31d9
          FROZEN_HEAD: 5e51b9a864aa84d0e12bc893c46fc11ce4cc8479
          FROZEN_TREE: abaacae86575b716789154effde48538a1db1ecd
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_BASE"
          test "$(git rev-parse HEAD:scripts/workflow_capability_admission.py)" = "a832c73cc3be625a8af9b5997c815b73c3520dab"
          python3 -B scripts/verify-python-runtime.py
          git fetch --no-tags --depth=1 origin "$FROZEN_HEAD"
          test "$(git rev-parse "$FROZEN_HEAD^{tree}")" = "$FROZEN_TREE"
          mkdir -p "$RUNNER_TEMP/frozen-dependabot-advisory-candidate"
          git archive "$FROZEN_HEAD" | tar -x -C "$RUNNER_TEMP/frozen-dependabot-advisory-candidate"
          test -z "$(git status --porcelain)"
          python3 -B scripts/workflow_capability_admission.py \
            "$RUNNER_TEMP/frozen-dependabot-advisory-candidate" \
            --candidate-tree-sha "$FROZEN_TREE" --measure
          test -z "$(git status --porcelain)"
