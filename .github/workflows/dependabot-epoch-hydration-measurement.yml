name: One-shot Dependabot profile epoch hydration authorization measurement
on:
  pull_request:
    paths:
      - ".github/workflows/dependabot-epoch-hydration-measurement.yml"
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.13.16"
jobs:
  measure:
    name: measure-frozen-trusted-epoch-hydration
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout frozen accepted-main evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7d9d77a70e7189ab2476ae3a940987ca819822ba
          path: trusted
          persist-credentials: false
      - name: Checkout immutable code candidate as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e9760541077f36df9139e6d6a3c2381bcd40992e
          path: candidate
          persist-credentials: false
      - name: Install reviewed pinned runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Measure exact candidate protected-source expansion without executing candidate code
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "7d9d77a70e7189ab2476ae3a940987ca819822ba"
          test "$(git -C candidate rev-parse HEAD)" = "e9760541077f36df9139e6d6a3c2381bcd40992e"
          python3 trusted/scripts/verify-python-runtime.py
          TREE_SHA="$(git -C candidate rev-parse 'HEAD^{tree}')"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Trusted SHA 7d9d77a70e7189ab2476ae3a940987ca819822ba; candidate SHA e9760541077f36df9139e6d6a3c2381bcd40992e; candidate tree $TREE_SHA"
          python3 trusted/scripts/workflow_capability_admission.py candidate \
            --candidate-tree-sha "$TREE_SHA" --measure
