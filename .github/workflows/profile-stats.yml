name: Update profile stats

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"
      - "scripts/customize-signal-field.py"
      - "scripts/polish-signal-field-v2.py"
      - "scripts/enhance-signal-field-v2.py"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: source

      - name: Checkout generated artifact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: generated
          path: artifacts

      - name: Generate signal-field cards
        id: stats
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: portyu9
          token: ${{ github.token }}
          profile: signal-field

      - name: Apply profile theme contract
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/customize-signal-field.py "$READY_DIR"

      - name: Apply Signal Field v2.1 polish contract
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/polish-signal-field-v2.py "$READY_DIR"

      - name: Apply Signal Field v2.2 evidence contract
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/enhance-signal-field-v2.py "$READY_DIR"

      - name: Stage complete themed artifact set
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          mkdir -p artifacts/profile-stats/profile
          cp "$READY_DIR"/signal-field-*.svg artifacts/profile-stats/profile/
          test -s artifacts/profile-stats/profile/signal-field-wide-light.svg
          test -s artifacts/profile-stats/profile/signal-field-wide-dark.svg
          test -s artifacts/profile-stats/profile/signal-field-compact-light.svg
          test -s artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-theme="yunior-portal-neon-v2"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-theme="yunior-portal-neon-v2"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-theme="yunior-portal-neon-v2"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          grep -q 'data-theme="yunior-portal-neon-v2"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-polish="signal-field-v2.1"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-polish="signal-field-v2.1"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-polish="signal-field-v2.1"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          grep -q 'data-polish="signal-field-v2.1"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-enhancement="signal-field-v2.2"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-enhancement="signal-field-v2.2"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-enhancement="signal-field-v2.2"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          grep -q 'data-enhancement="signal-field-v2.2"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-intensity-scale="github-contribution-levels-0-4"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-count-semantics="raw-github-contribution-counts"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-evidence-footer="true"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-activity-layout="month-calendar-v2"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-activity-layout="month-calendar-v2"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-activity-columns="7"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-activity-columns="7"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-activity-summary="true"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-latest-day="true"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-latest-outline="outer"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          git -C artifacts add profile-stats/profile/signal-field-*.svg

      - name: Publish changed artifact set
        run: |
          if git -C artifacts diff --cached --quiet; then
            exit 0
          fi
          git -C artifacts config user.name github-actions[bot]
          git -C artifacts config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C artifacts commit -m "chore: update themed profile stats [skip ci]"
          git -C artifacts push origin HEAD:generated
