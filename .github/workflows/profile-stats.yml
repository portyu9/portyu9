name: Update profile stats

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"
      - ".github/ATTESTATION.md"
      - ".github/attestation/**"
      - "scripts/signal_field_pipeline.py"
      - "scripts/signal-field-pipeline-v1.json"
      - "scripts/signal-field-pipeline-v2.json"
      - "scripts/customize-signal-field.py"
      - "scripts/polish-signal-field-v2.py"
      - "scripts/enhance-signal-field-v2.py"
      - "scripts/background-signal-field-v2.py"
      - "scripts/portal-signal-field-v2.py"
      - "scripts/align-signal-field-v2.py"
      - "scripts/phosphor-signal-field-v2.py"
      - "scripts/phosphor-activity-signal-field-v2.py"
      - "scripts/phosphor-lines-signal-field-v2.py"
      - "scripts/sync-profile-contribution-total.py"
      - "scripts/relabel-signal-field-metrics.py"
      - "scripts/glyphs-signal-field-metrics.py"
      - "scripts/balance-signal-field-secondary-metrics.py"
      - "scripts/clarify-signal-field-evidence-window.py"
      - "scripts/identify-signal-field-evidence.py"
      - "scripts/polish-signal-field-evidence-v215.py"
      - "scripts/balance-signal-field-issues-label.py"
      - "scripts/validate-signal-field-v213.py"
      - "scripts/validate-signal-field-v214.py"
      - "scripts/set-signal-field-refresh-cadence.py"
      - "scripts/finalize-signal-field-wide-alignment.py"
      - "scripts/validate-generated-signal-field.py"
      - "scripts/generate-engineering-spotlight.py"
      - "scripts/generate-engineering-spotlight-from-ledger.py"
      - "scripts/engineering_spotlight_v2.py"
      - "scripts/engineering_spotlight_v21.py"
      - "scripts/validate-engineering-spotlight.py"
      - "scripts/validate_engineering_spotlight_v2.py"
      - "scripts/validate_engineering_spotlight_v21.py"
      - "scripts/generate-portfolio-evidence-ledger.py"
      - "scripts/validate-portfolio-evidence-ledger.py"
      - "scripts/build-profile-evidence-attestation.py"
      - "scripts/validate-profile-attestation-contract.py"
      - "scripts/profile-evidence-subjects-v1.json"
      - "scripts/profile_evidence_subjects.py"
      - "scripts/stage-profile-evidence.py"
      - "scripts/validate-profile-evidence-subjects.py"
  schedule:
    # Two best-effort refresh opportunities per hour, away from top-of-hour congestion.
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: update-profile-stats
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  generate:
    name: generate-read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate upstream Signal Field
        id: stats
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: portyu9
          token: ${{ github.token }}
          profile: signal-field

      - name: Apply Signal Field contracts
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: portyu9
        run: |
          set -euo pipefail
          python3 source/scripts/signal_field_pipeline.py "$READY_DIR"

      - name: Upload immutable validated Signal Field
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal-field-svg
          path: ${{ steps.stats.outputs.ready-dir }}/signal-field-*.svg
          if-no-files-found: error
          retention-days: 1

      - name: Generate Portfolio Evidence Ledger once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf portfolio-ledger-ready
          python3 source/scripts/generate-portfolio-evidence-ledger.py portfolio-ledger-ready
          python3 source/scripts/validate-portfolio-evidence-ledger.py portfolio-ledger-ready --require-live

      - name: Upload immutable validated Portfolio Evidence Ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-evidence-ledger
          path: portfolio-ledger-ready/portfolio-evidence-ledger.json
          if-no-files-found: error
          retention-days: 1

      - name: Render deterministic daily Engineering Spotlight from Ledger
        run: |
          set -euo pipefail
          rm -rf spotlight-ready
          python3 source/scripts/generate-engineering-spotlight.py spotlight-ready --ledger portfolio-ledger-ready/portfolio-evidence-ledger.json
          python3 source/scripts/validate-engineering-spotlight.py spotlight-ready --ledger portfolio-ledger-ready/portfolio-evidence-ledger.json --require-live

      - name: Upload immutable validated Engineering Spotlight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-spotlight-svg
          path: spotlight-ready/*
          if-no-files-found: error
          retention-days: 1

  attest:
    name: attest-validated-evidence
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout trusted source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Checkout current generated evidence without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated
          path: published
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download validated Signal Field for attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signal-field-svg
          path: profile-stats/profile
          digest-mismatch: error

      - name: Download validated Engineering Spotlight for attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-spotlight-svg
          path: engineering-spotlight
          digest-mismatch: error

      - name: Download validated Portfolio Evidence Ledger for attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portfolio-evidence-ledger
          path: portfolio-evidence
          digest-mismatch: error

      - name: Revalidate attestation boundary
        run: |
          set -euo pipefail
          python3 source/scripts/validate-signal-field-v213.py profile-stats/profile
          python3 source/scripts/validate-signal-field-v214.py profile-stats/profile
          python3 source/scripts/validate-generated-signal-field.py profile-stats/profile
          python3 source/scripts/validate-portfolio-evidence-ledger.py portfolio-evidence --require-live
          python3 source/scripts/validate-engineering-spotlight.py engineering-spotlight --require-live --ledger portfolio-evidence/portfolio-evidence-ledger.json
          python3 source/scripts/validate-profile-evidence-subjects.py \
            --signal-field-dir profile-stats/profile \
            --spotlight-dir engineering-spotlight \
            --portfolio-ledger-dir portfolio-evidence

      - name: Determine whether scheduled evidence changed
        id: delta
        run: |
          set -euo pipefail
          rm -rf candidate-profile-evidence
          python3 source/scripts/stage-profile-evidence.py candidate-profile-evidence \
            --signal-field-dir profile-stats/profile \
            --spotlight-dir engineering-spotlight \
            --portfolio-ledger-dir portfolio-evidence
          python3 source/scripts/validate-profile-evidence-subjects.py --published-root published
          if diff -qr candidate-profile-evidence published >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build profile evidence attestation predicate
        if: github.event_name != 'schedule' || steps.delta.outputs.changed == 'true'
        run: python3 source/scripts/build-profile-evidence-attestation.py profile-stats/profile portfolio-evidence attestation-predicate.json

      - name: Attest validated profile evidence
        if: github.event_name != 'schedule' || steps.delta.outputs.changed == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            profile-stats/profile/signal-field-*.svg
            engineering-spotlight/spotlight-*.svg
            portfolio-evidence/portfolio-evidence-ledger.json
          predicate-type: https://raw.githubusercontent.com/portyu9/portyu9/main/.github/attestation/profile-evidence-v3.schema.json
          predicate-path: attestation-predicate.json
          show-summary: true

  publish:
    name: publish-write-only
    needs: [generate, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout trusted source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Checkout generated artifact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated
          path: artifacts
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download validated Signal Field
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signal-field-svg
          path: publish-input
          digest-mismatch: error

      - name: Download validated Engineering Spotlight
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-spotlight-svg
          path: spotlight-publish-input
          digest-mismatch: error

      - name: Download validated Portfolio Evidence Ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portfolio-evidence-ledger
          path: portfolio-ledger-publish-input
          digest-mismatch: error

      - name: Revalidate publish boundary
        run: |
          set -euo pipefail
          python3 source/scripts/validate-signal-field-v213.py publish-input
          python3 source/scripts/validate-signal-field-v214.py publish-input
          python3 source/scripts/validate-generated-signal-field.py publish-input
          python3 source/scripts/validate-portfolio-evidence-ledger.py portfolio-ledger-publish-input --require-live
          python3 source/scripts/validate-engineering-spotlight.py spotlight-publish-input --ledger portfolio-ledger-publish-input/portfolio-evidence-ledger.json --require-live
          python3 source/scripts/validate-profile-evidence-subjects.py \
            --signal-field-dir publish-input \
            --spotlight-dir spotlight-publish-input \
            --portfolio-ledger-dir portfolio-ledger-publish-input

      - name: Stage artifact-only generated branch
        run: |
          set -euo pipefail
          find artifacts -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          python3 source/scripts/stage-profile-evidence.py artifacts \
            --signal-field-dir publish-input \
            --spotlight-dir spotlight-publish-input \
            --portfolio-ledger-dir portfolio-ledger-publish-input
          python3 source/scripts/validate-profile-evidence-subjects.py --published-root artifacts
          python3 source/scripts/validate-signal-field-v213.py artifacts/profile-stats/profile
          python3 source/scripts/validate-signal-field-v214.py artifacts/profile-stats/profile
          python3 source/scripts/validate-generated-signal-field.py artifacts/profile-stats/profile
          python3 source/scripts/validate-portfolio-evidence-ledger.py artifacts/portfolio-evidence --require-live
          git -C artifacts add -A

      - name: Publish changed artifact set
        run: |
          set -euo pipefail
          if git -C artifacts diff --cached --quiet; then
            echo "Generated profile evidence is already current."
            exit 0
          fi
          git -C artifacts config user.name github-actions[bot]
          git -C artifacts config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C artifacts commit -m "chore: publish validated profile evidence [skip ci]"
          git -C artifacts push origin HEAD:generated
