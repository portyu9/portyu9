name: Update profile stats

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"
      - "scripts/customize-signal-field.py"
      - "scripts/polish-signal-field-v2.py"
      - "scripts/enhance-signal-field-v2.py"
      - "scripts/background-signal-field-v2.py"
      - "scripts/portal-signal-field-v2.py"
      - "scripts/align-signal-field-v2.py"
      - "scripts/phosphor-signal-field-v2.py"
      - "scripts/phosphor-activity-signal-field-v2.py"
      - "scripts/phosphor-lines-signal-field-v2.py"
      - "scripts/sync-profile-contribution-total.py"
      - "scripts/relabel-signal-field-metrics.py"
      - "scripts/glyphs-signal-field-metrics.py"
      - "scripts/balance-signal-field-secondary-metrics.py"
      - "scripts/clarify-signal-field-evidence-window.py"
      - "scripts/validate-signal-field-v213.py"
      - "scripts/validate-generated-signal-field.py"
      - "scripts/generate-engineering-spotlight.py"
      - "scripts/validate-engineering-spotlight.py"
  schedule:
    # Offset from the top of the hour to reduce scheduled-run congestion.
    - cron: "2-57/5 * * * *"

permissions:
  contents: read

concurrency:
  group: update-profile-stats
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  generate:
    name: generate-read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate upstream Signal Field
        id: stats
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: portyu9
          token: ${{ github.token }}
          profile: signal-field

      - name: Apply Signal Field contracts
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: portyu9
        run: |
          set -euo pipefail
          python3 source/scripts/customize-signal-field.py "$READY_DIR"
          python3 source/scripts/polish-signal-field-v2.py "$READY_DIR"
          python3 source/scripts/enhance-signal-field-v2.py "$READY_DIR"
          python3 source/scripts/background-signal-field-v2.py "$READY_DIR"
          python3 source/scripts/portal-signal-field-v2.py "$READY_DIR"
          python3 source/scripts/align-signal-field-v2.py "$READY_DIR"
          python3 source/scripts/phosphor-signal-field-v2.py "$READY_DIR"
          python3 source/scripts/phosphor-activity-signal-field-v2.py "$READY_DIR"
          python3 source/scripts/phosphor-lines-signal-field-v2.py "$READY_DIR"
          python3 source/scripts/sync-profile-contribution-total.py "$READY_DIR"
          python3 source/scripts/relabel-signal-field-metrics.py "$READY_DIR"
          python3 source/scripts/glyphs-signal-field-metrics.py "$READY_DIR"
          python3 source/scripts/balance-signal-field-secondary-metrics.py "$READY_DIR"
          python3 source/scripts/clarify-signal-field-evidence-window.py "$READY_DIR"
          python3 source/scripts/validate-signal-field-v213.py "$READY_DIR"
          python3 source/scripts/validate-generated-signal-field.py "$READY_DIR"

      - name: Upload immutable validated Signal Field
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signal-field-svg
          path: ${{ steps.stats.outputs.ready-dir }}/signal-field-*.svg
          if-no-files-found: error
          retention-days: 1

      - name: Generate deterministic daily Engineering Spotlight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf spotlight-ready
          python3 source/scripts/generate-engineering-spotlight.py spotlight-ready
          python3 source/scripts/validate-engineering-spotlight.py spotlight-ready --require-live

      - name: Upload immutable validated Engineering Spotlight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineering-spotlight-svg
          path: spotlight-ready/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish-write-only
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout trusted source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Checkout generated artifact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated
          path: artifacts
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download validated Signal Field
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: signal-field-svg
          path: publish-input

      - name: Download validated Engineering Spotlight
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: engineering-spotlight-svg
          path: spotlight-publish-input

      - name: Revalidate publish boundary
        run: |
          set -euo pipefail
          python3 source/scripts/validate-signal-field-v213.py publish-input
          python3 source/scripts/validate-generated-signal-field.py publish-input
          python3 source/scripts/validate-engineering-spotlight.py spotlight-publish-input --require-live

      - name: Stage artifact-only generated branch
        run: |
          set -euo pipefail
          find artifacts -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p artifacts/profile-stats/profile artifacts/engineering-spotlight
          cp publish-input/signal-field-*.svg artifacts/profile-stats/profile/
          cp spotlight-publish-input/* artifacts/engineering-spotlight/
          python3 source/scripts/validate-signal-field-v213.py artifacts/profile-stats/profile
          python3 source/scripts/validate-generated-signal-field.py artifacts/profile-stats/profile
          python3 source/scripts/validate-engineering-spotlight.py artifacts/engineering-spotlight --require-live
          git -C artifacts add -A

      - name: Publish changed artifact set
        run: |
          set -euo pipefail
          if git -C artifacts diff --cached --quiet; then
            echo "Generated profile evidence is already current."
            exit 0
          fi
          git -C artifacts config user.name github-actions[bot]
          git -C artifacts config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C artifacts commit -m "chore: publish validated profile evidence [skip ci]"
          git -C artifacts push origin HEAD:generated
