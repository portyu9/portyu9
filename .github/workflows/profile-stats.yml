name: Update profile stats

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"
      - "scripts/customize-signal-field.py"
      - "scripts/polish-signal-field-v2.py"
      - "scripts/enhance-signal-field-v2.py"
      - "scripts/background-signal-field-v2.py"
      - "scripts/portal-signal-field-v2.py"
      - "scripts/align-signal-field-v2.py"
      - "scripts/phosphor-signal-field-v2.py"
      - "scripts/phosphor-activity-signal-field-v2.py"
      - "scripts/phosphor-lines-signal-field-v2.py"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: source

      - name: Checkout generated artifact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: generated
          path: artifacts

      - name: Generate signal-field cards
        id: stats
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: portyu9
          token: ${{ github.token }}
          profile: signal-field

      - name: Apply profile theme contract
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/customize-signal-field.py "$READY_DIR"

      - name: Apply Signal Field v2.1 polish contract
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/polish-signal-field-v2.py "$READY_DIR"

      - name: Apply Signal Field v2.2 evidence contract
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/enhance-signal-field-v2.py "$READY_DIR"

      - name: Apply Signal Field v2.3 topology background
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/background-signal-field-v2.py "$READY_DIR"

      - name: Apply Signal Field v2.4 dimensional portal
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/portal-signal-field-v2.py "$READY_DIR"

      - name: Apply Signal Field v2.5 layout alignment
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/align-signal-field-v2.py "$READY_DIR"

      - name: Apply Signal Field v2.6 phosphorescent metrics
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/phosphor-signal-field-v2.py "$READY_DIR"

      - name: Apply Signal Field v2.7 phosphorescent activity telemetry
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/phosphor-activity-signal-field-v2.py "$READY_DIR"

      - name: Apply Signal Field v2.8 phosphorescent metric lines
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: python3 source/scripts/phosphor-lines-signal-field-v2.py "$READY_DIR"

      - name: Stage complete themed artifact set
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          mkdir -p artifacts/profile-stats/profile
          cp "$READY_DIR"/signal-field-*.svg artifacts/profile-stats/profile/
          test -s artifacts/profile-stats/profile/signal-field-wide-light.svg
          test -s artifacts/profile-stats/profile/signal-field-wide-dark.svg
          test -s artifacts/profile-stats/profile/signal-field-compact-light.svg
          test -s artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-theme="yunior-portal-neon-v2"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-theme="yunior-portal-neon-v2"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-theme="yunior-portal-neon-v2"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          grep -q 'data-theme="yunior-portal-neon-v2"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-polish="signal-field-v2.1"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-polish="signal-field-v2.1"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-polish="signal-field-v2.1"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          grep -q 'data-polish="signal-field-v2.1"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-enhancement="signal-field-v2.2"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-enhancement="signal-field-v2.2"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-enhancement="signal-field-v2.2"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          grep -q 'data-enhancement="signal-field-v2.2"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-background="signal-field-v2.3"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-background="signal-field-v2.3"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-background="signal-field-v2.3"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          grep -q 'data-background="signal-field-v2.3"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-background-layer="evidence-topology"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-portal="signal-field-v2.4"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-portal="signal-field-v2.4"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-portal="signal-field-v2.4"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          grep -q 'data-portal="signal-field-v2.4"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-portal-layer="dimensional-core"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-metric-layout="signal-field-v2.5"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-metric-layout="signal-field-v2.5"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          ! grep -q 'data-metric-layout="signal-field-v2.5"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          ! grep -q 'data-metric-layout="signal-field-v2.5"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-day-alignment="centered-month-boundary"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-day-alignment="centered-month-boundary"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-metric-phosphor="signal-field-v2.6"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-metric-phosphor="signal-field-v2.6"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-metric-phosphor="signal-field-v2.6"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          grep -q 'data-metric-phosphor="signal-field-v2.6"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-metric-phosphor="contributions"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-metric-phosphor="stars"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-metric-phosphor="pull_requests"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-metric-phosphor="issues"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-activity-phosphor="signal-field-v2.7"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-activity-phosphor="signal-field-v2.7"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-activity-phosphor="signal-field-v2.7"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          grep -q 'data-activity-phosphor="signal-field-v2.7"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-telemetry-phosphor="active"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-telemetry-phosphor="streak"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-telemetry-phosphor="peak_date"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-telemetry-phosphor="peak_count"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-telemetry-phosphor="peak_count"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-line-phosphor="signal-field-v2.8"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-line-phosphor="signal-field-v2.8"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-line-phosphor="signal-field-v2.8"' artifacts/profile-stats/profile/signal-field-compact-light.svg
          grep -q 'data-line-phosphor="signal-field-v2.8"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-metric-phosphor-line="contributions"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-metric-phosphor-line="stars"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-metric-phosphor-line="pull_requests"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-metric-phosphor-line="issues"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-metric-phosphor-line="contributions"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-metric-phosphor-line="stars"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-metric-phosphor-line="pull_requests"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-metric-phosphor-line="issues"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-refresh-cadence="5-minutes"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'Refresh cadence: every 5 minutes.' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-intensity-scale="github-contribution-levels-0-4"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-count-semantics="raw-github-contribution-counts"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-evidence-footer="true"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          grep -q 'data-activity-layout="month-calendar-v2"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-activity-layout="month-calendar-v2"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-activity-columns="7"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-activity-columns="7"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-activity-summary="true"' artifacts/profile-stats/profile/signal-field-wide-light.svg
          grep -q 'data-latest-day="true"' artifacts/profile-stats/profile/signal-field-wide-dark.svg
          grep -q 'data-latest-outline="outer"' artifacts/profile-stats/profile/signal-field-compact-dark.svg
          git -C artifacts add profile-stats/profile/signal-field-*.svg

      - name: Publish changed artifact set
        run: |
          if git -C artifacts diff --cached --quiet; then
            exit 0
          fi
          git -C artifacts config user.name github-actions[bot]
          git -C artifacts config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C artifacts commit -m "chore: update themed profile stats [skip ci]"
          git -C artifacts push origin HEAD:generated
