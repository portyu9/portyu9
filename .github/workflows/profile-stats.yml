name: Update profile stats

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"
      - "scripts/profile-stats-source-epoch-v1.json"
  schedule:
    # One best-effort hourly fallback, offset from top-of-hour scheduler congestion.
    - cron: "17 * * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.15"

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    name: generate-read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: profile-stats-planning
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 source/scripts/verify-python-runtime.py

      - name: Generate upstream Signal Field
        id: stats
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: portyu9
          token: ${{ github.token }}
          profile: signal-field

      - name: Generate canonical profile evidence
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: portyu9
        run: |
          set -euo pipefail
          python3 source/scripts/generate-profile-evidence.py \
            --signal-field-dir "$READY_DIR" \
            --portfolio-ledger-dir portfolio-ledger-ready \
            --spotlight-dir spotlight-ready

      - name: Upload immutable validated Signal Field
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal-field-svg
          path: ${{ steps.stats.outputs.ready-dir }}/signal-field-*.svg
          if-no-files-found: error
          retention-days: 1

      - name: Upload immutable validated Portfolio Evidence Ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-evidence-ledger
          path: portfolio-ledger-ready/portfolio-evidence-ledger.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload immutable validated Engineering Spotlight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-spotlight-svg
          path: spotlight-ready/*
          if-no-files-found: error
          retention-days: 1

  attest:
    name: prepare-attestation-read-only
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    concurrency:
      group: profile-stats-planning
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.delta.outputs.changed }}
      generated_sha: ${{ steps.candidate.outputs.generated_sha }}
      predicate_sha256: ${{ steps.candidate.outputs.predicate_sha256 }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}

    steps:
      - name: Checkout trusted source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Checkout current generated evidence without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated
          path: published
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 source/scripts/verify-python-runtime.py

      - name: Download validated Signal Field for attestation preparation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signal-field-svg
          path: profile-stats/profile
          digest-mismatch: error

      - name: Download validated Engineering Spotlight for attestation preparation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-spotlight-svg
          path: engineering-spotlight
          digest-mismatch: error

      - name: Download validated Portfolio Evidence Ledger for attestation preparation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portfolio-evidence-ledger
          path: portfolio-evidence
          digest-mismatch: error

      - name: Revalidate attestation boundary
        run: |
          set -euo pipefail
          python3 source/scripts/validate-profile-evidence-boundary.py \
            --signal-field-dir profile-stats/profile \
            --spotlight-dir engineering-spotlight \
            --portfolio-ledger-dir portfolio-evidence

      - name: Determine whether scheduled evidence changed
        id: delta
        run: |
          set -euo pipefail
          rm -rf candidate-profile-evidence
          python3 source/scripts/stage-profile-evidence.py candidate-profile-evidence \
            --signal-field-dir profile-stats/profile \
            --spotlight-dir engineering-spotlight \
            --portfolio-ledger-dir portfolio-evidence
          python3 source/scripts/validate-profile-evidence-subjects.py --published-root published
          if diff -qr --exclude=.git candidate-profile-evidence published >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build profile evidence attestation predicate
        if: github.event_name != 'schedule' || steps.delta.outputs.changed == 'true'
        run: python3 source/scripts/build-profile-evidence-attestation.py profile-stats/profile portfolio-evidence attestation-predicate.json

      - name: Seal profile transaction candidate identity
        id: candidate
        if: github.event_name != 'schedule' || steps.delta.outputs.changed == 'true'
        run: |
          set -euo pipefail
          SOURCE_SHA="$GITHUB_SHA"
          GENERATED_SHA="$(git -C published rev-parse HEAD)"
          PREDICATE_SHA256="$(sha256sum attestation-predicate.json | cut -d' ' -f1)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GENERATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREDICATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$SOURCE_SHA" "$GENERATED_SHA" "$PREDICATE_SHA256" | sha256sum | cut -d' ' -f1)"
          [[ "$CANDIDATE_ID" =~ ^[0-9a-f]{64}$ ]]
          echo "generated_sha=$GENERATED_SHA" >> "$GITHUB_OUTPUT"
          echo "predicate_sha256=$PREDICATE_SHA256" >> "$GITHUB_OUTPUT"
          echo "candidate_id=$CANDIDATE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload reviewed attestation predicate
        if: github.event_name != 'schedule' || steps.delta.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-evidence-attestation-predicate
          path: attestation-predicate.json
          if-no-files-found: error
          retention-days: 1

  lease:
    if: github.event_name != 'schedule' || needs.attest.outputs.changed == 'true'
    name: mint-mutation-lease-read-only
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: profile-stats-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
    outputs:
      lease_id: ${{ steps.lease.outputs.lease_id }}
      issued_at: ${{ steps.lease.outputs.issued_at }}
      expires_at: ${{ steps.lease.outputs.expires_at }}
      base_sha: ${{ steps.lease.outputs.base_sha }}
      candidate_id: ${{ steps.lease.outputs.candidate_id }}

    steps:
      - name: Mint exact short-lived mutation lease
        id: lease
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.sha }}
          GENERATED_SHA: ${{ needs.attest.outputs.generated_sha }}
          PREDICATE_SHA256: ${{ needs.attest.outputs.predicate_sha256 }}
          CANDIDATE_ID: ${{ needs.attest.outputs.candidate_id }}
        run: |
          set -euo pipefail
          LEASE_TTL_SECONDS=1800
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GENERATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREDICATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_ID" =~ ^[0-9a-f]{64}$ ]]
          EXPECTED_CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$BASE_SHA" "$GENERATED_SHA" "$PREDICATE_SHA256" | sha256sum | cut -d' ' -f1)"
          test "$CANDIDATE_ID" = "$EXPECTED_CANDIDATE_ID"
          [[ "$GITHUB_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/profile-stats.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$BASE_SHA"
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          test "$(jq -r .id <<<"$RUN")" = "$GITHUB_RUN_ID"
          test "$(jq -r .run_attempt <<<"$RUN")" = "$GITHUB_RUN_ATTEMPT"
          test "$(jq -r .head_sha <<<"$RUN")" = "$BASE_SHA"
          test "$(jq -r .head_branch <<<"$RUN")" = "main"
          test "$(jq -r .path <<<"$RUN")" = ".github/workflows/profile-stats.yml"
          test "$(jq -r .repository.id <<<"$RUN")" = "$GITHUB_REPOSITORY_ID"
          test "$(jq -r .head_repository.id <<<"$RUN")" = "$GITHUB_REPOSITORY_ID"
          REMOTE_GENERATED="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/generated)"
          [[ "$REMOTE_GENERATED" =~ ^([0-9a-f]{40})[[:space:]]refs/heads/generated$ ]]
          test "${BASH_REMATCH[1]}" = "$GENERATED_SHA"
          ISSUED_AT="$(date -u +%s)"
          [[ "$ISSUED_AT" =~ ^[1-9][0-9]*$ ]]
          EXPIRES_AT=$((ISSUED_AT + LEASE_TTL_SECONDS))
          LEASE_ID="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" ".github/workflows/profile-stats.yml" \
            "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$BASE_SHA" "$CANDIDATE_ID" "$ISSUED_AT" "$EXPIRES_AT" | sha256sum | cut -d' ' -f1)"
          [[ "$LEASE_ID" =~ ^[0-9a-f]{64}$ ]]
          echo "lease_id=$LEASE_ID" >> "$GITHUB_OUTPUT"
          echo "issued_at=$ISSUED_AT" >> "$GITHUB_OUTPUT"
          echo "expires_at=$EXPIRES_AT" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_id=$CANDIDATE_ID" >> "$GITHUB_OUTPUT"

  attest_publish:
    if: github.event_name != 'schedule' || needs.attest.outputs.changed == 'true'
    name: attest-write-only
    needs: [attest, lease]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    concurrency:
      group: profile-stats-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Verify exact short-lived mutation lease
        env:
          LEASE_ID: ${{ needs.lease.outputs.lease_id }}
          LEASE_ISSUED_AT: ${{ needs.lease.outputs.issued_at }}
          LEASE_EXPIRES_AT: ${{ needs.lease.outputs.expires_at }}
          LEASE_BASE_SHA: ${{ needs.lease.outputs.base_sha }}
          LEASE_CANDIDATE_ID: ${{ needs.lease.outputs.candidate_id }}
          EXPECTED_BASE_SHA: ${{ github.sha }}
          EXPECTED_CANDIDATE_ID: ${{ needs.attest.outputs.candidate_id }}
        run: |
          set -euo pipefail
          LEASE_TTL_SECONDS=1800
          LEASE_MIN_REMAINING_SECONDS=300
          [[ "$LEASE_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LEASE_ISSUED_AT" =~ ^[1-9][0-9]*$ ]]
          [[ "$LEASE_EXPIRES_AT" =~ ^[1-9][0-9]*$ ]]
          test "$LEASE_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_CANDIDATE_ID" = "$EXPECTED_CANDIDATE_ID"
          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/profile-stats.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_EXPIRES_AT" -eq $((LEASE_ISSUED_AT + LEASE_TTL_SECONDS))
          NOW_EPOCH="$(date -u +%s)"
          test "$NOW_EPOCH" -ge "$LEASE_ISSUED_AT"
          test "$NOW_EPOCH" -lt "$LEASE_EXPIRES_AT"
          test $((LEASE_EXPIRES_AT - NOW_EPOCH)) -ge "$LEASE_MIN_REMAINING_SECONDS"
          EXPECTED_LEASE_ID="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" ".github/workflows/profile-stats.yml" \
            "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$LEASE_BASE_SHA" "$LEASE_CANDIDATE_ID" "$LEASE_ISSUED_AT" "$LEASE_EXPIRES_AT" | sha256sum | cut -d' ' -f1)"
          test "$EXPECTED_LEASE_ID" = "$LEASE_ID"

      - name: Download validated Signal Field for terminal attestation
        if: github.event_name != 'schedule' || needs.attest.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signal-field-svg
          path: profile-stats/profile
          digest-mismatch: error

      - name: Download validated Engineering Spotlight for terminal attestation
        if: github.event_name != 'schedule' || needs.attest.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-spotlight-svg
          path: engineering-spotlight
          digest-mismatch: error

      - name: Download validated Portfolio Evidence Ledger for terminal attestation
        if: github.event_name != 'schedule' || needs.attest.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portfolio-evidence-ledger
          path: portfolio-evidence
          digest-mismatch: error

      - name: Download reviewed attestation predicate
        if: github.event_name != 'schedule' || needs.attest.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-evidence-attestation-predicate
          path: attestation-input
          digest-mismatch: error

      - name: Verify leased attestation predicate identity
        env:
          EXPECTED_PREDICATE_SHA256: ${{ needs.attest.outputs.predicate_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PREDICATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum attestation-input/attestation-predicate.json | cut -d' ' -f1)" = "$EXPECTED_PREDICATE_SHA256"

      - name: Attest validated profile evidence
        if: github.event_name != 'schedule' || needs.attest.outputs.changed == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            profile-stats/profile/signal-field-*.svg
            engineering-spotlight/spotlight-*.svg
            portfolio-evidence/portfolio-evidence-ledger.json
          predicate-type: https://raw.githubusercontent.com/portyu9/portyu9/main/.github/attestation/profile-evidence-v3.schema.json
          predicate-path: attestation-input/attestation-predicate.json
          show-summary: true

  stage:
    if: github.event_name != 'schedule' || needs.attest.outputs.changed == 'true'
    name: stage-publication-read-only
    needs: [generate, attest, lease, attest_publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    concurrency:
      group: profile-stats-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.seal.outputs.changed }}
      base_sha: ${{ steps.seal.outputs.base_sha }}
      candidate_sha: ${{ steps.seal.outputs.candidate_sha }}
      source_sha: ${{ steps.seal.outputs.source_sha }}

    steps:
      - name: Checkout trusted source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 source/scripts/verify-python-runtime.py

      - name: Download validated Signal Field for publication staging
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signal-field-svg
          path: publish-input
          digest-mismatch: error

      - name: Download validated Engineering Spotlight for publication staging
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-spotlight-svg
          path: spotlight-publish-input
          digest-mismatch: error

      - name: Download validated Portfolio Evidence Ledger for publication staging
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portfolio-evidence-ledger
          path: portfolio-ledger-publish-input
          digest-mismatch: error

      - name: Revalidate publication candidate boundary
        run: |
          set -euo pipefail
          python3 source/scripts/validate-profile-evidence-boundary.py \
            --signal-field-dir publish-input \
            --spotlight-dir spotlight-publish-input \
            --portfolio-ledger-dir portfolio-ledger-publish-input

      - name: Checkout generated artifact branch without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated
          path: artifacts
          fetch-depth: 0
          persist-credentials: false

      - name: Stage and seal exact generated publication candidate
        id: seal
        env:
          LEASED_GENERATED_SHA: ${{ needs.attest.outputs.generated_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          base_sha="$(git -C artifacts rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LEASED_GENERATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$source_sha" = "$GITHUB_SHA"
          test "$base_sha" = "$LEASED_GENERATED_SHA"
          test "$(git -C artifacts rev-parse refs/remotes/origin/generated)" = "$base_sha"
          test "$(git -C artifacts rev-parse --abbrev-ref HEAD)" = "generated"
          if git -C artifacts config --local --get-regexp '^(credential\.|http\..*\.extraheader|includeif\.)' >/dev/null; then
            echo "Credential-bearing Git configuration survived the read-only checkout." >&2
            exit 1
          fi
          find artifacts -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          python3 source/scripts/stage-profile-evidence.py artifacts \
            --signal-field-dir publish-input \
            --spotlight-dir spotlight-publish-input \
            --portfolio-ledger-dir portfolio-ledger-publish-input
          python3 source/scripts/validate-profile-evidence-subjects.py --published-root artifacts
          python3 source/scripts/validate-signal-field-v213.py artifacts/profile-stats/profile
          python3 source/scripts/validate-signal-field-v214.py artifacts/profile-stats/profile
          python3 source/scripts/validate-generated-signal-field.py artifacts/profile-stats/profile
          python3 source/scripts/validate-portfolio-evidence-ledger.py artifacts/portfolio-evidence --require-live
          git -C artifacts add -A
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          if git -C artifacts diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "Generated profile evidence is already current."
            exit 0
          fi
          git -C artifacts config user.name github-actions[bot]
          git -C artifacts config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C artifacts commit -m "chore: publish validated profile evidence [skip ci]"
          candidate_sha="$(git -C artifacts rev-parse HEAD)"
          test "$(git -C artifacts rev-parse HEAD^)" = "$base_sha"
          test "$(git -C artifacts rev-list --parents -n 1 HEAD | awk '{print NF}')" -eq 2
          test -z "$(git -C artifacts status --porcelain)"
          git -C artifacts bundle create ../generated-publication.bundle generated
          git -C artifacts bundle verify ../generated-publication.bundle
          test "$(git bundle list-heads generated-publication.bundle)" = "$candidate_sha refs/heads/generated"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Upload sealed generated publication candidate
        if: steps.seal.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-publication-candidate
          path: generated-publication.bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    if: needs.stage.outputs.changed == 'true'
    name: publish-write-only
    needs: [stage, lease, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: profile-stats-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write

    steps:
      - name: Verify exact short-lived mutation lease
        env:
          LEASE_ID: ${{ needs.lease.outputs.lease_id }}
          LEASE_ISSUED_AT: ${{ needs.lease.outputs.issued_at }}
          LEASE_EXPIRES_AT: ${{ needs.lease.outputs.expires_at }}
          LEASE_BASE_SHA: ${{ needs.lease.outputs.base_sha }}
          LEASE_CANDIDATE_ID: ${{ needs.lease.outputs.candidate_id }}
          EXPECTED_BASE_SHA: ${{ github.sha }}
          EXPECTED_CANDIDATE_ID: ${{ needs.attest.outputs.candidate_id }}
        run: |
          set -euo pipefail
          LEASE_TTL_SECONDS=1800
          LEASE_MIN_REMAINING_SECONDS=240
          [[ "$LEASE_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LEASE_ISSUED_AT" =~ ^[1-9][0-9]*$ ]]
          [[ "$LEASE_EXPIRES_AT" =~ ^[1-9][0-9]*$ ]]
          test "$LEASE_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_CANDIDATE_ID" = "$EXPECTED_CANDIDATE_ID"
          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/profile-stats.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_EXPIRES_AT" -eq $((LEASE_ISSUED_AT + LEASE_TTL_SECONDS))
          NOW_EPOCH="$(date -u +%s)"
          test "$NOW_EPOCH" -ge "$LEASE_ISSUED_AT"
          test "$NOW_EPOCH" -lt "$LEASE_EXPIRES_AT"
          test $((LEASE_EXPIRES_AT - NOW_EPOCH)) -ge "$LEASE_MIN_REMAINING_SECONDS"
          EXPECTED_LEASE_ID="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" ".github/workflows/profile-stats.yml" \
            "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$LEASE_BASE_SHA" "$LEASE_CANDIDATE_ID" "$LEASE_ISSUED_AT" "$LEASE_EXPIRES_AT" | sha256sum | cut -d' ' -f1)"
          test "$EXPECTED_LEASE_ID" = "$LEASE_ID"

      - name: Publication candidate already current
        if: needs.stage.outputs.changed == 'false'
        run: echo "Validated generated profile evidence is already current."

      - name: Download sealed generated publication candidate
        if: needs.stage.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-publication-candidate
          path: publication-candidate
          digest-mismatch: error

      - name: Verify sealed generated publication candidate
        if: needs.stage.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ needs.stage.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.stage.outputs.candidate_sha }}
          SOURCE_SHA: ${{ needs.stage.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BASE_SHA" != "$CANDIDATE_SHA"
          test "$(find publication-candidate -mindepth 1 -maxdepth 1 -type f -printf '%f\n')" = "generated-publication.bundle"
          test "$(git bundle list-heads publication-candidate/generated-publication.bundle)" = "$CANDIDATE_SHA refs/heads/generated"
          rm -rf artifacts
          git init -q artifacts
          git -C artifacts bundle verify ../publication-candidate/generated-publication.bundle
          git -C artifacts fetch -q ../publication-candidate/generated-publication.bundle refs/heads/generated:refs/heads/generated
          git -C artifacts checkout -q generated
          test "$(git -C artifacts rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C artifacts rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git -C artifacts rev-list --parents -n 1 HEAD | awk '{print NF}')" -eq 2
          test -z "$(git -C artifacts status --porcelain)"
          test "$(git -C artifacts log -1 --format=%s)" = "chore: publish validated profile evidence [skip ci]"
          test "$(git -C artifacts log -1 --format='%an <%ae>')" = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          test "$(git -C artifacts log -1 --format='%cn <%ce>')" = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          printf '%s\n' \
            engineering-spotlight/spotlight-1-dark.svg \
            engineering-spotlight/spotlight-1-light.svg \
            engineering-spotlight/spotlight-2-dark.svg \
            engineering-spotlight/spotlight-2-light.svg \
            engineering-spotlight/spotlight-3-dark.svg \
            engineering-spotlight/spotlight-3-light.svg \
            portfolio-evidence/portfolio-evidence-ledger.json \
            profile-stats/profile/signal-field-compact-dark.svg \
            profile-stats/profile/signal-field-compact-light.svg \
            profile-stats/profile/signal-field-wide-dark.svg \
            profile-stats/profile/signal-field-wide-light.svg \
            > expected-publication-paths.txt
          git -C artifacts ls-tree -r --name-only HEAD | LC_ALL=C sort > observed-publication-paths.txt
          LC_ALL=C sort -o expected-publication-paths.txt expected-publication-paths.txt
          diff -u expected-publication-paths.txt observed-publication-paths.txt
          test "$(git -C artifacts ls-tree -r HEAD | awk '{print $1}' | LC_ALL=C sort -u)" = "100644"
          if git -C artifacts config --local --get-regexp '^(credential\.|http\..*\.extraheader|includeif\.)' >/dev/null; then
            echo "Sealed publication candidate contains credential-bearing Git configuration." >&2
            exit 1
          fi
          git -C artifacts remote add origin https://github.com/portyu9/portyu9
          test "$(git -C artifacts remote get-url origin)" = "https://github.com/portyu9/portyu9"

      - name: Publish sealed artifact commit
        if: needs.stage.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.stage.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          REMOTE_MAIN="$(git -C artifacts ls-remote --exit-code origin refs/heads/main)"
          [[ "$REMOTE_MAIN" =~ ^([0-9a-f]{40})[[:space:]]refs/heads/main$ ]]
          test "${BASH_REMATCH[1]}" = "$SOURCE_SHA"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C artifacts -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push origin HEAD:generated

  receipt:
    if: needs.stage.outputs.changed == 'true'
    name: prepare-publication-receipt-read-only
    needs: [publish, stage, lease, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    concurrency:
      group: profile-stats-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    outputs:
      subject_sha256: ${{ steps.receipt.outputs.subject_sha256 }}
      predicate_sha256: ${{ steps.receipt.outputs.predicate_sha256 }}

    steps:
      - name: Checkout trusted source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Checkout actual published generated commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated
          path: published
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 source/scripts/verify-python-runtime.py

      - name: Build exact post-publication receipt
        id: receipt
        env:
          EXPECTED_GENERATED_SHA: ${{ needs.stage.outputs.candidate_sha }}
          EXPECTED_GENERATED_PARENT_SHA: ${{ needs.stage.outputs.base_sha }}
          TRANSACTION_CANDIDATE_ID: ${{ needs.attest.outputs.candidate_id }}
          MUTATION_LEASE_ID: ${{ needs.lease.outputs.lease_id }}
        run: |
          set -euo pipefail
          python3 source/scripts/build-profile-publication-receipt.py \
            published generated-publication-subject.json profile-publication-receipt.json
          SUBJECT_SHA256="$(sha256sum generated-publication-subject.json | cut -d' ' -f1)"
          PREDICATE_SHA256="$(sha256sum profile-publication-receipt.json | cut -d' ' -f1)"
          [[ "$SUBJECT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PREDICATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "subject_sha256=$SUBJECT_SHA256" >> "$GITHUB_OUTPUT"
          echo "predicate_sha256=$PREDICATE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-publication-receipt
          path: |
            generated-publication-subject.json
            profile-publication-receipt.json
          if-no-files-found: error
          retention-days: 1

  receipt_attest:
    if: needs.stage.outputs.changed == 'true'
    name: attest-publication-receipt-write-only
    needs: [receipt, lease, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: profile-stats-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download reviewed publication receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-publication-receipt
          path: receipt-input
          digest-mismatch: error

      - name: Verify exact short-lived mutation lease and receipt identity
        env:
          LEASE_ID: ${{ needs.lease.outputs.lease_id }}
          LEASE_ISSUED_AT: ${{ needs.lease.outputs.issued_at }}
          LEASE_EXPIRES_AT: ${{ needs.lease.outputs.expires_at }}
          LEASE_BASE_SHA: ${{ needs.lease.outputs.base_sha }}
          LEASE_CANDIDATE_ID: ${{ needs.lease.outputs.candidate_id }}
          EXPECTED_BASE_SHA: ${{ github.sha }}
          EXPECTED_CANDIDATE_ID: ${{ needs.attest.outputs.candidate_id }}
          EXPECTED_SUBJECT_SHA256: ${{ needs.receipt.outputs.subject_sha256 }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.receipt.outputs.predicate_sha256 }}
        run: |
          set -euo pipefail
          LEASE_TTL_SECONDS=1800
          LEASE_MIN_REMAINING_SECONDS=240
          [[ "$LEASE_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LEASE_ISSUED_AT" =~ ^[1-9][0-9]*$ ]]
          [[ "$LEASE_EXPIRES_AT" =~ ^[1-9][0-9]*$ ]]
          test "$LEASE_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_CANDIDATE_ID" = "$EXPECTED_CANDIDATE_ID"
          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/profile-stats.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_EXPIRES_AT" -eq $((LEASE_ISSUED_AT + LEASE_TTL_SECONDS))
          NOW_EPOCH="$(date -u +%s)"
          test "$NOW_EPOCH" -ge "$LEASE_ISSUED_AT"
          test "$NOW_EPOCH" -lt "$LEASE_EXPIRES_AT"
          test $((LEASE_EXPIRES_AT - NOW_EPOCH)) -ge "$LEASE_MIN_REMAINING_SECONDS"
          EXPECTED_LEASE_ID="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" ".github/workflows/profile-stats.yml" \
            "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$LEASE_BASE_SHA" "$LEASE_CANDIDATE_ID" "$LEASE_ISSUED_AT" "$LEASE_EXPIRES_AT" | sha256sum | cut -d' ' -f1)"
          test "$EXPECTED_LEASE_ID" = "$LEASE_ID"
          test "$(find receipt-input -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)" = $'generated-publication-subject.json\nprofile-publication-receipt.json'
          [[ "$EXPECTED_SUBJECT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum receipt-input/generated-publication-subject.json | cut -d' ' -f1)" = "$EXPECTED_SUBJECT_SHA256"
          test "$(sha256sum receipt-input/profile-publication-receipt.json | cut -d' ' -f1)" = "$EXPECTED_RECEIPT_SHA256"

      - name: Attest actual generated publication receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: receipt-input/generated-publication-subject.json
          predicate-type: https://raw.githubusercontent.com/portyu9/portyu9/main/.github/attestation/profile-publication-receipt-v1.schema.json
          predicate-path: receipt-input/profile-publication-receipt.json
          show-summary: true

  dispatch:
    name: dispatch-spotlight-link-sync
    needs: [receipt_attest, publish, lease, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: profile-stats-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      actions: write

    steps:
      - name: Verify exact short-lived mutation lease
        env:
          LEASE_ID: ${{ needs.lease.outputs.lease_id }}
          LEASE_ISSUED_AT: ${{ needs.lease.outputs.issued_at }}
          LEASE_EXPIRES_AT: ${{ needs.lease.outputs.expires_at }}
          LEASE_BASE_SHA: ${{ needs.lease.outputs.base_sha }}
          LEASE_CANDIDATE_ID: ${{ needs.lease.outputs.candidate_id }}
          EXPECTED_BASE_SHA: ${{ github.sha }}
          EXPECTED_CANDIDATE_ID: ${{ needs.attest.outputs.candidate_id }}
        run: |
          set -euo pipefail
          LEASE_TTL_SECONDS=1800
          LEASE_MIN_REMAINING_SECONDS=180
          [[ "$LEASE_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LEASE_ISSUED_AT" =~ ^[1-9][0-9]*$ ]]
          [[ "$LEASE_EXPIRES_AT" =~ ^[1-9][0-9]*$ ]]
          test "$LEASE_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_CANDIDATE_ID" = "$EXPECTED_CANDIDATE_ID"
          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/profile-stats.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_EXPIRES_AT" -eq $((LEASE_ISSUED_AT + LEASE_TTL_SECONDS))
          NOW_EPOCH="$(date -u +%s)"
          test "$NOW_EPOCH" -ge "$LEASE_ISSUED_AT"
          test "$NOW_EPOCH" -lt "$LEASE_EXPIRES_AT"
          test $((LEASE_EXPIRES_AT - NOW_EPOCH)) -ge "$LEASE_MIN_REMAINING_SECONDS"
          EXPECTED_LEASE_ID="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" ".github/workflows/profile-stats.yml" \
            "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$LEASE_BASE_SHA" "$LEASE_CANDIDATE_ID" "$LEASE_ISSUED_AT" "$LEASE_EXPIRES_AT" | sha256sum | cut -d' ' -f1)"
          test "$EXPECTED_LEASE_ID" = "$LEASE_ID"

      - name: Dispatch exact Spotlight reconciliation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/spotlight-link-sync.yml/dispatches" \
            -f ref=main
