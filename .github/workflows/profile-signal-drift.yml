name: Profile signal drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-profile-signal.mjs"
      - "assets/repository-signal.svg"

permissions:
  contents: read

concurrency:
  group: profile-repository-signal
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate repository signal from public metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: portyu9
        run: node scripts/generate-profile-signal.mjs

      - name: Validate pure-vector profile contract
        run: python3 scripts/validate-profile.py

      - name: Detect stale committed telemetry
        shell: bash
        run: |
          if ! git diff --exit-code -- assets/repository-signal.svg; then
            echo "::error::Repository signal is stale. Run 'node scripts/generate-profile-signal.mjs' and commit assets/repository-signal.svg."
            exit 1
          fi
