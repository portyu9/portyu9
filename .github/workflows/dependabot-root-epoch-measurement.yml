name: One-shot relative trusted-root epoch authorization measurement
on:
  pull_request:
    paths:
      - ".github/workflows/dependabot-root-epoch-measurement.yml"
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.13.16"
jobs:
  measure:
    name: measure-frozen-relative-root-epoch-fix
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout exact accepted base compiler (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e591c9104d6ba8805ca98aaf55ed04da66039ce1
          path: trusted
          persist-credentials: false
      - name: Checkout frozen candidate as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3e900c4a45c97497b71c551bacb9187e305806ee
          path: candidate
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Measure frozen protected delta using accepted-main compiler
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "e591c9104d6ba8805ca98aaf55ed04da66039ce1"
          test "$(git -C candidate rev-parse HEAD)" = "3e900c4a45c97497b71c551bacb9187e305806ee"
          python3 trusted/scripts/verify-python-runtime.py
          TREE_SHA="$(git -C candidate rev-parse 'HEAD^{tree}')"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Reviewed main: e591c9104d6ba8805ca98aaf55ed04da66039ce1; immutable source: 3e900c4a45c97497b71c551bacb9187e305806ee; exact tree $TREE_SHA"
          python3 trusted/scripts/workflow_capability_admission.py candidate \
            --candidate-tree-sha "$TREE_SHA" --measure
