name: CodeQL Autofix controller

on:
  workflow_run:
    workflows:
      - CodeQL
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: "37 * * * *"
  repository_dispatch:
    types:
      - codeql-autofix

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  security-events: write

env:
  PYTHON_VERSION: "3.13.15"

jobs:
  controller:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_sha == github.sha
    name: trusted-codeql-autofix-controller
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: codeql-autofix-controller
      cancel-in-progress: false
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout exact trusted default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 scripts/verify-python-runtime.py

      - name: Bind trusted trigger and current main
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/codeql_autofix_controller.py trigger \
            --event-name "$EVENT_NAME" \
            --event-file "$GITHUB_EVENT_PATH" \
            --trusted-sha "$TRUSTED_SHA" \
            --out trigger.json

          AFTER_ALERT=0
          if [ "$EVENT_NAME" = "repository_dispatch" ] && jq -e '.client_payload.queueContinuation == true' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            test "$(jq -r '.sender.login // ""' "$GITHUB_EVENT_PATH")" = "github-actions[bot]"
            test "$(jq -r '.client_payload.baseSha // ""' "$GITHUB_EVENT_PATH")" = "$TRUSTED_SHA"
            AFTER_ALERT="$(jq -r '.client_payload.afterAlert // 0' "$GITHUB_EVENT_PATH")"
            [[ "$AFTER_ALERT" =~ ^[1-9][0-9]*$ ]]
          fi

          gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > main-ref.json
          python3 scripts/codeql_autofix_controller.py main \
            --ref-file main-ref.json \
            --expected-sha "$TRUSTED_SHA" \
            --out main.json
          BASE_SHA="$(jq -r .baseSha main.json)"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'base_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'after_alert=%s\n' "$AFTER_ALERT" >> "$GITHUB_OUTPUT"

      - name: Discover one exact-main CodeQL alert
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          AFTER_ALERT: ${{ steps.base.outputs.after_alert }}
        run: |
          set -euo pipefail
          [[ "$AFTER_ALERT" =~ ^[0-9]+$ ]]
          gh api --paginate --slurp \
            "repos/${TARGET_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&per_page=100" \
            > alert-pages.json
          python3 scripts/codeql_autofix_controller.py discover \
            --alerts-file alert-pages.json \
            --base-sha "$BASE_SHA" \
            --out discovery.json
          jq -c --argjson after "$AFTER_ALERT" \
            '[.discovery.alerts[] | select(.number > $after)] | .[0] // null' \
            discovery.json > target.json
          if jq -e '. != null' target.json >/dev/null; then
            ALERT_NUMBER="$(jq -r .number target.json)"
            test "$ALERT_NUMBER" -gt "$AFTER_ALERT"
            printf 'has_target=true\n' >> "$GITHUB_OUTPUT"
            printf 'alert_number=%s\n' "$ALERT_NUMBER" >> "$GITHUB_OUTPUT"
          else
            printf 'has_target=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Locate an existing remediation PR
        if: steps.target.outputs.has_target == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          ALERT_NUMBER: ${{ steps.target.outputs.alert_number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${TARGET_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            > open-pr-pages.json
          python3 scripts/codeql_autofix_controller.py locate \
            --prs-file open-pr-pages.json \
            --alert "$ALERT_NUMBER" \
            --out existing.json
          EXISTS="$(jq -r .exists existing.json)"
          test "$EXISTS" = "true" -o "$EXISTS" = "false"
          printf 'exists=%s\n' "$EXISTS" >> "$GITHUB_OUTPUT"
          if [ "$EXISTS" = "true" ]; then
            printf 'pr_number=%s\n' "$(jq -r .pr.prNumber existing.json)" >> "$GITHUB_OUTPUT"
            printf 'origin_run_id=%s\n' "$(jq -r .pr.originRunId existing.json)" >> "$GITHUB_OUTPUT"
            printf 'head_sha=%s\n' "$(jq -r .pr.headSha existing.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Request and inspect GitHub CodeQL Autofix
        if: steps.target.outputs.has_target == 'true' && steps.existing.outputs.exists == 'false'
        id: autofix
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          ALERT_NUMBER: ${{ steps.target.outputs.alert_number }}
        run: |
          set -euo pipefail
          assert_main_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > "$RUNNER_TEMP/codeql-autofix-main-ref.json"
            python3 scripts/codeql_autofix_controller.py read-ref-response \
              --response-file "$RUNNER_TEMP/codeql-autofix-main-ref.json" \
              --expected-ref "refs/heads/main" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/codeql-autofix-main-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/codeql-autofix-main-ref-normalized.json")" = "$expected_sha"
          }
          set +e
          gh api -X POST \
            "repos/${TARGET_REPOSITORY}/code-scanning/alerts/${ALERT_NUMBER}/autofix" \
            > autofix-create.json 2> autofix-create.err
          AUTOFIX_RC=$?
          set -e

          if [ "$AUTOFIX_RC" -ne 0 ]; then
            ERROR_TEXT="$(tr -d '\r' < autofix-create.err)"
            test "$ERROR_TEXT" = "gh: Alert is not supported by autofix. (HTTP 422)"
            python3 - <<'PY'
          from codeql_autofix_queue import classify_request_failure
          result = classify_request_failure(http_status=422, message="Alert is not supported by autofix.")
          if result != {"classification": "unsupported", "reason": "github-autofix-unsupported"}:
              raise SystemExit("unexpected unsupported-Autofix classification")
          PY
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$ALERT_NUMBER" -gt 0
            assert_main_sha "$BASE_SHA"

            gh api --paginate --slurp \
              "repos/${TARGET_REPOSITORY}/commits/${BASE_SHA}/comments?per_page=100" \
              > unsupported-comment-pages.json
            python3 scripts/codeql_autofix_controller.py unsupported-evidence \
              --target-file target.json \
              --comments-file unsupported-comment-pages.json \
              --expected-sha "$BASE_SHA" \
              --out unsupported-evidence.json
            EVIDENCE_EXISTS="$(jq -r .exists unsupported-evidence.json)"
            test "$EVIDENCE_EXISTS" = "true" -o "$EVIDENCE_EXISTS" = "false"
            if [ "$EVIDENCE_EXISTS" = "false" ]; then
              EVIDENCE_MARKER="$(jq -r .marker unsupported-evidence.json)"
              EVIDENCE_BODY="$(jq -r .body unsupported-evidence.json)"
              gh api --method POST \
                "repos/${TARGET_REPOSITORY}/commits/${BASE_SHA}/comments" \
                -f body="$EVIDENCE_BODY" \
                > unsupported-evidence-created.json
              python3 scripts/codeql_autofix_controller.py unsupported-evidence-created \
                --comment-file unsupported-evidence-created.json \
                --expected-sha "$BASE_SHA" \
                --marker "$EVIDENCE_MARKER" \
                --out unsupported-evidence-created-normalized.json
            fi

            assert_main_sha "$BASE_SHA"
            jq -n \
              --arg baseSha "$BASE_SHA" \
              --argjson afterAlert "$ALERT_NUMBER" \
              '{event_type:"codeql-autofix",client_payload:{queueContinuation:true,baseSha:$baseSha,afterAlert:$afterAlert}}' \
              > unsupported-dispatch.json
            gh api --method POST "repos/${TARGET_REPOSITORY}/dispatches" --input unsupported-dispatch.json >/dev/null
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            printf 'unsupported=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api \
            "repos/${TARGET_REPOSITORY}/code-scanning/alerts/${ALERT_NUMBER}/autofix" \
            > autofix-status.json
          python3 scripts/codeql_autofix_controller.py status \
            --target-file target.json \
            --status-file autofix-status.json \
            --out normalized-autofix.json
          READY="$(jq -r .ready normalized-autofix.json)"
          test "$READY" = "true" -o "$READY" = "false"
          printf 'ready=%s\n' "$READY" >> "$GITHUB_OUTPUT"
          printf 'unsupported=false\n' >> "$GITHUB_OUTPUT"

      - name: Commit exact Autofix to a dedicated branch and open one PR
        if: steps.target.outputs.has_target == 'true' && steps.existing.outputs.exists == 'false' && steps.autofix.outputs.ready == 'true'
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          ALERT_NUMBER: ${{ steps.target.outputs.alert_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$ALERT_NUMBER" -gt 0
          test "$RUN_ID" -gt 0
          test "$RUN_ATTEMPT" -gt 0
          test "$RUN_ATTEMPT" -le 20

          : > prior-attempts.ndjson
          for ATTEMPT_NUMBER in $(seq 1 20); do
            if [ "$ATTEMPT_NUMBER" -ge "$RUN_ATTEMPT" ]; then
              break
            fi
            gh api "repos/${TARGET_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${ATTEMPT_NUMBER}" \
              | jq -c '.' >> prior-attempts.ndjson
            sleep 1
          done
          jq -s '.' prior-attempts.ndjson > prior-attempts.json

          BRANCH="codeql-autofix/alert-${ALERT_NUMBER}/run-${RUN_ID}"
          TARGET_REF="refs/heads/${BRANCH}"

          gh api "repos/${TARGET_REPOSITORY}/git/matching-refs/heads/${BRANCH}" > matching-refs.json
          python3 scripts/codeql_autofix_controller.py ref-state \
            --refs-file matching-refs.json \
            --branch "$BRANCH" \
            --out ref-state.json
          REF_STATE="$(jq -r .state ref-state.json)"
          test "$REF_STATE" = "absent" || {
            echo "ERROR: deterministic Autofix branch already exists without an open matching PR" >&2
            exit 1
          }

          gh api -X POST "repos/${TARGET_REPOSITORY}/git/refs" \
            -f ref="$TARGET_REF" \
            -f sha="$BASE_SHA" \
            > created-ref.json
          python3 scripts/codeql_autofix_controller.py created-ref-response \
            --response-file created-ref.json \
            --branch "$BRANCH" \
            --expected-sha "$BASE_SHA" \
            --out created-ref-normalized.json
          test "$(jq -r .ref created-ref-normalized.json)" = "$TARGET_REF"
          test "$(jq -r .sha created-ref-normalized.json)" = "$BASE_SHA"

          gh api -X POST \
            "repos/${TARGET_REPOSITORY}/code-scanning/alerts/${ALERT_NUMBER}/autofix/commits" \
            -f target_ref="$TARGET_REF" \
            -f message="CodeQL Autofix alert #${ALERT_NUMBER}" \
            > autofix-commit.json
          python3 scripts/codeql_autofix_controller.py commit \
            --response-file autofix-commit.json \
            --branch "$BRANCH" \
            --out committed.json
          HEAD_SHA="$(jq -r .headSha committed.json)"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$HEAD_SHA" != "$BASE_SHA"

          gh api "repos/${TARGET_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" > compare.json
          python3 scripts/codeql_autofix_controller.py compare \
            --compare-file compare.json \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --out compare-proof.json

          RULE_ID="$(jq -r .ruleId target.json)"
          PR_BODY="Trusted GitHub CodeQL Autofix for alert #${ALERT_NUMBER} (${RULE_ID}). Generated by ${RUN_ID}; protected checks and exact-head admission remain mandatory before protected merge can be attempted."
          gh api -X POST "repos/${TARGET_REPOSITORY}/pulls" \
            -f title="CodeQL Autofix alert #${ALERT_NUMBER}" \
            -f head="$BRANCH" \
            -f base="main" \
            -f body="$PR_BODY" \
            -F draft=false \
            > created-pr.json
          python3 scripts/codeql_autofix_controller.py receipt \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --target-file target.json \
            --branch "$BRANCH" \
            --head-sha "$HEAD_SHA" \
            --pr-file created-pr.json \
            --attempt-history-file prior-attempts.json \
            --out codeql-autofix-receipt.json
          PR_NUMBER="$(jq -r .prNumber codeql-autofix-receipt.json)"
          gh api --method POST "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=portyu9' > requested-reviewer.json
          python3 scripts/codeql_autofix_controller.py reviewer-request-response \
            --response-file requested-reviewer.json \
            --pr-number "$PR_NUMBER" \
            --repository "$TARGET_REPOSITORY" \
            --base-sha "$BASE_SHA" \
            --branch "$BRANCH" \
            --head-sha "$HEAD_SHA" \
            --out requested-reviewer-normalized.json
          test "$(jq -r .prNumber requested-reviewer-normalized.json)" = "$PR_NUMBER"
          test "$(jq -r .reviewer requested-reviewer-normalized.json)" = "portyu9"
          test "$(jq -r .headSha requested-reviewer-normalized.json)" = "$HEAD_SHA"
          RECEIPT_NAME="codeql-autofix-receipt-run-${RUN_ID}-alert-${ALERT_NUMBER}"
          printf 'created=true\n' >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'receipt_name=%s\n' "$RECEIPT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload immutable controller provenance receipt
        if: steps.create.outputs.created == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.create.outputs.receipt_name }}
          path: codeql-autofix-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Approve exact protected checks and queue admission retry
        if: steps.create.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          ALERT_NUMBER: ${{ steps.target.outputs.alert_number }}
          PR_NUMBER: ${{ steps.create.outputs.pr_number }}
          HEAD_SHA: ${{ steps.create.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$ALERT_NUMBER" -gt 0
          test "$PR_NUMBER" -gt 0
          test "$RUN_ID" -gt 0
          BRANCH="codeql-autofix/alert-${ALERT_NUMBER}/run-${RUN_ID}"
          assert_main_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > "$RUNNER_TEMP/codeql-autofix-main-ref.json"
            python3 scripts/codeql_autofix_controller.py read-ref-response \
              --response-file "$RUNNER_TEMP/codeql-autofix-main-ref.json" \
              --expected-ref "refs/heads/main" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/codeql-autofix-main-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/codeql-autofix-main-ref-normalized.json")" = "$expected_sha"
          }
          assert_head_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${BRANCH}" > "$RUNNER_TEMP/codeql-autofix-head-ref.json"
            python3 scripts/codeql_autofix_controller.py read-ref-response \
              --response-file "$RUNNER_TEMP/codeql-autofix-head-ref.json" \
              --expected-ref "refs/heads/${BRANCH}" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/codeql-autofix-head-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/codeql-autofix-head-ref-normalized.json")" = "$expected_sha"
          }
          assert_main_sha "$BASE_SHA"
          assert_head_sha "$HEAD_SHA"
          PR="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"$PR")" = "open"
          test "$(jq -r .base.ref <<<"$PR")" = "main"
          test "$(jq -r .base.sha <<<"$PR")" = "$BASE_SHA"
          test "$(jq -r .head.ref <<<"$PR")" = "$BRANCH"
          test "$(jq -r .head.sha <<<"$PR")" = "$HEAD_SHA"
          test "$(jq -r .head.repo.full_name <<<"$PR")" = "$TARGET_REPOSITORY"

          gh api "repos/${TARGET_REPOSITORY}/actions/workflows/codeql.yml" > "$RUNNER_TEMP/codeql-workflow-definition.json"
          python3 scripts/codeql_autofix_controller.py workflow-definition-response \
            --response-file "$RUNNER_TEMP/codeql-workflow-definition.json" \
            --expected-path ".github/workflows/codeql.yml" \
            --out "$RUNNER_TEMP/codeql-workflow-definition-normalized.json"
          CODEQL_WORKFLOW_ID="$(jq -r .id "$RUNNER_TEMP/codeql-workflow-definition-normalized.json")"

          gh api "repos/${TARGET_REPOSITORY}/actions/workflows/dependency-review.yml" > "$RUNNER_TEMP/dependency-workflow-definition.json"
          python3 scripts/codeql_autofix_controller.py workflow-definition-response \
            --response-file "$RUNNER_TEMP/dependency-workflow-definition.json" \
            --expected-path ".github/workflows/dependency-review.yml" \
            --out "$RUNNER_TEMP/dependency-workflow-definition-normalized.json"
          DEPENDENCY_WORKFLOW_ID="$(jq -r .id "$RUNNER_TEMP/dependency-workflow-definition-normalized.json")"

          gh api "repos/${TARGET_REPOSITORY}/actions/workflows/profile-quality.yml" > "$RUNNER_TEMP/profile-workflow-definition.json"
          python3 scripts/codeql_autofix_controller.py workflow-definition-response \
            --response-file "$RUNNER_TEMP/profile-workflow-definition.json" \
            --expected-path ".github/workflows/profile-quality.yml" \
            --out "$RUNNER_TEMP/profile-workflow-definition-normalized.json"
          PROFILE_WORKFLOW_ID="$(jq -r .id "$RUNNER_TEMP/profile-workflow-definition-normalized.json")"
          for WORKFLOW_ID in "$CODEQL_WORKFLOW_ID" "$DEPENDENCY_WORKFLOW_ID" "$PROFILE_WORKFLOW_ID"; do
            [[ "$WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]
          done
          test "$(printf '%s\n' "$CODEQL_WORKFLOW_ID" "$DEPENDENCY_WORKFLOW_ID" "$PROFILE_WORKFLOW_ID" | LC_ALL=C sort -u | wc -l)" = "3"

          COMPLETE=false
          APPROVAL_REQUESTED_RUN_IDS=""
          for ATTEMPT in $(seq 1 60); do
            RUNS="$(gh api "repos/${TARGET_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100")"
            RUN_COUNT="$(jq -r .total_count <<<"$RUNS")"
            [[ "$RUN_COUNT" =~ ^[0-9]+$ ]]
            if [ "$RUN_COUNT" -lt 3 ]; then
              sleep 10
              continue
            fi
            test "$RUN_COUNT" = "3"
            MATCHES="$(jq -c --argjson codeql "$CODEQL_WORKFLOW_ID" --argjson dependency "$DEPENDENCY_WORKFLOW_ID" --argjson profile "$PROFILE_WORKFLOW_ID" '[.workflow_runs[] | select(.workflow_id == $codeql or .workflow_id == $dependency or .workflow_id == $profile)]' <<<"$RUNS")"
            test "$(jq 'length' <<<"$MATCHES")" = "3"
            test "$(jq '[.[].workflow_id] | unique | length' <<<"$MATCHES")" = "3"
            jq -e --arg head "$HEAD_SHA" --arg branch "$BRANCH" --arg repo "$TARGET_REPOSITORY" 'all(.[]; .event == "pull_request" and .head_sha == $head and .head_branch == $branch and .head_repository.full_name == $repo)' <<<"$MATCHES" >/dev/null

            COMPLETE=true
            while IFS=$'\t' read -r CHECK_RUN_ID STATUS CONCLUSION; do
              [[ "$CHECK_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              case "$STATUS:$CONCLUSION" in
                completed:success)
                  ;;
                completed:action_required|completed:waiting)
                  case " $APPROVAL_REQUESTED_RUN_IDS " in
                    *" $CHECK_RUN_ID "*) : ;;
                    *)
                      gh api --method POST "repos/${TARGET_REPOSITORY}/actions/runs/${CHECK_RUN_ID}/approve" >/dev/null
                      APPROVAL_REQUESTED_RUN_IDS="${APPROVAL_REQUESTED_RUN_IDS} ${CHECK_RUN_ID}"
                      ;;
                  esac
                  COMPLETE=false
                  ;;
                queued:null|in_progress:null|waiting:null|pending:null)
                  COMPLETE=false
                  ;;
                *)
                  echo "ERROR: exact Autofix protected workflow entered forbidden state: ${STATUS}:${CONCLUSION}" >&2
                  exit 1
                  ;;
              esac
            done < <(jq -r '.[] | [.id, .status, (.conclusion // "null")] | @tsv' <<<"$MATCHES")
            if [ "$COMPLETE" = "true" ]; then
              break
            fi
            sleep 10
          done
          test "$COMPLETE" = "true"

          jq -n \
            --argjson prNumber "$PR_NUMBER" \
            --argjson originRunId "$RUN_ID" \
            --argjson alertNumber "$ALERT_NUMBER" \
            --arg baseSha "$BASE_SHA" \
            --arg headSha "$HEAD_SHA" \
            '{event_type:"codeql-autofix-admission",client_payload:{prNumber:$prNumber,originRunId:$originRunId,alertNumber:$alertNumber,baseSha:$baseSha,headSha:$headSha}}' \
            > admission-dispatch.json
          gh api --method POST "repos/${TARGET_REPOSITORY}/dispatches" --input admission-dispatch.json >/dev/null

          TRUSTED_READY=false
          GHAS_READY=false
          for ATTEMPT in $(seq 1 60); do
            gh api "repos/${TARGET_REPOSITORY}/commits/${HEAD_SHA}/check-runs?app_id=15368&check_name=trusted-capability-admission&filter=latest&per_page=100" \
              > trusted-readiness-response.json
            python3 scripts/codeql_autofix_controller.py readiness-check \
              --response-file trusted-readiness-response.json \
              --head-sha "$HEAD_SHA" \
              --name trusted-capability-admission \
              --app-id 15368 \
              --out trusted-readiness.json
            TRUSTED_STATE="$(jq -r .state trusted-readiness.json)"
            case "$TRUSTED_STATE" in
              success)
                TRUSTED_READY=true
                ;;
              failure)
                echo "ERROR: trusted capability-admission check rejected the exact Autofix head" >&2
                exit 1
                ;;
              ambiguous)
                echo "ERROR: exact Autofix trusted capability-admission check is ambiguous" >&2
                exit 1
                ;;
              missing|pending)
                ;;
              *)
                echo "ERROR: trusted capability-admission readiness state is invalid: $TRUSTED_STATE" >&2
                exit 1
                ;;
            esac

            gh api "repos/${TARGET_REPOSITORY}/commits/${HEAD_SHA}/check-runs?app_id=57789&check_name=CodeQL&filter=latest&per_page=100" \
              > ghas-readiness-response.json
            python3 scripts/codeql_autofix_controller.py readiness-check \
              --response-file ghas-readiness-response.json \
              --head-sha "$HEAD_SHA" \
              --name CodeQL \
              --app-id 57789 \
              --out ghas-readiness.json
            GHAS_STATE="$(jq -r .state ghas-readiness.json)"
            case "$GHAS_STATE" in
              success)
                GHAS_READY=true
                ;;
              missing|pending|failure|ambiguous)
                ;;
              *)
                echo "ERROR: GHAS CodeQL readiness state is invalid: $GHAS_STATE" >&2
                exit 1
                ;;
            esac
            if [ "$TRUSTED_READY" = "true" ] && [ "$GHAS_READY" = "true" ]; then
              break
            fi
            sleep 10
          done
          test "$TRUSTED_READY" = "true"
          test "$GHAS_READY" = "true"
          assert_main_sha "$BASE_SHA"
          test "$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" = "$HEAD_SHA"

          gh api --method POST "repos/${TARGET_REPOSITORY}/dispatches" \
            -f event_type=codeql-autofix >/dev/null

      - name: Verify an existing Autofix PR and perform protected merge
        if: steps.target.outputs.has_target == 'true' && steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          ALERT_NUMBER: ${{ steps.target.outputs.alert_number }}
          PR_NUMBER: ${{ steps.existing.outputs.pr_number }}
          ORIGIN_RUN_ID: ${{ steps.existing.outputs.origin_run_id }}
          EXPECTED_HEAD_SHA: ${{ steps.existing.outputs.head_sha }}
        run: |
          set -euo pipefail
          assert_main_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > "$RUNNER_TEMP/codeql-autofix-main-ref.json"
            python3 scripts/codeql_autofix_controller.py read-ref-response \
              --response-file "$RUNNER_TEMP/codeql-autofix-main-ref.json" \
              --expected-ref "refs/heads/main" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/codeql-autofix-main-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/codeql-autofix-main-ref-normalized.json")" = "$expected_sha"
          }
          test "$ALERT_NUMBER" -gt 0
          test "$PR_NUMBER" -gt 0
          test "$ORIGIN_RUN_ID" -gt 0
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          gh api "repos/${TARGET_REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}/artifacts?per_page=100" > artifacts.json
          python3 scripts/codeql_autofix_controller.py artifact \
            --artifacts-file artifacts.json \
            --run-id "$ORIGIN_RUN_ID" \
            --alert "$ALERT_NUMBER" \
            --out artifact.json
          ARTIFACT_ID="$(jq -r .id artifact.json)"
          test "$ARTIFACT_ID" -gt 0
          gh api "repos/${TARGET_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > receipt.zip
          unzip -p receipt.zip codeql-autofix-receipt.json > verified-receipt.json
          test -s verified-receipt.json
          test "$(jq -r .runId verified-receipt.json)" = "$ORIGIN_RUN_ID"
          RECEIPT_ATTEMPT="$(jq -r .runAttempt verified-receipt.json)"
          [[ "$RECEIPT_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${TARGET_REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}/attempts/${RECEIPT_ATTEMPT}" > origin-run.json

          gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" > pr.json
          test "$(jq -r .head.sha pr.json)" = "$EXPECTED_HEAD_SHA"
          gh api --paginate --slurp \
            "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > pr-file-pages.json
          jq -n \
            --slurpfile pr pr.json \
            --slurpfile pages pr-file-pages.json \
            '{pullRequest: $pr[0], files: [$pages[0][][] | .filename]}' \
            > pr-wrapper.json

          HEAD_SHA="$(jq -r .head.sha pr.json)"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > admission-main-ref.json
          gh api --paginate --slurp \
            "repos/${TARGET_REPOSITORY}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
            > check-pages-raw.json
          jq '[.[].check_runs[]]' check-pages-raw.json > check-pages.json
          gh api \
            "repos/${TARGET_REPOSITORY}/commits/${HEAD_SHA}/check-runs?app_id=57789&check_name=CodeQL&filter=latest&per_page=100" \
            > ghas.json
          gh api --paginate --slurp \
            "repos/${TARGET_REPOSITORY}/code-scanning/alerts?pr=${PR_NUMBER}&tool_name=CodeQL&state=open&per_page=100" \
            > pr-alert-pages.json
          gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}pageInfo{hasNextPage}}}}}' \
            -f owner='portyu9' \
            -f name='portyu9' \
            -F number="$PR_NUMBER" \
            > review-threads.json

          python3 scripts/codeql_autofix_controller.py admit \
            --receipt verified-receipt.json \
            --workflow-run origin-run.json \
            --artifact artifact.json \
            --pr pr-wrapper.json \
            --main-ref admission-main-ref.json \
            --checks check-pages.json \
            --ghas ghas.json \
            --pr-alerts pr-alert-pages.json \
            --threads review-threads.json \
            --out admission.json
          jq -e '.eligible == true' admission.json >/dev/null

          gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" > final-pr.json
          test "$(jq -r .state final-pr.json)" = "open"
          test "$(jq -r .base.ref final-pr.json)" = "main"
          test "$(jq -r .base.sha final-pr.json)" = "$(jq -r .baseSha admission.json)"
          test "$(jq -r .head.sha final-pr.json)" = "$(jq -r .headSha admission.json)"
          test "$(jq -r .head.repo.full_name final-pr.json)" = "$TARGET_REPOSITORY"

          ADMITTED_BASE_SHA="$(jq -r .baseSha admission.json)"
          ADMITTED_HEAD_SHA="$(jq -r .headSha admission.json)"
          [[ "$ADMITTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ADMITTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          assert_main_sha "$ADMITTED_BASE_SHA"

          REVIEW_MARKER="<!-- portyu9-bot-review:v2 base=${ADMITTED_BASE_SHA} head=${ADMITTED_HEAD_SHA} -->"
          REVIEW_PAGES="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
          jq -e '
            (type == "array") and (length >= 1) and (length <= 20) and
            (all(.[]; type == "array" and length <= 100)) and
            (all(.[0:-1][]; length == 100)) and
            (all(.[][];
              type == "object" and
              (.id | type == "number" and . == floor and . > 0) and
              (.user | type == "object" and (.login | type == "string" and length > 0)) and
              (.state | type == "string" and
                (. == "APPROVED" or . == "CHANGES_REQUESTED" or . == "COMMENTED" or . == "DISMISSED" or . == "PENDING")) and
              has("commit_id") and
              (.commit_id == null or (.commit_id | type == "string" and test("^[0-9a-f]{40}$"))) and
              has("body") and
              (.body == null or (.body | type == "string"))
            )) and
            (([.[][] | .id] | length) == ([.[][] | .id] | unique | length))
          ' <<<"$REVIEW_PAGES" >/dev/null || {
            echo "ERROR: malformed or incomplete paginated pull-review evidence." >&2
            exit 1
          }
          REVIEWS="$(jq -c '[.[][]]' <<<"$REVIEW_PAGES")"
          PORTYU9_APPROVAL_COUNT="$(jq --arg head "$ADMITTED_HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .state == "APPROVED" and .commit_id == $head and ((.body // "") | contains($marker)))] | length' <<<"$REVIEWS")"
          LATEST_MANUAL_DECISIVE_STATE="$(jq -r --arg head "$ADMITTED_HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and (.state == "APPROVED" or .state == "CHANGES_REQUESTED") and (((.body // "") | contains($marker)) | not))] | sort_by(.id) | if length == 0 then "" else .[-1].state end' <<<"$REVIEWS")"
          [[ "$PORTYU9_APPROVAL_COUNT" =~ ^[0-9]+$ ]]
          test "$PORTYU9_APPROVAL_COUNT" = "1" || {
            echo "ERROR: exactly one exact-base/head marker-bound APPROVED review by portyu9 is required before autonomous CodeQL Autofix merge." >&2
            exit 1
          }
          if [ "$LATEST_MANUAL_DECISIVE_STATE" = "CHANGES_REQUESTED" ]; then
            echo "ERROR: latest manual exact-head portyu9 review requests changes; autonomous CodeQL Autofix merge is vetoed." >&2
            exit 1
          fi

          APPROVAL_MARKER="<!-- portyu9-automation-approval:v1 head=${ADMITTED_HEAD_SHA} -->"
          COMMENTS="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
          if ! jq -e --arg marker "$APPROVAL_MARKER" '[.[][] | select(.body | contains($marker))] | length > 0' <<<"$COMMENTS" >/dev/null; then
            printf -v APPROVAL_BODY '%s\n%s' "$APPROVAL_MARKER" "Automation-approved: the exact CodeQL Autofix head \`${ADMITTED_HEAD_SHA}\` passed trusted admission, protected checks, GHAS CodeQL, review-thread closure, and an exact-base/head marker-bound APPROVED review by @portyu9. No manual workflow approval is required. Continuing with the governed expected-head merge."
            gh api --method POST "repos/${TARGET_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$APPROVAL_BODY" > approval-comment.json
            test "$(jq -r .body approval-comment.json | grep -Fxc "$APPROVAL_BODY")" = "1"
          fi

          gh api --method PUT "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge \
            -f sha="$ADMITTED_HEAD_SHA" \
            -f commit_title="CodeQL Autofix alert #${ALERT_NUMBER}" \
            -f commit_message="Trusted CodeQL Autofix merged after exact-head admission and Protect Main enforcement." \
            > merge.json
          python3 scripts/codeql_autofix_controller.py merge-success-response \
            --response-file merge.json \
            --out merge-success-normalized.json
          MERGE_SHA="$(jq -r .sha merge-success-normalized.json)"
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]

          fetch_codeql_dispatch_runs() {
            gh api --paginate --slurp \
              "repos/${TARGET_REPOSITORY}/actions/workflows/codeql.yml/runs?branch=main&event=workflow_dispatch&per_page=100"
          }

          assert_main_sha "$MERGE_SHA"
          fetch_codeql_dispatch_runs > codeql-dispatch-runs-before.json
          python3 scripts/codeql_autofix_controller.py followup-select \
            --before-file codeql-dispatch-runs-before.json \
            --after-file codeql-dispatch-runs-before.json \
            --expected-sha "$MERGE_SHA" \
            --out post-merge-codeql-selection.json
          test "$(jq -r .state post-merge-codeql-selection.json)" = "pending"

          gh api --method POST \
            "repos/${TARGET_REPOSITORY}/actions/workflows/codeql.yml/dispatches" \
            -f ref=main >/dev/null

          POST_MERGE_CODEQL_RUN_ID=""
          for attempt in $(seq 1 60); do
            sleep 2
            assert_main_sha "$MERGE_SHA"
            fetch_codeql_dispatch_runs > codeql-dispatch-runs-after.json
            python3 scripts/codeql_autofix_controller.py followup-select \
              --before-file codeql-dispatch-runs-before.json \
              --after-file codeql-dispatch-runs-after.json \
              --expected-sha "$MERGE_SHA" \
              --out post-merge-codeql-selection.json
            if [ "$(jq -r .state post-merge-codeql-selection.json)" = "bound" ]; then
              POST_MERGE_CODEQL_RUN_ID="$(jq -r .runId post-merge-codeql-selection.json)"
              break
            fi
          done
          [[ "$POST_MERGE_CODEQL_RUN_ID" =~ ^[1-9][0-9]*$ ]]

          POST_MERGE_CODEQL_STATUS=""
          POST_MERGE_CODEQL_CONCLUSION=""
          for attempt in $(seq 1 120); do
            assert_main_sha "$MERGE_SHA"
            gh api "repos/${TARGET_REPOSITORY}/actions/runs/${POST_MERGE_CODEQL_RUN_ID}" > post-merge-codeql-run.json
            python3 scripts/codeql_autofix_controller.py followup-run \
              --run-file post-merge-codeql-run.json \
              --run-id "$POST_MERGE_CODEQL_RUN_ID" \
              --expected-sha "$MERGE_SHA" \
              --out post-merge-codeql-status.json
            POST_MERGE_CODEQL_STATUS="$(jq -r .status post-merge-codeql-status.json)"
            POST_MERGE_CODEQL_CONCLUSION="$(jq -r '.conclusion // ""' post-merge-codeql-status.json)"
            if [ "$POST_MERGE_CODEQL_STATUS" = "completed" ]; then
              break
            fi
            sleep 5
          done
          test "$POST_MERGE_CODEQL_STATUS" = "completed"
          test "$POST_MERGE_CODEQL_CONCLUSION" = "success"
          assert_main_sha "$MERGE_SHA"

          gh api --method POST "repos/${TARGET_REPOSITORY}/dispatches" \
            -f event_type=codeql-autofix >/dev/null
