name: One-shot native Dependabot App admission post release measurement
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.13.16"
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout immutable accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7788a3b201d0102b46795ac6c5a5e0e173a4ff1d
          fetch-depth: 0
          persist-credentials: false
      - name: Set up trusted Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Measure frozen post-merge candidate without authorization
        env:
          TRUSTED_BASE: 7788a3b201d0102b46795ac6c5a5e0e173a4ff1d
          FROZEN_HEAD: a44a46fd48bcd078232b75bf9ba2c1bed03e2027
          FROZEN_TREE: 475b334d7f85785e00891cd3bae362dc26bc2835
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_BASE"
          test "$(git rev-parse HEAD:scripts/workflow_capability_admission.py)" = "a832c73cc3be625a8af9b5997c815b73c3520dab"
          python3 -B scripts/verify-python-runtime.py
          git fetch --no-tags --depth=1 origin "$FROZEN_HEAD"
          test "$(git rev-parse "$FROZEN_HEAD^{tree}")" = "$FROZEN_TREE"
          mkdir -p "$RUNNER_TEMP/native-dependabot-app-post-release"
          git archive "$FROZEN_HEAD" | tar -x -C "$RUNNER_TEMP/native-dependabot-app-post-release"
          test -z "$(git status --porcelain)"
          python3 -B scripts/workflow_capability_admission.py \
            "$RUNNER_TEMP/native-dependabot-app-post-release" \
            --candidate-tree-sha "$FROZEN_TREE" --measure
          test -z "$(git status --porcelain)"
