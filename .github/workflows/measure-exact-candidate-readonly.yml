# One-shot, read-only prior authorization measurement.
# Runs accepted-main code against a frozen Git commit tree; remove before merge.
name: One-shot exact capability measurement
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  measure:
    name: read-only-accepted-main-measure
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout trusted accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up reviewed Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Verify trusted source and immutable candidate tree
        env:
          FROZEN_BASE: 66ac260b79ed3df0827cc24964b7c8fd1e320515
          FROZEN_HEAD: 0bf4d544c1782c02b3dda6a427be6f42439afeab
          FROZEN_TREE: 816674bb67da1201b96d669198749837ccd895e9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_BASE"
          python3 scripts/verify-python-runtime.py
          git fetch --no-tags --depth=1 origin "$FROZEN_HEAD"
          test "$(git rev-parse "${FROZEN_HEAD}^{tree}")" = "$FROZEN_TREE"
          CANDIDATE_ROOT="$RUNNER_TEMP/read-only-frozen-candidate"
          mkdir -p "$CANDIDATE_ROOT"
          git archive "$FROZEN_HEAD" | tar -x -C "$CANDIDATE_ROOT"
          echo "Verified accepted-main evaluator and frozen candidate tree: $FROZEN_TREE"
          python3 scripts/workflow_capability_admission.py \
            "$CANDIDATE_ROOT" \
            --candidate-tree-sha "$FROZEN_TREE" \
            --measure
