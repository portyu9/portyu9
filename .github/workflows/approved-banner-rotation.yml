name: Rotate approved profile banners independently

on:
  workflow_dispatch:
  schedule:
    # Four bounded daily UTC retries recover from accepted-main races and
    # delayed scheduler delivery; the approved UTC-day selector is idempotent.
    # A successful rotation does not publish again on the same UTC day.
    - cron: "11 1,7,13,19 * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.18"

jobs:
  plan:
    name: propose-accepted-banner-triplet-read-only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      utc_day: ${{ steps.plan.outputs.utc_day }}
      output_sha256: ${{ steps.plan.outputs.output_sha256 }}
    steps:
      - name: Checkout exact accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 source/scripts/verify-python-runtime.py

      - name: Verify standalone approved artwork
        run: python3 source/scripts/independent_banner_rotation.py --self-test

      - name: Produce independent README proposal
        id: plan
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          UTC_DAY="$(date -u +%F)"
          python3 source/scripts/independent_banner_rotation.py \
            --plan banner-ready --base-sha "$GITHUB_SHA" --date "$UTC_DAY" \
            > banner-plan-output.json
          python3 source/scripts/independent_banner_rotation.py \
            --verify banner-ready --base-sha "$GITHUB_SHA" --date "$UTC_DAY" \
            > /dev/null
          CHANGED="$(jq -er '.changed | tostring' banner-ready/plan.json)"
          OUT_SHA="$(jq -er .outputSha256 banner-ready/plan.json)"
          test "$CHANGED" = "true" || test "$CHANGED" = "false"
          [[ "$OUT_SHA" =~ ^[0-9a-f]{64}$ ]]
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "base_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "utc_day=$UTC_DAY" >> "$GITHUB_OUTPUT"
          echo "output_sha256=$OUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload one exact banner-only candidate
        if: steps.plan.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-banner-readme
          path: banner-ready/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: open-protected-README-only-banner-PR
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: ruleset-admin-identity
    concurrency:
      group: approved-banner-rotation-terminal
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact reviewed main without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 source/scripts/verify-python-runtime.py

      - name: Download exact read-only banner plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-banner-readme
          path: banner-candidate
          digest-mismatch: error

      - name: Re-prove plan and create only an immutable README PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.base_sha }}
          UTC_DAY: ${{ needs.plan.outputs.utc_day }}
          OUTPUT_SHA256: ${{ needs.plan.outputs.output_sha256 }}
          APP_ID: ${{ secrets.PORTYU9_RULESET_ADMIN_APP_ID }}
          INSTALLATION_ID: ${{ secrets.PORTYU9_RULESET_ADMIN_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PORTYU9_RULESET_ADMIN_PRIVATE_KEY }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test "$GITHUB_REPOSITORY" = "portyu9/portyu9"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/approved-banner-rotation.yml@refs/heads/main"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UTC_DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$OUTPUT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          python3 source/scripts/verify-python-runtime.py
          python3 source/scripts/independent_banner_rotation.py \
            --verify banner-candidate --base-sha "$SOURCE_SHA" --date "$UTC_DAY" \
            > /dev/null
          test "$(sha256sum banner-candidate/README.md | cut -d' ' -f1)" = "$OUTPUT_SHA256"
          LIVE_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          if [ "$LIVE_MAIN" != "$SOURCE_SHA" ]; then
            echo "Main advanced: decline stale banner PR and retry on next schedule."
            exit 0
          fi
          PR_LIST="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100")"
          jq -e 'type == "array" and length < 100' <<< "$PR_LIST" > /dev/null
          # Read-only App candidate selection and historical salvage occur
          # after independently minted scoped App identity below. Never skip
          # all future UTC rotations merely because an old PR remains open.
          BRANCH="automation/banner-rotation/${UTC_DAY}-${SOURCE_SHA:0:12}"
          cp banner-candidate/README.md source/README.md
          git -C source config user.name 'github-actions[bot]'
          git -C source config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C source checkout -q -b "$BRANCH"
          git -C source add -- README.md
          test "$(git -C source diff --cached --name-only)" = README.md
          git -C source commit -q -m "chore(profile): rotate approved banner triplet for ${UTC_DAY}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$SOURCE_SHA" || {
            echo "Main advanced before banner push; decline stale candidate."
            exit 0
          }
          # Isolate the existing selected-installation App authority to a
          # ONE-repository, TWO-permission short-lived publishing lease.
          [[ "$APP_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$APP_PRIVATE_KEY"
          APP_KEY="$RUNNER_TEMP/banner-app-key.pem"
          APP_INSTALL="$RUNNER_TEMP/banner-app-install.json"
          APP_BOT="$RUNNER_TEMP/banner-app-bot.json"
          APP_TOKEN_FILE="$RUNNER_TEMP/banner-app-token.json"
          trap 'rm -f "$RUNNER_TEMP/banner-app-key.pem" "$RUNNER_TEMP/banner-app-install.json" "$RUNNER_TEMP/banner-app-bot.json" "$RUNNER_TEMP/banner-app-token.json"' EXIT
          printf %s "$APP_PRIVATE_KEY" > "$APP_KEY"
          openssl pkey -in "$APP_KEY" -noout >/dev/null
          ISSUED="$(date -u +%s)"
          HEADER="$(printf %s '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          PAYLOAD="$(jq -cn --arg iss "$APP_ID" --argjson iat "$((ISSUED - 60))" --argjson exp "$((ISSUED + 540))" '{iss:$iss,iat:$iat,exp:$exp}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          SIGNATURE="$(printf %s "${HEADER}.${PAYLOAD}" | openssl dgst -binary -sha256 -sign "$APP_KEY" | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          APP_JWT="${HEADER}.${PAYLOAD}.${SIGNATURE}"
          rm -f "$APP_KEY"
          unset APP_PRIVATE_KEY HEADER PAYLOAD SIGNATURE
          GH_TOKEN="$APP_JWT" gh api -H "Authorization: Bearer ${APP_JWT}" "app/installations/${INSTALLATION_ID}" > "$APP_INSTALL"
          APP_SLUG="$(jq -er .app_slug "$APP_INSTALL")"
          [[ "$APP_SLUG" =~ ^[a-z0-9][a-z0-9-]{2,100}$ ]]
          gh api "users/${APP_SLUG}%5Bbot%5D" > "$APP_BOT"
          GH_TOKEN="$APP_JWT" gh api -H "Authorization: Bearer ${APP_JWT}" --method POST "app/installations/${INSTALLATION_ID}/access_tokens" \
            -f "repositories[]=portyu9" -f "permissions[contents]=write" \
            -f "permissions[pull_requests]=write" > "$APP_TOKEN_FILE"
          unset APP_JWT
          PYTHONPATH=source/scripts python3 - "$APP_INSTALL" "$APP_BOT" "$APP_TOKEN_FILE" "$APP_ID" "$INSTALLATION_ID" "$REPOSITORY_ID" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from independent_banner_candidate_contract import verified_scoped_banner_app
          with open(sys.argv[1], encoding="utf-8") as stream:
              installed = json.load(stream)
          with open(sys.argv[2], encoding="utf-8") as stream:
              bot = json.load(stream)
          with open(sys.argv[3], encoding="utf-8") as stream:
              token = json.load(stream)
          verified_scoped_banner_app(
              installation=installed, bot_user=bot, token_response=token,
              expected_app_id=int(sys.argv[4]),
              expected_installation_id=int(sys.argv[5]),
              expected_repository_id=int(sys.argv[6]),
              observed_at=datetime.now(timezone.utc),
          )
          PY
          PUBLISH_TOKEN="$(jq -er .token "$APP_TOKEN_FILE")"
          echo "::add-mask::$PUBLISH_TOKEN"
          rm -f "$APP_TOKEN_FILE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$SOURCE_SHA"

          # Fail closed on every incomplete, discussed, forged or updated PR.
          # This is an authenticated read-only decision using accepted-main
          # source and immutable native GitHub REST/GraphQL inventories.
          jq -n --slurpfile install "$APP_INSTALL" --slurpfile bot "$APP_BOT" \
            --argjson appId "$APP_ID" --argjson installationId "$INSTALLATION_ID" \
            --argjson repositoryId "$REPOSITORY_ID" \
            '{installation:$install[0],bot_user:$bot[0],expected_app_id:$appId,
              expected_installation_id:$installationId,expected_repository_id:$repositoryId}' \
            > "$RUNNER_TEMP/banner-app-evidence.json"
          PYTHONPATH=source/scripts python3 source/scripts/banner_native_stale_recovery.py \
            --app-evidence "$RUNNER_TEMP/banner-app-evidence.json" \
            --decision-out "$RUNNER_TEMP/banner-stale-decision.json" >/dev/null
          STALE_STATE="$(jq -er .decision "$RUNNER_TEMP/banner-stale-decision.json")"
          case "$STALE_STATE" in
            no-open-banner-candidate)
              echo "No prior banner candidate; proceed with current UTC proposal." ;;
            current-banner-candidate-requires-proof)
              echo "Current-day exact native banner PR already exists; do not duplicate."
              exit 0 ;;
            stale-banner-candidate-comment-then-close-only)
              STALE_PR="$(jq -er .prNumber "$RUNNER_TEMP/banner-stale-decision.json")"
              STALE_HEAD="$(jq -er .headSha "$RUNNER_TEMP/banner-stale-decision.json")"
              STALE_REF="$(jq -er .headRef "$RUNNER_TEMP/banner-stale-decision.json")"
              HISTORICAL_BASE="$(jq -er .historicalBaseSha "$RUNNER_TEMP/banner-stale-decision.json")"
              [[ "$STALE_PR" =~ ^[1-9][0-9]*$ ]]
              [[ "$STALE_HEAD" =~ ^[0-9a-f]{40}$ ]]
              [[ "$HISTORICAL_BASE" =~ ^[0-9a-f]{40}$ ]]
              [[ "$STALE_REF" =~ ^automation/banner-rotation/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{12}$ ]]
              test "$(jq -er .mainSha "$RUNNER_TEMP/banner-stale-decision.json")" = "$SOURCE_SHA"

              # Independently repeat the complete read-only salvage proof
              # just before any App token is used for a PR mutation.
              PYTHONPATH=source/scripts python3 source/scripts/banner_native_stale_recovery.py \
                --app-evidence "$RUNNER_TEMP/banner-app-evidence.json" \
                --decision-out "$RUNNER_TEMP/banner-stale-reproof.json" >/dev/null
              cmp "$RUNNER_TEMP/banner-stale-decision.json" "$RUNNER_TEMP/banner-stale-reproof.json"
              test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
              test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$STALE_REF" --jq .object.sha)" = "$STALE_HEAD"
              test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$STALE_PR" --jq .head.sha)" = "$STALE_HEAD"

              STALE_COMMENT="Automatic close-only salvage of stale original approved banner PR #${STALE_PR}. Immutable head ${STALE_HEAD} (parent ${HISTORICAL_BASE}) is an exact one-commit README-only historical UTC candidate, no SVGs or source changes. Read-only full native inventories proved zero reviews, comments and review threads, correct selected-installation App producer and unchanged accepted-main/head refs. Current main ${SOURCE_SHA} moved; the current UTC artwork will be independently re-proposed without forcing the old branch. All original art preserved. This source branch has a PR and is safe for owner deletion; no code or tests to salvage."
              COMMENT_RESPONSE="$(GH_TOKEN="$PUBLISH_TOKEN" gh api --include --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/$STALE_PR/comments" -f body="$STALE_COMMENT")"
              COMMENT_STATUS="$(head -n 1 <<< "$COMMENT_RESPONSE" | tr -d '\r')"
              [[ "$COMMENT_STATUS" =~ ^HTTP/[0-9.]+[[:space:]]+201([[:space:]]|$) ]] || {
                echo "ERROR: banner close-only salvage comment did not return HTTP 201" >&2
                exit 1
              }
              COMMENT_JSON="$(sed '1,/^[[:space:]]*$/d' <<< "$COMMENT_RESPONSE")"
              COMMENT_ID="$(jq -er --arg body "$STALE_COMMENT" --arg bot "${APP_SLUG}[bot]" \
                'select(.body == $body and .user.login == $bot) | .id' <<< "$COMMENT_JSON")"
              [[ "$COMMENT_ID" =~ ^[1-9][0-9]*$ ]]

              # Re-check engagement after the visible comment: a competing
              # human review, discussion, changed head or main vetoes close.
              test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
              test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$STALE_REF" --jq .object.sha)" = "$STALE_HEAD"
              LIVE_PR="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$STALE_PR")"
              jq -e --arg sha "$STALE_HEAD" --arg main "$SOURCE_SHA" \
                '.state == "open" and .merged == false and .head.sha == $sha and .base.sha == $main' \
                <<< "$LIVE_PR" > /dev/null
              LIVE_REVIEWS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/$STALE_PR/reviews?per_page=100" --jq '.[]' | jq -s '.')"
              test "$(jq -er 'length' <<< "$LIVE_REVIEWS")" = 0
              LIVE_COMMENTS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/$STALE_PR/comments?per_page=100" --jq '.[]' | jq -s '.')"
              jq -e --argjson id "$COMMENT_ID" \
                'length == 1 and .[0].id == $id' <<< "$LIVE_COMMENTS" >/dev/null
              LIVE_THREADS="$(gh api graphql -f owner=portyu9 -f name=portyu9 \
                -F number="$STALE_PR" \
                -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){totalCount nodes{id isResolved} pageInfo{hasNextPage}}}}}')"
              jq -e '.data.repository.pullRequest.reviewThreads |
                .totalCount == 0 and (.nodes|length == 0) and
                .pageInfo.hasNextPage == false' <<< "$LIVE_THREADS" >/dev/null

              CLOSE_RESPONSE="$(GH_TOKEN="$PUBLISH_TOKEN" gh api --include --method PATCH \
                "repos/${GITHUB_REPOSITORY}/pulls/$STALE_PR" -f state=closed)"
              CLOSE_STATUS="$(head -n 1 <<< "$CLOSE_RESPONSE" | tr -d '\r')"
              [[ "$CLOSE_STATUS" =~ ^HTTP/[0-9.]+[[:space:]]+200([[:space:]]|$) ]] || {
                echo "ERROR: banner stale PR close returned non-200" >&2
                exit 1
              }
              jq -e --arg head "$STALE_HEAD" \
                '.state == "closed" and .merged_at == null and .head.sha == $head' \
                <<< "$(sed '1,/^[[:space:]]*$/d' <<< "$CLOSE_RESPONSE")" >/dev/null
              test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$SOURCE_SHA"
              echo "Verified, commented and closed stale native banner PR #$STALE_PR without merge." ;;
            *)
              echo "ERROR: unknown native banner stale recovery decision" >&2
              exit 1 ;;
          esac
          rm -f "$APP_INSTALL" "$APP_BOT" "$RUNNER_TEMP/banner-app-evidence.json" \
            "$RUNNER_TEMP/banner-stale-decision.json" "$RUNNER_TEMP/banner-stale-reproof.json"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$SOURCE_SHA"
          # Only now is a no-open-candidate verdict available. Keep the
          # orphan-ref guard, but do not reject an already-open current PR.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Banner ref exists without a qualified open current-day PR; fail closed."
            exit 1
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)"
          created=false
          opened=false
          cleanup() {
            if [ "$created" = true ] && [ "$opened" != true ]; then
              git -C source -c "http.https://github.com/.extraheader=$AUTH_HEADER" push -q origin ":refs/heads/$BRANCH" || true
            fi
          }
          trap 'cleanup; rm -f "$RUNNER_TEMP/banner-app-key.pem" "$RUNNER_TEMP/banner-app-install.json" "$RUNNER_TEMP/banner-app-bot.json" "$RUNNER_TEMP/banner-app-token.json"' EXIT
          git -C source -c "http.https://github.com/.extraheader=$AUTH_HEADER" push -q origin "HEAD:refs/heads/$BRANCH"
          created=true
          PR_BODY="README-only UTC banner rotation using the reviewed approved v8 catalog. Three image surfaces and marker only; external CI evidence unchanged. Base $SOURCE_SHA. Output SHA256 $OUTPUT_SHA256. Requires normal protected checks."
          PR_REQUEST="$(jq -n --arg title "chore(profile): independently rotate approved banners for $UTC_DAY" --arg head "$BRANCH" --arg body "$PR_BODY" '{title:$title,base:"main",head:$head,body:$body,draft:false}')"
          PR_JSON="$(GH_TOKEN="$PUBLISH_TOKEN" gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" --input - <<< "$PR_REQUEST")"
          jq -e --arg head "$BRANCH" '(type=="object") and (.number|type=="number" and .>0) and (.head.ref==$head) and (.base.ref=="main") and (.draft==false)' <<< "$PR_JSON" > /dev/null
          opened=true
          unset PUBLISH_TOKEN AUTH_HEADER
