# Temporary read-only frozen candidate measurement. Remove before any feature merge.
name: Temporary exact capability measurement
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  measure:
    name: exact-trusted-main-capability-measure
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact trusted admitted compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 84ba18de4c89b962b3c6b7a741205bd2be5ae4dc
          path: trusted
          persist-credentials: false
      - name: Checkout exact frozen candidate subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 00df005b67d3c507984c50cd684594cbfe4f9509
          path: candidate
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - name: Measure exact frozen source with accepted compiler only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "84ba18de4c89b962b3c6b7a741205bd2be5ae4dc"
          test "$(git -C candidate rev-parse HEAD)" = "00df005b67d3c507984c50cd684594cbfe4f9509"
          TREE_SHA="$(git -C candidate rev-parse 'HEAD^{tree}')"
          test "$TREE_SHA" = "110ca919bdaf516b82b0f49d4aff52cecd5a21c8"
          cd trusted
          python3 scripts/verify-python-runtime.py
          python3 scripts/workflow_capability_admission.py ../candidate --candidate-tree-sha "$TREE_SHA" --self-test --measure > "$RUNNER_TEMP/capability-measurement.json"
          jq -e '.measurement | type == "object"' "$RUNNER_TEMP/capability-measurement.json" >/dev/null
          cat "$RUNNER_TEMP/capability-measurement.json"
          cat "$RUNNER_TEMP/capability-measurement.json" >> "$GITHUB_STEP_SUMMARY"
