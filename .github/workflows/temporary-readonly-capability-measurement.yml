# Temporary read-only proof only. Remove before any protected merge.
name: Temporary exact capability measurement
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
env:
  PYTHON_VERSION: '3.13.18'
jobs:
  measure:
    name: exact-trusted-main-capability-measure
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact accepted compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cad1f8609289534cf7a0b9e9864c93abddc54239
          path: trusted
          persist-credentials: false
      - name: Checkout frozen subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 799dfa859c0ac398f17588e812b4c04cffcc0ffc
          path: candidate
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - name: Measure frozen candidate using accepted compiler only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "cad1f8609289534cf7a0b9e9864c93abddc54239"
          test "$(git -C candidate rev-parse HEAD)" = "799dfa859c0ac398f17588e812b4c04cffcc0ffc"
          TREE_SHA="$(git -C candidate rev-parse 'HEAD^{tree}')"
          test "$TREE_SHA" = "5689bd683ae79f231363ee2095c5f5af0b800987"
          cd trusted
          python3 scripts/verify-python-runtime.py
          python3 scripts/workflow_capability_admission.py \\
            ../candidate \\
            --candidate-tree-sha "$TREE_SHA" \\
            --self-test \\
            --measure > "$RUNNER_TEMP/capability-measurement.json"
          jq -e '.measurement | type == "object"' "$RUNNER_TEMP/capability-measurement.json" >/dev/null
          cat "$RUNNER_TEMP/capability-measurement.json"
          cat "$RUNNER_TEMP/capability-measurement.json" >> "$GITHUB_STEP_SUMMARY"
