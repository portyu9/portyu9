# Temporary read-only independent trusted compiler measurement. Delete before feature merge.
name: Temporary exact capability measurement
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
env:
  PYTHON_VERSION: '3.13.18'
jobs:
  measure:
    name: exact-trusted-main-capability-measure
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout accepted trusted compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e76211594193482b843e990a88195de65eaa37bb
          path: trusted
          persist-credentials: false
      - name: Checkout frozen 7-file source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7707bd36ba060aeb580e05369af29db0b45c0e52
          path: candidate
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - name: Measure frozen candidate without authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "e76211594193482b843e990a88195de65eaa37bb"
          test "$(git -C candidate rev-parse HEAD)" = "7707bd36ba060aeb580e05369af29db0b45c0e52"
          TREE_SHA="$(git -C candidate rev-parse 'HEAD^{tree}')"
          test "$TREE_SHA" = "d16e55111cd4b4b651fcc7179902a11660c85316"
          cd trusted
          python3 scripts/verify-python-runtime.py
          python3 scripts/workflow_capability_admission.py ../candidate --candidate-tree-sha "$TREE_SHA" --self-test --measure > "$RUNNER_TEMP/capability-measurement.json"
          jq -e '.measurement | type == "object"' "$RUNNER_TEMP/capability-measurement.json" >/dev/null
          cat "$RUNNER_TEMP/capability-measurement.json"
          cat "$RUNNER_TEMP/capability-measurement.json" >> "$GITHUB_STEP_SUMMARY"
