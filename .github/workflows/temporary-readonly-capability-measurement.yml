# Temporary, read-only measurement workflow. Remove before any feature merge.
name: Temporary exact capability measurement
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  measure:
    name: exact-trusted-main-capability-measure
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact accepted compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2bf01c0962dbea8458e586be63422e1be2b83ff1
          path: trusted
          persist-credentials: false
      - name: Checkout frozen subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9540e8a3443fad074e85419f364adca73d2e81f9
          path: candidate
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
      - name: Measure exact frozen candidate without authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "2bf01c0962dbea8458e586be63422e1be2b83ff1"
          test "$(git -C candidate rev-parse HEAD)" = "9540e8a3443fad074e85419f364adca73d2e81f9"
          TREE_SHA="$(git -C candidate rev-parse 'HEAD^{tree}')"
          test "$TREE_SHA" = "1b6e4ca5f3c17587db5df94e74788a21c625c6ff"
          cd trusted
          python3 scripts/verify-python-runtime.py
          python3 scripts/workflow_capability_admission.py \
            ../candidate \
            --candidate-tree-sha "$TREE_SHA" \
            --self-test \
            --measure > "$RUNNER_TEMP/capability-measurement.json"
          jq -e '.measurement | type == "object"' "$RUNNER_TEMP/capability-measurement.json" >/dev/null
          cat "$RUNNER_TEMP/capability-measurement.json"
          cat "$RUNNER_TEMP/capability-measurement.json" >> "$GITHUB_STEP_SUMMARY"
