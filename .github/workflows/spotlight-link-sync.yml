name: Sync Spotlight profile links

on:
  workflow_dispatch:
  schedule:
    # Reconcile after the hourly profile-evidence refresh. Most runs are deterministic no-ops.
    - cron: "41 * * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.15"
  BOT_BRANCH_PREFIX: "automation/spotlight-links/"
  BOT_NAME: "github-actions[bot]"
  BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    name: plan-direct-links-read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    concurrency:
      group: spotlight-link-sync-planning
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.render.outputs.changed }}
      base_sha: ${{ steps.render.outputs.base_sha }}
      generated_sha: ${{ steps.render.outputs.generated_sha }}
      readme_sha256_after: ${{ steps.render.outputs.readme_sha256_after }}

    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Checkout published evidence snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated
          path: published
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 source/scripts/verify-python-runtime.py

      - name: Reconstruct exact published Spotlight projection
        run: |
          set -euo pipefail
          python3 source/scripts/validate-portfolio-evidence-ledger.py published/portfolio-evidence --require-live
          rm -rf projected-spotlight
          python3 source/scripts/generate-engineering-spotlight.py projected-spotlight \
            --ledger published/portfolio-evidence/portfolio-evidence-ledger.json
          python3 source/scripts/validate-engineering-spotlight.py projected-spotlight \
            --ledger published/portfolio-evidence/portfolio-evidence-ledger.json
          for slot in 1 2 3; do
            for theme in light dark; do
              cmp "projected-spotlight/spotlight-${slot}-${theme}.svg" \
                  "published/engineering-spotlight/spotlight-${slot}-${theme}.svg"
            done
          done

      - name: Render atomic direct-link README proposal
        id: render
        run: |
          set -euo pipefail
          GENERATED_SHA="$(git -C published rev-parse HEAD)"
          python3 source/scripts/spotlight_profile_links.py \
            --manifest projected-spotlight/spotlight-manifest.json \
            --readme source/README.md \
            --generated-sha "$GENERATED_SHA" \
            --base-sha "$GITHUB_SHA" \
            --output-dir spotlight-link-plan
          CHANGED="$(jq -r .changed spotlight-link-plan/plan.json)"
          README_SHA256_AFTER="$(jq -r .readme_sha256_after spotlight-link-plan/plan.json)"
          test "$CHANGED" = "true" || test "$CHANGED" = "false"
          [[ "$README_SHA256_AFTER" =~ ^[0-9a-f]{64}$ ]]
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "base_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "generated_sha=$GENERATED_SHA" >> "$GITHUB_OUTPUT"
          echo "readme_sha256_after=$README_SHA256_AFTER" >> "$GITHUB_OUTPUT"

      - name: Upload reviewed direct-link proposal
        if: steps.render.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spotlight-link-plan-${{ steps.render.outputs.base_sha }}-${{ steps.render.outputs.generated_sha }}
          path: spotlight-link-plan/*
          if-no-files-found: error
          retention-days: 1

  lease:
    name: mint-mutation-lease-read-only
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: spotlight-link-sync-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
    outputs:
      lease_id: ${{ steps.lease.outputs.lease_id }}
      issued_at: ${{ steps.lease.outputs.issued_at }}
      expires_at: ${{ steps.lease.outputs.expires_at }}
      base_sha: ${{ steps.lease.outputs.base_sha }}
      candidate_id: ${{ steps.lease.outputs.candidate_id }}

    steps:
      - name: Mint exact short-lived mutation lease
        id: lease
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          GENERATED_SHA: ${{ needs.plan.outputs.generated_sha }}
          README_SHA256_AFTER: ${{ needs.plan.outputs.readme_sha256_after }}
        run: |
          set -euo pipefail
          LEASE_TTL_SECONDS=1800
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GENERATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$README_SHA256_AFTER" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$BASE_SHA" "$GENERATED_SHA" "$README_SHA256_AFTER" | sha256sum | cut -d' ' -f1)"
          [[ "$CANDIDATE_ID" =~ ^[0-9a-f]{64}$ ]]
          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/spotlight-link-sync.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$BASE_SHA"
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          test "$(jq -r .id <<<"$RUN")" = "$GITHUB_RUN_ID"
          test "$(jq -r .run_attempt <<<"$RUN")" = "$GITHUB_RUN_ATTEMPT"
          test "$(jq -r .head_sha <<<"$RUN")" = "$BASE_SHA"
          test "$(jq -r .head_branch <<<"$RUN")" = "main"
          test "$(jq -r .path <<<"$RUN")" = ".github/workflows/spotlight-link-sync.yml"
          test "$(jq -r .repository.id <<<"$RUN")" = "$GITHUB_REPOSITORY_ID"
          test "$(jq -r .head_repository.id <<<"$RUN")" = "$GITHUB_REPOSITORY_ID"
          ISSUED_AT="$(date -u +%s)"
          [[ "$ISSUED_AT" =~ ^[1-9][0-9]*$ ]]
          EXPIRES_AT=$((ISSUED_AT + LEASE_TTL_SECONDS))
          LEASE_ID="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" ".github/workflows/spotlight-link-sync.yml" \
            "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$BASE_SHA" "$CANDIDATE_ID" "$ISSUED_AT" "$EXPIRES_AT" | sha256sum | cut -d' ' -f1)"
          [[ "$LEASE_ID" =~ ^[0-9a-f]{64}$ ]]
          echo "lease_id=$LEASE_ID" >> "$GITHUB_OUTPUT"
          echo "issued_at=$ISSUED_AT" >> "$GITHUB_OUTPUT"
          echo "expires_at=$EXPIRES_AT" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_id=$CANDIDATE_ID" >> "$GITHUB_OUTPUT"

  reconcile:
    name: reconcile-stale-candidates-write
    needs: [plan, lease]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: spotlight-link-sync-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Remove only stale validated automation candidates
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ needs.plan.outputs.changed }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          GENERATED_SHA: ${{ needs.plan.outputs.generated_sha }}
          README_SHA256_AFTER: ${{ needs.plan.outputs.readme_sha256_after }}
          LEASE_ID: ${{ needs.lease.outputs.lease_id }}
          LEASE_ISSUED_AT: ${{ needs.lease.outputs.issued_at }}
          LEASE_EXPIRES_AT: ${{ needs.lease.outputs.expires_at }}
          LEASE_BASE_SHA: ${{ needs.lease.outputs.base_sha }}
          LEASE_CANDIDATE_ID: ${{ needs.lease.outputs.candidate_id }}
        run: |
          set -euo pipefail
          # Verify exact short-lived mutation lease.
          LEASE_TTL_SECONDS=1800
          EXPECTED_BASE_SHA="$BASE_SHA"
          EXPECTED_CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$EXPECTED_BASE_SHA" "$GENERATED_SHA" "$README_SHA256_AFTER" | sha256sum | cut -d' ' -f1)"
          test "$LEASE_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_CANDIDATE_ID" = "$EXPECTED_CANDIDATE_ID"
          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/spotlight-link-sync.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_EXPIRES_AT" -eq $((LEASE_ISSUED_AT + LEASE_TTL_SECONDS))
          NOW_EPOCH="$(date -u +%s)"
          test "$NOW_EPOCH" -ge "$LEASE_ISSUED_AT"
          test "$NOW_EPOCH" -lt "$LEASE_EXPIRES_AT"
          EXPECTED_LEASE_ID="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" ".github/workflows/spotlight-link-sync.yml" \
            "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$LEASE_BASE_SHA" "$LEASE_CANDIDATE_ID" "$LEASE_ISSUED_AT" "$LEASE_EXPIRES_AT" | sha256sum | cut -d' ' -f1)"
          test "$EXPECTED_LEASE_ID" = "$LEASE_ID"

          test "$CHANGED" = "true" || test "$CHANGED" = "false"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GENERATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$README_SHA256_AFTER" =~ ^[0-9a-f]{64}$ ]]
          test "$BASE_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/generated" --jq .object.sha)" = "$GENERATED_SHA"

          EXPECTED_CANDIDATE_BRANCH=""
          if [ "$CHANGED" = "true" ]; then
            EXPECTED_CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$BASE_SHA" "$GENERATED_SHA" "$README_SHA256_AFTER" | sha256sum | cut -d' ' -f1)"
            [[ "$EXPECTED_CANDIDATE_ID" =~ ^[0-9a-f]{64}$ ]]
            EXPECTED_CANDIDATE_BRANCH="${BOT_BRANCH_PREFIX}${EXPECTED_CANDIDATE_ID}"
            [[ "$EXPECTED_CANDIDATE_BRANCH" =~ ^automation/spotlight-links/[0-9a-f]{64}$ ]]
          fi

          STALE_AFTER_SECONDS=1800
          NOW_EPOCH="$(date -u +%s)"
          [[ "$NOW_EPOCH" =~ ^[1-9][0-9]*$ ]]
          REFS="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${BOT_BRANCH_PREFIX}")"
          REF_COUNT="$(jq 'length' <<<"$REFS")"
          [[ "$REF_COUNT" =~ ^[0-9]+$ ]]
          test "$REF_COUNT" -le 20 || {
            echo "Spotlight candidate namespace exceeds the reviewed reconciliation bound." >&2
            exit 1
          }
          INVALID_REFS="$(jq '[.[] | select(
            (.ref | test("^refs/heads/automation/spotlight-links/[0-9a-f]{64}$") | not) or
            .object.type != "commit" or
            (.object.sha | test("^[0-9a-f]{40}$") | not)
          )] | length' <<<"$REFS")"
          test "$INVALID_REFS" = "0" || {
            echo "Spotlight candidate namespace contains an unreviewed ref shape." >&2
            exit 1
          }

          CLEANED=0
          PRESERVED_CURRENT=0
          PRESERVED_YOUNG=0
          while IFS=$'\t' read -r REF HEAD_SHA; do
            test -n "$REF" || continue
            BRANCH="${REF#refs/heads/}"
            [[ "$BRANCH" =~ ^automation/spotlight-links/[0-9a-f]{64}$ ]]
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

            if [ -n "$EXPECTED_CANDIDATE_BRANCH" ] && [ "$BRANCH" = "$EXPECTED_CANDIDATE_BRANCH" ]; then
              PRESERVED_CURRENT=$((PRESERVED_CURRENT + 1))
              continue
            fi

            CANDIDATE_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}")"
            test "$(jq '.parents | length' <<<"$CANDIDATE_COMMIT")" = "1"
            PARENT_SHA="$(jq -r '.parents[0].sha' <<<"$CANDIDATE_COMMIT")"
            [[ "$PARENT_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$(jq -r .author.name <<<"$CANDIDATE_COMMIT")" = "$BOT_NAME"
            test "$(jq -r .author.email <<<"$CANDIDATE_COMMIT")" = "$BOT_EMAIL"
            test "$(jq -r .committer.name <<<"$CANDIDATE_COMMIT")" = "$BOT_NAME"
            test "$(jq -r .committer.email <<<"$CANDIDATE_COMMIT")" = "$BOT_EMAIL"
            test "$(jq -r .message <<<"$CANDIDATE_COMMIT")" = "chore: sync rotating Spotlight links"

            COMMITTER_DATE="$(jq -r .committer.date <<<"$CANDIDATE_COMMIT")"
            COMMIT_EPOCH="$(date -u -d "$COMMITTER_DATE" +%s)"
            [[ "$COMMIT_EPOCH" =~ ^[1-9][0-9]*$ ]]
            AGE_SECONDS=$((NOW_EPOCH - COMMIT_EPOCH))
            test "$AGE_SECONDS" -ge 0
            if [ "$AGE_SECONDS" -lt "$STALE_AFTER_SECONDS" ]; then
              PRESERVED_YOUNG=$((PRESERVED_YOUNG + 1))
              continue
            fi

            COMPARE="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PARENT_SHA}...${HEAD_SHA}")"
            test "$(jq -r .status <<<"$COMPARE")" = "ahead"
            test "$(jq -r .base_commit.sha <<<"$COMPARE")" = "$PARENT_SHA"
            test "$(jq -r .merge_base_commit.sha <<<"$COMPARE")" = "$PARENT_SHA"
            test "$(jq -r .ahead_by <<<"$COMPARE")" = "1"
            test "$(jq -r .behind_by <<<"$COMPARE")" = "0"
            test "$(jq -r .total_commits <<<"$COMPARE")" = "1"
            test "$(jq '.files | length' <<<"$COMPARE")" = "1"
            test "$(jq -r '.files[0].filename' <<<"$COMPARE")" = "README.md"
            test "$(jq -r '.files[0].status' <<<"$COMPARE")" = "modified"

            PRS="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=portyu9:${BRANCH}&base=main&per_page=2")"
            PR_COUNT="$(jq 'length' <<<"$PRS")"
            test "$PR_COUNT" = "0" || test "$PR_COUNT" = "1"
            if [ "$PR_COUNT" = "1" ]; then
              PR="$(jq -c '.[0]' <<<"$PRS")"
              PR_NUMBER="$(jq -r .number <<<"$PR")"
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
              test "$(jq -r .state <<<"$PR")" = "open"
              test "$(jq -r .user.login <<<"$PR")" = "github-actions[bot]"
              test "$(jq -r .title <<<"$PR")" = "chore: sync rotating Spotlight links"
              test "$(jq -r .body <<<"$PR")" = "Automation-managed README-only update. Direct Spotlight repository/workflow links and immutable card snapshot are derived from the validated published evidence. Main protection and all required checks remain in force."
              test "$(jq -r .base.ref <<<"$PR")" = "main"
              test "$(jq -r .head.ref <<<"$PR")" = "$BRANCH"
              test "$(jq -r .head.sha <<<"$PR")" = "$HEAD_SHA"
              test "$(jq -r .head.repo.full_name <<<"$PR")" = "$GITHUB_REPOSITORY"
              test "$(jq -r .maintainer_can_modify <<<"$PR")" = "false"
              jq -n '{state:"closed"}' > close-pr.json
              CLOSED_PR="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --input close-pr.json)"
              test "$(jq -r .state <<<"$CLOSED_PR")" = "closed"
              test "$(jq -r .head.ref <<<"$CLOSED_PR")" = "$BRANCH"
              test "$(jq -r .head.sha <<<"$CLOSED_PR")" = "$HEAD_SHA"
            fi

            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null
            REMAINING_REFS="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${BRANCH}")"
            REMAINING_EXACT="$(jq --arg ref "refs/heads/${BRANCH}" '[.[] | select(.ref == $ref)] | length' <<<"$REMAINING_REFS")"
            test "$REMAINING_EXACT" = "0"
            CLEANED=$((CLEANED + 1))
          done < <(jq -r '.[] | [.ref, .object.sha] | @tsv' <<<"$REFS")

          {
            echo "### Spotlight interrupted-transaction reconciliation"
            echo "- candidate refs observed: **$REF_COUNT**"
            echo "- stale candidates cleaned: **$CLEANED**"
            echo "- current deterministic candidate preserved: **$PRESERVED_CURRENT**"
            echo "- candidates below 30-minute stale floor preserved: **$PRESERVED_YOUNG**"
          } >> "$GITHUB_STEP_SUMMARY"

  budget:
    if: needs.plan.outputs.changed == 'true'
    name: mutation-budget-read-only
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: spotlight-link-sync-planning
      cancel-in-progress: true
    permissions:
      actions: read
    outputs:
      allowed: ${{ steps.admit.outputs.allowed }}
      attempt_count: ${{ steps.admit.outputs.attempt_count }}

    steps:
      - name: Admit exact source epoch within bounded mutation budget
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          GENERATED_SHA: ${{ needs.plan.outputs.generated_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GENERATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          ARTIFACT_NAME="spotlight-link-plan-${BASE_SHA}-${GENERATED_SHA}"
          MAX_ATTEMPTS=2
          ARTIFACTS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100")"
          TOTAL="$(jq -r '.total_count // empty' <<<"$ARTIFACTS")"
          COUNT="$(jq '.artifacts | length' <<<"$ARTIFACTS")"
          [[ "$TOTAL" =~ ^[0-9]+$ ]]
          [[ "$COUNT" =~ ^[0-9]+$ ]]
          test "$TOTAL" = "$COUNT" || {
            echo "Spotlight mutation-budget artifact history is incomplete." >&2
            exit 1
          }
          test "$TOTAL" -le 100 || {
            echo "Spotlight mutation-budget artifact history exceeds one complete reviewed page." >&2
            exit 1
          }
          INVALID="$(jq \
            --arg name "$ARTIFACT_NAME" \
            --arg base "$BASE_SHA" \
            --argjson repo "$GITHUB_REPOSITORY_ID" \
            '[.artifacts[] | select(
              .name != $name or
              .expired != false or
              .workflow_run == null or
              .workflow_run.repository_id != $repo or
              .workflow_run.head_repository_id != $repo or
              .workflow_run.head_branch != "main" or
              .workflow_run.head_sha != $base
            )] | length' <<<"$ARTIFACTS")"
          test "$INVALID" = "0"
          CURRENT="$(jq --argjson run_id "$GITHUB_RUN_ID" '[.artifacts[] | select(.workflow_run.id == $run_id)] | length' <<<"$ARTIFACTS")"
          test "$CURRENT" = "1" || {
            echo "Current Spotlight mutation-attempt artifact is missing or ambiguous." >&2
            exit 1
          }
          if [ "$TOTAL" -le "$MAX_ATTEMPTS" ]; then
            ALLOWED=true
            REASON="within-budget"
          else
            ALLOWED=false
            REASON="source-epoch-budget-exhausted"
          fi
          echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          echo "attempt_count=$TOTAL" >> "$GITHUB_OUTPUT"
          {
            echo "### Spotlight mutation budget"
            echo "- source main: \`$BASE_SHA\`"
            echo "- generated: \`$GENERATED_SHA\`"
            echo "- immutable changed-plan attempts in current 24h artifact window: **$TOTAL / $MAX_ATTEMPTS**"
            echo "- admission: **$ALLOWED** ($REASON)"
          } >> "$GITHUB_STEP_SUMMARY"

  quarantine:
    if: always() && needs.plan.outputs.changed == 'true' && needs.budget.result == 'success' && needs.budget.outputs.allowed != 'true'
    name: mutation-budget-quarantine-read-only
    needs: [plan, budget]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    concurrency:
      group: spotlight-link-sync-planning
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Report fail-closed mutation quarantine
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          GENERATED_SHA: ${{ needs.plan.outputs.generated_sha }}
          ATTEMPT_COUNT: ${{ needs.budget.outputs.attempt_count }}
        run: |
          set -euo pipefail
          {
            echo "### Spotlight mutation quarantine"
            echo "Constructive mutation authority is disabled for source epoch \`$BASE_SHA / $GENERATED_SHA\`."
            echo "Observed changed-plan attempts: **$ATTEMPT_COUNT**."
            echo "No candidate creation, pull request creation, workflow approval, or merge mutation was authorized by this budget decision."
            echo "Reductive stale-candidate reconciliation remains a separately modeled maintenance capability."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Spotlight source-epoch mutation budget exhausted; constructive mutation remains disabled." >&2
          exit 1

  propose:
    if: needs.plan.outputs.changed == 'true' && needs.budget.outputs.allowed == 'true'
    name: propose-readme-only-write
    needs: [plan, lease, reconcile, budget]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    concurrency:
      group: spotlight-link-sync-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.propose.outputs.pr_number }}
      head_sha: ${{ steps.propose.outputs.head_sha }}
      base_sha: ${{ steps.propose.outputs.base_sha }}
      candidate_branch: ${{ steps.propose.outputs.candidate_branch }}

    steps:
      - name: Download reviewed direct-link proposal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spotlight-link-plan-${{ needs.plan.outputs.base_sha }}-${{ needs.plan.outputs.generated_sha }}
          path: spotlight-link-plan
          digest-mismatch: error

      - name: Create or reuse immutable README-only candidate
        id: propose
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.base_sha }}
          GENERATED_SHA: ${{ needs.plan.outputs.generated_sha }}
          README_SHA256_AFTER: ${{ needs.plan.outputs.readme_sha256_after }}
          LEASE_ID: ${{ needs.lease.outputs.lease_id }}
          LEASE_ISSUED_AT: ${{ needs.lease.outputs.issued_at }}
          LEASE_EXPIRES_AT: ${{ needs.lease.outputs.expires_at }}
          LEASE_BASE_SHA: ${{ needs.lease.outputs.base_sha }}
          LEASE_CANDIDATE_ID: ${{ needs.lease.outputs.candidate_id }}
        run: |
          set -euo pipefail
          # Verify exact short-lived mutation lease.
          LEASE_TTL_SECONDS=1800
          EXPECTED_BASE_SHA="$SOURCE_SHA"
          EXPECTED_CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$EXPECTED_BASE_SHA" "$GENERATED_SHA" "$README_SHA256_AFTER" | sha256sum | cut -d' ' -f1)"
          test "$LEASE_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_CANDIDATE_ID" = "$EXPECTED_CANDIDATE_ID"
          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/spotlight-link-sync.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_EXPIRES_AT" -eq $((LEASE_ISSUED_AT + LEASE_TTL_SECONDS))
          NOW_EPOCH="$(date -u +%s)"
          test "$NOW_EPOCH" -ge "$LEASE_ISSUED_AT"
          test "$NOW_EPOCH" -lt "$LEASE_EXPIRES_AT"
          EXPECTED_LEASE_ID="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" ".github/workflows/spotlight-link-sync.yml" \
            "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$LEASE_BASE_SHA" "$LEASE_CANDIDATE_ID" "$LEASE_ISSUED_AT" "$LEASE_EXPIRES_AT" | sha256sum | cut -d' ' -f1)"
          test "$EXPECTED_LEASE_ID" = "$LEASE_ID"

          PLAN="spotlight-link-plan/plan.json"
          PROPOSED="spotlight-link-plan/README.md"
          test -s "$PLAN" && test -s "$PROPOSED"
          test "$(jq -r .version "$PLAN")" = "spotlight-profile-links-v1"
          test "$(jq -r .base_sha "$PLAN")" = "$SOURCE_SHA"
          test "$(jq -r .generated_sha "$PLAN")" = "$GENERATED_SHA"
          [[ "$README_SHA256_AFTER" =~ ^[0-9a-f]{64}$ ]]
          test "$(jq -r .readme_sha256_after "$PLAN")" = "$README_SHA256_AFTER"
          test "$(sha256sum "$PROPOSED" | cut -d' ' -f1)" = "$README_SHA256_AFTER"

          CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$SOURCE_SHA" "$GENERATED_SHA" "$README_SHA256_AFTER" | sha256sum | cut -d' ' -f1)"
          CANDIDATE_BRANCH="${BOT_BRANCH_PREFIX}${CANDIDATE_ID}"
          [[ "$CANDIDATE_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_BRANCH" =~ ^automation/spotlight-links/[0-9a-f]{64}$ ]]

          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/contents/README.md?ref=main" --jq .content \
            | tr -d '\n' | base64 --decode > current-readme.md
          test "$(sha256sum current-readme.md | cut -d' ' -f1)" = "$(jq -r .readme_sha256_before "$PLAN")"

          # A matching immutable ref may only be reused; it is never PATCHed or force-moved.
          MATCHING_REFS="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${CANDIDATE_BRANCH}")"
          EXACT_REF_COUNT="$(jq --arg ref "refs/heads/${CANDIDATE_BRANCH}" '[.[] | select(.ref == $ref)] | length' <<<"$MATCHING_REFS")"
          test "$EXACT_REF_COUNT" = "0" || test "$EXACT_REF_COUNT" = "1"
          if [ "$EXACT_REF_COUNT" = "1" ]; then
            HEAD_SHA="$(jq -r --arg ref "refs/heads/${CANDIDATE_BRANCH}" '[.[] | select(.ref == $ref)][0].object.sha' <<<"$MATCHING_REFS")"
          else
            CONTENT="$(base64 -w0 "$PROPOSED")"
            jq -n --arg content "$CONTENT" '{content:$content,encoding:"base64"}' > blob.json
            BLOB="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input blob.json)"
            README_BLOB_SHA="$(jq -r .sha <<<"$BLOB")"
            [[ "$README_BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]

            BASE_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${SOURCE_SHA}")"
            BASE_TREE_SHA="$(jq -r .tree.sha <<<"$BASE_COMMIT")"
            [[ "$BASE_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
            jq -n \
              --arg base_tree "$BASE_TREE_SHA" \
              --arg blob "$README_BLOB_SHA" \
              '{base_tree:$base_tree,tree:[{path:"README.md",mode:"100644",type:"blob",sha:$blob}]}' > tree.json
            TREE="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input tree.json)"
            CANDIDATE_TREE_SHA="$(jq -r .sha <<<"$TREE")"
            [[ "$CANDIDATE_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$CANDIDATE_TREE_SHA" != "$BASE_TREE_SHA"

            jq -n \
              --arg message "chore: sync rotating Spotlight links" \
              --arg tree "$CANDIDATE_TREE_SHA" \
              --arg parent "$SOURCE_SHA" \
              --arg name "$BOT_NAME" \
              --arg email "$BOT_EMAIL" \
              '{message:$message,tree:$tree,parents:[$parent],author:{name:$name,email:$email},committer:{name:$name,email:$email}}' > commit.json
            CANDIDATE_COMMIT="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input commit.json)"
            HEAD_SHA="$(jq -r .sha <<<"$CANDIDATE_COMMIT")"
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi

          # Validate the complete candidate object before first publication or retry reuse.
          CANDIDATE_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}")"
          test "$(jq '.parents | length' <<<"$CANDIDATE_COMMIT")" = "1"
          test "$(jq -r '.parents[0].sha' <<<"$CANDIDATE_COMMIT")" = "$SOURCE_SHA"
          test "$(jq -r .author.name <<<"$CANDIDATE_COMMIT")" = "$BOT_NAME"
          test "$(jq -r .author.email <<<"$CANDIDATE_COMMIT")" = "$BOT_EMAIL"
          test "$(jq -r .committer.name <<<"$CANDIDATE_COMMIT")" = "$BOT_NAME"
          test "$(jq -r .committer.email <<<"$CANDIDATE_COMMIT")" = "$BOT_EMAIL"
          test "$(jq -r .message <<<"$CANDIDATE_COMMIT")" = "chore: sync rotating Spotlight links"
          COMPARE="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...${HEAD_SHA}")"
          test "$(jq -r .status <<<"$COMPARE")" = "ahead"
          test "$(jq -r .base_commit.sha <<<"$COMPARE")" = "$SOURCE_SHA"
          test "$(jq -r .merge_base_commit.sha <<<"$COMPARE")" = "$SOURCE_SHA"
          test "$(jq -r .ahead_by <<<"$COMPARE")" = "1"
          test "$(jq -r .behind_by <<<"$COMPARE")" = "0"
          test "$(jq -r .total_commits <<<"$COMPARE")" = "1"
          test "$(jq '.files | length' <<<"$COMPARE")" = "1"
          test "$(jq -r '.files[0].filename' <<<"$COMPARE")" = "README.md"
          test "$(jq -r '.files[0].status' <<<"$COMPARE")" = "modified"
          gh api "repos/${GITHUB_REPOSITORY}/contents/README.md?ref=${HEAD_SHA}" --jq .content \
            | tr -d '\n' | base64 --decode > candidate-readme.md
          test "$(sha256sum candidate-readme.md | cut -d' ' -f1)" = "$README_SHA256_AFTER"

          if [ "$EXACT_REF_COUNT" = "0" ]; then
            jq -n --arg ref "refs/heads/${CANDIDATE_BRANCH}" --arg sha "$HEAD_SHA" '{ref:$ref,sha:$sha}' > ref.json
            CREATED_REF="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" --input ref.json)"
            test "$(jq -r .ref <<<"$CREATED_REF")" = "refs/heads/${CANDIDATE_BRANCH}"
            test "$(jq -r .object.sha <<<"$CREATED_REF")" = "$HEAD_SHA"
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CANDIDATE_BRANCH}" --jq .object.sha)" = "$HEAD_SHA"

          PRS="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=portyu9:${CANDIDATE_BRANCH}&base=main&per_page=10")"
          COUNT="$(jq 'length' <<<"$PRS")"
          if [ "$COUNT" = "0" ]; then
            jq -n \
              --arg title "chore: sync rotating Spotlight links" \
              --arg head "$CANDIDATE_BRANCH" \
              --arg base "main" \
              --arg body "Automation-managed README-only update. Direct Spotlight repository/workflow links and immutable card snapshot are derived from the validated published evidence. Main protection and all required checks remain in force." \
              '{title:$title,head:$head,base:$base,body:$body,maintainer_can_modify:false}' > pr.json
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" --input pr.json > pr-response.json
            PR_NUMBER="$(jq -r .number pr-response.json)"
          else
            test "$COUNT" = "1"
            PR_NUMBER="$(jq -r '.[0].number' <<<"$PRS")"
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          PR="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"$PR")" = "open"
          test "$(jq -r .base.ref <<<"$PR")" = "main"
          test "$(jq -r .head.ref <<<"$PR")" = "$CANDIDATE_BRANCH"
          test "$(jq -r .head.sha <<<"$PR")" = "$HEAD_SHA"
          test "$(jq -r .head.repo.full_name <<<"$PR")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .maintainer_can_modify <<<"$PR")" = "false"

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"

  approve:
    if: needs.plan.outputs.changed == 'true' && needs.budget.outputs.allowed == 'true' && needs.propose.result == 'success'
    name: approve-bot-pr-checks-only
    needs: [plan, lease, reconcile, budget, propose]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: spotlight-link-sync-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: write
    outputs:
      codeql_run_id: ${{ steps.authorize.outputs.codeql_run_id }}
      codeql_check_suite_id: ${{ steps.authorize.outputs.codeql_check_suite_id }}
      dependency_run_id: ${{ steps.authorize.outputs.dependency_run_id }}
      dependency_check_suite_id: ${{ steps.authorize.outputs.dependency_check_suite_id }}
      profile_run_id: ${{ steps.authorize.outputs.profile_run_id }}
      profile_check_suite_id: ${{ steps.authorize.outputs.profile_check_suite_id }}

    steps:
      - name: Approve and wait for only the exact README-only automation checks
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.propose.outputs.base_sha }}
          HEAD_SHA: ${{ needs.propose.outputs.head_sha }}
          CANDIDATE_BRANCH: ${{ needs.propose.outputs.candidate_branch }}
          GENERATED_SHA: ${{ needs.plan.outputs.generated_sha }}
          README_SHA256_AFTER: ${{ needs.plan.outputs.readme_sha256_after }}
          LEASE_ID: ${{ needs.lease.outputs.lease_id }}
          LEASE_ISSUED_AT: ${{ needs.lease.outputs.issued_at }}
          LEASE_EXPIRES_AT: ${{ needs.lease.outputs.expires_at }}
          LEASE_BASE_SHA: ${{ needs.lease.outputs.base_sha }}
          LEASE_CANDIDATE_ID: ${{ needs.lease.outputs.candidate_id }}
        run: |
          set -euo pipefail
          # Verify exact short-lived mutation lease.
          LEASE_TTL_SECONDS=1800
          EXPECTED_BASE_SHA="$BASE_SHA"
          EXPECTED_CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$EXPECTED_BASE_SHA" "$GENERATED_SHA" "$README_SHA256_AFTER" | sha256sum | cut -d' ' -f1)"
          test "$LEASE_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_CANDIDATE_ID" = "$EXPECTED_CANDIDATE_ID"
          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/spotlight-link-sync.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_EXPIRES_AT" -eq $((LEASE_ISSUED_AT + LEASE_TTL_SECONDS))
          NOW_EPOCH="$(date -u +%s)"
          test "$NOW_EPOCH" -ge "$LEASE_ISSUED_AT"
          test "$NOW_EPOCH" -lt "$LEASE_EXPIRES_AT"
          EXPECTED_LEASE_ID="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" ".github/workflows/spotlight-link-sync.yml" \
            "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$LEASE_BASE_SHA" "$LEASE_CANDIDATE_ID" "$LEASE_ISSUED_AT" "$LEASE_EXPIRES_AT" | sha256sum | cut -d' ' -f1)"
          test "$EXPECTED_LEASE_ID" = "$LEASE_ID"

          EXPECTED_CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$BASE_SHA" "$GENERATED_SHA" "$README_SHA256_AFTER" | sha256sum | cut -d' ' -f1)"
          test "$CANDIDATE_BRANCH" = "${BOT_BRANCH_PREFIX}${EXPECTED_CANDIDATE_ID}"
          [[ "$CANDIDATE_BRANCH" =~ ^automation/spotlight-links/[0-9a-f]{64}$ ]]

          # Approval is authority to execute. Prove both mutable roots still match the
          # reviewed plan, the immutable ref is unchanged, and the exact head is one README-only commit.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/generated" --jq .object.sha)" = "$GENERATED_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CANDIDATE_BRANCH}" --jq .object.sha)" = "$HEAD_SHA"
          COMPARE="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}")"
          test "$(jq -r .status <<<"$COMPARE")" = "ahead"
          test "$(jq -r .base_commit.sha <<<"$COMPARE")" = "$BASE_SHA"
          test "$(jq -r .merge_base_commit.sha <<<"$COMPARE")" = "$BASE_SHA"
          test "$(jq -r .ahead_by <<<"$COMPARE")" = "1"
          test "$(jq -r .behind_by <<<"$COMPARE")" = "0"
          test "$(jq -r .total_commits <<<"$COMPARE")" = "1"
          test "$(jq '.files | length' <<<"$COMPARE")" = "1"
          test "$(jq -r '.files[0].filename' <<<"$COMPARE")" = "README.md"
          test "$(jq -r '.files[0].status' <<<"$COMPARE")" = "modified"

          CODEQL_WORKFLOW_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml" --jq .id)"
          DEPENDENCY_WORKFLOW_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/dependency-review.yml" --jq .id)"
          PROFILE_WORKFLOW_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/profile-quality.yml" --jq .id)"
          EXPECTED_IDENTITIES="$(jq -cn \
            --argjson codeql "$CODEQL_WORKFLOW_ID" \
            --argjson dependency "$DEPENDENCY_WORKFLOW_ID" \
            --argjson profile "$PROFILE_WORKFLOW_ID" \
            '[{"name":"CodeQL","workflow_id":$codeql},{"name":"Dependency review","workflow_id":$dependency},{"name":"Profile quality","workflow_id":$profile}] | sort_by(.name)')"

          APPROVAL_REQUESTED_RUN_IDS=""
          for attempt in $(seq 1 60); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100")"
            RUNS_TOTAL="$(jq -r '.total_count // empty' <<<"$RUNS")"
            RUNS_COUNT="$(jq '.[("workflow" + "_runs")] | length' <<<"$RUNS")"
            [[ "$RUNS_TOTAL" =~ ^[0-9]+$ ]]
            [[ "$RUNS_COUNT" =~ ^[0-9]+$ ]]
            test "$RUNS_TOTAL" = "$RUNS_COUNT" || {
              echo "Canonical Spotlight-link workflow-run response is incomplete." >&2
              exit 1
            }
            test "$RUNS_TOTAL" -le 3 || {
              echo "Canonical Spotlight-link workflow-run set is ambiguous." >&2
              exit 1
            }

            ALL_SUCCESS=false
            if [ "$RUNS_TOTAL" = "3" ]; then
              OBSERVED_IDENTITIES="$(jq -c '[.[("workflow" + "_runs")][] | {name,workflow_id}] | sort_by(.name)' <<<"$RUNS")"
              test "$OBSERVED_IDENTITIES" = "$EXPECTED_IDENTITIES" || {
                echo "Canonical Spotlight-link workflow-run identities changed." >&2
                exit 1
              }
              ALL_SUCCESS=true
              for NAME in "CodeQL" "Dependency review" "Profile quality"; do
                case "$NAME" in
                  "CodeQL") EXPECTED_ID="$CODEQL_WORKFLOW_ID" ;;
                  "Dependency review") EXPECTED_ID="$DEPENDENCY_WORKFLOW_ID" ;;
                  "Profile quality") EXPECTED_ID="$PROFILE_WORKFLOW_ID" ;;
                  *) exit 1 ;;
                esac
                RUN_COUNT="$(jq --arg name "$NAME" --argjson workflow_id "$EXPECTED_ID" '[.[("workflow" + "_runs")][] | select(.name == $name and .workflow_id == $workflow_id)] | length' <<<"$RUNS")"
                test "$RUN_COUNT" = "1"
                RUN="$(jq -c --arg name "$NAME" --argjson workflow_id "$EXPECTED_ID" '[.[("workflow" + "_runs")][] | select(.name == $name and .workflow_id == $workflow_id)][0]' <<<"$RUNS")"
                RUN_ID="$(jq -r .id <<<"$RUN")"
                CHECK_SUITE_ID="$(jq -r .check_suite_id <<<"$RUN")"
                RUN_ATTEMPT="$(jq -r .run_attempt <<<"$RUN")"
                STATUS="$(jq -r .status <<<"$RUN")"
                CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN")"
                [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
                [[ "$CHECK_SUITE_ID" =~ ^[1-9][0-9]*$ ]]
                [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
                test "$(jq -r .head_sha <<<"$RUN")" = "$HEAD_SHA"
                test "$(jq -r .head_branch <<<"$RUN")" = "$CANDIDATE_BRANCH"
                test "$(jq -r .event <<<"$RUN")" = "pull_request"
                test "$(jq -r .workflow_id <<<"$RUN")" = "$EXPECTED_ID"
                test "$(jq -r .repository.full_name <<<"$RUN")" = "$GITHUB_REPOSITORY"
                test "$(jq -r .head_repository.full_name <<<"$RUN")" = "$GITHUB_REPOSITORY"
                case "$NAME" in
                  "CodeQL") CODEQL_RUN_ID="$RUN_ID"; CODEQL_CHECK_SUITE_ID="$CHECK_SUITE_ID" ;;
                  "Dependency review") DEPENDENCY_RUN_ID="$RUN_ID"; DEPENDENCY_CHECK_SUITE_ID="$CHECK_SUITE_ID" ;;
                  "Profile quality") PROFILE_RUN_ID="$RUN_ID"; PROFILE_CHECK_SUITE_ID="$CHECK_SUITE_ID" ;;
                  *) exit 1 ;;
                esac
                if [ "$STATUS" = "action_required" ] || [ "$STATUS" = "waiting" ] || [ "$CONCLUSION" = "action_required" ]; then
                  case " $APPROVAL_REQUESTED_RUN_IDS " in
                    *" $RUN_ID "*) : ;;
                    *)
                      gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approve" >/dev/null
                      APPROVAL_REQUESTED_RUN_IDS="${APPROVAL_REQUESTED_RUN_IDS} ${RUN_ID}"
                      ;;
                  esac
                  ALL_SUCCESS=false
                elif [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
                  :
                elif [ "$STATUS" = "completed" ]; then
                  echo "Canonical Spotlight-link PR workflow failed: $NAME ($CONCLUSION)." >&2
                  exit 1
                else
                  ALL_SUCCESS=false
                fi
              done
            fi
            if [ "$ALL_SUCCESS" = "true" ]; then
              break
            fi
            test "$attempt" -lt 60
            sleep 10
          done
          test "$ALL_SUCCESS" = "true"
          echo "codeql_run_id=$CODEQL_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "codeql_check_suite_id=$CODEQL_CHECK_SUITE_ID" >> "$GITHUB_OUTPUT"
          echo "dependency_run_id=$DEPENDENCY_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "dependency_check_suite_id=$DEPENDENCY_CHECK_SUITE_ID" >> "$GITHUB_OUTPUT"
          echo "profile_run_id=$PROFILE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "profile_check_suite_id=$PROFILE_CHECK_SUITE_ID" >> "$GITHUB_OUTPUT"

  merge:
    if: needs.plan.outputs.changed == 'true' && needs.budget.outputs.allowed == 'true' && needs.propose.result == 'success' && needs.approve.result == 'success'
    name: merge-readme-only-terminal-write
    needs: [plan, lease, reconcile, budget, propose, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: spotlight-link-sync-terminal
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: read
      checks: read

    steps:
      - name: Merge exact approved head and clean up immutable candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.propose.outputs.pr_number }}
          HEAD_SHA: ${{ needs.propose.outputs.head_sha }}
          BASE_SHA: ${{ needs.propose.outputs.base_sha }}
          CANDIDATE_BRANCH: ${{ needs.propose.outputs.candidate_branch }}
          GENERATED_SHA: ${{ needs.plan.outputs.generated_sha }}
          README_SHA256_AFTER: ${{ needs.plan.outputs.readme_sha256_after }}
          LEASE_ID: ${{ needs.lease.outputs.lease_id }}
          LEASE_ISSUED_AT: ${{ needs.lease.outputs.issued_at }}
          LEASE_EXPIRES_AT: ${{ needs.lease.outputs.expires_at }}
          LEASE_BASE_SHA: ${{ needs.lease.outputs.base_sha }}
          LEASE_CANDIDATE_ID: ${{ needs.lease.outputs.candidate_id }}
          CODEQL_RUN_ID: ${{ needs.approve.outputs.codeql_run_id }}
          CODEQL_CHECK_SUITE_ID: ${{ needs.approve.outputs.codeql_check_suite_id }}
          DEPENDENCY_RUN_ID: ${{ needs.approve.outputs.dependency_run_id }}
          DEPENDENCY_CHECK_SUITE_ID: ${{ needs.approve.outputs.dependency_check_suite_id }}
          PROFILE_RUN_ID: ${{ needs.approve.outputs.profile_run_id }}
          PROFILE_CHECK_SUITE_ID: ${{ needs.approve.outputs.profile_check_suite_id }}
        run: |
          set -euo pipefail
          # Verify exact short-lived mutation lease.
          LEASE_TTL_SECONDS=1800
          EXPECTED_BASE_SHA="$BASE_SHA"
          EXPECTED_CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$EXPECTED_BASE_SHA" "$GENERATED_SHA" "$README_SHA256_AFTER" | sha256sum | cut -d' ' -f1)"
          test "$LEASE_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_CANDIDATE_ID" = "$EXPECTED_CANDIDATE_ID"
          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/spotlight-link-sync.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_BASE_SHA"
          test "$LEASE_EXPIRES_AT" -eq $((LEASE_ISSUED_AT + LEASE_TTL_SECONDS))
          NOW_EPOCH="$(date -u +%s)"
          test "$NOW_EPOCH" -ge "$LEASE_ISSUED_AT"
          test "$NOW_EPOCH" -lt "$LEASE_EXPIRES_AT"
          EXPECTED_LEASE_ID="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" ".github/workflows/spotlight-link-sync.yml" \
            "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$LEASE_BASE_SHA" "$LEASE_CANDIDATE_ID" "$LEASE_ISSUED_AT" "$LEASE_EXPIRES_AT" | sha256sum | cut -d' ' -f1)"
          test "$EXPECTED_LEASE_ID" = "$LEASE_ID"

          EXPECTED_CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$BASE_SHA" "$GENERATED_SHA" "$README_SHA256_AFTER" | sha256sum | cut -d' ' -f1)"
          test "$CANDIDATE_BRANCH" = "${BOT_BRANCH_PREFIX}${EXPECTED_CANDIDATE_ID}"
          [[ "$CANDIDATE_BRANCH" =~ ^automation/spotlight-links/[0-9a-f]{64}$ ]]

          PR="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"$PR")" = "open"
          test "$(jq -r .base.ref <<<"$PR")" = "main"
          test "$(jq -r .head.ref <<<"$PR")" = "$CANDIDATE_BRANCH"
          test "$(jq -r .head.sha <<<"$PR")" = "$HEAD_SHA"
          test "$(jq -r .head.repo.full_name <<<"$PR")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .maintainer_can_modify <<<"$PR")" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/generated" --jq .object.sha)" = "$GENERATED_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CANDIDATE_BRANCH}" --jq .object.sha)" = "$HEAD_SHA"
          FILES="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          test "$(jq 'length' <<<"$FILES")" = "1"
          test "$(jq -r '.[0].filename' <<<"$FILES")" = "README.md"

          CANDIDATE_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}")"
          test "$(jq '.parents | length' <<<"$CANDIDATE_COMMIT")" = "1"
          test "$(jq -r '.parents[0].sha' <<<"$CANDIDATE_COMMIT")" = "$BASE_SHA"
          test "$(jq -r .author.name <<<"$CANDIDATE_COMMIT")" = "$BOT_NAME"
          test "$(jq -r .author.email <<<"$CANDIDATE_COMMIT")" = "$BOT_EMAIL"
          test "$(jq -r .committer.name <<<"$CANDIDATE_COMMIT")" = "$BOT_NAME"
          test "$(jq -r .committer.email <<<"$CANDIDATE_COMMIT")" = "$BOT_EMAIL"

          for ID in "$CODEQL_RUN_ID" "$CODEQL_CHECK_SUITE_ID" "$DEPENDENCY_RUN_ID" "$DEPENDENCY_CHECK_SUITE_ID" "$PROFILE_RUN_ID" "$PROFILE_CHECK_SUITE_ID"; do
            [[ "$ID" =~ ^[1-9][0-9]*$ ]]
          done
          test "$(printf '%s\n' "$CODEQL_RUN_ID" "$DEPENDENCY_RUN_ID" "$PROFILE_RUN_ID" | LC_ALL=C sort -u | wc -l)" = "3"
          test "$(printf '%s\n' "$CODEQL_CHECK_SUITE_ID" "$DEPENDENCY_CHECK_SUITE_ID" "$PROFILE_CHECK_SUITE_ID" | LC_ALL=C sort -u | wc -l)" = "3"

          CHECKS="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100")"
          CHECKS_TOTAL="$(jq -r '.total_count // empty' <<<"$CHECKS")"
          CHECKS_COUNT="$(jq '.check_runs | length' <<<"$CHECKS")"
          [[ "$CHECKS_TOTAL" =~ ^[0-9]+$ ]]
          [[ "$CHECKS_COUNT" =~ ^[0-9]+$ ]]
          test "$CHECKS_TOTAL" = "$CHECKS_COUNT" || {
            echo "Spotlight terminal check-run response is incomplete." >&2
            exit 1
          }
          EXPECTED_CHECKS="$(jq -cn \
            --arg head "$HEAD_SHA" \
            --argjson codeql "$CODEQL_CHECK_SUITE_ID" \
            --argjson dependency "$DEPENDENCY_CHECK_SUITE_ID" \
            --argjson profile "$PROFILE_CHECK_SUITE_ID" \
            '[
              {name:"analyze-actions",check_suite_id:$codeql,status:"completed",conclusion:"success",head_sha:$head},
              {name:"analyze-python",check_suite_id:$codeql,status:"completed",conclusion:"success",head_sha:$head},
              {name:"dependency-review",check_suite_id:$dependency,status:"completed",conclusion:"success",head_sha:$head},
              {name:"integration-pinned-upstream",check_suite_id:$profile,status:"completed",conclusion:"success",head_sha:$head},
              {name:"validate-contracts",check_suite_id:$profile,status:"completed",conclusion:"success",head_sha:$head}
            ] | sort_by(.name)')"
          OBSERVED_CHECKS="$(jq -c '[.check_runs[] | select(.app.id == 15368) | {name,check_suite_id:.check_suite.id,status,conclusion,head_sha}] | sort_by(.name)' <<<"$CHECKS")"
          test "$OBSERVED_CHECKS" = "$EXPECTED_CHECKS"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/generated" --jq .object.sha)" = "$GENERATED_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CANDIDATE_BRANCH}" --jq .object.sha)" = "$HEAD_SHA"
          jq -n --arg sha "$HEAD_SHA" '{merge_method:"merge",sha:$sha}' > merge.json
          RESULT="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" --input merge.json)"
          test "$(jq -r .merged <<<"$RESULT")" = "true"
          MERGE_SHA="$(jq -r .sha <<<"$RESULT")"
          test "$MERGE_SHA" != "null"

          MERGED_PR="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .merged <<<"$MERGED_PR")" = "true"
          test "$(jq -r .state <<<"$MERGED_PR")" = "closed"
          test "$(jq -r .base.ref <<<"$MERGED_PR")" = "main"
          test "$(jq -r .head.ref <<<"$MERGED_PR")" = "$CANDIDATE_BRANCH"
          test "$(jq -r .head.sha <<<"$MERGED_PR")" = "$HEAD_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$MERGE_SHA"
          CANDIDATE_REFS="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${CANDIDATE_BRANCH}")"
          EXACT_REF_COUNT="$(jq --arg ref "refs/heads/${CANDIDATE_BRANCH}" '[.[] | select(.ref == $ref)] | length' <<<"$CANDIDATE_REFS")"
          test "$EXACT_REF_COUNT" = "0" || test "$EXACT_REF_COUNT" = "1"
          if [ "$EXACT_REF_COUNT" = "1" ]; then
            test "$(jq -r --arg ref "refs/heads/${CANDIDATE_BRANCH}" '[.[] | select(.ref == $ref)][0].object.sha' <<<"$CANDIDATE_REFS")" = "$HEAD_SHA"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${CANDIDATE_BRANCH}" >/dev/null
            AFTER_REFS="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${CANDIDATE_BRANCH}")"
            AFTER_EXACT="$(jq --arg ref "refs/heads/${CANDIDATE_BRANCH}" '[.[] | select(.ref == $ref)] | length' <<<"$AFTER_REFS")"
            test "$AFTER_EXACT" = "0"
          fi
