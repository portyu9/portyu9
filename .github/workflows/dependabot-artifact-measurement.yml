name: Temporary Dependabot capability measurement (read only)
on:
  pull_request:
    paths:
      - ".github/workflows/dependabot-artifact-measurement.yml"
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.13.16"
jobs:
  measure:
    name: measure-exact-artifact-governance-candidate-read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout immutable accepted main evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ec6f4253a2c0be0321b98a82b5f31ab88a1877bf
          path: trusted
          persist-credentials: false
      - name: Checkout immutable feature candidate as inert source data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: db7551ad6223de9bb5514cf11350f4a4e71958d6
          path: candidate
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Verify immutable sources and print sanitized prior-authorization tuple
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "ec6f4253a2c0be0321b98a82b5f31ab88a1877bf"
          test "$(git -C candidate rev-parse HEAD)" = "db7551ad6223de9bb5514cf11350f4a4e71958d6"
          python3 trusted/scripts/verify-python-runtime.py
          TREE_SHA="$(git -C candidate rev-parse 'HEAD^{tree}')"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Accepted main ec6f4253a2c0be0321b98a82b5f31ab88a1877bf; candidate db7551ad6223de9bb5514cf11350f4a4e71958d6; candidate tree $TREE_SHA"
          python3 trusted/scripts/workflow_capability_admission.py \
            candidate --candidate-tree-sha "$TREE_SHA" --measure
