name: Restore profile README snapshot

on:
  push:
    branches: [profile-animation-v3]

permissions:
  contents: write

jobs:
  restore-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-animation-v3
          fetch-depth: 3
      - name: Restore exact pre-cleanup README
        run: |
          git checkout 714bf062a7a97d5168ca84c1bff4397d0b6c5df9 -- README.md
          rm .github/workflows/restore-profile-readme.yml
          git diff --check
          grep -q 'quality-engineering-automation-systems-nebula-portal-animated-v2.svg' README.md
          grep -q 'quality-engineering-automation-systems-nebula-portal-animated-v3.svg' README.md
      - name: Commit restoration
        run: |
          git config user.name "Ƴunior Ƥortal"
          git config user.email "35150859+portyu9@users.noreply.github.com"
          git add -A
          git commit -m "fix(profile): restore README after cleanup mistake"
          git push origin HEAD:profile-animation-v3
