name: One-shot native Dependabot App rebase final candidate measurement
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.13.16"
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout immutable accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f756dcfc64dad34529f474e350659d6820fd1b69
          fetch-depth: 0
          persist-credentials: false
      - name: Set up trusted Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Measure frozen exact native bot evidence handoff source
        env:
          TRUSTED_BASE: f756dcfc64dad34529f474e350659d6820fd1b69
          FROZEN_HEAD: 838cda58d48d5cd95709ecf5f0d6be2d3450f12d
          FROZEN_TREE: 4c92094fab7ec189f777825bf0ff57baf1f27ca2
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_BASE"
          test "$(git rev-parse HEAD:scripts/workflow_capability_admission.py)" = "a832c73cc3be625a8af9b5997c815b73c3520dab"
          python3 -B scripts/verify-python-runtime.py
          git fetch --no-tags --depth=1 origin "$FROZEN_HEAD"
          test "$(git rev-parse "$FROZEN_HEAD^{tree}")" = "$FROZEN_TREE"
          mkdir -p "$RUNNER_TEMP/frozen-native-bot-admission-final"
          git archive "$FROZEN_HEAD" | tar -x -C "$RUNNER_TEMP/frozen-native-bot-admission-final"
          test -z "$(git status --porcelain)"
          python3 -B scripts/workflow_capability_admission.py \
            "$RUNNER_TEMP/frozen-native-bot-admission-final" \
            --candidate-tree-sha "$FROZEN_TREE" --measure
          test -z "$(git status --porcelain)"
