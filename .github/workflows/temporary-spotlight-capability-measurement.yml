# Temporary read-only exact-source measurement; delete after frozen authorization.
# No secrets, write tokens, status publication, PR approvals or merges.
name: Temporary Spotlight capability measurement
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-spotlight-capability-measurement.yml'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch frozen accepted-main compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 041583a9e50da1881b6197ffab931ea0f039d54e
          path: trusted
          persist-credentials: false
      - name: Fetch frozen feature subject as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: aea2e56056ec7eb6a00b91cdf1ac3e04766eb5fc
          path: candidate
          persist-credentials: false
      - name: Recheck exact compiler, candidate commit, and tree
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "041583a9e50da1881b6197ffab931ea0f039d54e"
          test "$(git -C candidate rev-parse HEAD)" = "aea2e56056ec7eb6a00b91cdf1ac3e04766eb5fc"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "7e6e7566a414406d7d465b468a990c0f62ce0a39"
          python3 trusted/scripts/workflow_capability_admission.py candidate --candidate-tree-sha 7e6e7566a414406d7d465b468a990c0f62ce0a39 --measure
      - name: Independently run candidate proof regression fixtures without credentials
        run: |
          set -euo pipefail
          python3 candidate/scripts/dependabot_latest_authentic_checks.py self-test
