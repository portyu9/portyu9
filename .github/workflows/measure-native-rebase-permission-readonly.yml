# One-shot trusted-source measurement of frozen candidate; remove before merge.
name: One-shot native rebase capability measurement
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.13.16"
jobs:
  measure:
    name: accepted-main-readonly-measure
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Measure frozen candidate as read-only data
        env:
          FROZEN_BASE: ac83036a04ce280a54b08ff657c075a6c26ba2ab
          FROZEN_HEAD: 9f23d86575402c755e525db1a50531c79f1caa1a
          FROZEN_TREE: f910ac562d6d46e8e3c1c2951e03704b32ff5047
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_BASE"
          python3 scripts/verify-python-runtime.py
          git fetch --no-tags --depth=1 origin "$FROZEN_HEAD"
          test "$(git rev-parse "${FROZEN_HEAD}^{tree}")" = "$FROZEN_TREE"
          CANDIDATE_ROOT="$RUNNER_TEMP/frozen-native-rebase-candidate"
          mkdir -p "$CANDIDATE_ROOT"
          git archive "$FROZEN_HEAD" | tar -x -C "$CANDIDATE_ROOT"
          echo "Verified frozen source tree $FROZEN_TREE with accepted evaluator $FROZEN_BASE"
          python3 scripts/workflow_capability_admission.py \
            "$CANDIDATE_ROOT" \
            --candidate-tree-sha "$FROZEN_TREE" \
            --measure
