name: Dependabot controller

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.13.15"

jobs:
  controller:
    name: trusted-dependabot-codeql-controller
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: dependabot-codeql-controller
      cancel-in-progress: false
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout exact trusted default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 scripts/verify-python-runtime.py

      - name: Bind current main and one native Dependabot candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          MAIN_SHA="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$MAIN_SHA" = "$TRUSTED_SHA"

          PRS="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls?state=open&base=main&per_page=100")"
          MATCHES="$(jq -c '[.[][] | select(
            .user.login == "dependabot[bot]" and
            .state == "open" and
            .draft == false and
            .head.repo.full_name == "portyu9/portyu9" and
            (.head.ref | test("^dependabot/github_actions/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*$"))
          )] | sort_by(.number)' <<<"$PRS")"
          COUNT="$(jq 'length' <<<"$MATCHES")"
          if [ "$COUNT" = "0" ]; then
            printf 'has_target=false\n' >> "$GITHUB_OUTPUT"
            echo "No native GitHub-Actions Dependabot PR requires controller work."
            exit 0
          fi

          PR_NUMBER="$(jq -r '.[0].number' <<<"$MATCHES")"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" > dependabot-pr.json
          HEAD_SHA="$(jq -r .head.sha dependabot-pr.json)"
          HEAD_REF="$(jq -r .head.ref dependabot-pr.json)"
          BASE_SHA="$(jq -r .base.sha dependabot-pr.json)"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REF" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          if [ "$BASE_SHA" != "$MAIN_SHA" ]; then
            gh api --method PUT "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
              -f expected_head_sha="$HEAD_SHA" > update-branch.json
            test "$(jq -r .message update-branch.json)" = "Updating pull request branch."
            printf 'has_target=false\n' >> "$GITHUB_OUTPUT"
            echo "Requested exact-head Dependabot branch update; next scheduled pass will re-prove the new head."
            exit 0
          fi

          printf 'has_target=true\n' >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'head_ref=%s\n' "$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Assemble exact candidate tree as data
        if: steps.candidate.outputs.has_target == 'true'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          CANDIDATE_ROOT="$RUNNER_TEMP/dependabot-candidate"
          rm -rf "$CANDIDATE_ROOT"
          cp -a . "$CANDIDATE_ROOT"

          gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > pr-file-pages.json
          jq -r '.[][] | .filename' pr-file-pages.json | LC_ALL=C sort > changed-paths.txt
          test -s changed-paths.txt
          test "$(sort -u changed-paths.txt | wc -l)" = "$(wc -l < changed-paths.txt)"

          COMMIT="$(gh api "repos/${TARGET_REPOSITORY}/git/commits/${HEAD_SHA}")"
          test "$(jq -r .sha <<<"$COMMIT")" = "$HEAD_SHA"
          TREE_SHA="$(jq -r .tree.sha <<<"$COMMIT")"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          TREE="$(gh api "repos/${TARGET_REPOSITORY}/git/trees/${TREE_SHA}?recursive=1")"
          test "$(jq -r .truncated <<<"$TREE")" = "false"

          mapfile -t FETCH_PATHS < <(
            {
              find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%p\n' | sed 's#^./##'
              printf '%s\n' .github/action-lock.json .github/workflow-capability-bom-v1.json scripts/validate-codeql-contract.py
            } | LC_ALL=C sort -u
          )
          for PATH_VALUE in "${FETCH_PATHS[@]}"; do
            if ! grep -qxF "$PATH_VALUE" changed-paths.txt && [[ "$PATH_VALUE" != .github/workflows/* ]]; then
              continue
            fi
            ENTRY="$(jq -c --arg path "$PATH_VALUE" '[.tree[] | select(.path == $path and .type == "blob")]' <<<"$TREE")"
            test "$(jq 'length' <<<"$ENTRY")" = "1"
            test "$(jq -r '.[0].mode' <<<"$ENTRY")" = "100644"
            BLOB_SHA="$(jq -r '.[0].sha' <<<"$ENTRY")"
            [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]
            BLOB="$(gh api "repos/${TARGET_REPOSITORY}/git/blobs/${BLOB_SHA}")"
            test "$(jq -r .sha <<<"$BLOB")" = "$BLOB_SHA"
            test "$(jq -r .encoding <<<"$BLOB")" = "base64"
            mkdir -p "$CANDIDATE_ROOT/$(dirname "$PATH_VALUE")"
            jq -r .content <<<"$BLOB" | tr -d '\n' | base64 --decode > "$CANDIDATE_ROOT/$PATH_VALUE"
          done
          printf '%s\n' "$TREE_SHA" > candidate-tree-sha.txt
          printf 'candidate_root=%s\n' "$CANDIDATE_ROOT" >> "$GITHUB_OUTPUT"
          printf 'tree_sha=%s\n' "$TREE_SHA" >> "$GITHUB_OUTPUT"

      - name: Prove bot identity, atomic pin closure, and public release provenance
        if: steps.candidate.outputs.has_target == 'true'
        id: proof
        env:
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          CANDIDATE_ROOT: ${{ steps.source.outputs.candidate_root }}
        run: |
          set -euo pipefail
          python3 scripts/dependabot_controller.py probe \
            --pr dependabot-pr.json \
            --expected-head "$HEAD_SHA" \
            --base-root . \
            --candidate-root "$CANDIDATE_ROOT" \
            --out probe.json
          DEPENDENCY_REPOSITORY="$(jq -r .dependencyRepository probe.json)"
          CANDIDATE_TAG="$(jq -r .after.tag probe.json)"
          CANDIDATE_SHA="$(jq -r .after.sha probe.json)"
          test "$DEPENDENCY_REPOSITORY" = "github/codeql-action"
          [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

          git ls-remote --tags "https://github.com/${DEPENDENCY_REPOSITORY}.git" \
            "refs/tags/${CANDIDATE_TAG}" "refs/tags/${CANDIDATE_TAG}^{}" > release-refs.txt
          python3 scripts/dependabot_release.py \
            --refs release-refs.txt \
            --repository "$DEPENDENCY_REPOSITORY" \
            --tag "$CANDIDATE_TAG" \
            --expected-sha "$CANDIDATE_SHA" \
            --out resolved-release-sha.txt
          RESOLVED_SHA="$(cat resolved-release-sha.txt)"
          test "$RESOLVED_SHA" = "$CANDIDATE_SHA"

          python3 scripts/dependabot_controller.py admit \
            --pr dependabot-pr.json \
            --expected-head "$HEAD_SHA" \
            --base-root . \
            --candidate-root "$CANDIDATE_ROOT" \
            --resolved-release-sha "$RESOLVED_SHA" \
            --out dependabot-proof.json

          jq -r '.files[]' dependabot-proof.json | LC_ALL=C sort -u > expected-raw-paths.txt
          { cat expected-raw-paths.txt; printf '%s\n' .github/action-lock.json .github/workflow-capability-bom-v1.json scripts/validate-codeql-contract.py; } \
            | LC_ALL=C sort -u > expected-reconciled-paths.txt
          if cmp -s changed-paths.txt expected-raw-paths.txt; then
            STATE=raw
          elif cmp -s changed-paths.txt expected-reconciled-paths.txt; then
            STATE=reconciled
          else
            echo "ERROR: Dependabot PR contains files outside raw pin update or exact trusted reconciliation" >&2
            diff -u expected-reconciled-paths.txt changed-paths.txt || true
            exit 1
          fi
          printf 'state=%s\n' "$STATE" >> "$GITHUB_OUTPUT"
          printf 'resolved_release_sha=%s\n' "$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Atomically reconcile canonical governance files onto the bot head
        if: steps.candidate.outputs.has_target == 'true' && steps.proof.outputs.state == 'raw'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          HEAD_REF: ${{ steps.candidate.outputs.head_ref }}
          TREE_SHA: ${{ steps.source.outputs.tree_sha }}
          CANDIDATE_ROOT: ${{ steps.source.outputs.candidate_root }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)" = "$HEAD_SHA"
          python3 scripts/dependabot_controller.py derive \
            --proof dependabot-proof.json \
            --base-root . \
            --candidate-root "$CANDIDATE_ROOT" \
            --output-root "$RUNNER_TEMP/derived"

          echo '[]' > tree-entries.json
          for PATH_VALUE in .github/action-lock.json .github/workflow-capability-bom-v1.json scripts/validate-codeql-contract.py; do
            FILE="$RUNNER_TEMP/derived/$PATH_VALUE"
            test -s "$FILE"
            CONTENT="$(base64 -w0 < "$FILE")"
            BLOB="$(gh api --method POST "repos/${TARGET_REPOSITORY}/git/blobs" -f content="$CONTENT" -f encoding=base64)"
            BLOB_SHA="$(jq -r .sha <<<"$BLOB")"
            [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]
            jq --arg path "$PATH_VALUE" --arg sha "$BLOB_SHA" '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' \
              tree-entries.json > tree-entries.next.json
            mv tree-entries.next.json tree-entries.json
          done
          jq -n --arg base_tree "$TREE_SHA" --slurpfile tree tree-entries.json \
            '{base_tree:$base_tree,tree:$tree[0]}' > tree-request.json
          NEW_TREE="$(gh api --method POST "repos/${TARGET_REPOSITORY}/git/trees" --input tree-request.json)"
          NEW_TREE_SHA="$(jq -r .sha <<<"$NEW_TREE")"
          [[ "$NEW_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]

          jq -n --arg message 'Reconcile Dependabot CodeQL governance' --arg tree "$NEW_TREE_SHA" --arg parent "$HEAD_SHA" \
            '{message:$message,tree:$tree,parents:[$parent]}' > commit-request.json
          NEW_COMMIT="$(gh api --method POST "repos/${TARGET_REPOSITORY}/git/commits" --input commit-request.json)"
          NEW_HEAD_SHA="$(jq -r .sha <<<"$NEW_COMMIT")"
          [[ "$NEW_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$NEW_HEAD_SHA" != "$HEAD_SHA"

          gh api --method PATCH "repos/${TARGET_REPOSITORY}/git/refs/heads/${HEAD_REF}" \
            -f sha="$NEW_HEAD_SHA" -F force=false > updated-ref.json
          test "$(jq -r .object.sha updated-ref.json)" = "$NEW_HEAD_SHA"
          test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          echo "Reconciled exact derived governance files; next scheduled pass will re-prove the new immutable head."

      - name: Validate reconciled candidate and inspect protected checks
        if: steps.candidate.outputs.has_target == 'true' && steps.proof.outputs.state == 'reconciled'
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          HEAD_REF: ${{ steps.candidate.outputs.head_ref }}
          CANDIDATE_ROOT: ${{ steps.source.outputs.candidate_root }}
        run: |
          set -euo pipefail
          python3 scripts/dependabot_controller.py validate \
            --proof dependabot-proof.json \
            --base-root . \
            --candidate-root "$CANDIDATE_ROOT" \
            --changed-paths changed-paths.txt \
            --out reconciled.json
          test "$(jq -r .headSha reconciled.json)" = "$HEAD_SHA"
          test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)" = "$HEAD_SHA"

          READY=true
          for NAME in validate-contracts integration-pinned-upstream dependency-review trusted-capability-admission analyze-actions analyze-python; do
            CHECKS="$(gh api "repos/${TARGET_REPOSITORY}/commits/${HEAD_SHA}/check-runs?app_id=15368&check_name=${NAME}&filter=latest&per_page=100")"
            if [ "$(jq -r .total_count <<<"$CHECKS")" != "1" ] || ! jq -e --arg head "$HEAD_SHA" '.check_runs[0] | .head_sha == $head and .app.id == 15368 and .status == "completed" and .conclusion == "success"' <<<"$CHECKS" >/dev/null; then
              READY=false
            fi
          done
          printf 'ready=%s\n' "$READY" >> "$GITHUB_OUTPUT"

          if [ "$READY" != "true" ]; then
            ACTIVE="$(gh api "repos/${TARGET_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=workflow_dispatch&per_page=100")"
            if jq -e '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length > 0' <<<"$ACTIVE" >/dev/null; then
              printf 'dispatched=false\n' >> "$GITHUB_OUTPUT"
              echo "Exact-head protected checks are already active; next pass will re-evaluate."
              exit 0
            fi

            gh api --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/codeql.yml/dispatches" -f ref="$HEAD_REF" >/dev/null
            gh api --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/profile-quality.yml/dispatches" -f ref="$HEAD_REF" >/dev/null
            gh api --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/dependency-review.yml/dispatches" -f ref="$HEAD_REF" >/dev/null
            jq -n --argjson prNumber "$PR_NUMBER" --arg baseSha "$BASE_SHA" --arg headSha "$HEAD_SHA" \
              '{event_type:"dependabot-admission",client_payload:{prNumber:$prNumber,baseSha:$baseSha,headSha:$headSha}}' \
              > admission-dispatch.json
            gh api --method POST "repos/${TARGET_REPOSITORY}/dispatches" --input admission-dispatch.json >/dev/null
            printf 'dispatched=true\n' >> "$GITHUB_OUTPUT"
            echo "Dispatched exact-head protected validation; next pass will merge only after every gate is green."
          else
            printf 'dispatched=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Perform exact-head protected Dependabot merge
        if: steps.candidate.outputs.has_target == 'true' && steps.proof.outputs.state == 'reconciled' && steps.checks.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          HEAD_REF: ${{ steps.candidate.outputs.head_ref }}
        run: |
          set -euo pipefail
          PR="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"$PR")" = "open"
          test "$(jq -r .draft <<<"$PR")" = "false"
          test "$(jq -r .base.ref <<<"$PR")" = "main"
          test "$(jq -r .base.sha <<<"$PR")" = "$BASE_SHA"
          test "$(jq -r .head.sha <<<"$PR")" = "$HEAD_SHA"
          test "$(jq -r .head.ref <<<"$PR")" = "$HEAD_REF"
          test "$(jq -r .head.repo.full_name <<<"$PR")" = "$TARGET_REPOSITORY"
          test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)" = "$HEAD_SHA"

          MERGE="$(gh api --method PUT "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge \
            -f sha="$HEAD_SHA" \
            -f commit_title="Dependabot CodeQL Action release" \
            -f commit_message="Trusted atomic Dependabot CodeQL update merged after exact-head delegated admission and protected checks.")"
          test "$(jq -r .merged <<<"$MERGE")" = "true"
          MERGE_SHA="$(jq -r .sha <<<"$MERGE")"
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$MERGE_SHA"
          gh api --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/codeql.yml/dispatches" -f ref=main >/dev/null
