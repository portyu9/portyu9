name: Dependabot controller

on:
  workflow_run:
    workflows:
      - Profile quality
      - CodeQL
    types:
      - completed
    branches:
      - main
      - "dependabot/github_actions/**"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.15"

jobs:
  controller:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch != 'main' || github.event.workflow_run.event != 'pull_request')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    name: trusted-dependabot-codeql-controller
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: dependabot-codeql-controller
      cancel-in-progress: false
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout static trusted main controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 scripts/verify-python-runtime.py

      - name: Bind current main and one native Dependabot candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WAKE_RUN_ID: ${{ github.event.workflow_run.id }}
          WAKE_REF: ${{ github.ref }}
          WAKE_ACTOR: ${{ github.actor }}
          WAKE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          case "$EVENT_NAME" in
            schedule)
              ;;
            workflow_dispatch)
              test "$WAKE_REF" = "refs/heads/main"
              test "$WAKE_ACTOR" = "github-actions[bot]"
              [[ "$WAKE_SHA" =~ ^[0-9a-f]{40}$ ]]
              ;;
            workflow_run)
              [[ "$WAKE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              gh api "repos/${TARGET_REPOSITORY}/actions/runs/${WAKE_RUN_ID}" > "$RUNNER_TEMP/dependabot-wake-run.json"
              python3 scripts/dependabot_controller.py wake-run-response \
                --response "$RUNNER_TEMP/dependabot-wake-run.json" \
                --expected-run-id "$WAKE_RUN_ID" \
                --expected-repository "$TARGET_REPOSITORY" \
                --out "$RUNNER_TEMP/dependabot-wake-run-normalized.json"
              WAKE="$(cat "$RUNNER_TEMP/dependabot-wake-run.json")"
              test "$(jq -r .id <<<"$WAKE")" = "$WAKE_RUN_ID"
              WAKE_WORKFLOW="$(jq -r .name <<<"$WAKE")"
              WAKE_EVENT="$(jq -r .event <<<"$WAKE")"
              WAKE_HEAD_BRANCH="$(jq -r '.head_branch // ""' <<<"$WAKE")"
              WAKE_HEAD_SHA="$(jq -r .head_sha <<<"$WAKE")"
              test "$WAKE_WORKFLOW" = "Profile quality" || test "$WAKE_WORKFLOW" = "CodeQL"
              test "$(jq -r .repository.full_name <<<"$WAKE")" = "$TARGET_REPOSITORY"
              test "$(jq -r .head_repository.full_name <<<"$WAKE")" = "$TARGET_REPOSITORY"
              [[ "$WAKE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              if [ "$WAKE_HEAD_BRANCH" = "main" ]; then
                if [ "$WAKE_EVENT" = "pull_request" ]; then
                  printf 'has_target=false\n' >> "$GITHUB_OUTPUT"
                  echo "Ignoring main-headed pull_request workflow_run wake; reverse ancestry-sync PRs are not Dependabot candidates."
                  exit 0
                fi
                test "$WAKE_EVENT" = "push" || test "$WAKE_EVENT" = "workflow_dispatch"
              else
                test "$WAKE_EVENT" = "pull_request" || test "$WAKE_EVENT" = "workflow_dispatch"
                [[ "$WAKE_HEAD_BRANCH" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
              fi
              ;;
            *)
              echo "ERROR: unsupported Dependabot controller wake event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > "$RUNNER_TEMP/dependabot-initial-main-ref.json"
          python3 scripts/dependabot_controller.py git-ref-read-response \
            --response "$RUNNER_TEMP/dependabot-initial-main-ref.json" \
            --expected-ref "refs/heads/main" \
            --out "$RUNNER_TEMP/dependabot-initial-main-ref-normalized.json"
          MAIN_SHA="$(jq -r .sha "$RUNNER_TEMP/dependabot-initial-main-ref-normalized.json")"
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$WAKE_SHA" != "$MAIN_SHA" ]; then
            echo "Current main moved after the trusted post-review dispatch; ending this pass without merge."
            exit 0
          fi

          gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls?state=open&base=main&per_page=100" > open-pr-pages.json
          python3 scripts/workflow_capability_api_collection.py pull-requests \
            --input open-pr-pages.json \
            --out open-prs.json
          PRS="$(cat open-prs.json)"
          MATCHES="$(jq -c '[.[] | select(
            .user.login == "dependabot[bot]" and
            .state == "open" and
            .draft == false and
            .head.repo.full_name == "portyu9/portyu9" and
            (.head.ref | test("^dependabot/github_actions/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*$"))
          )] | sort_by(.number)' <<<"$PRS")"
          COUNT="$(jq 'length' <<<"$MATCHES")"
          if [ "$COUNT" = "0" ]; then
            printf 'has_target=false\n' >> "$GITHUB_OUTPUT"
            echo "No native GitHub-Actions Dependabot PR requires controller work."
            exit 0
          fi

          PR_NUMBER="$(jq -r '.[0].number' <<<"$MATCHES")"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" > dependabot-pr.json
          python3 scripts/dependabot_controller.py pull-request-response \
            --response dependabot-pr.json \
            --expected-number "$PR_NUMBER" \
            --expected-repository "$TARGET_REPOSITORY" \
            --out dependabot-pr-normalized.json
          HEAD_SHA="$(jq -r .headSha dependabot-pr-normalized.json)"
          HEAD_REF="$(jq -r .headRef dependabot-pr-normalized.json)"
          BASE_SHA="$(jq -r .baseSha dependabot-pr-normalized.json)"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REF" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          REQUESTED="$(jq -r 'if .portyu9Requested then 1 else 0 end' dependabot-pr-normalized.json)"
          [[ "$REQUESTED" =~ ^[0-9]+$ ]]
          if [ "$REQUESTED" = "0" ]; then
            REQUESTED_REVIEWER_HTTP_RESPONSE="$(gh api --include --method POST "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
              -f 'reviewers[]=portyu9')"
            REQUESTED_REVIEWER_STATUS_LINE="$(head -n 1 <<<"$REQUESTED_REVIEWER_HTTP_RESPONSE" | tr -d '\r')"
            [[ "$REQUESTED_REVIEWER_STATUS_LINE" =~ ^HTTP/[0-9.]+[[:space:]]+201([[:space:]]|$) ]] || {
              echo "ERROR: Dependabot reviewer request returned unexpected status: ${REQUESTED_REVIEWER_STATUS_LINE}" >&2
              exit 1
            }
            sed '1,/^[[:space:]]*$/d' <<<"$REQUESTED_REVIEWER_HTTP_RESPONSE" > requested-reviewer.json
            python3 scripts/dependabot_controller.py pull-request-response \
              --response requested-reviewer.json \
              --expected-number "$PR_NUMBER" \
              --expected-repository "$TARGET_REPOSITORY" \
              --out requested-reviewer-normalized.json
            test "$(jq -r .portyu9Requested requested-reviewer-normalized.json)" = "true"
          fi

          if [ "$BASE_SHA" != "$MAIN_SHA" ]; then
            PRE_UPDATE_HEAD_SHA="$HEAD_SHA"
            gh api --method PUT "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
              -f expected_head_sha="$PRE_UPDATE_HEAD_SHA" > update-branch.json
            python3 scripts/dependabot_controller.py update-branch-response \
              --response update-branch.json \
              --out update-branch-normalized.json
            test "$(jq -r .message update-branch-normalized.json)" = "Updating pull request branch."

            UPDATE_CONVERGED=false
            for UPDATE_ATTEMPT in $(seq 1 24); do
              sleep 5
              gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" \
                > "$RUNNER_TEMP/dependabot-post-update-pr.json"
              python3 scripts/dependabot_controller.py pull-request-response \
                --response "$RUNNER_TEMP/dependabot-post-update-pr.json" \
                --expected-number "$PR_NUMBER" \
                --expected-repository "$TARGET_REPOSITORY" \
                --out "$RUNNER_TEMP/dependabot-post-update-pr-normalized.json"
              UPDATED_HEAD_SHA="$(jq -r .headSha "$RUNNER_TEMP/dependabot-post-update-pr-normalized.json")"
              UPDATED_HEAD_REF="$(jq -r .headRef "$RUNNER_TEMP/dependabot-post-update-pr-normalized.json")"
              UPDATED_BASE_SHA="$(jq -r .baseSha "$RUNNER_TEMP/dependabot-post-update-pr-normalized.json")"
              [[ "$UPDATED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$UPDATED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$UPDATED_HEAD_REF" = "$HEAD_REF"

              if [ "$UPDATED_BASE_SHA" = "$MAIN_SHA" ]; then
                if [ "$UPDATED_HEAD_SHA" = "$PRE_UPDATE_HEAD_SHA" ]; then
                  echo "ERROR: Dependabot update reported current-main ancestry without advancing the exact candidate head." >&2
                  exit 1
                fi
                HEAD_SHA="$UPDATED_HEAD_SHA"
                BASE_SHA="$UPDATED_BASE_SHA"
                UPDATE_CONVERGED=true
                echo "Dependabot exact-head update converged to current main on bounded attempt ${UPDATE_ATTEMPT}/24: ${PRE_UPDATE_HEAD_SHA} -> ${HEAD_SHA}."
                break
              fi

              echo "Dependabot update convergence attempt ${UPDATE_ATTEMPT}/24: base=${UPDATED_BASE_SHA} head=${UPDATED_HEAD_SHA}; waiting for exact current-main rebinding."
            done

            if [ "$UPDATE_CONVERGED" != "true" ]; then
              echo "ERROR: exact-head Dependabot branch update did not converge to the trusted current main inside the bounded window." >&2
              exit 1
            fi
          fi

          printf 'has_target=true\n' >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'head_ref=%s\n' "$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Assemble exact candidate tree as data
        if: steps.candidate.outputs.has_target == 'true'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          CANDIDATE_ROOT="$RUNNER_TEMP/dependabot-candidate"
          rm -rf "$CANDIDATE_ROOT"
          cp -a . "$CANDIDATE_ROOT"

          gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > pr-file-pages.json
          python3 scripts/workflow_capability_api_collection.py files \
            --input pr-file-pages.json \
            --out changed-paths.txt
          test -s changed-paths.txt
          test "$(sort -u changed-paths.txt | wc -l)" = "$(wc -l < changed-paths.txt)"

          gh api "repos/${TARGET_REPOSITORY}/git/commits/${HEAD_SHA}" \
            > "$RUNNER_TEMP/dependabot-candidate-commit-read.json"
          python3 scripts/dependabot_controller.py git-commit-read-response \
            --response "$RUNNER_TEMP/dependabot-candidate-commit-read.json" \
            --expected-sha "$HEAD_SHA" \
            --out "$RUNNER_TEMP/dependabot-candidate-commit-read-normalized.json"
          COMMIT="$(cat "$RUNNER_TEMP/dependabot-candidate-commit-read-normalized.json")"
          test "$(jq -r .sha <<<"$COMMIT")" = "$HEAD_SHA"
          TREE_SHA="$(jq -r .tree.sha <<<"$COMMIT")"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${TARGET_REPOSITORY}/git/trees/${TREE_SHA}?recursive=1" \
            > "$RUNNER_TEMP/dependabot-candidate-tree-read.json"
          python3 scripts/dependabot_controller.py git-tree-read-response \
            --response "$RUNNER_TEMP/dependabot-candidate-tree-read.json" \
            --expected-sha "$TREE_SHA" \
            --out "$RUNNER_TEMP/dependabot-candidate-tree-read-normalized.json"
          TREE="$(cat "$RUNNER_TEMP/dependabot-candidate-tree-read-normalized.json")"
          test "$(jq -r .truncated <<<"$TREE")" = "false"

          mapfile -t FETCH_PATHS < <(
            {
              find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%p\n' | sed 's#^./##'
              printf '%s\n' .github/action-lock.json .github/workflow-capability-bom-v1.json scripts/validate-codeql-contract.py
            } | LC_ALL=C sort -u
          )
          for PATH_VALUE in "${FETCH_PATHS[@]}"; do
            if ! grep -qxF "$PATH_VALUE" changed-paths.txt && [[ "$PATH_VALUE" != .github/workflows/* ]]; then
              continue
            fi
            ENTRY="$(jq -c --arg path "$PATH_VALUE" '[.tree[] | select(.path == $path and .type == "blob")]' <<<"$TREE")"
            test "$(jq 'length' <<<"$ENTRY")" = "1"
            test "$(jq -r '.[0].mode' <<<"$ENTRY")" = "100644"
            BLOB_SHA="$(jq -r '.[0].sha' <<<"$ENTRY")"
            [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]
            gh api "repos/${TARGET_REPOSITORY}/git/blobs/${BLOB_SHA}" \
              > "$RUNNER_TEMP/dependabot-candidate-blob-read.json"
            python3 scripts/dependabot_controller.py git-blob-read-response \
              --response "$RUNNER_TEMP/dependabot-candidate-blob-read.json" \
              --expected-sha "$BLOB_SHA" \
              --out "$RUNNER_TEMP/dependabot-candidate-blob-read-normalized.json"
            BLOB="$(cat "$RUNNER_TEMP/dependabot-candidate-blob-read-normalized.json")"
            test "$(jq -r .sha <<<"$BLOB")" = "$BLOB_SHA"
            test "$(jq -r .encoding <<<"$BLOB")" = "base64"
            mkdir -p "$CANDIDATE_ROOT/$(dirname "$PATH_VALUE")"
            jq -r .content <<<"$BLOB" | base64 --decode > "$CANDIDATE_ROOT/$PATH_VALUE"
          done
          printf '%s\n' "$TREE_SHA" > candidate-tree-sha.txt
          printf 'candidate_root=%s\n' "$CANDIDATE_ROOT" >> "$GITHUB_OUTPUT"
          printf 'tree_sha=%s\n' "$TREE_SHA" >> "$GITHUB_OUTPUT"

      - name: Prove bot identity, atomic pin closure, and public release provenance
        if: steps.candidate.outputs.has_target == 'true'
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          CANDIDATE_ROOT: ${{ steps.source.outputs.candidate_root }}
        run: |
          set -euo pipefail
          python3 scripts/dependabot_controller.py probe \
            --pr dependabot-pr.json \
            --expected-head "$HEAD_SHA" \
            --base-root . \
            --candidate-root "$CANDIDATE_ROOT" \
            --out probe.json
          DEPENDENCY_REPOSITORY="$(jq -r .dependencyRepository probe.json)"
          CANDIDATE_TAG="$(jq -r .after.tag probe.json)"
          CANDIDATE_SHA="$(jq -r .after.sha probe.json)"
          test "$DEPENDENCY_REPOSITORY" = "github/codeql-action"
          [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

          git ls-remote --tags "https://github.com/${DEPENDENCY_REPOSITORY}.git" \
            "refs/tags/${CANDIDATE_TAG}" "refs/tags/${CANDIDATE_TAG}^{}" > release-refs.txt
          gh api "repos/${DEPENDENCY_REPOSITORY}" > release-repository.json
          gh api "repos/${DEPENDENCY_REPOSITORY}/releases/tags/${CANDIDATE_TAG}" > release.json
          python3 scripts/dependabot_release.py \
            --refs release-refs.txt \
            --repository-json release-repository.json \
            --release-json release.json \
            --repository "$DEPENDENCY_REPOSITORY" \
            --tag "$CANDIDATE_TAG" \
            --expected-sha "$CANDIDATE_SHA" \
            --out resolved-release.json
          RESOLVED_SHA="$(jq -r .sha resolved-release.json)"
          test "$RESOLVED_SHA" = "$CANDIDATE_SHA"

          python3 scripts/dependabot_controller.py admit \
            --pr dependabot-pr.json \
            --expected-head "$HEAD_SHA" \
            --base-root . \
            --candidate-root "$CANDIDATE_ROOT" \
            --resolved-release resolved-release.json \
            --out dependabot-proof.json

          jq -r '.files[]' dependabot-proof.json | LC_ALL=C sort -u > expected-raw-paths.txt
          { cat expected-raw-paths.txt; printf '%s\n' .github/action-lock.json .github/workflow-capability-bom-v1.json scripts/validate-codeql-contract.py; } \
            | LC_ALL=C sort -u > expected-reconciled-paths.txt
          if cmp -s changed-paths.txt expected-raw-paths.txt; then
            STATE=raw
          elif cmp -s changed-paths.txt expected-reconciled-paths.txt; then
            STATE=reconciled
          else
            echo "ERROR: Dependabot PR contains files outside raw pin update or exact trusted reconciliation" >&2
            diff -u expected-reconciled-paths.txt changed-paths.txt || true
            exit 1
          fi
          printf 'state=%s\n' "$STATE" >> "$GITHUB_OUTPUT"
          printf 'resolved_release_sha=%s\n' "$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Atomically reconcile canonical governance files onto the bot head
        if: steps.candidate.outputs.has_target == 'true' && steps.proof.outputs.state == 'raw'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          HEAD_REF: ${{ steps.candidate.outputs.head_ref }}
          TREE_SHA: ${{ steps.source.outputs.tree_sha }}
          CANDIDATE_ROOT: ${{ steps.source.outputs.candidate_root }}
        run: |
          set -euo pipefail
          assert_main_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > "$RUNNER_TEMP/dependabot-main-ref.json"
            python3 scripts/dependabot_controller.py git-ref-read-response \
              --response "$RUNNER_TEMP/dependabot-main-ref.json" \
              --expected-ref "refs/heads/main" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/dependabot-main-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/dependabot-main-ref-normalized.json")" = "$expected_sha"
          }
          assert_head_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" > "$RUNNER_TEMP/dependabot-head-ref.json"
            python3 scripts/dependabot_controller.py git-ref-read-response \
              --response "$RUNNER_TEMP/dependabot-head-ref.json" \
              --expected-ref "refs/heads/${HEAD_REF}" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/dependabot-head-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/dependabot-head-ref-normalized.json")" = "$expected_sha"
          }

          assert_main_sha "$BASE_SHA"
          assert_head_sha "$HEAD_SHA"
          python3 scripts/dependabot_controller.py derive \
            --proof dependabot-proof.json \
            --base-root . \
            --candidate-root "$CANDIDATE_ROOT" \
            --output-root "$RUNNER_TEMP/derived"

          echo '[]' > tree-entries.json
          for PATH_VALUE in .github/action-lock.json .github/workflow-capability-bom-v1.json scripts/validate-codeql-contract.py; do
            FILE="$RUNNER_TEMP/derived/$PATH_VALUE"
            test -s "$FILE"
            CONTENT="$(base64 -w0 < "$FILE")"
            gh api --method POST "repos/${TARGET_REPOSITORY}/git/blobs" -f content="$CONTENT" -f encoding=base64 > git-blob-response.json
            python3 scripts/dependabot_controller.py git-blob-response \
              --response git-blob-response.json \
              --out git-blob-response-normalized.json
            BLOB_SHA="$(jq -r .sha git-blob-response-normalized.json)"
            [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]
            jq --arg path "$PATH_VALUE" --arg sha "$BLOB_SHA" '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' \
              tree-entries.json > tree-entries.next.json
            mv tree-entries.next.json tree-entries.json
          done
          jq -n --arg base_tree "$TREE_SHA" --slurpfile tree tree-entries.json \
            '{base_tree:$base_tree,tree:$tree[0]}' > tree-request.json
          gh api --method POST "repos/${TARGET_REPOSITORY}/git/trees" --input tree-request.json > git-tree-response.json
          python3 scripts/dependabot_controller.py git-tree-response \
            --response git-tree-response.json \
            --out git-tree-response-normalized.json
          NEW_TREE_SHA="$(jq -r .sha git-tree-response-normalized.json)"
          [[ "$NEW_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]

          jq -n --arg message 'Reconcile Dependabot CodeQL governance' --arg tree "$NEW_TREE_SHA" --arg parent "$HEAD_SHA" \
            '{message:$message,tree:$tree,parents:[$parent]}' > commit-request.json
          gh api --method POST "repos/${TARGET_REPOSITORY}/git/commits" --input commit-request.json > git-commit-response.json
          python3 scripts/dependabot_controller.py git-commit-response \
            --response git-commit-response.json \
            --expected-tree "$NEW_TREE_SHA" \
            --expected-parent "$HEAD_SHA" \
            --out git-commit-response-normalized.json
          NEW_HEAD_SHA="$(jq -r .sha git-commit-response-normalized.json)"
          [[ "$NEW_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$NEW_HEAD_SHA" != "$HEAD_SHA"

          gh api --method PATCH "repos/${TARGET_REPOSITORY}/git/refs/heads/${HEAD_REF}" \
            -f sha="$NEW_HEAD_SHA" -F force=false > updated-ref.json
          python3 scripts/dependabot_controller.py git-ref-response \
            --response updated-ref.json \
            --expected-ref "refs/heads/${HEAD_REF}" \
            --expected-sha "$NEW_HEAD_SHA" \
            --out updated-ref-normalized.json
          test "$(jq -r .sha updated-ref-normalized.json)" = "$NEW_HEAD_SHA"
          assert_main_sha "$BASE_SHA"

          jq -n --argjson prNumber "$PR_NUMBER" --arg baseSha "$BASE_SHA" --arg headSha "$NEW_HEAD_SHA" \
            '{event_type:"dependabot-admission",client_payload:{prNumber:$prNumber,baseSha:$baseSha,headSha:$headSha}}' \
            > admission-dispatch.json
          RECONCILED_ADMISSION_DISPATCH_RESPONSE="$(gh api --include --method POST "repos/${TARGET_REPOSITORY}/dispatches" --input admission-dispatch.json)"
          RECONCILED_ADMISSION_DISPATCH_STATUS_LINE="$(head -n 1 <<<"$RECONCILED_ADMISSION_DISPATCH_RESPONSE" | tr -d '\r')"
          [[ "$RECONCILED_ADMISSION_DISPATCH_STATUS_LINE" =~ ^HTTP/[0-9.]+[[:space:]]+204([[:space:]]|$) ]] || {
            echo "ERROR: Dependabot reconciled-head repository dispatch returned unexpected status: ${RECONCILED_ADMISSION_DISPATCH_STATUS_LINE}" >&2
            exit 1
          }
          RECONCILED_VALIDATION_DISPATCH_RESPONSE="$(gh api --include --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/dependabot-controller.yml/dispatches" -f ref="$HEAD_REF")"
          RECONCILED_VALIDATION_DISPATCH_STATUS_LINE="$(head -n 1 <<<"$RECONCILED_VALIDATION_DISPATCH_RESPONSE" | tr -d '\r')"
          [[ "$RECONCILED_VALIDATION_DISPATCH_STATUS_LINE" =~ ^HTTP/[0-9.]+[[:space:]]+204([[:space:]]|$) ]] || {
            echo "ERROR: Dependabot reconciled-head validation workflow dispatch returned unexpected status: ${RECONCILED_VALIDATION_DISPATCH_STATUS_LINE}" >&2
            exit 1
          }
          echo "Reconciled exact derived governance files and dispatched admission plus read-only validation for the new immutable head."

      - name: Validate reconciled candidate and inspect protected checks
        if: steps.candidate.outputs.has_target == 'true' && steps.proof.outputs.state == 'reconciled'
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          HEAD_REF: ${{ steps.candidate.outputs.head_ref }}
          CANDIDATE_ROOT: ${{ steps.source.outputs.candidate_root }}
        run: |
          set -euo pipefail
          python3 scripts/dependabot_controller.py validate \
            --proof dependabot-proof.json \
            --base-root . \
            --candidate-root "$CANDIDATE_ROOT" \
            --changed-paths changed-paths.txt \
            --out reconciled.json
          test "$(jq -r .headSha reconciled.json)" = "$HEAD_SHA"

          assert_main_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > "$RUNNER_TEMP/dependabot-main-ref.json"
            python3 scripts/dependabot_controller.py git-ref-read-response \
              --response "$RUNNER_TEMP/dependabot-main-ref.json" \
              --expected-ref "refs/heads/main" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/dependabot-main-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/dependabot-main-ref-normalized.json")" = "$expected_sha"
          }
          assert_head_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" > "$RUNNER_TEMP/dependabot-head-ref.json"
            python3 scripts/dependabot_controller.py git-ref-read-response \
              --response "$RUNNER_TEMP/dependabot-head-ref.json" \
              --expected-ref "refs/heads/${HEAD_REF}" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/dependabot-head-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/dependabot-head-ref-normalized.json")" = "$expected_sha"
          }

          assert_transaction() {
            assert_main_sha "$BASE_SHA"
            assert_head_sha "$HEAD_SHA"
          }

          workflow_dispatch_runs() {
            local runs
            runs="$(gh api "repos/${TARGET_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=workflow_dispatch&per_page=100")" || {
              echo "ERROR: failed to fetch exact-head workflow-dispatch runs for ${HEAD_SHA}." >&2
              return 1
            }
            jq -e --arg head "$HEAD_SHA" --arg head_ref "$HEAD_REF" --arg repo "$TARGET_REPOSITORY" '
              (type == "object") and
              (.total_count | type == "number" and . == floor and . >= 0 and . <= 100) and
              (.workflow_runs | type == "array" and length <= 100) and
              (.total_count == (.workflow_runs | length)) and
              (all(.workflow_runs[];
                type == "object" and
                (.id | (type == "number") and . == floor and . > 0) and
                (.name | type == "string" and length > 0) and
                (.path | type == "string" and length > 0) and
                (.event == "workflow_dispatch") and
                (.head_sha == $head) and
                (.head_branch == $head_ref) and
                (.repository | type == "object" and (.full_name == $repo)) and
                (.head_repository | type == "object" and (.full_name == $repo)) and
                (.status | type == "string" and
                  (. == "queued" or . == "in_progress" or . == "requested" or
                   . == "waiting" or . == "pending" or . == "completed")) and
                (if .status == "completed"
                 then (.conclusion | type == "string" and length > 0)
                 else .conclusion == null
                 end)
              )) and
              (([.workflow_runs[] | .id] | length) == ([.workflow_runs[] | .id] | unique | length))
            ' <<<"$runs" >/dev/null || {
              echo "ERROR: malformed or incomplete exact-head workflow-dispatch run evidence for ${HEAD_SHA}." >&2
              return 1
            }
            printf '%s\n' "$runs"
          }

          delegated_admission_attempt_ready() {
            local proof_checks proof_count proof_run_id proof_run_attempt
            proof_checks="$(gh api "repos/${TARGET_REPOSITORY}/commits/${HEAD_SHA}/check-runs?app_id=15368&check_name=trusted-capability-admission-proof&filter=latest&per_page=100")" || return 1
            if ! jq -e --arg head "$HEAD_SHA" '
              (type == "object") and
              (.total_count == 1) and
              (.check_runs | type == "array" and length == 1) and
              (.check_runs[0] | type == "object" and .head_sha == $head)
            ' <<<"$proof_checks" >/dev/null; then
              return 1
            fi
            jq '.check_runs[0]' <<<"$proof_checks" > dependabot-admission-proof-check.json
            if ! python3 scripts/dependabot_admission_proof.py verify-check \
              --check dependabot-admission-proof-check.json \
              --pr-number "$PR_NUMBER" \
              --base-sha "$BASE_SHA" \
              --head-sha "$HEAD_SHA" \
              --out dependabot-admission-proof-meta.json; then
              return 1
            fi
            proof_run_id="$(jq -r .runId dependabot-admission-proof-meta.json)"
            proof_run_attempt="$(jq -r .runAttempt dependabot-admission-proof-meta.json)"
            [[ "$proof_run_id" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "$proof_run_attempt" =~ ^[1-9][0-9]*$ ]] || return 1
            gh api "repos/${TARGET_REPOSITORY}/actions/runs/${proof_run_id}/attempts/${proof_run_attempt}" \
              > dependabot-admission-proof-current-run.json || return 1
            python3 scripts/dependabot_admission_proof.py verify-current \
              --current-run dependabot-admission-proof-current-run.json \
              --proof dependabot-admission-proof-meta.json \
              --out dependabot-admission-proof-current-verified.json >/dev/null
          }

          checks_ready() {
            local ready=true
            local count observed_count active
            for NAME in validate-contracts integration-pinned-upstream dependency-review trusted-capability-admission analyze-actions analyze-python; do
              CHECKS="$(gh api "repos/${TARGET_REPOSITORY}/commits/${HEAD_SHA}/check-runs?app_id=15368&check_name=${NAME}&filter=latest&per_page=100")"
              if ! jq -e --arg head "$HEAD_SHA" --arg name "$NAME" '
                (type == "object") and
                (.total_count | type == "number" and . == floor and . >= 0 and . <= 100) and
                (.check_runs | type == "array" and length <= 100) and
                (.total_count == (.check_runs | length)) and
                (all(.check_runs[];
                  type == "object" and
                  (.id | (type == "number") and . == floor and . > 0) and
                  (.name == $name) and
                  (.head_sha == $head) and
                  (.app | type == "object" and (.id == 15368)) and
                  (.status | type == "string" and
                    (. == "queued" or . == "in_progress" or . == "requested" or
                     . == "waiting" or . == "pending" or . == "completed")) and
                  (if .status == "completed"
                   then (.conclusion | type == "string" and length > 0)
                   else .conclusion == null
                   end)
                )) and
                (([.check_runs[] | .id] | length) == ([.check_runs[] | .id] | unique | length))
              ' <<<"$CHECKS" >/dev/null; then
                echo "ERROR: malformed or incomplete required-check evidence for ${NAME} on ${HEAD_SHA}." >&2
                ready=false
                continue
              fi
              count="$(jq -r .total_count <<<"$CHECKS")"
              observed_count="$(jq '.check_runs | length' <<<"$CHECKS")"
              if ! [[ "$count" =~ ^[0-9]+$ ]] || ! [[ "$observed_count" =~ ^[0-9]+$ ]] ||
                 [ "$count" != "$observed_count" ] || [ "$count" -lt 1 ] ||
                 ! jq -e 'all(.check_runs[]; .status == "completed" and .conclusion == "success")' <<<"$CHECKS" >/dev/null; then
                ready=false
              fi
            done

            if ! active="$(workflow_dispatch_runs)"; then
              ready=false
            elif jq -e '[.workflow_runs[] | select(.status != "completed")] | length > 0' <<<"$active" >/dev/null; then
              ready=false
            fi

            if ! delegated_admission_attempt_ready; then
              ready=false
            fi

            test "$ready" = "true"
          }

          approve_exact_pr_workflows() {
            local codeql_workflow_id dependency_workflow_id profile_workflow_id expected_id
            local runs total observed name run run_count run_id check_suite_id run_attempt status conclusion

            gh api "repos/${TARGET_REPOSITORY}/actions/workflows/codeql.yml" \
              > "$RUNNER_TEMP/dependabot-codeql-workflow-definition.json"
            python3 scripts/dependabot_controller.py workflow-definition-response \
              --response "$RUNNER_TEMP/dependabot-codeql-workflow-definition.json" \
              --expected-path ".github/workflows/codeql.yml" \
              --out "$RUNNER_TEMP/dependabot-codeql-workflow-definition-normalized.json"
            codeql_workflow_id="$(jq -r .id "$RUNNER_TEMP/dependabot-codeql-workflow-definition-normalized.json")"

            gh api "repos/${TARGET_REPOSITORY}/actions/workflows/dependency-review.yml" \
              > "$RUNNER_TEMP/dependabot-dependency-workflow-definition.json"
            python3 scripts/dependabot_controller.py workflow-definition-response \
              --response "$RUNNER_TEMP/dependabot-dependency-workflow-definition.json" \
              --expected-path ".github/workflows/dependency-review.yml" \
              --out "$RUNNER_TEMP/dependabot-dependency-workflow-definition-normalized.json"
            dependency_workflow_id="$(jq -r .id "$RUNNER_TEMP/dependabot-dependency-workflow-definition-normalized.json")"

            gh api "repos/${TARGET_REPOSITORY}/actions/workflows/profile-quality.yml" \
              > "$RUNNER_TEMP/dependabot-profile-workflow-definition.json"
            python3 scripts/dependabot_controller.py workflow-definition-response \
              --response "$RUNNER_TEMP/dependabot-profile-workflow-definition.json" \
              --expected-path ".github/workflows/profile-quality.yml" \
              --out "$RUNNER_TEMP/dependabot-profile-workflow-definition-normalized.json"
            profile_workflow_id="$(jq -r .id "$RUNNER_TEMP/dependabot-profile-workflow-definition-normalized.json")"

            [[ "$codeql_workflow_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$dependency_workflow_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$profile_workflow_id" =~ ^[1-9][0-9]*$ ]]
            expected="$(jq -cn --argjson codeql "$codeql_workflow_id" --argjson dependency "$dependency_workflow_id" --argjson profile "$profile_workflow_id" \
              '[{"name":"CodeQL","workflow_id":$codeql},{"name":"Dependency review","workflow_id":$dependency},{"name":"Profile quality","workflow_id":$profile}] | sort_by(.name)')"

            for attempt in $(seq 1 12); do
              assert_transaction
              gh api "repos/${TARGET_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
                > "$RUNNER_TEMP/dependabot-protected-workflow-runs.json"
              python3 scripts/dependabot_controller.py protected-workflow-runs-response \
                --response "$RUNNER_TEMP/dependabot-protected-workflow-runs.json" \
                --head-sha "$HEAD_SHA" \
                --branch "$HEAD_REF" \
                --codeql-workflow-id "$codeql_workflow_id" \
                --dependency-workflow-id "$dependency_workflow_id" \
                --profile-workflow-id "$profile_workflow_id" \
                --out "$RUNNER_TEMP/dependabot-protected-workflow-runs-normalized.json"
              total="$(jq -r .totalCount "$RUNNER_TEMP/dependabot-protected-workflow-runs-normalized.json")"
              [[ "$total" =~ ^[0-9]+$ ]]
              if [ "$total" = "3" ]; then
                runs="$(jq -c .runs "$RUNNER_TEMP/dependabot-protected-workflow-runs-normalized.json")"
                observed="$(jq -c '[.[] | {name,workflow_id:.workflowId}] | sort_by(.name)' <<<"$runs")"
                test "$observed" = "$expected" || { echo "Canonical Dependabot PR workflow-run identities changed." >&2; exit 1; }
                for name in "CodeQL" "Dependency review" "Profile quality"; do
                  case "$name" in
                    "CodeQL") expected_id="$codeql_workflow_id" ;;
                    "Dependency review") expected_id="$dependency_workflow_id" ;;
                    "Profile quality") expected_id="$profile_workflow_id" ;;
                    *) exit 1 ;;
                  esac
                  run_count="$(jq --arg name "$name" --argjson workflow_id "$expected_id" '[.[] | select(.name == $name and .workflowId == $workflow_id)] | length' <<<"$runs")"
                  test "$run_count" = "1"
                  run="$(jq -c --arg name "$name" --argjson workflow_id "$expected_id" '[.[] | select(.name == $name and .workflowId == $workflow_id)][0]' <<<"$runs")"
                  run_id="$(jq -r .id <<<"$run")"
                  check_suite_id="$(jq -r .checkSuiteId <<<"$run")"
                  run_attempt="$(jq -r .runAttempt <<<"$run")"
                  status="$(jq -r .status <<<"$run")"
                  conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
                  [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
                  [[ "$check_suite_id" =~ ^[1-9][0-9]*$ ]]
                  [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
                  test "$(jq -r .workflowId <<<"$run")" = "$expected_id"
                  if [ "$status" = "action_required" ] || [ "$status" = "waiting" ] || [ "$conclusion" = "action_required" ]; then
                    approval_response="$(gh api --include --method POST "repos/${TARGET_REPOSITORY}/actions/runs/${run_id}/approve")"
                    approval_status_line="$(head -n 1 <<<"$approval_response" | tr -d '\r')"
                    [[ "$approval_status_line" =~ ^HTTP/[0-9.]+[[:space:]]+201([[:space:]]|$) ]] || {
                      echo "ERROR: Dependabot protected-run approval returned unexpected status: ${approval_status_line}" >&2
                      exit 1
                    }
                    echo "Approved exact canonical Dependabot PR workflow: ${name} run ${run_id}."
                  elif [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                    echo "Canonical Dependabot PR workflow completed unsuccessfully before approval: ${name} (${conclusion})." >&2
                    exit 1
                  fi
                done
                return 0
              fi
              sleep 5
            done
            echo "ERROR: exact canonical Dependabot PR workflow-run set did not materialize inside the bounded approval window" >&2
            exit 1
          }

          assert_transaction
          approve_exact_pr_workflows
          READY=false
          if checks_ready; then
            READY=true
          fi

          if [ "$READY" != "true" ]; then
            ACTIVE="$(workflow_dispatch_runs)"
            if jq -e '[.workflow_runs[] | select(.status != "completed")] | length > 0' <<<"$ACTIVE" >/dev/null; then
              printf 'dispatched=false\n' >> "$GITHUB_OUTPUT"
              echo "Exact-head protected checks are already active; bounded convergence will re-evaluate them."
            else
              VALIDATION_DISPATCH_RESPONSE="$(gh api --include --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/dependabot-controller.yml/dispatches" -f ref="$HEAD_REF")"
              VALIDATION_DISPATCH_STATUS_LINE="$(head -n 1 <<<"$VALIDATION_DISPATCH_RESPONSE" | tr -d '\r')"
              [[ "$VALIDATION_DISPATCH_STATUS_LINE" =~ ^HTTP/[0-9.]+[[:space:]]+204([[:space:]]|$) ]] || {
                echo "ERROR: Dependabot exact-head validation workflow dispatch returned unexpected status: ${VALIDATION_DISPATCH_STATUS_LINE}" >&2
                exit 1
              }
              jq -n --argjson prNumber "$PR_NUMBER" --arg baseSha "$BASE_SHA" --arg headSha "$HEAD_SHA" \
                '{event_type:"dependabot-admission",client_payload:{prNumber:$prNumber,baseSha:$baseSha,headSha:$headSha}}' \
                > admission-dispatch.json
              ADMISSION_DISPATCH_RESPONSE="$(gh api --include --method POST "repos/${TARGET_REPOSITORY}/dispatches" --input admission-dispatch.json)"
              ADMISSION_DISPATCH_STATUS_LINE="$(head -n 1 <<<"$ADMISSION_DISPATCH_RESPONSE" | tr -d '\r')"
              [[ "$ADMISSION_DISPATCH_STATUS_LINE" =~ ^HTTP/[0-9.]+[[:space:]]+204([[:space:]]|$) ]] || {
                echo "ERROR: Dependabot exact-head repository dispatch returned unexpected status: ${ADMISSION_DISPATCH_STATUS_LINE}" >&2
                exit 1
              }
              printf 'dispatched=true\n' >> "$GITHUB_OUTPUT"
              echo "Dispatched exact-head admission and read-only validation; validation will sequence CodeQL after its three gates succeed."
            fi

            for ATTEMPT in $(seq 1 24); do
              sleep 15
              assert_transaction
              if checks_ready; then
                READY=true
                echo "All six exact-head protected checks converged successfully on bounded attempt ${ATTEMPT}."
                break
              fi
            done
          else
            printf 'dispatched=false\n' >> "$GITHUB_OUTPUT"
          fi

          printf 'ready=%s\n' "$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" != "true" ]; then
            echo "Exact-head checks did not converge inside the bounded controller window; a later trusted wake may retry."
          fi

      - name: Perform exact-head protected Dependabot merge
        if: steps.candidate.outputs.has_target == 'true' && steps.proof.outputs.state == 'reconciled' && steps.checks.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          HEAD_REF: ${{ steps.candidate.outputs.head_ref }}
        run: |
          set -euo pipefail
          assert_main_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > "$RUNNER_TEMP/dependabot-main-ref.json"
            python3 scripts/dependabot_controller.py git-ref-read-response \
              --response "$RUNNER_TEMP/dependabot-main-ref.json" \
              --expected-ref "refs/heads/main" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/dependabot-main-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/dependabot-main-ref-normalized.json")" = "$expected_sha"
          }
          assert_head_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" > "$RUNNER_TEMP/dependabot-head-ref.json"
            python3 scripts/dependabot_controller.py git-ref-read-response \
              --response "$RUNNER_TEMP/dependabot-head-ref.json" \
              --expected-ref "refs/heads/${HEAD_REF}" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/dependabot-head-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/dependabot-head-ref-normalized.json")" = "$expected_sha"
          }
          MERGE_ELIGIBLE=false
          for ATTEMPT in $(seq 1 12); do
            gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/dependabot-pr-snapshot.json"
            python3 scripts/dependabot_controller.py pull-request-response \
              --response "$RUNNER_TEMP/dependabot-pr-snapshot.json" \
              --expected-number "$PR_NUMBER" \
              --expected-repository "$TARGET_REPOSITORY" \
              --out "$RUNNER_TEMP/dependabot-pr-snapshot-normalized.json"
            PR="$(cat "$RUNNER_TEMP/dependabot-pr-snapshot-normalized.json")"
            test "$(jq -r .state <<<"$PR")" = "open"
            test "$(jq -r .draft <<<"$PR")" = "false"
            test "$(jq -r .baseRef <<<"$PR")" = "main"
            test "$(jq -r .baseSha <<<"$PR")" = "$BASE_SHA"
            test "$(jq -r .headSha <<<"$PR")" = "$HEAD_SHA"
            test "$(jq -r .headRef <<<"$PR")" = "$HEAD_REF"
            test "$(jq -r .headRepository <<<"$PR")" = "$TARGET_REPOSITORY"
            assert_main_sha "$BASE_SHA"
            assert_head_sha "$HEAD_SHA"

            MERGEABLE="$(jq -r '.mergeable // ""' <<<"$PR")"
            MERGEABLE_STATE="$(jq -r '.mergeableState // ""' <<<"$PR")"
            if [ "$MERGEABLE" = "true" ] && [ "$MERGEABLE_STATE" = "clean" ]; then
              MERGE_ELIGIBLE=true
              echo "GitHub protected-merge eligibility converged on bounded attempt ${ATTEMPT}."
              break
            fi
            case "$MERGEABLE_STATE" in
              ""|unknown|blocked)
                sleep 5
                ;;
              behind|dirty|draft|unstable)
                echo "ERROR: non-transient protected-merge state after exact-head check convergence: ${MERGEABLE_STATE}" >&2
                exit 1
                ;;
              *)
                echo "ERROR: unsupported protected-merge state after exact-head check convergence: ${MERGEABLE_STATE}" >&2
                exit 1
                ;;
            esac
          done
          test "$MERGE_ELIGIBLE" = "true"

          REVIEW_MARKER="<!-- portyu9-bot-review:v2 base=${BASE_SHA} head=${HEAD_SHA} -->"
          REVIEW_PAGES="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
          jq -e '
            (type == "array") and (length >= 1) and (length <= 20) and
            (all(.[]; type == "array" and length <= 100)) and
            (all(.[0:-1][]; length == 100)) and
            (all(.[][];
              type == "object" and
              (.id | type == "number" and . == floor and . > 0) and
              (.user | type == "object" and (.login | type == "string" and length > 0)) and
              (.state | type == "string" and
                (. == "APPROVED" or . == "CHANGES_REQUESTED" or . == "COMMENTED" or . == "DISMISSED" or . == "PENDING")) and
              has("commit_id") and
              (.commit_id == null or (.commit_id | type == "string" and test("^[0-9a-f]{40}$"))) and
              has("body") and
              (.body == null or (.body | type == "string"))
            )) and
            (([.[][] | .id] | length) == ([.[][] | .id] | unique | length))
          ' <<<"$REVIEW_PAGES" >/dev/null || {
            echo "ERROR: malformed or incomplete paginated pull-review evidence." >&2
            exit 1
          }
          REVIEWS="$(jq -c '[.[][]]' <<<"$REVIEW_PAGES")"
          PORTYU9_APPROVAL_COUNT="$(jq --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .state == "APPROVED" and .commit_id == $head and ((.body // "") | contains($marker)))] | length' <<<"$REVIEWS")"
          LATEST_MANUAL_DECISIVE_STATE="$(jq -r --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and (.state == "APPROVED" or .state == "CHANGES_REQUESTED") and (((.body // "") | contains($marker)) | not))] | sort_by(.id) | if length == 0 then "" else .[-1].state end' <<<"$REVIEWS")"
          [[ "$PORTYU9_APPROVAL_COUNT" =~ ^[0-9]+$ ]]
          test "$PORTYU9_APPROVAL_COUNT" = "1" || {
            echo "ERROR: exactly one exact-base/head marker-bound APPROVED review by portyu9 is required before autonomous Dependabot merge." >&2
            exit 1
          }
          if [ "$LATEST_MANUAL_DECISIVE_STATE" = "CHANGES_REQUESTED" ]; then
            echo "ERROR: latest manual exact-head portyu9 review requests changes; autonomous Dependabot merge is vetoed." >&2
            exit 1
          fi

          APPROVAL_MARKER="<!-- portyu9-automation-approval:v1 head=${HEAD_SHA} -->"
          gh api --paginate --slurp \
            "repos/${TARGET_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            > "$RUNNER_TEMP/dependabot-approval-comment-pages.json"
          APPROVAL_COMMENT_EXISTS=false
          if python3 scripts/automation_approval_comment.py evidence \
            --comments-file "$RUNNER_TEMP/dependabot-approval-comment-pages.json" \
            --repository "$TARGET_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --marker "$APPROVAL_MARKER"; then
            APPROVAL_COMMENT_EXISTS=true
          else
            APPROVAL_EVIDENCE_STATUS="$?"
            if [ "$APPROVAL_EVIDENCE_STATUS" != "3" ]; then
              echo "ERROR: malformed Dependabot automation-approval comment evidence." >&2
              exit "$APPROVAL_EVIDENCE_STATUS"
            fi
          fi
          test "$APPROVAL_COMMENT_EXISTS" = "true" -o "$APPROVAL_COMMENT_EXISTS" = "false"
          if [ "$APPROVAL_COMMENT_EXISTS" = "false" ]; then
            printf -v APPROVAL_BODY '%s\n%s' "$APPROVAL_MARKER" "Automation-approved: all six protected exact-head gates are green for \`${HEAD_SHA}\` and an exact-base/head marker-bound APPROVED review by @portyu9 is verified. No manual workflow approval is required. Continuing with the governed expected-head merge."
            gh api --method POST "repos/${TARGET_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$APPROVAL_BODY" \
              > "$RUNNER_TEMP/dependabot-approval-comment-created.json"
            python3 scripts/automation_approval_comment.py created \
              --comment-file "$RUNNER_TEMP/dependabot-approval-comment-created.json" \
              --repository "$TARGET_REPOSITORY" \
              --pr-number "$PR_NUMBER" \
              --expected-body "$APPROVAL_BODY"
          fi

          MERGE_HTTP_RESPONSE="$RUNNER_TEMP/dependabot-merge-http-response.txt"
          MERGE_BODY="$RUNNER_TEMP/dependabot-merge-response.json"
          MERGE_ERR="$RUNNER_TEMP/dependabot-merge-error.txt"
          set +e
          gh api --include --method PUT "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge \
            -f sha="$HEAD_SHA" \
            -f commit_title="Dependabot CodeQL Action release" \
            -f commit_message="Trusted atomic Dependabot CodeQL update merged after exact-head delegated admission and protected checks." \
            >"$MERGE_HTTP_RESPONSE" 2>"$MERGE_ERR"
          MERGE_STATUS=$?
          set -e
          if [ "$MERGE_STATUS" -ne 0 ]; then
            sed '1,/^[[:space:]]*$/d' "$MERGE_HTTP_RESPONSE" > "$MERGE_BODY"
            MERGE_MESSAGE="$(jq -r '.message // empty' "$MERGE_BODY" 2>/dev/null || true)"
            if [ -z "$MERGE_MESSAGE" ]; then
              MERGE_MESSAGE="$(tr '\n' ' ' < "$MERGE_ERR")"
            fi
            echo "::error::Dependabot merge API request failed: ${MERGE_MESSAGE}"
            exit 1
          fi
          MERGE_STATUS_LINE="$(head -n 1 "$MERGE_HTTP_RESPONSE" | tr -d '\r')"
          [[ "$MERGE_STATUS_LINE" =~ ^HTTP/[0-9.]+[[:space:]]+200([[:space:]]|$) ]] || {
            echo "ERROR: Dependabot terminal merge returned unexpected status: ${MERGE_STATUS_LINE}" >&2
            exit 1
          }
          sed '1,/^[[:space:]]*$/d' "$MERGE_HTTP_RESPONSE" > "$MERGE_BODY"
          MERGE="$(cat "$MERGE_BODY")"
          if [ "$(jq -r '.merged // false' <<<"$MERGE")" != "true" ]; then
            MERGE_MESSAGE="$(jq -r '.message // "GitHub merge API returned merged=false without a message."' <<<"$MERGE")"
            echo "::error::Dependabot merge API rejected exact-head merge: ${MERGE_MESSAGE}"
            exit 1
          fi
          python3 scripts/dependabot_controller.py merge-success-response \
            --response "$MERGE_BODY" \
            --out "$RUNNER_TEMP/dependabot-merge-success-normalized.json"
          MERGE_SHA="$(jq -r .sha "$RUNNER_TEMP/dependabot-merge-success-normalized.json")"
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          assert_main_sha "$MERGE_SHA"
          POST_MERGE_CODEQL_DISPATCH_RESPONSE="$(gh api --include --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/codeql.yml/dispatches" -f ref=main)"
          POST_MERGE_CODEQL_DISPATCH_STATUS_LINE="$(head -n 1 <<<"$POST_MERGE_CODEQL_DISPATCH_RESPONSE" | tr -d '\r')"
          [[ "$POST_MERGE_CODEQL_DISPATCH_STATUS_LINE" =~ ^HTTP/[0-9.]+[[:space:]]+204([[:space:]]|$) ]] || {
            echo "ERROR: Dependabot post-merge CodeQL dispatch returned unexpected status: ${POST_MERGE_CODEQL_DISPATCH_STATUS_LINE}" >&2
            exit 1
          }

  validation_bind:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/dependabot/github_actions/')
    name: trusted-capability-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.bind.outputs.pr_number }}
      base_sha: ${{ steps.bind.outputs.base_sha }}
      head_sha: ${{ steps.bind.outputs.head_sha }}
      head_ref: ${{ steps.bind.outputs.head_ref }}

    steps:
      - name: Checkout static trusted main validation TCB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 scripts/verify-python-runtime.py

      - name: Bind exact controller-issued validation target
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          test "$ACTOR" = "github-actions[bot]"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REF" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
          gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > "$RUNNER_TEMP/dependabot-validation-main-ref.json"
          python3 scripts/dependabot_controller.py git-ref-read-response \
            --response "$RUNNER_TEMP/dependabot-validation-main-ref.json" \
            --expected-ref "refs/heads/main" \
            --out "$RUNNER_TEMP/dependabot-validation-main-ref-normalized.json"
          BASE_SHA="$(jq -r .sha "$RUNNER_TEMP/dependabot-validation-main-ref-normalized.json")"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          gh api "repos/${TARGET_REPOSITORY}/pulls?state=open&base=main&head=portyu9:${HEAD_REF}&per_page=10" \
            > "$RUNNER_TEMP/dependabot-validation-pr-list.json"
          python3 scripts/dependabot_controller.py pull-request-list-response \
            --response "$RUNNER_TEMP/dependabot-validation-pr-list.json" \
            --expected-repository "$TARGET_REPOSITORY" \
            --expected-base-sha "$BASE_SHA" \
            --expected-head-ref "$HEAD_REF" \
            --expected-head-sha "$HEAD_SHA" \
            --out "$RUNNER_TEMP/dependabot-validation-pr-list-normalized.json"
          PR_NUMBER="$(jq -r .number "$RUNNER_TEMP/dependabot-validation-pr-list-normalized.json")"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" > dependabot-pr.json
          python3 scripts/dependabot_controller.py pull-request-response \
            --response dependabot-pr.json \
            --expected-number "$PR_NUMBER" \
            --expected-repository "$TARGET_REPOSITORY" \
            --out dependabot-pr-normalized.json
          test "$(jq -r .number dependabot-pr-normalized.json)" = "$PR_NUMBER"
          test "$(jq -r .user dependabot-pr-normalized.json)" = "dependabot[bot]"
          test "$(jq -r .state dependabot-pr-normalized.json)" = "open"
          test "$(jq -r .draft dependabot-pr-normalized.json)" = "false"
          test "$(jq -r .maintainerCanModify dependabot-pr-normalized.json)" = "false"
          test "$(jq -r .baseRef dependabot-pr-normalized.json)" = "main"
          test "$(jq -r .baseSha dependabot-pr-normalized.json)" = "$BASE_SHA"
          test "$(jq -r .headSha dependabot-pr-normalized.json)" = "$HEAD_SHA"
          test "$(jq -r .headRef dependabot-pr-normalized.json)" = "$HEAD_REF"
          test "$(jq -r .headRepository dependabot-pr-normalized.json)" = "$TARGET_REPOSITORY"
          gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" > "$RUNNER_TEMP/dependabot-validation-head-ref.json"
          python3 scripts/dependabot_controller.py git-ref-read-response \
            --response "$RUNNER_TEMP/dependabot-validation-head-ref.json" \
            --expected-ref "refs/heads/${HEAD_REF}" \
            --expected-sha "$HEAD_SHA" \
            --out "$RUNNER_TEMP/dependabot-validation-head-ref-normalized.json"
          test "$(jq -r .sha "$RUNNER_TEMP/dependabot-validation-head-ref-normalized.json")" = "$HEAD_SHA"

          gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > pr-file-pages.json
          python3 scripts/workflow_capability_api_collection.py files \
            --input pr-file-pages.json \
            --out changed-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/action-lock.json
          .github/workflow-capability-bom-v1.json
          .github/workflows/codeql.yml
          scripts/validate-codeql-contract.py
          EOF
          cmp -s expected-paths.txt changed-paths.txt

          printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'head_ref=%s\n' "$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Reconstruct exact reconciled candidate as data
        id: candidate_data
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.bind.outputs.base_sha }}
          HEAD_SHA: ${{ steps.bind.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          CANDIDATE_ROOT="$RUNNER_TEMP/dependabot-validation-candidate"
          rm -rf "$CANDIDATE_ROOT"
          cp -a . "$CANDIDATE_ROOT"

          gh api "repos/${TARGET_REPOSITORY}/git/commits/${HEAD_SHA}" \
            > "$RUNNER_TEMP/dependabot-candidate-commit-read.json"
          python3 scripts/dependabot_controller.py git-commit-read-response \
            --response "$RUNNER_TEMP/dependabot-candidate-commit-read.json" \
            --expected-sha "$HEAD_SHA" \
            --out "$RUNNER_TEMP/dependabot-candidate-commit-read-normalized.json"
          COMMIT="$(cat "$RUNNER_TEMP/dependabot-candidate-commit-read-normalized.json")"
          test "$(jq -r .sha <<<"$COMMIT")" = "$HEAD_SHA"
          TREE_SHA="$(jq -r .tree.sha <<<"$COMMIT")"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${TARGET_REPOSITORY}/git/trees/${TREE_SHA}?recursive=1" \
            > "$RUNNER_TEMP/dependabot-candidate-tree-read.json"
          python3 scripts/dependabot_controller.py git-tree-read-response \
            --response "$RUNNER_TEMP/dependabot-candidate-tree-read.json" \
            --expected-sha "$TREE_SHA" \
            --out "$RUNNER_TEMP/dependabot-candidate-tree-read-normalized.json"
          TREE="$(cat "$RUNNER_TEMP/dependabot-candidate-tree-read-normalized.json")"
          test "$(jq -r .truncated <<<"$TREE")" = "false"

          while IFS= read -r PATH_VALUE; do
            test -n "$PATH_VALUE"
            ENTRY="$(jq -c --arg path "$PATH_VALUE" '[.tree[] | select(.path == $path and .type == "blob")]' <<<"$TREE")"
            test "$(jq 'length' <<<"$ENTRY")" = "1"
            test "$(jq -r '.[0].mode' <<<"$ENTRY")" = "100644"
            BLOB_SHA="$(jq -r '.[0].sha' <<<"$ENTRY")"
            [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]
            gh api "repos/${TARGET_REPOSITORY}/git/blobs/${BLOB_SHA}" \
              > "$RUNNER_TEMP/dependabot-candidate-blob-read.json"
            python3 scripts/dependabot_controller.py git-blob-read-response \
              --response "$RUNNER_TEMP/dependabot-candidate-blob-read.json" \
              --expected-sha "$BLOB_SHA" \
              --out "$RUNNER_TEMP/dependabot-candidate-blob-read-normalized.json"
            BLOB="$(cat "$RUNNER_TEMP/dependabot-candidate-blob-read-normalized.json")"
            test "$(jq -r .sha <<<"$BLOB")" = "$BLOB_SHA"
            test "$(jq -r .encoding <<<"$BLOB")" = "base64"
            mkdir -p "$CANDIDATE_ROOT/$(dirname "$PATH_VALUE")"
            jq -r .content <<<"$BLOB" | base64 --decode > "$CANDIDATE_ROOT/$PATH_VALUE"
          done < expected-paths.txt

          printf 'candidate_root=%s\n' "$CANDIDATE_ROOT" >> "$GITHUB_OUTPUT"

      - name: Independently re-prove deterministic reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.bind.outputs.pr_number }}
          HEAD_SHA: ${{ steps.bind.outputs.head_sha }}
          CANDIDATE_ROOT: ${{ steps.candidate_data.outputs.candidate_root }}
        run: |
          set -euo pipefail
          python3 scripts/dependabot_controller.py probe \
            --pr dependabot-pr.json \
            --expected-head "$HEAD_SHA" \
            --base-root . \
            --candidate-root "$CANDIDATE_ROOT" \
            --out probe.json
          DEPENDENCY_REPOSITORY="$(jq -r .dependencyRepository probe.json)"
          CANDIDATE_TAG="$(jq -r .after.tag probe.json)"
          CANDIDATE_SHA="$(jq -r .after.sha probe.json)"
          test "$DEPENDENCY_REPOSITORY" = "github/codeql-action"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git ls-remote --tags "https://github.com/${DEPENDENCY_REPOSITORY}.git" \
            "refs/tags/${CANDIDATE_TAG}" "refs/tags/${CANDIDATE_TAG}^{}" > release-refs.txt
          gh api "repos/${DEPENDENCY_REPOSITORY}" > release-repository.json
          gh api "repos/${DEPENDENCY_REPOSITORY}/releases/tags/${CANDIDATE_TAG}" > release.json
          python3 scripts/dependabot_release.py \
            --refs release-refs.txt \
            --repository-json release-repository.json \
            --release-json release.json \
            --repository "$DEPENDENCY_REPOSITORY" \
            --tag "$CANDIDATE_TAG" \
            --expected-sha "$CANDIDATE_SHA" \
            --out resolved-release.json
          RESOLVED_SHA="$(jq -r .sha resolved-release.json)"
          test "$RESOLVED_SHA" = "$CANDIDATE_SHA"
          python3 scripts/dependabot_controller.py admit \
            --pr dependabot-pr.json \
            --expected-head "$HEAD_SHA" \
            --base-root . \
            --candidate-root "$CANDIDATE_ROOT" \
            --resolved-release resolved-release.json \
            --out dependabot-proof.json
          python3 scripts/dependabot_controller.py validate \
            --proof dependabot-proof.json \
            --base-root . \
            --candidate-root "$CANDIDATE_ROOT" \
            --changed-paths changed-paths.txt \
            --out reconciled.json
          test "$(jq -r .classification reconciled.json)" = "dependabot-codeql-reconciled"
          test "$(jq -r .headSha reconciled.json)" = "$HEAD_SHA"

      - name: Verify exact delegated admission proof
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.bind.outputs.pr_number }}
          BASE_SHA: ${{ steps.bind.outputs.base_sha }}
          HEAD_SHA: ${{ steps.bind.outputs.head_sha }}
          HEAD_REF: ${{ steps.bind.outputs.head_ref }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REF" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]

          assert_main_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > "$RUNNER_TEMP/dependabot-main-ref.json"
            python3 scripts/dependabot_controller.py git-ref-read-response \
              --response "$RUNNER_TEMP/dependabot-main-ref.json" \
              --expected-ref "refs/heads/main" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/dependabot-main-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/dependabot-main-ref-normalized.json")" = "$expected_sha"
          }
          assert_head_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" > "$RUNNER_TEMP/dependabot-head-ref.json"
            python3 scripts/dependabot_controller.py git-ref-read-response \
              --response "$RUNNER_TEMP/dependabot-head-ref.json" \
              --expected-ref "refs/heads/${HEAD_REF}" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/dependabot-head-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/dependabot-head-ref-normalized.json")" = "$expected_sha"
          }

          for ATTEMPT in $(seq 1 30); do
            assert_main_sha "$BASE_SHA"
            assert_head_sha "$HEAD_SHA"
            CHECKS="$(gh api "repos/${TARGET_REPOSITORY}/commits/${HEAD_SHA}/check-runs?app_id=15368&check_name=trusted-capability-admission-proof&filter=latest&per_page=100")"
            if [ "$(jq -r .total_count <<<"$CHECKS")" = "1" ]; then
              jq '.check_runs[0]' <<<"$CHECKS" > dependabot-admission-check.json
              EXTERNAL_ID="$(jq -r '.external_id // ""' dependabot-admission-check.json)"
              if [[ "$EXTERNAL_ID" =~ ^dependabot-delegated-admission:([1-9][0-9]*):([1-9][0-9]*):([0-9a-f]{64}):${PR_NUMBER}:${BASE_SHA}:${HEAD_SHA}$ ]]; then
                if python3 scripts/dependabot_admission_proof.py verify-check \
                  --check dependabot-admission-check.json \
                  --pr-number "$PR_NUMBER" \
                  --base-sha "$BASE_SHA" \
                  --head-sha "$HEAD_SHA" \
                  --out dependabot-admission-proof-verified.json; then
                  echo "Consumed exact trusted-main delegated admission digest-bound retry-history proof on bounded attempt ${ATTEMPT}."
                  exit 0
                fi
              fi
            fi
            sleep 5
          done

          echo "ERROR: exact trusted-main delegated admission proof did not arrive inside the bounded gate window" >&2
          exit 1

  validate_contracts:
    if: github.event_name == 'workflow_dispatch' && needs.validation_bind.result == 'success'
    needs: [validation_bind]
    name: validate-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read

    steps:
      - name: Checkout static trusted main contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact trusted validation base
        env:
          BASE_SHA: ${{ needs.validation_bind.outputs.base_sha }}
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 scripts/verify-python-runtime.py

      - name: Validate exact repository contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/validate-privileged-workflow-identity.py
          python3 scripts/verify-python-runtime.py
          python3 scripts/validate-workflow-capability-bom.py
          python3 scripts/signal_field_pipeline.py --self-test
          python3 scripts/generate-profile-evidence.py --self-test
          python3 scripts/check-json-object-uniqueness.py
          python3 scripts/validate-validator-purity.py
          python3 scripts/validate-validator-execution-aliases.py
          python3 scripts/validate-profile-v4.py
          python3 scripts/validate-engineering-card-geometry.py
          python3 scripts/validate-first-person-profile-voice.py
          python3 scripts/validate-profile-cache-contract.py
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/ledger" "$tmp/spotlight"
          python3 scripts/generate-portfolio-evidence-ledger.py "$tmp/ledger" --date 2026-09-04 --offline
          python3 scripts/validate-portfolio-evidence-ledger.py "$tmp/ledger"
          python3 scripts/generate-engineering-spotlight.py "$tmp/spotlight" --ledger "$tmp/ledger/portfolio-evidence-ledger.json" --date 2026-09-04
          python3 scripts/validate-engineering-spotlight.py "$tmp/spotlight" --ledger "$tmp/ledger/portfolio-evidence-ledger.json"
          python3 scripts/profile_evidence_subjects.py
          python3 scripts/stage-profile-evidence.py --self-test
          python3 scripts/validate-profile-evidence-subjects.py
          python3 scripts/profile_evidence_validation.py
          python3 scripts/validate-profile-stats-trigger-contract.py
          python3 scripts/build-profile-evidence-attestation.py --self-test
          python3 scripts/validate-profile-attestation-schema-binding.py
          python3 scripts/validate-profile-attestation-contract.py
          python3 scripts/validate-capability-evidence.py
          python3 scripts/validate-dependabot-contract.py
          python3 scripts/validate-action-release-provenance.py
          python3 scripts/validate-profile-upstream-retry.py
          python3 scripts/validate-dependency-review-contract.py
          python3 scripts/validate-workflow-source-shape.py
          python3 scripts/validate-workflow-authority-contract.py
          python3 scripts/validate-python-runtime-contract.py
          python3 scripts/check-python-maintenance-freshness.py
          python3 scripts/validate-spotlight-ui-merge-authorization.py
          python3 scripts/validate-workflow-shell-safety.py
          python3 scripts/validate-codeql-contract.py
          python3 scripts/write-profile-contract-summary.py --self-test
          python3 scripts/validate-governance-contract.py
          python3 scripts/validate-assurance-docs.py
          python3 scripts/validate-ruleset-contract.py --live

  integration:
    if: github.event_name == 'workflow_dispatch' && needs.validation_bind.result == 'success'
    needs: [validation_bind]
    name: integration-pinned-upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout static trusted main contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact trusted validation base
        env:
          BASE_SHA: ${{ needs.validation_bind.outputs.base_sha }}
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 scripts/verify-python-runtime.py

      - name: Generate actual pinned upstream Signal Field
        id: stats_primary
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: portyu9
          token: ${{ github.token }}
          profile: signal-field

      - name: Select successful exact pinned upstream output
        id: stats
        env:
          PRIMARY_OUTCOME: ${{ steps.stats_primary.outcome }}
          PRIMARY_READY_DIR: ${{ steps.stats_primary.outputs.ready-dir }}
        run: |
          set -euo pipefail
          test "$PRIMARY_OUTCOME" = "success"
          test -n "$PRIMARY_READY_DIR"
          echo "ready-dir=$PRIMARY_READY_DIR" >> "$GITHUB_OUTPUT"

      - name: Exercise canonical profile evidence generation pipeline
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: portyu9
        run: |
          set -euo pipefail
          python3 scripts/generate-profile-evidence.py \
            --signal-field-dir "$READY_DIR" \
            --portfolio-ledger-dir integration-portfolio-evidence \
            --spotlight-dir integration-engineering-spotlight

      - name: Validate generated engineering card geometry
        run: python3 scripts/validate-engineering-card-geometry.py --spotlight-dir integration-engineering-spotlight

      - name: Upload exact validation Signal Field
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-signal-field-${{ needs.validation_bind.outputs.head_sha }}
          path: ${{ steps.stats.outputs.ready-dir }}/signal-field-*.svg
          if-no-files-found: error
          retention-days: 1

      - name: Download exact validation Signal Field
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependabot-signal-field-${{ needs.validation_bind.outputs.head_sha }}
          path: roundtrip-signal-field
          digest-mismatch: error

      - name: Revalidate Signal Field artifact round-trip
        run: |
          set -euo pipefail
          python3 scripts/validate-signal-field-v214.py roundtrip-signal-field
          python3 scripts/validate-generated-signal-field.py roundtrip-signal-field

      - name: Exercise canonical live profile evidence validation boundary
        env:
          SIGNAL_FIELD_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          set -euo pipefail
          python3 scripts/validate-profile-evidence-boundary.py \
            --signal-field-dir "$SIGNAL_FIELD_DIR" \
            --spotlight-dir integration-engineering-spotlight \
            --portfolio-ledger-dir integration-portfolio-evidence

      - name: Exercise exact live publication subject staging
        env:
          SIGNAL_FIELD_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          set -euo pipefail
          rm -rf integration-profile-evidence
          python3 scripts/stage-profile-evidence.py integration-profile-evidence \
            --signal-field-dir "$SIGNAL_FIELD_DIR" \
            --spotlight-dir integration-engineering-spotlight \
            --portfolio-ledger-dir integration-portfolio-evidence
          python3 scripts/validate-profile-evidence-subjects.py --published-root integration-profile-evidence

      - name: Bind generated cache identities to live candidate contracts
        env:
          SIGNAL_FIELD_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          set -euo pipefail
          python3 scripts/validate-profile-cache-contract.py \
            --signal-field-dir "$SIGNAL_FIELD_DIR" \
            --spotlight-dir integration-engineering-spotlight \
            --ledger-dir integration-portfolio-evidence

      - name: Write read-only contract summary
        env:
          SIGNAL_FIELD_DIR: ${{ steps.stats.outputs.ready-dir }}
          SPOTLIGHT_DIR: integration-engineering-spotlight
          PORTFOLIO_LEDGER_DIR: integration-portfolio-evidence
        run: python3 scripts/write-profile-contract-summary.py

  dependency_review:
    if: github.event_name == 'workflow_dispatch' && needs.validation_bind.result == 'success'
    needs: [validation_bind]
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout static trusted main dependency-review TCB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact trusted validation base
        env:
          BASE_SHA: ${{ needs.validation_bind.outputs.base_sha }}
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Review exact dependency change
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ needs.validation_bind.outputs.base_sha }}
          head-ref: ${{ needs.validation_bind.outputs.head_sha }}
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          license-check: false
          vulnerability-check: true
          comment-summary-in-pr: never
          warn-only: false

  dispatch_codeql:
    if: github.event_name == 'workflow_dispatch' && needs.validation_bind.result == 'success' && needs.validate_contracts.result == 'success' && needs.integration.result == 'success' && needs.dependency_review.result == 'success'
    needs: [validation_bind, validate_contracts, integration, dependency_review]
    name: dependabot-dispatch-codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
      - name: Dispatch CodeQL after exact read-only validation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ needs.validation_bind.outputs.pr_number }}
          BASE_SHA: ${{ needs.validation_bind.outputs.base_sha }}
          HEAD_SHA: ${{ needs.validation_bind.outputs.head_sha }}
          HEAD_REF: ${{ needs.validation_bind.outputs.head_ref }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          test "$ACTOR" = "github-actions[bot]"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REF" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]

          assert_main_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" > "$RUNNER_TEMP/dependabot-main-ref.json"
            python3 scripts/dependabot_controller.py git-ref-read-response \
              --response "$RUNNER_TEMP/dependabot-main-ref.json" \
              --expected-ref "refs/heads/main" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/dependabot-main-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/dependabot-main-ref-normalized.json")" = "$expected_sha"
          }
          assert_head_sha() {
            local expected_sha="$1"
            gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" > "$RUNNER_TEMP/dependabot-head-ref.json"
            python3 scripts/dependabot_controller.py git-ref-read-response \
              --response "$RUNNER_TEMP/dependabot-head-ref.json" \
              --expected-ref "refs/heads/${HEAD_REF}" \
              --expected-sha "$expected_sha" \
              --out "$RUNNER_TEMP/dependabot-head-ref-normalized.json"
            test "$(jq -r .sha "$RUNNER_TEMP/dependabot-head-ref-normalized.json")" = "$expected_sha"
          }

          gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/dependabot-pr-snapshot.json"
          python3 scripts/dependabot_controller.py pull-request-response \
            --response "$RUNNER_TEMP/dependabot-pr-snapshot.json" \
            --expected-number "$PR_NUMBER" \
            --expected-repository "$TARGET_REPOSITORY" \
            --out "$RUNNER_TEMP/dependabot-pr-snapshot-normalized.json"
          PR="$(cat "$RUNNER_TEMP/dependabot-pr-snapshot-normalized.json")"
          test "$(jq -r .state <<<"$PR")" = "open"
          test "$(jq -r .draft <<<"$PR")" = "false"
          test "$(jq -r .baseRef <<<"$PR")" = "main"
          test "$(jq -r .baseSha <<<"$PR")" = "$BASE_SHA"
          test "$(jq -r .headSha <<<"$PR")" = "$HEAD_SHA"
          test "$(jq -r .headRef <<<"$PR")" = "$HEAD_REF"
          test "$(jq -r .headRepository <<<"$PR")" = "$TARGET_REPOSITORY"
          assert_main_sha "$BASE_SHA"
          assert_head_sha "$HEAD_SHA"

          CODEQL_DISPATCH_RESPONSE="$(gh api --include --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/codeql.yml/dispatches" -f ref="$HEAD_REF")"
          CODEQL_DISPATCH_STATUS_LINE="$(head -n 1 <<<"$CODEQL_DISPATCH_RESPONSE" | tr -d '\r')"
          [[ "$CODEQL_DISPATCH_STATUS_LINE" =~ ^HTTP/[0-9.]+[[:space:]]+204([[:space:]]|$) ]] || {
            echo "ERROR: Dependabot exact-head CodeQL workflow dispatch returned unexpected status: ${CODEQL_DISPATCH_STATUS_LINE}" >&2
            exit 1
          }
          echo "Dispatched CodeQL only after exact read-only Dependabot validation succeeded."

