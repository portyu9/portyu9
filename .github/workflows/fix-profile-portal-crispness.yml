name: Apply crisp profile portal fix

on:
  push:
    branches: [profile-animation-v3]

permissions:
  contents: write

jobs:
  patch-profile-animation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-animation-v3
          fetch-depth: 0

      - name: Patch native checkmark portal motion and mobile source
        shell: bash
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          svg_path = Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg')
          workflow_path = Path('.github/workflows/fix-profile-portal-crispness.yml')
          svg = svg_path.read_text(encoding='utf-8')

          start_marker = '<!-- Portal system integrated around the existing shield/pedestal. -->'
          end_marker = '<!-- Orbiting energy packets; fade completely before positional reset to avoid loop flicker. -->'
          start = svg.find(start_marker)
          end = svg.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Could not isolate the native checkmark portal system')

          portal = svg[start:end]
          if 'transform="translate(972 790)" shape-rendering="geometricPrecision"' not in portal:
              raise SystemExit('Expected sharpened native portal group was not found')

          rotate_re = re.compile(
              r'<animateTransform attributeName="transform" type="rotate" '
              r'from="(-?[0-9.]+)" to="(-?[0-9.]+)" dur="([^"]+)"([^>]*)/>'
          )

          def replace_rotation(match):
              src = float(match.group(1))
              dst = float(match.group(2))
              dur = match.group(3)
              suffix = match.group(4)
              offset = '-108' if dst > src else '108'
              return (
                  '<animate attributeName="stroke-dashoffset" values="0;' + offset + '" '
                  'dur="' + dur + '"' + suffix + '/>'
              )

          crisp_portal, rotation_count = rotate_re.subn(replace_rotation, portal)
          if rotation_count < 2:
              raise SystemExit(f'Expected at least two native rotating portal rings, found {rotation_count}')
          if '<animateTransform attributeName="transform" type="rotate"' in crisp_portal:
              raise SystemExit('Transform-driven portal ring rotation remains')

          # Keep the ring geometry fixed and animate dash phase instead. This prevents
          # sub-pixel transform resampling while preserving the same orbital motion.
          svg = svg[:start] + crisp_portal + svg[end:]
          ET.fromstring(svg)
          svg_path.write_text(svg, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_mobile = 'srcset="assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v2.svg"'
          new_mobile = 'srcset="assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg"'
          if old_mobile not in readme:
              raise SystemExit('Expected V2 mobile source was not found in README.md')
          readme = readme.replace(old_mobile, new_mobile, 1)
          if readme.count('quality-engineering-automation-systems-nebula-portal-animated-v3.svg') < 2:
              raise SystemExit('Desktop/mobile V3 source parity check failed')
          readme_path.write_text(readme, encoding='utf-8')

          workflow_path.unlink()
          print(f'Replaced {rotation_count} transform-driven native portal ring animations with crisp dash-phase motion.')
          print('Mobile and desktop now use the same V3 SVG.')
          PY

      - name: Validate corrected profile animation
        shell: bash
        run: |
          git diff --check
          test ! -e .github/workflows/fix-profile-portal-crispness.yml
          grep -q 'srcset="assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg"' README.md
          ! grep -q 'srcset="assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v2.svg"' README.md
          grep -q 'attributeName="stroke-dashoffset"' assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg
          PYTHONDONTWRITEBYTECODE=1 python -B scripts/validate-profile-v4.py

      - name: Commit corrected animation
        shell: bash
        run: |
          git config user.name "Ƴunior Ƥortal"
          git config user.email "35150859+portyu9@users.noreply.github.com"
          git add -A
          git commit -m "fix(profile): crisp checkmark portal motion on desktop and mobile"
          git push origin HEAD:profile-animation-v3
