name: Apply crisp profile portal fix

on:
  push:
    branches:
      - profile-animation-v3

permissions:
  contents: write

jobs:
  patch-profile-animation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-animation-v3
          fetch-depth: 0

      - name: Patch portal animation and mobile source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          svg_path = Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg')
          svg = svg_path.read_text(encoding='utf-8')

          outer_pattern = re.compile(
              r'<ellipse rx="360" ry="300" fill="none" stroke="url\(#energyGrad\)" stroke-width="3\.5" stroke-dasharray="14 18" opacity="\.34" vector-effect="non-scaling-stroke">\s*'
              r'<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>\s*'
              r'</ellipse>'
          )
          outer_replacement = (
              '<ellipse rx="360" ry="300" fill="none" stroke="url(#energyGrad)" stroke-width="2.25" '
              'stroke-linecap="round" stroke-dasharray="14 18" opacity=".46" vector-effect="non-scaling-stroke">\n'
              '      <animate attributeName="stroke-dashoffset" values="0;-64" dur="5.5s" repeatCount="indefinite"/>\n'
              '    </ellipse>'
          )
          svg, outer_count = outer_pattern.subn(outer_replacement, svg, count=1)

          inner_pattern = re.compile(
              r'<ellipse rx="270" ry="225" fill="none" stroke="rgba\(34,211,238,\.28\)" stroke-width="1\.8" stroke-dasharray="5 13" opacity="\.45" vector-effect="non-scaling-stroke">\s*'
              r'<animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>\s*'
              r'</ellipse>'
          )
          inner_replacement = (
              '<ellipse rx="270" ry="225" fill="none" stroke="rgba(34,211,238,.42)" stroke-width="1.5" '
              'stroke-linecap="round" stroke-dasharray="5 13" opacity=".54" vector-effect="non-scaling-stroke">\n'
              '      <animate attributeName="stroke-dashoffset" values="0;36" dur="4.8s" repeatCount="indefinite"/>\n'
              '    </ellipse>'
          )
          svg, inner_count = inner_pattern.subn(inner_replacement, svg, count=1)

          if outer_count != 1 or inner_count != 1:
              raise SystemExit(f'Portal patch mismatch: outer={outer_count}, inner={inner_count}')

          svg_path.write_text(svg, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_mobile = 'srcset="assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v2.svg"'
          new_mobile = 'srcset="assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg"'
          if old_mobile not in readme:
              raise SystemExit('Expected V2 mobile source was not found in README.md')
          readme = readme.replace(old_mobile, new_mobile, 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Commit corrected files
        shell: bash
        run: |
          rm -f .github/workflows/fix-profile-portal-crispness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sharpen checkmark portal animation across breakpoints"
          git push origin HEAD:profile-animation-v3
