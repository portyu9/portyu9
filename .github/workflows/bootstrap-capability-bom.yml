name: Bootstrap Workflow Capability BOM snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    if: >-
      github.repository == 'portyu9/portyu9' &&
      github.head_ref == 'item-12-workflow-capability-bom' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: bootstrap-capability-bom-snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - name: Commit exact canonical snapshot only
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-capability-bom.yml
          python3 scripts/workflow_capability_bom.py > .github/workflow-capability-bom-v1.json
          git checkout -- .github/workflows/bootstrap-capability-bom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflow-capability-bom-v1.json
          if git diff --cached --quiet; then
            echo "Canonical snapshot already current."
            exit 0
          fi
          git commit -m "Refresh canonical Workflow Capability BOM"
          git push origin "HEAD:${TARGET_BRANCH}"
