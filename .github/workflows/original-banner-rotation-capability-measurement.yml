name: Measure original banner eight-day capability (read only)
on:
  pull_request:
    paths:
      - ".github/workflows/original-banner-rotation-capability-measurement.yml"
permissions:
  contents: read
jobs:
  measure:
    name: measure-immutable-eight-day-banner-candidate-read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout accepted main as trusted executable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a291ad1a78437d9443f4337b5b20af5f8f30ccf7
          path: trusted
          persist-credentials: false
      - name: Checkout immutable candidate exclusively as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 248d023ed932a0e4e3389fe55206680c995482b4
          path: candidate
          persist-credentials: false
      - name: Set up pinned reviewed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Verify immutable inputs and measure only with trusted evaluator
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "a291ad1a78437d9443f4337b5b20af5f8f30ccf7"
          test "$(git -C candidate rev-parse HEAD)" = "248d023ed932a0e4e3389fe55206680c995482b4"
          python3 trusted/scripts/verify-python-runtime.py
          TREE_SHA="$(git -C candidate rev-parse 'HEAD^{tree}')"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Eight-day banner candidate frozen at 248d023ed932a0e4e3389fe55206680c995482b4; tree=$TREE_SHA"
          python3 trusted/scripts/workflow_capability_admission.py \
            candidate --candidate-tree-sha "$TREE_SHA" --measure
