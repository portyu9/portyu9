name: Profile quality

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - ".github/GOVERNANCE.md"
      - ".github/SPOTLIGHT_UI_MERGE_AUTHORIZATION.md"
      - ".github/REFRESH_CADENCE.md"
      - ".github/THREAT_MODEL.md"
      - ".github/RULESETS.md"
      - ".github/rulesets/**"
      - ".github/ATTESTATION.md"
      - ".github/attestation/**"
      - ".github/dependabot.yml"
      - ".github/action-lock.json"
      - ".github/automation-policy-v1.json"
      - ".github/workflow-capability-bom-v1.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: profile-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13.15"

jobs:
  validate:
    name: validate-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      actions: read
      attestations: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate privileged workflow byte identity
        run: python3 scripts/validate-privileged-workflow-identity.py

      - name: Verify resolved Python runtime
        run: python3 scripts/verify-python-runtime.py

      - name: Validate Workflow Capability BOM
        run: python3 scripts/validate-workflow-capability-bom.py

      - name: Validate Signal Field pipeline contract
        run: python3 scripts/signal_field_pipeline.py --self-test

      - name: Validate profile evidence generation contract
        run: python3 scripts/generate-profile-evidence.py --self-test

      - name: Validate source-controlled JSON object uniqueness
        run: python3 scripts/check-json-object-uniqueness.py

      - name: Validate validator purity
        run: python3 scripts/validate-validator-purity.py

      - name: Validate validator execution alias closure
        run: python3 scripts/validate-validator-execution-aliases.py

      - name: Validate profile asset contract
        run: python3 scripts/validate-profile-v4.py

      - name: Validate unified engineering card geometry
        run: python3 scripts/validate-engineering-card-geometry.py

      - name: Validate first-person profile voice
        run: python3 scripts/validate-first-person-profile-voice.py

      - name: Validate generated profile cache identities
        run: python3 scripts/validate-profile-cache-contract.py

      - name: Validate deterministic Portfolio Evidence Ledger and Spotlight projection
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/ledger" "$tmp/spotlight"
          python3 scripts/generate-portfolio-evidence-ledger.py "$tmp/ledger" --date 2026-09-04 --offline
          python3 scripts/validate-portfolio-evidence-ledger.py "$tmp/ledger"
          python3 scripts/generate-engineering-spotlight.py "$tmp/spotlight" --ledger "$tmp/ledger/portfolio-evidence-ledger.json" --date 2026-09-04
          python3 scripts/validate-engineering-spotlight.py "$tmp/spotlight" --ledger "$tmp/ledger/portfolio-evidence-ledger.json"

      - name: Validate canonical profile evidence subject closure
        run: |
          set -euo pipefail
          python3 scripts/profile_evidence_subjects.py
          python3 scripts/stage-profile-evidence.py --self-test
          python3 scripts/validate-profile-evidence-subjects.py

      - name: Validate profile evidence validation boundary contract
        run: python3 scripts/profile_evidence_validation.py

      - name: Validate production refresh trigger closure
        run: python3 scripts/validate-profile-stats-trigger-contract.py

      - name: Validate engineering attestation predicate builder
        run: python3 scripts/build-profile-evidence-attestation.py --self-test

      - name: Validate attestation builder/schema identity binding
        run: python3 scripts/validate-profile-attestation-schema-binding.py

      - name: Validate engineering attestation trust boundary
        run: python3 scripts/validate-profile-attestation-contract.py

      - name: Validate capability evidence links
        run: python3 scripts/validate-capability-evidence.py

      - name: Validate Dependabot governance contract
        run: python3 scripts/validate-dependabot-contract.py

      - name: Validate local action release provenance closure
        run: python3 scripts/validate-action-release-provenance.py --local-only

      - name: Discover exact fresh signed Action provenance witness
        id: action_provenance_witness_discovery
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOW="$(date -u +%s)"
          [[ "$NOW" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/action-provenance-witness.yml/runs?branch=main&status=success&per_page=100" > action-provenance-witness-runs.json
          python3 scripts/action_provenance_witness.py select-run \
            --runs action-provenance-witness-runs.json \
            --now "$NOW" \
            --out selected-action-provenance-witness-run.json
          RUN_ID="$(jq -r .id selected-action-provenance-witness-run.json)"
          RUN_ATTEMPT="$(jq -r .runAttempt selected-action-provenance-witness-run.json)"
          SOURCE_SHA="$(jq -r .headSha selected-action-provenance-witness-run.json)"
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}" > selected-action-provenance-witness-attempt.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > selected-action-provenance-witness-artifacts.json
          python3 scripts/action_provenance_witness.py select-artifact \
            --artifacts selected-action-provenance-witness-artifacts.json \
            --selected-run selected-action-provenance-witness-run.json \
            --out selected-action-provenance-witness-artifact.json
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "now=$NOW" >> "$GITHUB_OUTPUT"

      - name: Download exact fresh signed Action provenance witness
        id: action_provenance_witness_download
        if: steps.action_provenance_witness_discovery.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-provenance-witness-v1
          path: action-provenance-witness-consumer
          github-token: ${{ github.token }}
          run-id: ${{ steps.action_provenance_witness_discovery.outputs.run_id }}
          digest-mismatch: error

      - name: Verify and consume exact fresh signed Action provenance witness
        id: action_provenance_witness_verify
        if: steps.action_provenance_witness_discovery.outcome == 'success' && steps.action_provenance_witness_download.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.action_provenance_witness_discovery.outputs.source_sha }}
          WITNESS_NOW: ${{ steps.action_provenance_witness_discovery.outputs.now }}
          SUBJECT: action-provenance-witness-consumer/action-provenance-witness-subject.json
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WITNESS_NOW" =~ ^[1-9][0-9]*$ ]]
          test -f action-provenance-witness-consumer/action-provenance-witness.json
          test -f "$SUBJECT"
          test "$(find action-provenance-witness-consumer -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          test -z "$(find action-provenance-witness-consumer -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          gh attestation verify "$SUBJECT" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://raw.githubusercontent.com/portyu9/portyu9/main/.github/attestation/action-provenance-witness-v1.schema.json \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/action-provenance-witness.yml" \
            --signer-digest "$SOURCE_SHA" \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > verified-action-provenance-witness-attestation.json
          python3 scripts/action_provenance_witness.py consume-evidence \
            --run-list action-provenance-witness-runs.json \
            --attempt-run selected-action-provenance-witness-attempt.json \
            --artifact-list selected-action-provenance-witness-artifacts.json \
            --predicate action-provenance-witness-consumer/action-provenance-witness.json \
            --subject "$SUBJECT" \
            --verified-attestation verified-action-provenance-witness-attestation.json \
            --lock .github/action-lock.json \
            --policy-root . \
            --now "$WITNESS_NOW" \
            --out accepted-action-provenance-witness.json

      - name: Validate live Action release provenance fallback
        if: steps.action_provenance_witness_verify.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-action-release-provenance.py --live-only

      - name: Validate pinned upstream retry contract
        run: python3 scripts/validate-profile-upstream-retry.py

      - name: Validate Dependency Review governance contract
        run: python3 scripts/validate-dependency-review-contract.py

      - name: Validate workflow YAML source shape
        run: python3 scripts/validate-workflow-source-shape.py

      - name: Validate workflow authority firewall
        run: python3 scripts/validate-workflow-authority-contract.py

      - name: Validate exact Python runtime contract
        run: python3 scripts/validate-python-runtime-contract.py

      - name: Check Python maintenance freshness
        run: python3 scripts/check-python-maintenance-freshness.py

      - name: Validate Spotlight UI merge authorization
        run: python3 scripts/validate-spotlight-ui-merge-authorization.py

      - name: Validate workflow shell safety
        run: python3 scripts/validate-workflow-shell-safety.py

      - name: Validate CodeQL governance contract
        run: python3 scripts/validate-codeql-contract.py

      - name: Validate read-only contract summary renderer
        run: python3 scripts/write-profile-contract-summary.py --self-test

      - name: Validate repository governance contract
        run: python3 scripts/validate-governance-contract.py

      - name: Validate assurance documentation contract
        run: python3 scripts/validate-assurance-docs.py

      - name: Validate repository ruleset source + live observable control-plane contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-ruleset-contract.py --live

  integration:
    name: integration-pinned-upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      attestations: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 scripts/verify-python-runtime.py

      - name: Discover exact fresh signed Profile Generator Compatibility Witness
        id: profile_generator_witness_discovery
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOW="$(date -u +%s)"
          [[ "$NOW" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/profile-generator-compatibility-witness.yml/runs?branch=main&status=success&per_page=100" > profile-generator-compatibility-witness-runs.json
          python3 scripts/profile_generator_compatibility_witness.py select-run \
            --runs profile-generator-compatibility-witness-runs.json \
            --now "$NOW" \
            --out selected-profile-generator-compatibility-witness-run.json
          RUN_ID="$(jq -r .id selected-profile-generator-compatibility-witness-run.json)"
          RUN_ATTEMPT="$(jq -r .runAttempt selected-profile-generator-compatibility-witness-run.json)"
          SOURCE_SHA="$(jq -r .headSha selected-profile-generator-compatibility-witness-run.json)"
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}" > selected-profile-generator-compatibility-witness-attempt.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > selected-profile-generator-compatibility-witness-artifacts.json
          python3 scripts/profile_generator_compatibility_witness.py select-artifact \
            --artifacts selected-profile-generator-compatibility-witness-artifacts.json \
            --selected-run selected-profile-generator-compatibility-witness-run.json \
            --out selected-profile-generator-compatibility-witness-artifact.json
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "now=$NOW" >> "$GITHUB_OUTPUT"

      - name: Download exact fresh signed Profile Generator Compatibility Witness
        id: profile_generator_witness_download
        if: steps.profile_generator_witness_discovery.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-generator-compatibility-witness-v1
          path: profile-generator-compatibility-witness-consumer
          github-token: ${{ github.token }}
          run-id: ${{ steps.profile_generator_witness_discovery.outputs.run_id }}
          digest-mismatch: error

      - name: Verify and consume exact fresh signed Profile Generator Compatibility Witness
        id: profile_generator_witness_verify
        if: steps.profile_generator_witness_discovery.outcome == 'success' && steps.profile_generator_witness_download.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.profile_generator_witness_discovery.outputs.source_sha }}
          WITNESS_NOW: ${{ steps.profile_generator_witness_discovery.outputs.now }}
          SUBJECT: profile-generator-compatibility-witness-consumer/profile-generator-compatibility-witness-subject.json
          RAW_DIR: profile-generator-compatibility-witness-consumer/raw-signal-field
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WITNESS_NOW" =~ ^[1-9][0-9]*$ ]]
          test -f profile-generator-compatibility-witness-consumer/profile-generator-compatibility-witness.json
          test -f "$SUBJECT"
          test -d "$RAW_DIR"
          test "$(find profile-generator-compatibility-witness-consumer -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          test "$(find profile-generator-compatibility-witness-consumer -mindepth 1 -maxdepth 1 -type d -printf '%f\n')" = "raw-signal-field"
          test "$(find "$RAW_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "4"
          test -z "$(find "$RAW_DIR" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          gh attestation verify "$SUBJECT" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://github.com/portyu9/portyu9/attestations/profile-generator-compatibility/v1 \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/profile-generator-compatibility-witness.yml" \
            --signer-digest "$SOURCE_SHA" \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > verified-profile-generator-compatibility-witness-attestation.json
          python3 scripts/profile_generator_compatibility_witness.py consume-evidence \
            --run-list profile-generator-compatibility-witness-runs.json \
            --attempt-run selected-profile-generator-compatibility-witness-attempt.json \
            --artifact-list selected-profile-generator-compatibility-witness-artifacts.json \
            --predicate profile-generator-compatibility-witness-consumer/profile-generator-compatibility-witness.json \
            --subject "$SUBJECT" \
            --verified-attestation verified-profile-generator-compatibility-witness-attestation.json \
            --signal-field-dir "$RAW_DIR" \
            --lock .github/action-lock.json \
            --policy-root . \
            --now "$WITNESS_NOW" \
            --out accepted-profile-generator-compatibility-witness.json
          ISOLATED_DIR="$RUNNER_TEMP/profile-generator-compatibility-witness-ready"
          rm -rf "$ISOLATED_DIR"
          mkdir -p "$ISOLATED_DIR"
          WORKSPACE_REAL="$(realpath "$GITHUB_WORKSPACE")"
          ISOLATED_REAL="$(realpath "$ISOLATED_DIR")"
          case "$ISOLATED_REAL/" in
            "$WORKSPACE_REAL/"*)
              echo "Verified witness ready-dir must remain outside trusted source checkout" >&2
              exit 1
              ;;
          esac
          for name in \
            signal-field-wide-light.svg \
            signal-field-wide-dark.svg \
            signal-field-compact-light.svg \
            signal-field-compact-dark.svg
          do
            test -f "$RAW_DIR/$name"
            test ! -L "$RAW_DIR/$name"
            cp -- "$RAW_DIR/$name" "$ISOLATED_DIR/$name"
            test -f "$ISOLATED_DIR/$name"
            test ! -L "$ISOLATED_DIR/$name"
            cmp -- "$RAW_DIR/$name" "$ISOLATED_DIR/$name"
          done
          test "$(find "$ISOLATED_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "4"
          test -z "$(find "$ISOLATED_DIR" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          echo "ready-dir=$ISOLATED_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate actual pinned upstream Signal Field
        id: stats_primary
        if: steps.profile_generator_witness_verify.outcome != 'success'
        continue-on-error: true
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: portyu9
          token: ${{ github.token }}
          profile: signal-field

      - name: Back off before one exact pinned upstream retry
        if: steps.profile_generator_witness_verify.outcome != 'success' && steps.stats_primary.outcome == 'failure'
        run: sleep 60

      - name: Retry exact pinned upstream Signal Field once
        id: stats_retry
        if: steps.profile_generator_witness_verify.outcome != 'success' && steps.stats_primary.outcome == 'failure'
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: portyu9
          token: ${{ github.token }}
          profile: signal-field

      - name: Select successful exact pinned upstream output
        id: stats
        env:
          WITNESS_OUTCOME: ${{ steps.profile_generator_witness_verify.outcome }}
          WITNESS_READY_DIR: ${{ steps.profile_generator_witness_verify.outputs.ready-dir }}
          PRIMARY_OUTCOME: ${{ steps.stats_primary.outcome }}
          PRIMARY_READY_DIR: ${{ steps.stats_primary.outputs.ready-dir }}
          RETRY_OUTCOME: ${{ steps.stats_retry.outcome }}
          RETRY_READY_DIR: ${{ steps.stats_retry.outputs.ready-dir }}
        run: |
          set -euo pipefail
          if [ "$WITNESS_OUTCOME" = "success" ]; then
            test -n "$WITNESS_READY_DIR"
            READY_DIR="$WITNESS_READY_DIR"
          elif [ "$PRIMARY_OUTCOME" = "success" ]; then
            test -n "$PRIMARY_READY_DIR"
            READY_DIR="$PRIMARY_READY_DIR"
          else
            test "$PRIMARY_OUTCOME" = "failure"
            test "$RETRY_OUTCOME" = "success"
            test -n "$RETRY_READY_DIR"
            READY_DIR="$RETRY_READY_DIR"
          fi
          echo "ready-dir=$READY_DIR" >> "$GITHUB_OUTPUT"

      - name: Exercise canonical profile evidence generation pipeline
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: portyu9
        run: |
          set -euo pipefail
          python3 scripts/generate-profile-evidence.py \
            --signal-field-dir "$READY_DIR" \
            --portfolio-ledger-dir integration-portfolio-evidence \
            --spotlight-dir integration-engineering-spotlight

      - name: Validate generated engineering card geometry
        run: python3 scripts/validate-engineering-card-geometry.py --spotlight-dir integration-engineering-spotlight

      - name: Upload Signal Field review artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal-field-publishable-review
          path: ${{ steps.stats.outputs.ready-dir }}/signal-field-*.svg
          if-no-files-found: error
          retention-days: 1

      - name: Download Signal Field review artifacts
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signal-field-publishable-review
          path: roundtrip-signal-field
          digest-mismatch: error

      - name: Revalidate Signal Field artifact round-trip
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 scripts/validate-signal-field-v214.py roundtrip-signal-field
          python3 scripts/validate-generated-signal-field.py roundtrip-signal-field

      - name: Exercise canonical live profile evidence validation boundary
        env:
          SIGNAL_FIELD_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          set -euo pipefail
          python3 scripts/validate-profile-evidence-boundary.py \
            --signal-field-dir "$SIGNAL_FIELD_DIR" \
            --spotlight-dir integration-engineering-spotlight \
            --portfolio-ledger-dir integration-portfolio-evidence

      - name: Exercise exact live publication subject staging
        env:
          SIGNAL_FIELD_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          set -euo pipefail
          rm -rf integration-profile-evidence
          python3 scripts/stage-profile-evidence.py integration-profile-evidence \
            --signal-field-dir "$SIGNAL_FIELD_DIR" \
            --spotlight-dir integration-engineering-spotlight \
            --portfolio-ledger-dir integration-portfolio-evidence
          python3 scripts/validate-profile-evidence-subjects.py --published-root integration-profile-evidence

      - name: Bind generated cache identities to live candidate contracts
        env:
          SIGNAL_FIELD_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          set -euo pipefail
          python3 scripts/validate-profile-cache-contract.py \
            --signal-field-dir "$SIGNAL_FIELD_DIR" \
            --spotlight-dir integration-engineering-spotlight \
            --ledger-dir integration-portfolio-evidence

      - name: Write read-only contract summary
        env:
          SIGNAL_FIELD_DIR: ${{ steps.stats.outputs.ready-dir }}
          SPOTLIGHT_DIR: integration-engineering-spotlight
          PORTFOLIO_LEDGER_DIR: integration-portfolio-evidence
        run: python3 scripts/write-profile-contract-summary.py

  dependabot_admission:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/')
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/') && 'trusted-capability-admission' || 'dependabot-admission-not-applicable' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Consume exact trusted-main Dependabot admission proof
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          test "$PR_AUTHOR" = "dependabot[bot]"
          test "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY"
          test "$BASE_REF" = "main"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REF" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
          EXTERNAL_ID="dependabot-delegated-admission:${PR_NUMBER}:${BASE_SHA}:${HEAD_SHA}"

          for ATTEMPT in $(seq 1 36); do
            PR="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
            test "$(jq -r .state <<<"$PR")" = "open"
            test "$(jq -r .draft <<<"$PR")" = "false"
            test "$(jq -r .user.login <<<"$PR")" = "dependabot[bot]"
            test "$(jq -r .base.ref <<<"$PR")" = "$BASE_REF"
            test "$(jq -r .base.sha <<<"$PR")" = "$BASE_SHA"
            test "$(jq -r .head.repo.full_name <<<"$PR")" = "$HEAD_REPOSITORY"
            test "$(jq -r .head.ref <<<"$PR")" = "$HEAD_REF"
            test "$(jq -r .head.sha <<<"$PR")" = "$HEAD_SHA"
            test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
            test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)" = "$HEAD_SHA"

            CHECKS="$(gh api "repos/${TARGET_REPOSITORY}/commits/${HEAD_SHA}/check-runs?app_id=15368&check_name=trusted-capability-admission-proof&filter=latest&per_page=100")"
            if [ "$(jq -r .total_count <<<"$CHECKS")" = "1" ] && jq -e \
              --arg head "$HEAD_SHA" \
              --arg base "$BASE_SHA" \
              --arg external "$EXTERNAL_ID" \
              --argjson pr "$PR_NUMBER" '
                .check_runs[0] |
                .name == "trusted-capability-admission-proof" and
                .head_sha == $head and
                .app.id == 15368 and
                .status == "completed" and
                .conclusion == "success" and
                .external_id == $external and
                ([.pull_requests[]? | select(.number == $pr and .head.sha == $head and .base.sha == $base)] | length == 1)
              ' <<<"$CHECKS" >/dev/null; then
              echo "Consumed exact trusted-main Dependabot admission proof on bounded attempt ${ATTEMPT}."
              exit 0
            fi
            sleep 5
          done

          echo "ERROR: exact trusted-main Dependabot admission proof did not arrive inside the bounded PR-native gate window" >&2
          exit 1

  governed_bot_review:
    if: github.event_name == 'pull_request'
    name: trusted-governed-bot-review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Run exact accepted-base governed bot review gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_GATE_BLOB: 0158284c833051fa9a1152a3314b906038ec6a28
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$EVENT_BASE_REF" = "main"
          [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          TRUSTED_GATE="$RUNNER_TEMP/governed-bot-review-gate.py"
          gh api -H "Accept: application/vnd.github.raw+json" "repos/${TARGET_REPOSITORY}/contents/scripts/governed_bot_review_gate.py?ref=${EVENT_BASE_SHA}" > "$TRUSTED_GATE"
          test -s "$TRUSTED_GATE"
          GATE_SIZE="$(wc -c < "$TRUSTED_GATE" | tr -d '[:space:]')"
          [[ "$GATE_SIZE" =~ ^[1-9][0-9]*$ ]]
          GATE_BLOB="$( { printf 'blob %s\0' "$GATE_SIZE"; cat "$TRUSTED_GATE"; } | sha1sum | cut -d' ' -f1 )"
          test "$GATE_BLOB" = "$EXPECTED_GATE_BLOB"
          python3 "$TRUSTED_GATE" --self-test
          python3 "$TRUSTED_GATE"
