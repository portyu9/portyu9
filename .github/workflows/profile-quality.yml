name: Profile quality

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/profile-quality.yml"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: read

concurrency:
  group: profile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Signal Field customization contract
        run: python3 scripts/customize-signal-field.py --self-test

      - name: Validate Signal Field v2.1 polish contract
        run: python3 scripts/polish-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.2 evidence contract
        run: python3 scripts/enhance-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.3 background contract
        run: python3 scripts/background-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.4 portal contract
        run: python3 scripts/portal-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.5 layout alignment
        run: python3 scripts/align-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.6 phosphorescent metrics
        run: python3 scripts/phosphor-signal-field-v2.py --self-test

      - name: Validate profile asset contract
        run: python3 scripts/validate-profile.py
