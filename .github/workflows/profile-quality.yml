name: Profile quality

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - ".github/GOVERNANCE.md"
      - ".github/REFRESH_CADENCE.md"
      - ".github/THREAT_MODEL.md"
      - ".github/RULESETS.md"
      - ".github/rulesets/**"
      - ".github/ATTESTATION.md"
      - ".github/attestation/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: profile-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  validate:
    name: validate-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Signal Field pipeline contract
        run: python3 scripts/signal_field_pipeline.py --self-test

      - name: Validate validator purity
        run: python3 scripts/validate-validator-purity.py

      - name: Validate profile asset contract
        run: python3 scripts/validate-profile-v4.py

      - name: Validate generated profile cache identities
        run: python3 scripts/validate-profile-cache-contract.py

      - name: Validate deterministic Portfolio Evidence Ledger and Spotlight projection
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/ledger" "$tmp/spotlight"
          python3 scripts/generate-portfolio-evidence-ledger.py "$tmp/ledger" --date 2026-09-04 --offline
          python3 scripts/validate-portfolio-evidence-ledger.py "$tmp/ledger"
          python3 scripts/generate-engineering-spotlight.py "$tmp/spotlight" --ledger "$tmp/ledger/portfolio-evidence-ledger.json" --date 2026-09-04
          python3 scripts/validate-engineering-spotlight.py "$tmp/spotlight" --ledger "$tmp/ledger/portfolio-evidence-ledger.json"

      - name: Validate canonical profile evidence subject closure
        run: |
          set -euo pipefail
          python3 scripts/profile_evidence_subjects.py
          python3 scripts/stage-profile-evidence.py --self-test
          python3 scripts/validate-profile-evidence-subjects.py

      - name: Validate production refresh trigger closure
        run: python3 scripts/validate-profile-stats-trigger-contract.py

      - name: Validate engineering attestation predicate builder
        run: python3 scripts/build-profile-evidence-attestation.py --self-test

      - name: Validate engineering attestation trust boundary
        run: python3 scripts/validate-profile-attestation-contract.py

      - name: Validate capability evidence links
        run: python3 scripts/validate-capability-evidence.py

      - name: Validate Dependabot governance contract
        run: python3 scripts/validate-dependabot-contract.py

      - name: Validate action release provenance
        run: python3 scripts/validate-action-release-provenance.py

      - name: Validate Dependency Review governance contract
        run: python3 scripts/validate-dependency-review-contract.py

      - name: Validate workflow authority firewall
        run: python3 scripts/validate-workflow-authority-contract.py

      - name: Validate workflow shell safety
        run: python3 scripts/validate-workflow-shell-safety.py

      - name: Validate CodeQL governance contract
        run: python3 scripts/validate-codeql-contract.py

      - name: Validate read-only contract summary renderer
        run: python3 scripts/write-profile-contract-summary.py --self-test

      - name: Validate repository governance contract
        run: python3 scripts/validate-governance-contract.py

      - name: Validate assurance documentation contract
        run: python3 scripts/validate-assurance-docs.py

      - name: Validate repository ruleset source + live control-plane contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-ruleset-contract.py --live

  integration:
    name: integration-pinned-upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate actual pinned upstream Signal Field
        id: stats
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: portyu9
          token: ${{ github.token }}
          profile: signal-field

      - name: Exercise complete production transformation chain
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: portyu9
        run: |
          set -euo pipefail
          python3 scripts/signal_field_pipeline.py "$READY_DIR"

      - name: Upload Signal Field review artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal-field-v214-review
          path: ${{ steps.stats.outputs.ready-dir }}/signal-field-*.svg
          if-no-files-found: error
          retention-days: 1

      - name: Download Signal Field review artifacts
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signal-field-v214-review
          path: roundtrip-signal-field
          digest-mismatch: error

      - name: Revalidate Signal Field artifact round-trip
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 scripts/validate-signal-field-v214.py roundtrip-signal-field
          python3 scripts/validate-generated-signal-field.py roundtrip-signal-field

      - name: Exercise live Portfolio Evidence Ledger path
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf integration-portfolio-evidence
          python3 scripts/generate-portfolio-evidence-ledger.py integration-portfolio-evidence
          python3 scripts/validate-portfolio-evidence-ledger.py integration-portfolio-evidence --require-live

      - name: Exercise live Engineering Spotlight projection
        run: |
          set -euo pipefail
          rm -rf integration-engineering-spotlight
          python3 scripts/generate-engineering-spotlight.py integration-engineering-spotlight --ledger integration-portfolio-evidence/portfolio-evidence-ledger.json
          python3 scripts/validate-engineering-spotlight.py integration-engineering-spotlight --ledger integration-portfolio-evidence/portfolio-evidence-ledger.json --require-live

      - name: Exercise exact live publication subject closure
        env:
          SIGNAL_FIELD_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          set -euo pipefail
          rm -rf integration-profile-evidence
          python3 scripts/validate-profile-evidence-subjects.py \
            --signal-field-dir "$SIGNAL_FIELD_DIR" \
            --spotlight-dir integration-engineering-spotlight \
            --portfolio-ledger-dir integration-portfolio-evidence
          python3 scripts/stage-profile-evidence.py integration-profile-evidence \
            --signal-field-dir "$SIGNAL_FIELD_DIR" \
            --spotlight-dir integration-engineering-spotlight \
            --portfolio-ledger-dir integration-portfolio-evidence
          python3 scripts/validate-profile-evidence-subjects.py --published-root integration-profile-evidence

      - name: Bind generated cache identities to live candidate contracts
        env:
          SIGNAL_FIELD_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          set -euo pipefail
          python3 scripts/validate-profile-cache-contract.py \
            --signal-field-dir "$SIGNAL_FIELD_DIR" \
            --spotlight-dir integration-engineering-spotlight \
            --ledger-dir integration-portfolio-evidence

      - name: Write read-only contract summary
        env:
          SIGNAL_FIELD_DIR: ${{ steps.stats.outputs.ready-dir }}
          SPOTLIGHT_DIR: integration-engineering-spotlight
          PORTFOLIO_LEDGER_DIR: integration-portfolio-evidence
        run: python3 scripts/write-profile-contract-summary.py
