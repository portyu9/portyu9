name: Profile quality

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - ".github/GOVERNANCE.md"
      - ".github/ATTESTATION.md"
      - ".github/attestation/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: profile-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  validate:
    name: validate-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Signal Field customization contract
        run: python3 scripts/customize-signal-field.py --self-test

      - name: Validate Signal Field v2.1 polish contract
        run: python3 scripts/polish-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.2 evidence contract
        run: python3 scripts/enhance-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.3 background contract
        run: python3 scripts/background-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.4 portal contract
        run: python3 scripts/portal-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.5 layout alignment
        run: python3 scripts/align-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.6 phosphorescent metrics
        run: python3 scripts/phosphor-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.7 phosphorescent activity telemetry
        run: python3 scripts/phosphor-activity-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.8 phosphorescent metric lines
        run: python3 scripts/phosphor-lines-signal-field-v2.py --self-test

      - name: Validate Signal Field v2.9 profile evidence semantics
        run: python3 scripts/sync-profile-contribution-total.py --self-test

      - name: Validate Signal Field v2.10 metric labels
        run: python3 scripts/relabel-signal-field-metrics.py --self-test

      - name: Validate Signal Field v2.11 metric glyphs
        run: python3 scripts/glyphs-signal-field-metrics.py --self-test

      - name: Validate Signal Field v2.12 secondary metric balance
        run: python3 scripts/balance-signal-field-secondary-metrics.py --self-test

      - name: Validate Signal Field v2.13 evidence-window clarity
        run: python3 scripts/clarify-signal-field-evidence-window.py --self-test

      - name: Validate Signal Field v2.14 Evidence ID
        run: python3 scripts/validate-signal-field-v214.py --self-test

      - name: Validate profile asset contract
        run: python3 scripts/validate-profile-v4.py

      - name: Validate deterministic Engineering Spotlight generation
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python3 scripts/generate-engineering-spotlight.py "$tmp" --date 2026-09-04 --offline
          python3 scripts/validate-engineering-spotlight.py "$tmp"

      - name: Validate engineering attestation predicate builder
        run: python3 scripts/build-profile-evidence-attestation.py --self-test

      - name: Validate engineering attestation trust boundary
        run: python3 scripts/validate-profile-attestation-contract.py

      - name: Validate capability evidence links
        run: python3 scripts/validate-capability-evidence.py

      - name: Validate Dependabot governance contract
        run: python3 scripts/validate-dependabot-contract.py

      - name: Validate Dependency Review governance contract
        run: python3 scripts/validate-dependency-review-contract.py

      - name: Validate CodeQL governance contract
        run: python3 scripts/validate-codeql-contract.py

      - name: Validate repository governance contract
        run: python3 scripts/validate-governance-contract.py

  integration:
    name: integration-pinned-upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate actual pinned upstream Signal Field
        id: stats
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        with:
          username: portyu9
          token: ${{ github.token }}
          profile: signal-field

      - name: Exercise complete production transformation chain
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: portyu9
        run: |
          set -euo pipefail
          python3 scripts/customize-signal-field.py "$READY_DIR"
          python3 scripts/polish-signal-field-v2.py "$READY_DIR"
          python3 scripts/enhance-signal-field-v2.py "$READY_DIR"
          python3 scripts/background-signal-field-v2.py "$READY_DIR"
          python3 scripts/portal-signal-field-v2.py "$READY_DIR"
          python3 scripts/align-signal-field-v2.py "$READY_DIR"
          python3 scripts/phosphor-signal-field-v2.py "$READY_DIR"
          python3 scripts/phosphor-activity-signal-field-v2.py "$READY_DIR"
          python3 scripts/phosphor-lines-signal-field-v2.py "$READY_DIR"
          python3 scripts/sync-profile-contribution-total.py "$READY_DIR"
          python3 scripts/relabel-signal-field-metrics.py "$READY_DIR"
          python3 scripts/glyphs-signal-field-metrics.py "$READY_DIR"
          python3 scripts/balance-signal-field-secondary-metrics.py "$READY_DIR"
          python3 scripts/clarify-signal-field-evidence-window.py "$READY_DIR"
          python3 scripts/validate-signal-field-v213.py "$READY_DIR"
          python3 scripts/identify-signal-field-evidence.py "$READY_DIR"
          python3 scripts/validate-signal-field-v214.py "$READY_DIR"
          python3 scripts/validate-generated-signal-field.py "$READY_DIR"

      - name: Upload Signal Field review artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal-field-v214-review
          path: ${{ steps.stats.outputs.ready-dir }}/signal-field-*.svg
          if-no-files-found: error
          retention-days: 1

      - name: Download Signal Field review artifacts
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signal-field-v214-review
          path: roundtrip-signal-field
          digest-mismatch: error

      - name: Revalidate Signal Field artifact round-trip
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 scripts/validate-signal-field-v214.py roundtrip-signal-field
          python3 scripts/validate-generated-signal-field.py roundtrip-signal-field

      - name: Exercise live Engineering Spotlight evidence path
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python3 scripts/generate-engineering-spotlight.py "$tmp"
          python3 scripts/validate-engineering-spotlight.py "$tmp" --require-live
