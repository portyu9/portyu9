name: Dependency review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind exact dispatched candidate
        if: github.event_name == 'workflow_dispatch'
        id: exact
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REF" =~ ^refs/heads/dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          BASE_SHA="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BASE_SHA" != "$HEAD_SHA"
          printf 'base_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ steps.exact.outputs.base_sha || github.event.pull_request.base.sha }}
          head-ref: ${{ steps.exact.outputs.head_sha || github.event.pull_request.head.sha }}
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          license-check: false
          vulnerability-check: true
          comment-summary-in-pr: never
          warn-only: false
