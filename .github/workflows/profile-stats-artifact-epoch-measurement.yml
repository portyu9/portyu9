name: One-shot Profile Stats Action epoch prior-authorization measurement
on:
  pull_request:
    paths:
      - ".github/workflows/profile-stats-artifact-epoch-measurement.yml"
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.13.16"
jobs:
  measure:
    name: trusted-main-measure-frozen-artifact-epoch-source
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout immutable accepted main as trusted evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d1c1d49104d5c2cfe109f1a34c2e353f373e203f
          path: trusted
          persist-credentials: false
      - name: Checkout frozen source tree as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: daf19c9f230ff9d6e39ddac16e8e86e0cd8eb961
          path: candidate
          persist-credentials: false
      - name: Set up reviewed Python 3.13.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Compile exact capability diff using accepted-main code only
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "d1c1d49104d5c2cfe109f1a34c2e353f373e203f"
          test "$(git -C candidate rev-parse HEAD)" = "daf19c9f230ff9d6e39ddac16e8e86e0cd8eb961"
          python3 trusted/scripts/verify-python-runtime.py
          TREE_SHA="$(git -C candidate rev-parse 'HEAD^{tree}')"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Trusted base: d1c1d49104d5c2cfe109f1a34c2e353f373e203f; exact candidate: daf19c9f230ff9d6e39ddac16e8e86e0cd8eb961; measured tree: $TREE_SHA"
          python3 trusted/scripts/workflow_capability_admission.py candidate \
            --candidate-tree-sha "$TREE_SHA" --measure
