name: Bot PR user approval

on:
  workflow_run:
    workflows:
      - Profile quality
      - CodeQL
      - Dependency review
      - Capability admission
      - CodeQL Autofix controller
      - Spotlight link sync
      - Dependabot controller
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: bot-pr-user-approval
  cancel-in-progress: true

jobs:
  approve:
    name: exact-head-portyu9-review
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: portyu9-review-identity
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Approve only exact green governed bot PRs as portyu9
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TOKEN: ${{ secrets.PORTYU9_BOT_REVIEW_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"

          if [ -z "${REVIEW_TOKEN:-}" ]; then
            echo "::error::PORTYU9_BOT_REVIEW_TOKEN is required in the portyu9-review-identity environment; autonomous user approval is disabled until this credential is configured."
            exit 1
          fi

          REVIEW_LOGIN="$(GH_TOKEN="$REVIEW_TOKEN" gh api user --jq .login)"
          test "$REVIEW_LOGIN" = "portyu9"

          MAIN_SHA="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]

          PR_PAGES="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls?state=open&base=main&per_page=100")"
          CANDIDATES="$(jq -c --arg repo "$TARGET_REPOSITORY" '
            [.[][] | select(
              .state == "open" and
              .draft == false and
              .base.ref == "main" and
              .head.repo.full_name == $repo and
              (
                (
                  .user.login == "dependabot[bot]" and
                  (.head.ref | test("^dependabot/github_actions/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*$"))
                ) or
                (
                  .user.login == "github-actions[bot]" and
                  (
                    (.head.ref | test("^codeql-autofix/alert-[1-9][0-9]*/run-[1-9][0-9]*$")) or
                    (.head.ref | test("^automation/spotlight-links/[0-9a-f]{64}$"))
                  )
                )
              )
            )] | sort_by(.number)
          ' <<<"$PR_PAGES")"
          CANDIDATE_COUNT="$(jq 'length' <<<"$CANDIDATES")"
          [[ "$CANDIDATE_COUNT" =~ ^[0-9]+$ ]]
          test "$CANDIDATE_COUNT" -le 20

          check_required_contexts() {
            local head="$1" lane="$2" name checks total count active failed
            local -a required=(validate-contracts integration-pinned-upstream analyze-actions analyze-python dependency-review)
            case "$lane" in
              spotlight|dependabot|codeql-autofix)
                required+=(trusted-capability-admission)
                ;;
              *)
                echo "ERROR: unknown governed bot lane: $lane" >&2
                return 1
                ;;
            esac
            for name in "${required[@]}"; do
              checks="$(gh api "repos/${TARGET_REPOSITORY}/commits/${head}/check-runs?app_id=15368&check_name=${name}&filter=latest&per_page=100")" || {
                echo "ERROR: failed to fetch required check context ${name} for ${head}." >&2
                return 1
              }
              total="$(jq -r '.total_count // empty' <<<"$checks")"
              count="$(jq '.check_runs | length' <<<"$checks")"
              [[ "$total" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid required-check total for ${name}." >&2; return 1; }
              [[ "$count" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid required-check count for ${name}." >&2; return 1; }
              [ "$total" = "$count" ] || { echo "ERROR: incomplete required-check response for ${name}." >&2; return 1; }
              if [ "$count" = "0" ]; then
                echo "Governed bot head ${head} is not ready: required check ${name} has not materialized yet."
                return 2
              fi
              jq -e --arg head "$head" 'all(.check_runs[]; .head_sha == $head and .app.id == 15368)' <<<"$checks" >/dev/null || {
                echo "ERROR: required check identity changed for ${name} on ${head}." >&2
                return 1
              }
              active="$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$checks")"
              [[ "$active" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid active required-check count for ${name}." >&2; return 1; }
              if [ "$active" -gt 0 ]; then
                echo "Governed bot head ${head} is not ready: required check ${name} is still active."
                return 2
              fi
              failed="$(jq '[.check_runs[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"$checks")"
              [[ "$failed" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid failed required-check count for ${name}." >&2; return 1; }
              if [ "$failed" -gt 0 ]; then
                echo "ERROR: required check ${name} completed unsuccessfully on ${head}." >&2
                return 1
              fi
            done
          }

          check_quiescent_runs() {
            local head="$1" head_ref="$2" runs total count active_profile unexpected_active
            runs="$(gh api "repos/${TARGET_REPOSITORY}/actions/runs?head_sha=${head}&per_page=100")" || {
              echo "ERROR: failed to fetch workflow-run quiescence for ${head}." >&2
              return 1
            }
            total="$(jq -r '.total_count // empty' <<<"$runs")"
            count="$(jq '.workflow_runs | length' <<<"$runs")"
            [[ "$total" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid workflow-run total for ${head}." >&2; return 1; }
            [[ "$count" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid workflow-run count for ${head}." >&2; return 1; }
            [ "$total" = "$count" ] || { echo "ERROR: incomplete workflow-run response for ${head}." >&2; return 1; }

            # Profile Quality intentionally remains active while trusted-governed-bot-review
            # waits for this exact reviewer. Exempt only that one canonical PR workflow run;
            # every other exact-head run must be quiescent before the review mutation.
            active_profile="$(jq --arg head "$head" --arg head_ref "$head_ref" --arg repo "$TARGET_REPOSITORY" '[
              .workflow_runs[] |
              select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") |
              select(
                .name == "Profile quality" and
                .path == ".github/workflows/profile-quality.yml" and
                .event == "pull_request" and
                .head_sha == $head and
                .head_branch == $head_ref and
                .repository.full_name == $repo and
                .head_repository.full_name == $repo
              )
            ] | length' <<<"$runs")"
            [[ "$active_profile" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid active Profile Quality run count for ${head}." >&2; return 1; }
            [ "$active_profile" -le 1 ] || {
              echo "ERROR: multiple canonical active Profile Quality runs exist for ${head}." >&2
              return 1
            }

            unexpected_active="$(jq --arg head "$head" --arg head_ref "$head_ref" --arg repo "$TARGET_REPOSITORY" '[
              .workflow_runs[] |
              select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") |
              select((
                .name == "Profile quality" and
                .path == ".github/workflows/profile-quality.yml" and
                .event == "pull_request" and
                .head_sha == $head and
                .head_branch == $head_ref and
                .repository.full_name == $repo and
                .head_repository.full_name == $repo
              ) | not)
            ] | length' <<<"$runs")"
            [[ "$unexpected_active" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid unexpected active workflow-run count for ${head}." >&2; return 1; }
            if [ "$unexpected_active" -gt 0 ]; then
              echo "Governed bot head ${head} is not ready: ${unexpected_active} non-Profile-Quality workflow run(s) remain active."
              return 2
            fi
          }

          wake_governed_lane_after_review() {
            local lane="$1" head_ref="$2"
            case "$lane" in
              dependabot)
                gh api --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/dependabot-controller.yml/dispatches" -f ref=main >/dev/null
                ;;
              codeql-autofix)
                gh api --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/codeql.yml/dispatches" -f ref=main >/dev/null
                ;;
              spotlight)
                echo "Spotlight parent workflow bounded-waits for the exact review; no post-review recovery wake is required."
                ;;
              *)
                echo "ERROR: cannot wake unknown governed bot lane: $lane" >&2
                return 1
                ;;
            esac
          }

          while IFS= read -r CANDIDATE; do
            [ -n "$CANDIDATE" ] || continue
            PR_NUMBER="$(jq -r .number <<<"$CANDIDATE")"
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]

            PR="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
            test "$(jq -r .state <<<"$PR")" = "open"
            test "$(jq -r .draft <<<"$PR")" = "false"
            test "$(jq -r .base.ref <<<"$PR")" = "main"
            if [ "$(jq -r .base.sha <<<"$PR")" != "$MAIN_SHA" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: base is stale relative to current main."
              continue
            fi
            test "$(jq -r .head.repo.full_name <<<"$PR")" = "$TARGET_REPOSITORY"

            HEAD_SHA="$(jq -r .head.sha <<<"$PR")"
            HEAD_REF="$(jq -r .head.ref <<<"$PR")"
            AUTHOR="$(jq -r .user.login <<<"$PR")"
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            LANE=""
            case "$AUTHOR" in
              'dependabot[bot]')
                [[ "$HEAD_REF" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
                LANE="dependabot"
                ;;
              'github-actions[bot]')
                if [[ "$HEAD_REF" =~ ^codeql-autofix/alert-[1-9][0-9]*/run-[1-9][0-9]*$ ]]; then
                  LANE="codeql-autofix"
                elif [[ "$HEAD_REF" =~ ^automation/spotlight-links/[0-9a-f]{64}$ ]]; then
                  LANE="spotlight"
                else
                  echo "ERROR: governed bot branch grammar changed for PR #${PR_NUMBER}" >&2
                  exit 1
                fi
                ;;
              *)
                echo "ERROR: governed bot author changed for PR #${PR_NUMBER}" >&2
                exit 1
                ;;
            esac

            if [ "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" != "$MAIN_SHA" ]; then
              echo "Current main moved during bot-review evaluation; ending this pass without approval."
              exit 0
            fi
            if [ "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)" != "$HEAD_SHA" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: head moved during review evaluation."
              continue
            fi

            THREADS="$(gh api graphql               -F owner=portyu9               -F repo=portyu9               -F number="$PR_NUMBER"               -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}pageInfo{hasNextPage}}}}}')"
            jq -e '
              (.errors == null) and
              (.data | type == "object") and
              (.data.repository | type == "object") and
              (.data.repository.pullRequest | type == "object") and
              (.data.repository.pullRequest.reviewThreads | type == "object") and
              (.data.repository.pullRequest.reviewThreads.pageInfo | type == "object") and
              (.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | type == "boolean") and
              (.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage == false) and
              (.data.repository.pullRequest.reviewThreads.nodes | type == "array") and
              all(
                .data.repository.pullRequest.reviewThreads.nodes[];
                (type == "object") and (.isResolved | type == "boolean")
              )
            ' <<<"$THREADS" >/dev/null
            test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$THREADS")" = "0"

            if check_required_contexts "$HEAD_SHA" "$LANE"; then
              :
            else
              READY_STATUS=$?
              if [ "$READY_STATUS" -eq 2 ]; then
                echo "Skipping governed bot PR #${PR_NUMBER}: lane-required checks are not ready yet."
                continue
              fi
              exit "$READY_STATUS"
            fi
            if check_quiescent_runs "$HEAD_SHA" "$HEAD_REF"; then
              :
            else
              READY_STATUS=$?
              if [ "$READY_STATUS" -eq 2 ]; then
                echo "Skipping governed bot PR #${PR_NUMBER}: exact head is not quiescent yet."
                continue
              fi
              exit "$READY_STATUS"
            fi

            REVIEW_MARKER="<!-- portyu9-bot-review:v2 base=${MAIN_SHA} head=${HEAD_SHA} -->"
            REVIEW_PAGES="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
            jq -e '
              (type == "array") and (length >= 1) and (length <= 20) and
              (all(.[]; (type == "array") and (length <= 100))) and
              (all(.[0:-1][]; length == 100)) and
              (all(.[][];
                (type == "object") and
                (.id | (type == "number") and (. == floor) and (. > 0)) and
                (.user | (type == "object") and (.login | (type == "string") and (length > 0)))) and
                (.state | (type == "string") and
                  (. == "APPROVED" or . == "CHANGES_REQUESTED" or . == "COMMENTED" or . == "DISMISSED" or . == "PENDING")) and
                (.commit_id == null or (.commit_id | (type == "string") and test("^[0-9a-f]{40}$"))) and
                (.body == null or (.body | type == "string"))
              )) and
              (([.[][] | .id] | length) == ([.[][] | .id] | unique | length))
            ' <<<"$REVIEW_PAGES" >/dev/null || {
              echo "ERROR: malformed or incomplete paginated pull-review evidence." >&2
              exit 1
            }
            REVIEWS="$(jq -c '[.[][]]' <<<"$REVIEW_PAGES")"
            MARKER_REVIEW_COUNT="$(jq --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and ((.body // "") | contains($marker)))] | length' <<<"$REVIEWS")"
            LATEST_MANUAL_DECISIVE_STATE="$(jq -r --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and (.state == "APPROVED" or .state == "CHANGES_REQUESTED") and (((.body // "") | contains($marker)) | not))] | sort_by(.id) | if length == 0 then "" else .[-1].state end' <<<"$REVIEWS")"
            [[ "$MARKER_REVIEW_COUNT" =~ ^[0-9]+$ ]]
            test "$MARKER_REVIEW_COUNT" -le 1 || {
              echo "ERROR: governed bot PR #${PR_NUMBER} has multiple marker-bound portyu9 reviews for the exact head." >&2
              exit 1
            }
            if [ "$LATEST_MANUAL_DECISIVE_STATE" = "CHANGES_REQUESTED" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: a later manual exact-head CHANGES_REQUESTED veto by portyu9 is active."
              continue
            fi
            if [ "$MARKER_REVIEW_COUNT" = "1" ]; then
              MARKER_STATE="$(jq -r --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and ((.body // "") | contains($marker)))] | sort_by(.id) | .[-1].state' <<<"$REVIEWS")"
              if [ "$MARKER_STATE" = "APPROVED" ]; then
                echo "PR #${PR_NUMBER} already has an exact-base/head marker-bound portyu9 approval."
                wake_governed_lane_after_review "$LANE" "$HEAD_REF"
                echo "Re-dispatched idempotent post-review convergence wake for governed bot PR #${PR_NUMBER} (${LANE})."
              else
                echo "Skipping governed bot PR #${PR_NUMBER}: the exact marker-bound portyu9 review was revoked or dismissed and will not be auto-reissued."
              fi
              continue
            fi

            PR_NOW="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
            if [ "$(jq -r .state <<<"$PR_NOW")" != "open" ] ||
               [ "$(jq -r .draft <<<"$PR_NOW")" != "false" ] ||
               [ "$(jq -r .base.sha <<<"$PR_NOW")" != "$MAIN_SHA" ] ||
               [ "$(jq -r .head.sha <<<"$PR_NOW")" != "$HEAD_SHA" ] ||
               [ "$(jq -r .head.ref <<<"$PR_NOW")" != "$HEAD_REF" ] ||
               [ "$(jq -r .head.repo.full_name <<<"$PR_NOW")" != "$TARGET_REPOSITORY" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: exact PR identity changed before approval."
              continue
            fi
            if [ "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" != "$MAIN_SHA" ]; then
              echo "Current main moved before final bot-review authorization; ending this pass without approval."
              exit 0
            fi
            if [ "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)" != "$HEAD_SHA" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: head ref changed before approval."
              continue
            fi
            if check_required_contexts "$HEAD_SHA" "$LANE"; then
              :
            else
              READY_STATUS=$?
              if [ "$READY_STATUS" -eq 2 ]; then
                echo "Skipping governed bot PR #${PR_NUMBER}: lane-required checks changed back to not-ready before approval."
                continue
              fi
              exit "$READY_STATUS"
            fi
            if check_quiescent_runs "$HEAD_SHA" "$HEAD_REF"; then
              :
            else
              READY_STATUS=$?
              if [ "$READY_STATUS" -eq 2 ]; then
                echo "Skipping governed bot PR #${PR_NUMBER}: exact head became active again before approval."
                continue
              fi
              exit "$READY_STATUS"
            fi

            REVIEW_PAGES="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"

            jq -e '

              (type == "array") and (length >= 1) and (length <= 20) and

              (all(.[]; (type == "array") and (length <= 100))) and

              (all(.[0:-1][]; length == 100)) and

              (all(.[][];

                (type == "object") and

                (.id | (type == "number") and (. == floor) and (. > 0)) and

                (.user | (type == "object") and (.login | (type == "string") and (length > 0)))) and

                (.state | (type == "string") and

                  (. == "APPROVED" or . == "CHANGES_REQUESTED" or . == "COMMENTED" or . == "DISMISSED" or . == "PENDING")) and

                (.commit_id == null or (.commit_id | (type == "string") and test("^[0-9a-f]{40}$"))) and

                (.body == null or (.body | type == "string"))

              )) and

              (([.[][] | .id] | length) == ([.[][] | .id] | unique | length))

            ' <<<"$REVIEW_PAGES" >/dev/null || {

              echo "ERROR: malformed or incomplete paginated pull-review evidence." >&2

              exit 1

            }

            REVIEWS="$(jq -c '[.[][]]' <<<"$REVIEW_PAGES")"
            RACE_MARKER_REVIEW_COUNT="$(jq --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and ((.body // "") | contains($marker)))] | length' <<<"$REVIEWS")"
            RACE_MANUAL_DECISIVE_STATE="$(jq -r --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and (.state == "APPROVED" or .state == "CHANGES_REQUESTED") and (((.body // "") | contains($marker)) | not))] | sort_by(.id) | if length == 0 then "" else .[-1].state end' <<<"$REVIEWS")"
            [[ "$RACE_MARKER_REVIEW_COUNT" =~ ^[0-9]+$ ]]
            if [ "$RACE_MARKER_REVIEW_COUNT" -gt 0 ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: a marker-bound portyu9 review appeared before the review mutation."
              continue
            fi
            if [ "$RACE_MANUAL_DECISIVE_STATE" = "CHANGES_REQUESTED" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: a manual exact-head CHANGES_REQUESTED veto appeared before the review mutation."
              continue
            fi

            printf -v BODY '%s\n%s' "$REVIEW_MARKER" "Automated exact-base/head approval by portyu9 after all lane-required protected gates completed successfully for base \`${MAIN_SHA}\` and head \`${HEAD_SHA}\`. Repository bot automation may continue its governed merge path."
            jq -n --arg body "$BODY" --arg commit "$HEAD_SHA"               '{event:"APPROVE",body:$body,commit_id:$commit}' > review-request.json
            REVIEW_RESPONSE="$(GH_TOKEN="$REVIEW_TOKEN" gh api --method POST               "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews"               --input review-request.json)"
            test "$(jq -r .state <<<"$REVIEW_RESPONSE")" = "APPROVED"
            test "$(jq -r .user.login <<<"$REVIEW_RESPONSE")" = "portyu9"
            test "$(jq -r .commit_id <<<"$REVIEW_RESPONSE")" = "$HEAD_SHA"
            jq -e --arg body "$BODY" '.body == $body' <<<"$REVIEW_RESPONSE" >/dev/null
            echo "Submitted exact-base/head marker-bound portyu9 approval for governed bot PR #${PR_NUMBER} at ${HEAD_SHA}."
            wake_governed_lane_after_review "$LANE" "$HEAD_REF"
            echo "Dispatched event-driven post-review convergence wake for governed bot PR #${PR_NUMBER} (${LANE})."
          done < <(jq -c '.[]' <<<"$CANDIDATES")
