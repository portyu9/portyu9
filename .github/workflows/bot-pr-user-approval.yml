name: Bot PR user approval

on:
  workflow_run:
    workflows:
      - Profile quality
      - CodeQL
      - Dependency review
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: bot-pr-user-approval-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'spotlight-dispatch' }}
  cancel-in-progress: true

jobs:
  approve:
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
           github.event.workflow_run.event == 'pull_request' &&
           github.event.workflow_run.head_branch != 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           (startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/') ||
            startsWith(github.event.workflow_run.head_branch, 'codeql-autofix/alert-') ||
            startsWith(github.event.workflow_run.head_branch, 'automation/spotlight-links/'))) ||
          (github.event_name == 'workflow_dispatch' &&
           github.actor == 'github-actions[bot]' &&
           github.ref == 'refs/heads/main') }}
    name: exact-head-portyu9-review
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: portyu9-review-identity
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Approve only exact green governed bot PRs as portyu9
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TOKEN: ${{ secrets.PORTYU9_BOT_REVIEW_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
          WAKE_EVENT_NAME: ${{ github.event_name }}
          WAKE_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          WAKE_HEAD_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          case "$WAKE_EVENT_NAME" in
            workflow_run)
              [[ "$WAKE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              test -n "$WAKE_HEAD_REF"
              test "$WAKE_HEAD_REF" != "main"
              ;;
            workflow_dispatch)
              # Deliberate trusted-main wake carries no candidate payload. Candidate identity
              # is independently discovered and must resolve to exactly one canonical
              # current-main Spotlight PR before any review mutation can occur.
              ;;
            *)
              echo "ERROR: unsupported governed reviewer wake event: ${WAKE_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if [ -z "${REVIEW_TOKEN:-}" ]; then
            echo "::error::PORTYU9_BOT_REVIEW_TOKEN is required in the portyu9-review-identity environment; autonomous user approval is disabled until this credential is configured."
            exit 1
          fi

          validate_git_ref_object() {
            local response="$1" expected_branch="$2"
            jq -e --arg ref "refs/heads/${expected_branch}" '
              (type == "object") and
              (.ref | type == "string" and . == $ref) and
              (.object | type == "object" and
                (.type | type == "string" and . == "commit") and
                (.sha | type == "string" and test("^[0-9a-f]{40}$")) and
                (.url | type == "string" and length > 0))
            ' <<<"$response" >/dev/null
          }

          REVIEW_IDENTITY_RESPONSE="$(GH_TOKEN="$REVIEW_TOKEN" gh api user)"
          jq -e '
            (type == "object") and
            (.login | type == "string" and . == "portyu9")
          ' <<<"$REVIEW_IDENTITY_RESPONSE" >/dev/null || {
            echo "ERROR: malformed or mismatched portyu9 review-token identity response." >&2
            exit 1
          }
          REVIEW_LOGIN="$(jq -r .login <<<"$REVIEW_IDENTITY_RESPONSE")"
          test "$REVIEW_LOGIN" = "portyu9"

          MAIN_REF_RESPONSE="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main")"
          validate_git_ref_object "$MAIN_REF_RESPONSE" "main" || {
            echo "ERROR: malformed governed reviewer initial main-ref evidence." >&2
            exit 1
          }
          MAIN_SHA="$(jq -r .object.sha <<<"$MAIN_REF_RESPONSE")"
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          PR_PAGES="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls?state=open&base=main&per_page=100")"
          jq -e '
            (type == "array") and (length >= 1) and (length <= 30) and
            (all(.[]; (type == "array") and (length <= 100))) and
            (all(.[0:-1][]; (length == 100))) and
            (all(.[][];
              type == "object" and
              (.number | type == "number" and . == floor and . > 0) and
              (.user | (type == "object") and (.login | (type == "string") and (length > 0))) and
              (.state == "open") and
              (.draft | type == "boolean") and
              (.base | type == "object" and
                (.ref == "main") and
                (.sha | type == "string" and test("^[0-9a-f]{40}$"))) and
              (.head | type == "object" and
                (.ref | type == "string" and length > 0) and
                (.sha | type == "string" and test("^[0-9a-f]{40}$")) and
                (.repo | type == "object" and
                  (.full_name | type == "string" and length > 0))) and
              (.title | type == "string" and length > 0) and
              (has("body")) and
              (.body == null or ((.body | type) == "string"))
            )) and
            (([.[][] | .number] | length) == ([.[][] | .number] | unique | length))
          ' <<<"$PR_PAGES" >/dev/null || {
            echo "ERROR: malformed or incomplete paginated open-PR evidence." >&2
            exit 1
          }
          CANDIDATES="$(jq -c --arg repo "$TARGET_REPOSITORY" --arg main "$MAIN_SHA" --arg wake_mode "$WAKE_EVENT_NAME" --arg wake_head "$WAKE_HEAD_SHA" --arg wake_ref "$WAKE_HEAD_REF" '
            [.[][] | select(
              .state == "open" and
              .draft == false and
              .base.ref == "main" and
              .base.sha == $main and
              .head.repo.full_name == $repo and
              (
                if $wake_mode == "workflow_dispatch" then
                  .user.login == "github-actions[bot]" and
                  (.head.ref | test("^automation/spotlight-links/[0-9a-f]{64}$")) and
                  .title == "chore: sync rotating Spotlight links" and
                  .body == "Automation-managed README-only update. Direct Spotlight repository/workflow links and immutable card snapshot are derived from the validated published evidence. Main protection and all required checks remain in force."
                else
                  .head.sha == $wake_head and
                  .head.ref == $wake_ref and
                  (
                    (
                      .user.login == "dependabot[bot]" and
                      (.head.ref | test("^dependabot/github_actions/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*$"))
                    ) or
                    (
                      .user.login == "github-actions[bot]" and
                      (
                        (.head.ref | test("^codeql-autofix/alert-[1-9][0-9]*/run-[1-9][0-9]*$")) or
                        (.head.ref | test("^automation/spotlight-links/[0-9a-f]{64}$"))
                      )
                    )
                  )
                end
              )
            )] | sort_by(.number)
          ' <<<"$PR_PAGES")"
          CANDIDATE_COUNT="$(jq 'length' <<<"$CANDIDATES")"
          [[ "$CANDIDATE_COUNT" =~ ^[0-9]+$ ]]
          if [ "$WAKE_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CANDIDATE_COUNT" = "1" || {
              echo "ERROR: trusted-main Spotlight reviewer wake requires exactly one current-main candidate; observed ${CANDIDATE_COUNT}." >&2
              exit 1
            }
          else
            test "$CANDIDATE_COUNT" -le 1
          fi

          validate_governed_pr_object() {
            local pr="$1" number="$2"
            jq -e --argjson number "$number" '
              (type == "object") and
              (.number | type == "number" and . == floor and . > 0 and . == $number) and
              (.user | (type == "object") and (.login | (type == "string") and length > 0)) and
              (.state == "open") and
              (.draft | type == "boolean") and
              (.base | type == "object" and
                (.ref | type == "string" and length > 0) and
                (.sha | type == "string" and test("^[0-9a-f]{40}$"))) and
              (.head | type == "object" and
                (.ref | type == "string" and length > 0) and
                (.sha | type == "string" and test("^[0-9a-f]{40}$")) and
                (.repo | type == "object" and
                  (.full_name | type == "string" and length > 0)))
            ' <<<"$pr" >/dev/null
          }

          check_required_contexts() {
            local head="$1" lane="$2" checks total count name active failed
            local -a required=(validate-contracts integration-pinned-upstream analyze-actions analyze-python dependency-review)
            case "$lane" in
              spotlight|dependabot|codeql-autofix)
                required+=(trusted-capability-admission)
                ;;
              *)
                echo "ERROR: unknown governed bot lane: $lane" >&2
                return 1
                ;;
            esac

            checks="$(gh api "repos/${TARGET_REPOSITORY}/commits/${head}/check-runs?app_id=15368&filter=latest&per_page=100")" || {
              echo "ERROR: failed to fetch exact-head GitHub Actions check snapshot for ${head}." >&2
              return 1
            }
            jq -e --arg head "$head" '
              (type == "object") and
              (.total_count | type == "number" and . == floor and . >= 0 and . <= 100) and
              (.check_runs | type == "array" and length <= 100) and
              (.total_count == (.check_runs | length)) and
              (all(.check_runs[];
                type == "object" and
                (.id | type == "number" and . == floor and . > 0) and
                (.name | type == "string" and length > 0) and
                (.head_sha == $head) and
                (.app | type == "object" and .id == 15368) and
                (.status | type == "string" and
                  (. == "queued" or . == "in_progress" or . == "requested" or
                   . == "waiting" or . == "pending" or . == "completed")) and
                (if .status == "completed"
                 then (.conclusion | type == "string" and length > 0)
                 else .conclusion == null
                 end)
              )) and
              (([.check_runs[] | .id] | length) == ([.check_runs[] | .id] | unique | length))
            ' <<<"$checks" >/dev/null || {
              echo "ERROR: malformed or incomplete exact-head GitHub Actions check snapshot for ${head}." >&2
              return 1
            }
            total="$(jq -r '.total_count // empty' <<<"$checks")"
            count="$(jq '.check_runs | length' <<<"$checks")"
            [[ "$total" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid exact-head check total." >&2; return 1; }
            [[ "$count" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid exact-head check count." >&2; return 1; }
            [ "$total" = "$count" ] || { echo "ERROR: incomplete exact-head check snapshot." >&2; return 1; }

            for name in "${required[@]}"; do
              count="$(jq --arg name "$name" '[.check_runs[] | select(.name == $name)] | length' <<<"$checks")"
              [[ "$count" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid required-check count for ${name}." >&2; return 1; }
              if [ "$count" = "0" ]; then
                echo "Governed bot head ${head} is not ready: required check ${name} has not materialized yet."
                return 2
              fi
              [ "$count" = "1" ] || {
                echo "ERROR: required check ${name} is not singleton in the exact-head snapshot." >&2
                return 1
              }
              active="$(jq --arg name "$name" '[.check_runs[] | select(.name == $name and .status != "completed")] | length' <<<"$checks")"
              [[ "$active" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid active required-check count for ${name}." >&2; return 1; }
              if [ "$active" -gt 0 ]; then
                echo "Governed bot head ${head} is not ready: required check ${name} is still active."
                return 2
              fi
              failed="$(jq --arg name "$name" '[.check_runs[] | select(.name == $name and .status == "completed" and .conclusion != "success")] | length' <<<"$checks")"
              [[ "$failed" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid failed required-check count for ${name}." >&2; return 1; }
              if [ "$failed" -gt 0 ]; then
                echo "ERROR: required check ${name} completed unsuccessfully on ${head}." >&2
                return 1
              fi
            done
          }

          check_quiescent_runs() {
            local head="$1" head_ref="$2" runs total count active_profile unexpected_active
            runs="$(gh api "repos/${TARGET_REPOSITORY}/actions/runs?head_sha=${head}&per_page=100")" || {
              echo "ERROR: failed to fetch workflow-run quiescence for ${head}." >&2
              return 1
            }
            jq -e --arg head "$head" '
              (type == "object") and
              (.total_count | type == "number" and . == floor and . >= 0 and . <= 100) and
              (.workflow_runs | type == "array" and length <= 100) and
              (.total_count == (.workflow_runs | length)) and
              (all(.workflow_runs[];
                type == "object" and
                (.id | (type == "number") and . == floor and . > 0) and
                (.name | type == "string" and length > 0) and
                (.path | type == "string" and length > 0) and
                (.event | type == "string" and length > 0) and
                (.head_sha == $head) and
                (.head_branch | type == "string" and length > 0) and
                (.repository | type == "object" and
                  (.full_name | type == "string" and length > 0)) and
                (.head_repository | type == "object" and
                  (.full_name | type == "string" and length > 0)) and
                (.status | type == "string" and
                  (. == "queued" or . == "in_progress" or . == "requested" or
                   . == "waiting" or . == "pending" or . == "completed"))
              )) and
              (([.workflow_runs[] | .id] | length) == ([.workflow_runs[] | .id] | unique | length))
            ' <<<"$runs" >/dev/null || {
              echo "ERROR: malformed or incomplete workflow-run quiescence evidence for ${head}." >&2
              return 1
            }
            total="$(jq -r '.total_count // empty' <<<"$runs")"
            count="$(jq '.workflow_runs | length' <<<"$runs")"
            [[ "$total" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid workflow-run total for ${head}." >&2; return 1; }
            [[ "$count" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid workflow-run count for ${head}." >&2; return 1; }
            [ "$total" = "$count" ] || { echo "ERROR: incomplete workflow-run response for ${head}." >&2; return 1; }

            # The exact Profile Quality run may still be active while this event-driven reviewer
            # observes prerequisite checks. Exempt only that one canonical PR workflow run;
            # every other exact-head run must be quiescent before the review mutation.
            active_profile="$(jq --arg head "$head" --arg head_ref "$head_ref" --arg repo "$TARGET_REPOSITORY" '[
              .workflow_runs[] |
              select(.status != "completed") |
              select(
                .name == "Profile quality" and
                .path == ".github/workflows/profile-quality.yml" and
                .event == "pull_request" and
                .head_sha == $head and
                .head_branch == $head_ref and
                .repository.full_name == $repo and
                .head_repository.full_name == $repo
              )
            ] | length' <<<"$runs")"
            [[ "$active_profile" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid active Profile Quality run count for ${head}." >&2; return 1; }
            [ "$active_profile" -le 1 ] || {
              echo "ERROR: multiple canonical active Profile Quality runs exist for ${head}." >&2
              return 1
            }

            unexpected_active="$(jq --arg head "$head" --arg head_ref "$head_ref" --arg repo "$TARGET_REPOSITORY" '[
              .workflow_runs[] |
              select(.status != "completed") |
              select((
                .name == "Profile quality" and
                .path == ".github/workflows/profile-quality.yml" and
                .event == "pull_request" and
                .head_sha == $head and
                .head_branch == $head_ref and
                .repository.full_name == $repo and
                .head_repository.full_name == $repo
              ) | not)
            ] | length' <<<"$runs")"
            [[ "$unexpected_active" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid unexpected active workflow-run count for ${head}." >&2; return 1; }
            if [ "$unexpected_active" -gt 0 ]; then
              echo "Governed bot head ${head} is not ready: ${unexpected_active} non-Profile-Quality workflow run(s) remain active."
              return 2
            fi
          }

          prepare_review_retry_history() {
            local attempt_run expected_prior
            [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_RUN_ATTEMPT" -le 20
            : > "$RUNNER_TEMP/bot-review-prior-attempts.ndjson"
            for HISTORY_ATTEMPT in $(seq 1 20); do
              if [ "$HISTORY_ATTEMPT" -ge "$GITHUB_RUN_ATTEMPT" ]; then
                break
              fi
              attempt_run="$(gh api "repos/${TARGET_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${HISTORY_ATTEMPT}")"
              jq -e \
                --arg repo "$TARGET_REPOSITORY" \
                --arg source "$GITHUB_SHA" \
                --arg event "$WAKE_EVENT_NAME" \
                --argjson run "$GITHUB_RUN_ID" \
                --argjson attempt "$HISTORY_ATTEMPT" '
                  .id == $run and
                  .run_attempt == $attempt and
                  .name == "Bot PR user approval" and
                  .path == ".github/workflows/bot-pr-user-approval.yml" and
                  .event == $event and
                  .head_branch == "main" and
                  .head_sha == $source and
                  .repository.full_name == $repo and
                  .head_repository.full_name == $repo and
                  (.check_suite_id | type == "number" and . == floor and . > 0) and
                  .status == "completed" and
                  (.conclusion == "action_required" or
                   .conclusion == "cancelled" or
                   .conclusion == "failure" or
                   .conclusion == "neutral" or
                   .conclusion == "skipped" or
                   .conclusion == "stale" or
                   .conclusion == "startup_failure" or
                   .conclusion == "success" or
                   .conclusion == "timed_out") and
                  (.actor.login | type == "string" and length > 0) and
                  (.triggering_actor.login | type == "string" and length > 0)
                ' <<<"$attempt_run" >/dev/null
              jq -c '{
                attempt:.run_attempt,
                checkSuiteId:.check_suite_id,
                status:.status,
                conclusion:.conclusion,
                actor:.actor.login,
                triggeringActor:.triggering_actor.login
              }' <<<"$attempt_run" >> "$RUNNER_TEMP/bot-review-prior-attempts.ndjson"
              sleep 1
            done
            jq -s -c 'sort_by(.attempt)' "$RUNNER_TEMP/bot-review-prior-attempts.ndjson" > "$RUNNER_TEMP/bot-review-prior-attempts.json"
            expected_prior=$((GITHUB_RUN_ATTEMPT - 1))
            test "$(jq 'length' "$RUNNER_TEMP/bot-review-prior-attempts.json")" = "$expected_prior"
            jq -e --argjson current "$GITHUB_RUN_ATTEMPT" '
              [.[].attempt] == (if $current == 1 then [] else [range(1; $current)] end)
            ' "$RUNNER_TEMP/bot-review-prior-attempts.json" >/dev/null
          }

          rerun_governed_review_gate_if_needed() {
            local head="$1" head_ref="$2" review_submitted_at="$3"
            local checks count gate_id gate_status gate_conclusion gate_suite gate_details
            local gate_run_id gate_job_id run job run_attempt job_attempt job_started
            local rerun_response rerun_status rerun_status_line observed observed_id observed_status observed_conclusion

            jq -e -n --arg ts "$review_submitted_at" '$ts | fromdateiso8601 | type == "number"' >/dev/null || {
              echo "ERROR: exact marker-bound review has malformed submitted_at evidence." >&2
              return 1
            }

            checks="$(gh api "repos/${TARGET_REPOSITORY}/commits/${head}/check-runs?app_id=15368&check_name=trusted-governed-bot-review&filter=latest&per_page=100")" || {
              echo "ERROR: failed to fetch exact governed-review gate check for ${head}." >&2
              return 1
            }
            jq -e --arg head "$head" '
              (type == "object") and
              (.total_count | type == "number" and . == floor and . >= 0 and . <= 1) and
              (.check_runs | type == "array" and length <= 1) and
              (.total_count == (.check_runs | length)) and
              (all(.check_runs[];
                type == "object" and
                (.id | type == "number" and . == floor and . > 0) and
                .name == "trusted-governed-bot-review" and
                .head_sha == $head and
                (.app | type == "object" and .id == 15368) and
                (.check_suite | type == "object" and (.id | type == "number" and . == floor and . > 0)) and
                (.details_url | type == "string" and length > 0) and
                (.status | type == "string" and
                  (. == "queued" or . == "in_progress" or . == "requested" or
                   . == "waiting" or . == "pending" or . == "completed")) and
                (if .status == "completed"
                 then (.conclusion | type == "string" and length > 0)
                 else .conclusion == null
                 end)
              ))
            ' <<<"$checks" >/dev/null || {
              echo "ERROR: malformed or ambiguous governed-review gate check evidence for ${head}." >&2
              return 1
            }
            count="$(jq -r .total_count <<<"$checks")"
            if [ "$count" = "0" ]; then
              echo "Governed review gate has not materialized yet for ${head}; no rerun mutation is eligible."
              return 0
            fi

            gate_id="$(jq -r '.check_runs[0].id' <<<"$checks")"
            gate_status="$(jq -r '.check_runs[0].status' <<<"$checks")"
            gate_conclusion="$(jq -r '.check_runs[0].conclusion // ""' <<<"$checks")"
            gate_suite="$(jq -r '.check_runs[0].check_suite.id' <<<"$checks")"
            gate_details="$(jq -r '.check_runs[0].details_url' <<<"$checks")"
            [[ "$gate_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$gate_suite" =~ ^[1-9][0-9]*$ ]]
            if [ "$gate_status" != "completed" ]; then
              echo "Governed review gate ${gate_id} is still ${gate_status}; no rerun mutation is eligible."
              return 0
            fi
            if [ "$gate_conclusion" = "success" ]; then
              echo "Governed review gate ${gate_id} is already successful; no rerun mutation is needed."
              return 0
            fi

            if [[ "$gate_details" =~ ^https://github.com/portyu9/portyu9/actions/runs/([1-9][0-9]*)/job/([1-9][0-9]*)$ ]]; then
              gate_run_id="${BASH_REMATCH[1]}"
              gate_job_id="${BASH_REMATCH[2]}"
            else
              echo "ERROR: governed review gate details URL is not an exact portyu9 Actions run/job URL." >&2
              return 1
            fi
            test "$gate_job_id" = "$gate_id" || {
              echo "ERROR: governed review gate check/job identity mismatch." >&2
              return 1
            }

            run="$(gh api "repos/${TARGET_REPOSITORY}/actions/runs/${gate_run_id}")" || {
              echo "ERROR: failed to fetch governed review gate parent run ${gate_run_id}." >&2
              return 1
            }
            jq -e --argjson run "$gate_run_id" --argjson suite "$gate_suite" --arg head "$head" --arg head_ref "$head_ref" --arg repo "$TARGET_REPOSITORY" '
              (type == "object") and
              (.id == $run) and
              (.name == "Profile quality") and
              (.path == ".github/workflows/profile-quality.yml") and
              (.event == "pull_request") and
              (.head_sha == $head) and
              (.head_branch == $head_ref) and
              (.repository | type == "object" and .full_name == $repo) and
              (.head_repository | type == "object" and .full_name == $repo) and
              (.check_suite_id == $suite) and
              (.run_attempt | type == "number" and . == floor and . > 0) and
              (.status == "completed") and
              (.conclusion | type == "string" and length > 0)
            ' <<<"$run" >/dev/null || {
              echo "ERROR: governed review gate parent run identity is malformed or mismatched." >&2
              return 1
            }

            job="$(gh api "repos/${TARGET_REPOSITORY}/actions/jobs/${gate_job_id}")" || {
              echo "ERROR: failed to fetch governed review gate job ${gate_job_id}." >&2
              return 1
            }
            jq -e --argjson job "$gate_job_id" --argjson run "$gate_run_id" --arg head "$head" --arg conclusion "$gate_conclusion" --arg repo "$TARGET_REPOSITORY" '
              (type == "object") and
              (.id == $job) and
              (.run_id == $run) and
              (.head_sha == $head) and
              (.name == "trusted-governed-bot-review") and
              (.workflow_name == "Profile quality") and
              (.run_attempt | type == "number" and . == floor and . > 0) and
              (.check_run_url == ("https://api.github.com/repos/" + $repo + "/check-runs/" + ($job | tostring))) and
              (.status == "completed") and
              (.conclusion == $conclusion) and
              (.started_at | type == "string" and length > 0) and
              (.completed_at | type == "string" and length > 0)
            ' <<<"$job" >/dev/null || {
              echo "ERROR: governed review gate job identity is malformed or mismatched." >&2
              return 1
            }
            run_attempt="$(jq -r .run_attempt <<<"$run")"
            job_attempt="$(jq -r .run_attempt <<<"$job")"
            test "$job_attempt" = "$run_attempt" || {
              echo "ERROR: governed review gate run/job attempt mismatch." >&2
              return 1
            }
            job_started="$(jq -r .started_at <<<"$job")"
            if ! jq -e -n --arg started "$job_started" --arg submitted "$review_submitted_at" '($started | fromdateiso8601) < ($submitted | fromdateiso8601)' >/dev/null; then
              echo "Governed review gate job ${gate_job_id} started after the exact approval existed; refusing another autonomous rerun."
              return 0
            fi

            rerun_response="$RUNNER_TEMP/governed-review-gate-rerun-http-response.txt"
            set +e
            gh api --include --method POST "repos/${TARGET_REPOSITORY}/actions/jobs/${gate_job_id}/rerun" >"$rerun_response" 2>"$RUNNER_TEMP/governed-review-gate-rerun-error.txt"
            rerun_status=$?
            set -e
            if [ "$rerun_status" -eq 0 ]; then
              rerun_status_line="$(head -n 1 "$rerun_response" | tr -d '\r')"
              [[ "$rerun_status_line" =~ ^HTTP/[0-9.]+[[:space:]]+201([[:space:]]|$) ]] || {
                echo "ERROR: governed review gate job rerun returned unexpected status: ${rerun_status_line}" >&2
                return 1
              }
              echo "Re-ran exact pre-approval governed review gate job ${gate_job_id} once after exact marker approval."
              return 0
            fi

            sleep 1
            observed="$(gh api "repos/${TARGET_REPOSITORY}/commits/${head}/check-runs?app_id=15368&check_name=trusted-governed-bot-review&filter=latest&per_page=100")" || {
              echo "ERROR: ambiguous gate-rerun mutation could not be reconciled by exact check observation." >&2
              return 1
            }
            jq -e --arg head "$head" '
              (type == "object") and
              (.total_count == 1) and
              (.check_runs | type == "array" and length == 1) and
              (.check_runs[0] | type == "object" and
                (.id | type == "number" and . == floor and . > 0) and
                .name == "trusted-governed-bot-review" and
                .head_sha == $head and
                (.app | type == "object" and .id == 15368) and
                (.status | type == "string") and
                (if .status == "completed" then .conclusion == "success" else .conclusion == null end))
            ' <<<"$observed" >/dev/null || {
              echo "ERROR: ambiguous gate-rerun mutation did not produce valid exact-head observation." >&2
              return 1
            }
            observed_id="$(jq -r '.check_runs[0].id' <<<"$observed")"
            observed_status="$(jq -r '.check_runs[0].status' <<<"$observed")"
            observed_conclusion="$(jq -r '.check_runs[0].conclusion // ""' <<<"$observed")"
            if [ "$observed_id" != "$gate_id" ] &&
               { [ "$observed_status" != "completed" ] || [ "$observed_conclusion" = "success" ]; }; then
              echo "Observed a new exact governed-review check after ambiguous rerun transport; refusing duplicate POST."
              return 0
            fi
            echo "ERROR: governed review gate rerun transport failed and exact observation did not prove acceptance; refusing duplicate POST." >&2
            return 1
          }

          wake_governed_lane_after_review() {
            local lane="$1" head_ref="$2" wake_response wake_status_line
            case "$lane" in
              dependabot)
                wake_response="$(gh api --include --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/dependabot-controller.yml/dispatches" -f ref=main)"
                ;;
              codeql-autofix)
                wake_response="$(gh api --include --method POST "repos/${TARGET_REPOSITORY}/actions/workflows/codeql.yml/dispatches" -f ref=main)"
                ;;
              spotlight)
                echo "Spotlight parent workflow bounded-waits for the exact review; no post-review recovery wake is required."
                return 0
                ;;
              *)
                echo "ERROR: cannot wake unknown governed bot lane: $lane" >&2
                return 1
                ;;
            esac
            wake_status_line="$(head -n 1 <<<"$wake_response" | tr -d '\r')"
            [[ "$wake_status_line" =~ ^HTTP/[0-9.]+[[:space:]]+204([[:space:]]|$) ]] || {
              echo "ERROR: governed ${lane} recovery dispatch returned unexpected status: ${wake_status_line}" >&2
              return 1
            }
          }

          prepare_review_retry_history

          while IFS= read -r CANDIDATE; do
            [ -n "$CANDIDATE" ] || continue
            PR_NUMBER="$(jq -r .number <<<"$CANDIDATE")"
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]

            PR="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
            validate_governed_pr_object "$PR" "$PR_NUMBER" || {
              echo "ERROR: malformed governed bot PR evidence for #${PR_NUMBER}." >&2
              exit 1
            }
            test "$(jq -r .state <<<"$PR")" = "open"
            test "$(jq -r .draft <<<"$PR")" = "false"
            test "$(jq -r .base.ref <<<"$PR")" = "main"
            if [ "$(jq -r .base.sha <<<"$PR")" != "$MAIN_SHA" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: base is stale relative to current main."
              continue
            fi
            test "$(jq -r .head.repo.full_name <<<"$PR")" = "$TARGET_REPOSITORY"

            HEAD_SHA="$(jq -r .head.sha <<<"$PR")"
            HEAD_REF="$(jq -r .head.ref <<<"$PR")"
            AUTHOR="$(jq -r .user.login <<<"$PR")"
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            LANE=""
            case "$AUTHOR" in
              'dependabot[bot]')
                [[ "$HEAD_REF" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
                LANE="dependabot"
                ;;
              'github-actions[bot]')
                if [[ "$HEAD_REF" =~ ^codeql-autofix/alert-[1-9][0-9]*/run-[1-9][0-9]*$ ]]; then
                  LANE="codeql-autofix"
                elif [[ "$HEAD_REF" =~ ^automation/spotlight-links/[0-9a-f]{64}$ ]]; then
                  LANE="spotlight"
                else
                  echo "ERROR: governed bot branch grammar changed for PR #${PR_NUMBER}" >&2
                  exit 1
                fi
                ;;
              *)
                echo "ERROR: governed bot author changed for PR #${PR_NUMBER}" >&2
                exit 1
                ;;
            esac

            CURRENT_MAIN_REF_RESPONSE="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main")"
            validate_git_ref_object "$CURRENT_MAIN_REF_RESPONSE" "main" || {
              echo "ERROR: malformed governed reviewer current-main ref evidence." >&2
              exit 1
            }
            if [ "$(jq -r .object.sha <<<"$CURRENT_MAIN_REF_RESPONSE")" != "$MAIN_SHA" ]; then
              echo "Current main moved during bot-review evaluation; ending this pass without approval."
              exit 0
            fi
            CURRENT_HEAD_REF_RESPONSE="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}")"
            validate_git_ref_object "$CURRENT_HEAD_REF_RESPONSE" "$HEAD_REF" || {
              echo "ERROR: malformed governed reviewer current-head ref evidence for #${PR_NUMBER}." >&2
              exit 1
            }
            if [ "$(jq -r .object.sha <<<"$CURRENT_HEAD_REF_RESPONSE")" != "$HEAD_SHA" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: head moved during review evaluation."
              continue
            fi

            THREADS="$(gh api graphql               -F owner=portyu9               -F repo=portyu9               -F number="$PR_NUMBER"               -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}pageInfo{hasNextPage}}}}}')"
            jq -e '
              (.errors == null) and
              (.data | type == "object") and
              (.data.repository | type == "object") and
              (.data.repository.pullRequest | type == "object") and
              (.data.repository.pullRequest.reviewThreads | type == "object") and
              (.data.repository.pullRequest.reviewThreads.pageInfo | type == "object") and
              (.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | type == "boolean") and
              (.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage == false) and
              (.data.repository.pullRequest.reviewThreads.nodes | type == "array") and
              all(
                .data.repository.pullRequest.reviewThreads.nodes[];
                (type == "object") and (.isResolved | type == "boolean")
              )
            ' <<<"$THREADS" >/dev/null
            test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$THREADS")" = "0"

            if check_required_contexts "$HEAD_SHA" "$LANE"; then
              :
            else
              READY_STATUS=$?
              if [ "$READY_STATUS" -eq 2 ]; then
                echo "Skipping governed bot PR #${PR_NUMBER}: lane-required checks are not ready yet."
                continue
              fi
              exit "$READY_STATUS"
            fi
            if check_quiescent_runs "$HEAD_SHA" "$HEAD_REF"; then
              :
            else
              READY_STATUS=$?
              if [ "$READY_STATUS" -eq 2 ]; then
                echo "Skipping governed bot PR #${PR_NUMBER}: exact head is not quiescent yet."
                continue
              fi
              exit "$READY_STATUS"
            fi
            REVIEW_MARKER="<!-- portyu9-bot-review:v2 base=${MAIN_SHA} head=${HEAD_SHA} -->"
            REVIEW_PAGES="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
            jq -e '
              (type == "array") and (length >= 1) and (length <= 20) and
              (all(.[]; type == "array" and length <= 100)) and
              (all(.[0:-1][]; length == 100)) and
              (all(.[][];
                type == "object" and
                (.id | type == "number" and . == floor and . > 0) and
                (.user | type == "object" and (.login | type == "string" and length > 0)) and
                (.state | type == "string" and
                  (. == "APPROVED" or . == "CHANGES_REQUESTED" or . == "COMMENTED" or . == "DISMISSED" or . == "PENDING")) and
                has("commit_id") and
                (.commit_id == null or (.commit_id | type == "string" and test("^[0-9a-f]{40}$"))) and
                has("body") and
                (.body == null or (.body | type == "string"))
              )) and
              (([.[][] | .id] | length) == ([.[][] | .id] | unique | length))
            ' <<<"$REVIEW_PAGES" >/dev/null || {
              echo "ERROR: malformed or incomplete paginated pull-review evidence." >&2
              exit 1
            }
            REVIEWS="$(jq -c '[.[][]]' <<<"$REVIEW_PAGES")"
            MARKER_REVIEW_COUNT="$(jq --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and ((.body // "") | contains($marker)))] | length' <<<"$REVIEWS")"
            LATEST_MANUAL_DECISIVE_STATE="$(jq -r --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and (.state == "APPROVED" or .state == "CHANGES_REQUESTED") and (((.body // "") | contains($marker)) | not))] | sort_by(.id) | if length == 0 then "" else .[-1].state end' <<<"$REVIEWS")"
            [[ "$MARKER_REVIEW_COUNT" =~ ^[0-9]+$ ]]
            test "$MARKER_REVIEW_COUNT" -le 1 || {
              echo "ERROR: governed bot PR #${PR_NUMBER} has multiple marker-bound portyu9 reviews for the exact head." >&2
              exit 1
            }
            if [ "$LATEST_MANUAL_DECISIVE_STATE" = "CHANGES_REQUESTED" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: a later manual exact-head CHANGES_REQUESTED veto by portyu9 is active."
              continue
            fi
            if [ "$MARKER_REVIEW_COUNT" = "1" ]; then
              MARKER_STATE="$(jq -r --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and ((.body // "") | contains($marker)))] | sort_by(.id) | .[-1].state' <<<"$REVIEWS")"
              if [ "$MARKER_STATE" = "APPROVED" ]; then
                echo "PR #${PR_NUMBER} already has an exact-base/head marker-bound portyu9 approval."
                wake_governed_lane_after_review "$LANE" "$HEAD_REF"
                echo "Re-dispatched idempotent post-review convergence wake for governed bot PR #${PR_NUMBER} (${LANE})."
              else
                echo "Skipping governed bot PR #${PR_NUMBER}: the exact marker-bound portyu9 review was revoked or dismissed and will not be auto-reissued."
              fi
              continue
            fi

            PR_NOW="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
            validate_governed_pr_object "$PR_NOW" "$PR_NUMBER" || {
              echo "ERROR: malformed governed bot PR race evidence for #${PR_NUMBER}." >&2
              exit 1
            }
            if [ "$(jq -r .state <<<"$PR_NOW")" != "open" ] ||
               [ "$(jq -r .draft <<<"$PR_NOW")" != "false" ] ||
               [ "$(jq -r .base.sha <<<"$PR_NOW")" != "$MAIN_SHA" ] ||
               [ "$(jq -r .head.sha <<<"$PR_NOW")" != "$HEAD_SHA" ] ||
               [ "$(jq -r .head.ref <<<"$PR_NOW")" != "$HEAD_REF" ] ||
               [ "$(jq -r .head.repo.full_name <<<"$PR_NOW")" != "$TARGET_REPOSITORY" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: exact PR identity changed before approval."
              continue
            fi
            FINAL_MAIN_REF_RESPONSE="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main")"
            validate_git_ref_object "$FINAL_MAIN_REF_RESPONSE" "main" || {
              echo "ERROR: malformed governed reviewer final-main ref evidence." >&2
              exit 1
            }
            if [ "$(jq -r .object.sha <<<"$FINAL_MAIN_REF_RESPONSE")" != "$MAIN_SHA" ]; then
              echo "Current main moved before final bot-review authorization; ending this pass without approval."
              exit 0
            fi
            FINAL_HEAD_REF_RESPONSE="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}")"
            validate_git_ref_object "$FINAL_HEAD_REF_RESPONSE" "$HEAD_REF" || {
              echo "ERROR: malformed governed reviewer final-head ref evidence for #${PR_NUMBER}." >&2
              exit 1
            }
            if [ "$(jq -r .object.sha <<<"$FINAL_HEAD_REF_RESPONSE")" != "$HEAD_SHA" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: head ref changed before approval."
              continue
            fi
            if check_required_contexts "$HEAD_SHA" "$LANE"; then
              :
            else
              READY_STATUS=$?
              if [ "$READY_STATUS" -eq 2 ]; then
                echo "Skipping governed bot PR #${PR_NUMBER}: lane-required checks changed back to not-ready before approval."
                continue
              fi
              exit "$READY_STATUS"
            fi
            if check_quiescent_runs "$HEAD_SHA" "$HEAD_REF"; then
              :
            else
              READY_STATUS=$?
              if [ "$READY_STATUS" -eq 2 ]; then
                echo "Skipping governed bot PR #${PR_NUMBER}: exact head became active again before approval."
                continue
              fi
              exit "$READY_STATUS"
            fi

            REVIEW_PAGES="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"

            jq -e '
              (type == "array") and (length >= 1) and (length <= 20) and
              (all(.[]; type == "array" and length <= 100)) and
              (all(.[0:-1][]; length == 100)) and
              (all(.[][];
                type == "object" and
                (.id | type == "number" and . == floor and . > 0) and
                (.user | type == "object" and (.login | type == "string" and length > 0)) and
                (.state | type == "string" and
                  (. == "APPROVED" or . == "CHANGES_REQUESTED" or . == "COMMENTED" or . == "DISMISSED" or . == "PENDING")) and
                has("commit_id") and
                (.commit_id == null or (.commit_id | type == "string" and test("^[0-9a-f]{40}$"))) and
                has("body") and
                (.body == null or (.body | type == "string"))
              )) and
              (([.[][] | .id] | length) == ([.[][] | .id] | unique | length))
            ' <<<"$REVIEW_PAGES" >/dev/null || {

              echo "ERROR: malformed or incomplete paginated pull-review evidence." >&2

              exit 1

            }

            REVIEWS="$(jq -c '[.[][]]' <<<"$REVIEW_PAGES")"
            RACE_MARKER_REVIEW_COUNT="$(jq --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and ((.body // "") | contains($marker)))] | length' <<<"$REVIEWS")"
            RACE_MANUAL_DECISIVE_STATE="$(jq -r --arg head "$HEAD_SHA" --arg marker "$REVIEW_MARKER" '[.[] | select(.user.login == "portyu9" and .commit_id == $head and (.state == "APPROVED" or .state == "CHANGES_REQUESTED") and (((.body // "") | contains($marker)) | not))] | sort_by(.id) | if length == 0 then "" else .[-1].state end' <<<"$REVIEWS")"
            [[ "$RACE_MARKER_REVIEW_COUNT" =~ ^[0-9]+$ ]]
            if [ "$RACE_MARKER_REVIEW_COUNT" -gt 0 ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: a marker-bound portyu9 review appeared before the review mutation."
              continue
            fi
            if [ "$RACE_MANUAL_DECISIVE_STATE" = "CHANGES_REQUESTED" ]; then
              echo "Skipping governed bot PR #${PR_NUMBER}: a manual exact-head CHANGES_REQUESTED veto appeared before the review mutation."
              continue
            fi

            REVIEW_PROVENANCE="$(jq -cS -n \
              --arg repository "$TARGET_REPOSITORY" \
              --arg workflowName "Bot PR user approval" \
              --arg workflowPath ".github/workflows/bot-pr-user-approval.yml" \
              --arg event "$WAKE_EVENT_NAME" \
              --arg sourceSha "$GITHUB_SHA" \
              --argjson runId "$GITHUB_RUN_ID" \
              --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg baseSha "$MAIN_SHA" \
              --arg headSha "$HEAD_SHA" \
              --arg lane "$LANE" \
              --argjson prNumber "$PR_NUMBER" \
              --slurpfile retryHistory "$RUNNER_TEMP/bot-review-prior-attempts.json" '
                {
                  schemaVersion:1,
                  kind:"portyu9-bot-review-provenance",
                  repository:$repository,
                  workflow:{
                    name:$workflowName,
                    path:$workflowPath,
                    event:$event,
                    sourceSha:$sourceSha,
                    runId:$runId,
                    runAttempt:$runAttempt
                  },
                  retryHistory:$retryHistory[0],
                  authorization:{
                    prNumber:$prNumber,
                    lane:$lane,
                    baseSha:$baseSha,
                    headSha:$headSha
                  }
                }
              ')"
            REVIEW_PROVENANCE_SHA256="$(printf '%s' "$REVIEW_PROVENANCE" | sha256sum | cut -d' ' -f1)"
            [[ "$REVIEW_PROVENANCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            REVIEW_PROVENANCE_MARKER="<!-- portyu9-bot-review-provenance:v1 sha256=${REVIEW_PROVENANCE_SHA256} -->"
            printf -v BODY '%s\n%s\n%s\n%s' \
              "$REVIEW_MARKER" \
              "$REVIEW_PROVENANCE_MARKER" \
              "$REVIEW_PROVENANCE" \
              "Automated exact-base/head approval by portyu9 after all lane-required protected gates completed successfully for base \`${MAIN_SHA}\` and head \`${HEAD_SHA}\`. Repository bot automation may continue its governed merge path."
            jq -n --arg body "$BODY" --arg commit "$HEAD_SHA"               '{event:"APPROVE",body:$body,commit_id:$commit}' > review-request.json
            REVIEW_HTTP_RESPONSE="$(GH_TOKEN="$REVIEW_TOKEN" gh api --include --method POST               "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews"               --input review-request.json)"
            REVIEW_STATUS_LINE="$(head -n 1 <<<"$REVIEW_HTTP_RESPONSE" | tr -d '\r')"
            [[ "$REVIEW_STATUS_LINE" =~ ^HTTP/[0-9.]+[[:space:]]+200([[:space:]]|$) ]] || {
              echo "ERROR: governed bot review creation returned unexpected status: ${REVIEW_STATUS_LINE}" >&2
              exit 1
            }
            REVIEW_RESPONSE="$(sed '1,/^[[:space:]]*$/d' <<<"$REVIEW_HTTP_RESPONSE")"
            test "$REVIEW_RESPONSE" != "$REVIEW_HTTP_RESPONSE"
            jq -e --arg head "$HEAD_SHA" --arg body "$BODY" '
              (type == "object") and
              (.id | ((type == "number") and . == floor and . > 0)) and
              (.user | type == "object" and (.login == "portyu9")) and
              (.state == "APPROVED") and
              (.commit_id | type == "string" and test("^[0-9a-f]{40}$") and . == $head) and
              (.body | type == "string" and . == $body)
            ' <<<"$REVIEW_RESPONSE" >/dev/null || {
              echo "ERROR: malformed or mismatched governed bot review response for PR #${PR_NUMBER}." >&2
              exit 1
            }
            echo "Submitted exact-base/head marker-bound portyu9 approval for governed bot PR #${PR_NUMBER} at ${HEAD_SHA}."
            wake_governed_lane_after_review "$LANE" "$HEAD_REF"
            echo "Dispatched event-driven post-review convergence wake for governed bot PR #${PR_NUMBER} (${LANE})."
          done < <(jq -c '.[]' <<<"$CANDIDATES")
