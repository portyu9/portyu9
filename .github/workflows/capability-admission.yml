name: Capability admission

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_run:
    workflows:
      - Profile quality
    types:
      - requested
    branches:
      - "codeql-autofix/**"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.15"

jobs:
  admission:
    name: trusted-capability-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read

    steps:
      - name: Bind exact candidate context
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"

          case "$EVENT_NAME" in
            pull_request_target)
              PR="$(jq -c '.pull_request' "$GITHUB_EVENT_PATH")"
              HEAD_REPOSITORY="$(jq -r '.head.repo.full_name' <<<"$PR")"
              ;;
            workflow_run)
              test "$(jq -r '.workflow_run.event // ""' "$GITHUB_EVENT_PATH")" = "pull_request"
              test "$(jq -r '.workflow_run.name // ""' "$GITHUB_EVENT_PATH")" = "Profile quality"
              test "$(jq -r '.workflow_run.path // ""' "$GITHUB_EVENT_PATH")" = ".github/workflows/profile-quality.yml"
              test "$(jq -r '.workflow_run.run_attempt // 0' "$GITHUB_EVENT_PATH")" = "1"
              test "$(jq -r '.workflow_run.actor.login // ""' "$GITHUB_EVENT_PATH")" = "github-actions[bot]"
              PULLS="$(jq -c '.workflow_run.pull_requests' "$GITHUB_EVENT_PATH")"
              test "$(jq 'length' <<<"$PULLS")" = "1"
              PR="$(jq -c '.[0]' <<<"$PULLS")"
              test "$(jq -r '.workflow_run.head_branch' "$GITHUB_EVENT_PATH")" = "$(jq -r '.head.ref' <<<"$PR")"
              test "$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")" = "$(jq -r '.head.sha' <<<"$PR")"
              REPOSITORY_ID="$(jq -r '.repository.id' "$GITHUB_EVENT_PATH")"
              [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
              test "$(jq -r '.base.repo.id' <<<"$PR")" = "$REPOSITORY_ID"
              test "$(jq -r '.head.repo.id' <<<"$PR")" = "$REPOSITORY_ID"
              HEAD_REPOSITORY="$TARGET_REPOSITORY"
              ;;
            *)
              echo "ERROR: unsupported capability-admission event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          BASE_REF="$(jq -r '.base.ref' <<<"$PR")"
          BASE_SHA="$(jq -r '.base.sha' <<<"$PR")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR")"
          test "$BASE_REF" = "main"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            [[ "$HEAD_REF" =~ ^codeql-autofix/alert-[1-9][0-9]*/run-[1-9][0-9]*$ ]]
          fi

          printf 'base_ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'head_repository=%s\n' "$HEAD_REPOSITORY" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 scripts/verify-python-runtime.py

      - name: Fetch exact candidate capability source as data
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ steps.candidate.outputs.base_ref }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_REPOSITORY: ${{ steps.candidate.outputs.head_repository }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          test "$BASE_REF" = "main"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]

          rm -rf candidate-capability-source
          mkdir -p candidate-capability-source/.github/workflows candidate-capability-source/scripts

          COMMIT="$(gh api "repos/${HEAD_REPOSITORY}/git/commits/${HEAD_SHA}")"
          test "$(jq -r .sha <<<"$COMMIT")" = "$HEAD_SHA"
          TREE_SHA="$(jq -r .tree.sha <<<"$COMMIT")"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$TREE_SHA" > candidate-capability-source/.candidate-tree-sha

          TREE="$(gh api "repos/${HEAD_REPOSITORY}/git/trees/${TREE_SHA}?recursive=1")"
          test "$(jq -r .truncated <<<"$TREE")" = "false"

          mapfile -t PATHS < <(
            jq -r '.tree[] | select(.type == "blob") | .path' <<<"$TREE" |
              LC_ALL=C sort
          )
          test "${#PATHS[@]}" -gt 0
          test "$(printf '%s\n' "${PATHS[@]}" | LC_ALL=C sort -u | wc -l)" = "${#PATHS[@]}"

          mapfile -t SELECTED_PATHS < <(
            printf '%s\n' "${PATHS[@]}" |
              python3 scripts/workflow_capability_tcb.py select
          )
          test "${#SELECTED_PATHS[@]}" -gt 0

          POLICY_SEEN=0
          WORKFLOW_SEEN=0
          for PATH_VALUE in "${SELECTED_PATHS[@]}"; do
            if [ "$PATH_VALUE" = ".github/automation-policy-v1.json" ]; then
              POLICY_SEEN=$((POLICY_SEEN + 1))
            fi
            case "$PATH_VALUE" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                WORKFLOW_SEEN=$((WORKFLOW_SEEN + 1))
                ;;
            esac

            ENTRY="$(jq -c --arg path "$PATH_VALUE" '[.tree[] | select(.path == $path)]' <<<"$TREE")"
            test "$(jq 'length' <<<"$ENTRY")" = "1"
            test "$(jq -r '.[0].type' <<<"$ENTRY")" = "blob"
            test "$(jq -r '.[0].mode' <<<"$ENTRY")" = "100644"
            BLOB_SHA="$(jq -r '.[0].sha' <<<"$ENTRY")"
            [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]

            BLOB="$(gh api "repos/${HEAD_REPOSITORY}/git/blobs/${BLOB_SHA}")"
            test "$(jq -r .sha <<<"$BLOB")" = "$BLOB_SHA"
            test "$(jq -r .encoding <<<"$BLOB")" = "base64"
            mkdir -p "candidate-capability-source/$(dirname "$PATH_VALUE")"
            jq -r .content <<<"$BLOB" | tr -d '\n' | base64 --decode > "candidate-capability-source/$PATH_VALUE"
            test -s "candidate-capability-source/$PATH_VALUE"
          done

          test "$POLICY_SEEN" = "1"
          test "$WORKFLOW_SEEN" -ge 1

      - name: Evaluate trusted semantic capability admission
        run: |
          set -euo pipefail
          TREE_SHA="$(cat candidate-capability-source/.candidate-tree-sha)"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/workflow_capability_admission.py \
            candidate-capability-source \
            --candidate-tree-sha "$TREE_SHA" \
            > capability-admission.json
          jq -e '.decision.allowed == true' capability-admission.json >/dev/null
          jq -cS '{decision: .decision, expansionCount: (.diff.expansions | length), reductionCount: (.diff.reductions | length)}' capability-admission.json
