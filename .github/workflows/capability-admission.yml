name: Capability admission

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
  repository_dispatch:
    types:
      - codeql-autofix-admission
      - dependabot-admission
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.13.15"

jobs:
  admission:
    name: trusted-capability-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read

    steps:
      - name: Checkout static trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify resolved Python runtime
        run: python3 scripts/verify-python-runtime.py

      - name: Bind exact candidate context
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          DISPATCH=false
          DEPENDABOT=false
          SPOTLIGHT=false
          SPOTLIGHT_MODE=""
          HAS_CANDIDATE=true

          validate_api_pr_object() {
            local pr="$1" number="$2"
            jq -e --argjson number "$number" '
              (type == "object") and
              (.number | type == "number" and . == floor and . > 0 and . == $number) and
              (.user | (type == "object") and (.login | (type == "string") and length > 0)) and
              (.state == "open") and
              (.draft | type == "boolean") and
              (.maintainer_can_modify | type == "boolean") and
              (.base | type == "object" and
                (.ref | type == "string" and length > 0) and
                (.sha | type == "string" and test("^[0-9a-f]{40}$"))) and
              (.head | type == "object" and
                (.ref | type == "string" and length > 0) and
                (.sha | type == "string" and test("^[0-9a-f]{40}$")) and
                (.repo | type == "object" and
                  (.full_name | type == "string" and length > 0))) and
              (.title | type == "string" and length > 0) and
              has("body") and
              (.body == null or (.body | type == "string"))
            ' <<<"$pr" >/dev/null
          }

          case "$EVENT_NAME" in
            pull_request_target)
              PR="$(jq -c '.pull_request' "$GITHUB_EVENT_PATH")"
              HEAD_REPOSITORY="$(jq -r '.head.repo.full_name' <<<"$PR")"
              ;;
            repository_dispatch)
              ACTION="$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")"
              case "$ACTION" in
                codeql-autofix-admission)
                  PR_NUMBER="$(jq -r '.client_payload.prNumber // 0' "$GITHUB_EVENT_PATH")"
                  ORIGIN_RUN_ID="$(jq -r '.client_payload.originRunId // 0' "$GITHUB_EVENT_PATH")"
                  ALERT_NUMBER="$(jq -r '.client_payload.alertNumber // 0' "$GITHUB_EVENT_PATH")"
                  EXPECTED_BASE_SHA="$(jq -r '.client_payload.baseSha // ""' "$GITHUB_EVENT_PATH")"
                  EXPECTED_HEAD_SHA="$(jq -r '.client_payload.headSha // ""' "$GITHUB_EVENT_PATH")"
                  [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
                  [[ "$ORIGIN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                  [[ "$ALERT_NUMBER" =~ ^[1-9][0-9]*$ ]]
                  [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

                  PR="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
                  validate_api_pr_object "$PR" "$PR_NUMBER" || {
                    echo "ERROR: malformed CodeQL Autofix capability-admission PR evidence for #${PR_NUMBER}." >&2
                    exit 1
                  }
                  test "$(jq -r .state <<<"$PR")" = "open"
                  test "$(jq -r .draft <<<"$PR")" = "false"
                  test "$(jq -r .base.ref <<<"$PR")" = "main"
                  test "$(jq -r .base.sha <<<"$PR")" = "$EXPECTED_BASE_SHA"
                  test "$(jq -r .head.sha <<<"$PR")" = "$EXPECTED_HEAD_SHA"
                  test "$(jq -r .head.repo.full_name <<<"$PR")" = "$TARGET_REPOSITORY"
                  test "$(jq -r .head.ref <<<"$PR")" = "codeql-autofix/alert-${ALERT_NUMBER}/run-${ORIGIN_RUN_ID}"
                  HEAD_REPOSITORY="$TARGET_REPOSITORY"
                  DISPATCH=true
                  ;;
                dependabot-admission)
                  test "$(jq -r '.sender.login // ""' "$GITHUB_EVENT_PATH")" = "github-actions[bot]"
                  PR_NUMBER="$(jq -r '.client_payload.prNumber // 0' "$GITHUB_EVENT_PATH")"
                  EXPECTED_BASE_SHA="$(jq -r '.client_payload.baseSha // ""' "$GITHUB_EVENT_PATH")"
                  EXPECTED_HEAD_SHA="$(jq -r '.client_payload.headSha // ""' "$GITHUB_EVENT_PATH")"
                  [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
                  [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

                  gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/dependabot-pr.json"
                  PR="$(cat "$RUNNER_TEMP/dependabot-pr.json")"
                  validate_api_pr_object "$PR" "$PR_NUMBER" || {
                    echo "ERROR: malformed delegated Dependabot capability-admission PR evidence for #${PR_NUMBER}." >&2
                    exit 1
                  }
                  test "$(jq -r .state <<<"$PR")" = "open"
                  test "$(jq -r .draft <<<"$PR")" = "false"
                  test "$(jq -r .base.ref <<<"$PR")" = "main"
                  test "$(jq -r .base.sha <<<"$PR")" = "$EXPECTED_BASE_SHA"
                  test "$(jq -r .head.sha <<<"$PR")" = "$EXPECTED_HEAD_SHA"
                  test "$(jq -r .head.repo.full_name <<<"$PR")" = "$TARGET_REPOSITORY"
                  test "$(jq -r .maintainer_can_modify <<<"$PR")" = "false"
                  [[ "$(jq -r .head.ref <<<"$PR")" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
                  HEAD_REPOSITORY="$TARGET_REPOSITORY"
                  DEPENDABOT=true
                  ;;
                *)
                  echo "ERROR: unsupported capability-admission repository dispatch: $ACTION" >&2
                  exit 1
                  ;;
              esac
              ;;
            workflow_dispatch|schedule)
              if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                test "$ACTOR" = "github-actions[bot]"
                SPOTLIGHT_MODE="delegated"
              else
                SPOTLIGHT_MODE="scheduled"
              fi
              MAIN_SHA="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
              [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
              gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls?state=open&base=main&per_page=100" > spotlight-open-pr-pages.json
              python3 scripts/workflow_capability_api_collection.py pull-requests \
                --input spotlight-open-pr-pages.json \
                --out spotlight-open-prs.json
              PRS="$(cat spotlight-open-prs.json)"
              MATCHES="$(jq -c --arg main "$MAIN_SHA" '[.[] | select(
                .user.login == "github-actions[bot]" and
                .state == "open" and
                .draft == false and
                .base.ref == "main" and
                .base.sha == $main and
                .head.repo.full_name == "portyu9/portyu9" and
                (.head.ref | test("^automation/spotlight-links/[0-9a-f]{64}$")) and
                .title == "chore: sync rotating Spotlight links" and
                .body == "Automation-managed README-only update. Direct Spotlight repository/workflow links and immutable card snapshot are derived from the validated published evidence. Main protection and all required checks remain in force."
              )]' <<<"$PRS")"
              MATCH_COUNT="$(jq 'length' <<<"$MATCHES")"
              test "$MATCH_COUNT" -le 1
              if [ "$MATCH_COUNT" = "0" ]; then
                HAS_CANDIDATE=false
                printf 'has_candidate=false\n' >> "$GITHUB_OUTPUT"
                printf 'dispatch=false\n' >> "$GITHUB_OUTPUT"
                printf 'dependabot=false\n' >> "$GITHUB_OUTPUT"
                printf 'spotlight=false\n' >> "$GITHUB_OUTPUT"
                printf 'spotlight_mode=%s\n' "$SPOTLIGHT_MODE" >> "$GITHUB_OUTPUT"
                echo "No exact current-main Spotlight candidate needs admission."
                exit 0
              fi
              DISCOVERED_PR="$(jq -c '.[0]' <<<"$MATCHES")"
              PR_NUMBER="$(jq -r .number <<<"$DISCOVERED_PR")"
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
              PR="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
              validate_api_pr_object "$PR" "$PR_NUMBER" || {
                echo "ERROR: malformed Spotlight capability-admission PR evidence for #${PR_NUMBER}." >&2
                exit 1
              }
              test "$(jq -r .number <<<"$PR")" = "$PR_NUMBER"
              test "$(jq -r .user.login <<<"$PR")" = "github-actions[bot]"
              test "$(jq -r .state <<<"$PR")" = "open"
              test "$(jq -r .draft <<<"$PR")" = "false"
              test "$(jq -r .base.ref <<<"$PR")" = "main"
              test "$(jq -r .base.sha <<<"$PR")" = "$MAIN_SHA"
              test "$(jq -r .head.repo.full_name <<<"$PR")" = "$TARGET_REPOSITORY"
              [[ "$(jq -r .head.ref <<<"$PR")" =~ ^automation/spotlight-links/[0-9a-f]{64}$ ]]
              test "$(jq -r .title <<<"$PR")" = "chore: sync rotating Spotlight links"
              test "$(jq -r .body <<<"$PR")" = "Automation-managed README-only update. Direct Spotlight repository/workflow links and immutable card snapshot are derived from the validated published evidence. Main protection and all required checks remain in force."
              test "$(jq -r .maintainer_can_modify <<<"$PR")" = "false"
              HEAD_REPOSITORY="$TARGET_REPOSITORY"
              SPOTLIGHT=true
              ;;
            *)
              echo "ERROR: unsupported capability-admission event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          BASE_REF="$(jq -r '.base.ref' <<<"$PR")"
          BASE_SHA="$(jq -r '.base.sha' <<<"$PR")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR")"
          test "$BASE_REF" = "main"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"

          if [ "$DISPATCH" = "true" ]; then
            [[ "$HEAD_REF" =~ ^codeql-autofix/alert-[1-9][0-9]*/run-[1-9][0-9]*$ ]]
            printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
            printf 'origin_run_id=%s\n' "$ORIGIN_RUN_ID" >> "$GITHUB_OUTPUT"
            printf 'alert_number=%s\n' "$ALERT_NUMBER" >> "$GITHUB_OUTPUT"
          fi

          if [ "$DEPENDABOT" = "true" ]; then
            test "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY"
            [[ "$HEAD_REF" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
            printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

          if [ "$SPOTLIGHT" = "true" ]; then
            test "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY"
            [[ "$HEAD_REF" =~ ^automation/spotlight-links/[0-9a-f]{64}$ ]]
            test "$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)" = "$HEAD_SHA"

            CANDIDATE_COMMIT="$(gh api "repos/${TARGET_REPOSITORY}/git/commits/${HEAD_SHA}")"
            test "$(jq '.parents | length' <<<"$CANDIDATE_COMMIT")" = "1"
            test "$(jq -r '.parents[0].sha' <<<"$CANDIDATE_COMMIT")" = "$BASE_SHA"
            test "$(jq -r .author.name <<<"$CANDIDATE_COMMIT")" = "github-actions[bot]"
            test "$(jq -r .author.email <<<"$CANDIDATE_COMMIT")" = "41898282+github-actions[bot]@users.noreply.github.com"
            test "$(jq -r .committer.name <<<"$CANDIDATE_COMMIT")" = "github-actions[bot]"
            test "$(jq -r .committer.email <<<"$CANDIDATE_COMMIT")" = "41898282+github-actions[bot]@users.noreply.github.com"
            test "$(jq -r .message <<<"$CANDIDATE_COMMIT")" = "chore: sync rotating Spotlight links"

            COMPARE="$(gh api "repos/${TARGET_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}")"
            test "$(jq -r .status <<<"$COMPARE")" = "ahead"
            test "$(jq -r .base_commit.sha <<<"$COMPARE")" = "$BASE_SHA"
            test "$(jq -r .merge_base_commit.sha <<<"$COMPARE")" = "$BASE_SHA"
            test "$(jq -r .ahead_by <<<"$COMPARE")" = "1"
            test "$(jq -r .behind_by <<<"$COMPARE")" = "0"
            test "$(jq -r .total_commits <<<"$COMPARE")" = "1"
            test "$(jq '.files | length' <<<"$COMPARE")" = "1"
            test "$(jq -r '.files[0].filename' <<<"$COMPARE")" = "README.md"
            test "$(jq -r '.files[0].status' <<<"$COMPARE")" = "modified"

            GENERATED_SHA="$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/generated" --jq .object.sha)"
            [[ "$GENERATED_SHA" =~ ^[0-9a-f]{40}$ ]]
            gh api "repos/${TARGET_REPOSITORY}/contents/README.md?ref=${HEAD_SHA}" --jq .content \
              | tr -d '\n' | base64 --decode > spotlight-candidate-readme.md
            README_SHA256="$(sha256sum spotlight-candidate-readme.md | cut -d' ' -f1)"
            [[ "$README_SHA256" =~ ^[0-9a-f]{64}$ ]]
            CANDIDATE_ID="$(printf '%s\n%s\n%s\n' "$BASE_SHA" "$GENERATED_SHA" "$README_SHA256" | sha256sum | cut -d' ' -f1)"
            test "$HEAD_REF" = "automation/spotlight-links/${CANDIDATE_ID}"
            printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

          printf 'has_candidate=%s\n' "$HAS_CANDIDATE" >> "$GITHUB_OUTPUT"
          printf 'dispatch=%s\n' "$DISPATCH" >> "$GITHUB_OUTPUT"
          printf 'dependabot=%s\n' "$DEPENDABOT" >> "$GITHUB_OUTPUT"
          printf 'spotlight=%s\n' "$SPOTLIGHT" >> "$GITHUB_OUTPUT"
          printf 'spotlight_mode=%s\n' "$SPOTLIGHT_MODE" >> "$GITHUB_OUTPUT"
          printf 'base_ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'head_ref=%s\n' "$HEAD_REF" >> "$GITHUB_OUTPUT"
          printf 'head_repository=%s\n' "$HEAD_REPOSITORY" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact trusted base checkout
        if: steps.candidate.outputs.has_candidate == 'true'
        env:
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Verify immutable Autofix controller provenance
        if: steps.candidate.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_REF: ${{ steps.candidate.outputs.head_ref }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          ORIGIN_RUN_ID: ${{ steps.candidate.outputs.origin_run_id }}
          ALERT_NUMBER: ${{ steps.candidate.outputs.alert_number }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PR_NUMBER" -gt 0
          test "$ORIGIN_RUN_ID" -gt 0
          test "$ALERT_NUMBER" -gt 0

          gh api "repos/${TARGET_REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}/artifacts?per_page=100" > artifacts.json
          python3 scripts/codeql_autofix_controller.py artifact \
            --artifacts-file artifacts.json \
            --run-id "$ORIGIN_RUN_ID" \
            --alert "$ALERT_NUMBER" \
            --out artifact.json
          ARTIFACT_ID="$(jq -r .id artifact.json)"
          test "$ARTIFACT_ID" -gt 0
          test "$(jq -r .expired artifact.json)" = "false"
          test "$(jq -r .workflow_run.id artifact.json)" = "$ORIGIN_RUN_ID"
          test "$(jq -r .workflow_run.head_branch artifact.json)" = "main"
          test "$(jq -r .workflow_run.head_sha artifact.json)" = "$BASE_SHA"

          gh api "repos/${TARGET_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > receipt.zip
          unzip -p receipt.zip codeql-autofix-receipt.json > verified-receipt.json
          test -s verified-receipt.json
          test "$(jq -r .controllerId verified-receipt.json)" = "portyu9-codeql-autofix-v1"
          test "$(jq -r .flowId verified-receipt.json)" = "github-codeql-autofix-v1"
          test "$(jq -r .repository verified-receipt.json)" = "$TARGET_REPOSITORY"
          test "$(jq -r .workflowPath verified-receipt.json)" = ".github/workflows/codeql-autofix.yml"
          test "$(jq -r .runId verified-receipt.json)" = "$ORIGIN_RUN_ID"
          test "$(jq -r .baseSha verified-receipt.json)" = "$BASE_SHA"
          test "$(jq -r .alertNumber verified-receipt.json)" = "$ALERT_NUMBER"
          test "$(jq -r .targetBranch verified-receipt.json)" = "$HEAD_REF"
          test "$(jq -r .autofixCommitSha verified-receipt.json)" = "$HEAD_SHA"
          test "$(jq -r .prNumber verified-receipt.json)" = "$PR_NUMBER"
          RECEIPT_ATTEMPT="$(jq -r .runAttempt verified-receipt.json)"
          [[ "$RECEIPT_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          gh api "repos/${TARGET_REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}/attempts/${RECEIPT_ATTEMPT}" > origin-run.json
          test "$(jq -r .id origin-run.json)" = "$ORIGIN_RUN_ID"
          test "$(jq -r .run_attempt origin-run.json)" = "$RECEIPT_ATTEMPT"
          test "$(jq -r .name origin-run.json)" = "CodeQL Autofix controller"
          test "$(jq -r .path origin-run.json)" = ".github/workflows/codeql-autofix.yml"
          test "$(jq -r .event origin-run.json)" = "$(jq -r .event verified-receipt.json)"
          test "$(jq -r .head_branch origin-run.json)" = "main"
          test "$(jq -r .head_sha origin-run.json)" = "$BASE_SHA"
          test "$(jq -r .status origin-run.json)" = "in_progress"
          test "$(jq -r '.conclusion // "null"' origin-run.json)" = "null"

      - name: Fetch exact candidate capability source as data
        if: steps.candidate.outputs.has_candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ steps.candidate.outputs.base_ref }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          HEAD_REPOSITORY: ${{ steps.candidate.outputs.head_repository }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          DEPENDABOT: ${{ steps.candidate.outputs.dependabot }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "portyu9/portyu9"
          test "$BASE_REF" = "main"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]

          rm -rf candidate-capability-source
          mkdir -p candidate-capability-source/.github/workflows candidate-capability-source/scripts

          COMMIT="$(gh api "repos/${HEAD_REPOSITORY}/git/commits/${HEAD_SHA}")"
          test "$(jq -r .sha <<<"$COMMIT")" = "$HEAD_SHA"
          TREE_SHA="$(jq -r .tree.sha <<<"$COMMIT")"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$TREE_SHA" > candidate-capability-source/.candidate-tree-sha

          TREE="$(gh api "repos/${HEAD_REPOSITORY}/git/trees/${TREE_SHA}?recursive=1")"
          test "$(jq -r .truncated <<<"$TREE")" = "false"

          mapfile -t PATHS < <(
            jq -r '.tree[] | select(.type == "blob") | .path' <<<"$TREE" |
              LC_ALL=C sort
          )
          test "${#PATHS[@]}" -gt 0
          test "$(printf '%s\n' "${PATHS[@]}" | LC_ALL=C sort -u | wc -l)" = "${#PATHS[@]}"

          mapfile -t SELECTED_PATHS < <(
            printf '%s\n' "${PATHS[@]}" |
              python3 scripts/workflow_capability_tcb.py select
          )
          test "${#SELECTED_PATHS[@]}" -gt 0

          POLICY_SEEN=0
          WORKFLOW_SEEN=0
          for PATH_VALUE in "${SELECTED_PATHS[@]}"; do
            if [ "$PATH_VALUE" = ".github/automation-policy-v1.json" ]; then
              POLICY_SEEN=$((POLICY_SEEN + 1))
            fi
            case "$PATH_VALUE" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                WORKFLOW_SEEN=$((WORKFLOW_SEEN + 1))
                ;;
            esac

            ENTRY="$(jq -c --arg path "$PATH_VALUE" '[.tree[] | select(.path == $path)]' <<<"$TREE")"
            test "$(jq 'length' <<<"$ENTRY")" = "1"
            test "$(jq -r '.[0].type' <<<"$ENTRY")" = "blob"
            test "$(jq -r '.[0].mode' <<<"$ENTRY")" = "100644"
            BLOB_SHA="$(jq -r '.[0].sha' <<<"$ENTRY")"
            [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]

            BLOB="$(gh api "repos/${HEAD_REPOSITORY}/git/blobs/${BLOB_SHA}")"
            test "$(jq -r .sha <<<"$BLOB")" = "$BLOB_SHA"
            test "$(jq -r .encoding <<<"$BLOB")" = "base64"
            mkdir -p "candidate-capability-source/$(dirname "$PATH_VALUE")"
            jq -r .content <<<"$BLOB" | tr -d '\n' | base64 --decode > "candidate-capability-source/$PATH_VALUE"
            test -s "candidate-capability-source/$PATH_VALUE"
          done

          test "$POLICY_SEEN" = "1"
          test "$WORKFLOW_SEEN" -ge 1

          if [ "$DEPENDABOT" = "true" ]; then
            test "$PR_NUMBER" -gt 0
            gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > dependabot-file-pages.json
            python3 scripts/workflow_capability_api_collection.py files \
              --input dependabot-file-pages.json \
              --out dependabot-changed-paths.txt
            test -s dependabot-changed-paths.txt
            for PATH_VALUE in .github/action-lock.json .github/workflow-capability-bom-v1.json scripts/validate-codeql-contract.py; do
              ENTRY="$(jq -c --arg path "$PATH_VALUE" '[.tree[] | select(.path == $path and .type == "blob")]' <<<"$TREE")"
              test "$(jq 'length' <<<"$ENTRY")" = "1"
              test "$(jq -r '.[0].mode' <<<"$ENTRY")" = "100644"
              BLOB_SHA="$(jq -r '.[0].sha' <<<"$ENTRY")"
              [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]
              BLOB="$(gh api "repos/${HEAD_REPOSITORY}/git/blobs/${BLOB_SHA}")"
              test "$(jq -r .encoding <<<"$BLOB")" = "base64"
              mkdir -p "candidate-capability-source/$(dirname "$PATH_VALUE")"
              jq -r .content <<<"$BLOB" | tr -d '\n' | base64 --decode > "candidate-capability-source/$PATH_VALUE"
              test -s "candidate-capability-source/$PATH_VALUE"
            done
          fi

      - name: Verify delegated Dependabot release provenance
        if: steps.candidate.outputs.dependabot == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 scripts/dependabot_controller.py probe \
            --pr "$RUNNER_TEMP/dependabot-pr.json" \
            --expected-head "$HEAD_SHA" \
            --base-root . \
            --candidate-root candidate-capability-source \
            --out dependabot-probe.json
          DEPENDENCY_REPOSITORY="$(jq -r .dependencyRepository dependabot-probe.json)"
          CANDIDATE_TAG="$(jq -r .after.tag dependabot-probe.json)"
          CANDIDATE_SHA="$(jq -r .after.sha dependabot-probe.json)"
          test "$DEPENDENCY_REPOSITORY" = "github/codeql-action"
          [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git ls-remote --tags "https://github.com/${DEPENDENCY_REPOSITORY}.git" \
            "refs/tags/${CANDIDATE_TAG}" "refs/tags/${CANDIDATE_TAG}^{}" > dependabot-release-refs.txt
          gh api "repos/${DEPENDENCY_REPOSITORY}" > dependabot-release-repository.json
          gh api "repos/${DEPENDENCY_REPOSITORY}/releases/tags/${CANDIDATE_TAG}" > dependabot-release.json
          python3 scripts/dependabot_release.py \
            --refs dependabot-release-refs.txt \
            --repository-json dependabot-release-repository.json \
            --release-json dependabot-release.json \
            --repository "$DEPENDENCY_REPOSITORY" \
            --tag "$CANDIDATE_TAG" \
            --expected-sha "$CANDIDATE_SHA" \
            --out dependabot-release-identity.json
          test "$(jq -r .sha dependabot-release-identity.json)" = "$CANDIDATE_SHA"

      - name: Evaluate trusted semantic capability admission
        if: steps.candidate.outputs.has_candidate == 'true'
        env:
          DEPENDABOT: ${{ steps.candidate.outputs.dependabot }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          TREE_SHA="$(cat candidate-capability-source/.candidate-tree-sha)"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$DEPENDABOT" = "true" ]; then
            RESOLVED_RELEASE_SHA="$(jq -r .sha dependabot-release-identity.json)"
            [[ "$RESOLVED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            python3 scripts/dependabot_capability_admission.py \
              candidate-capability-source \
              --candidate-tree-sha "$TREE_SHA" \
              --pr "$RUNNER_TEMP/dependabot-pr.json" \
              --expected-head-sha "$HEAD_SHA" \
              --resolved-release dependabot-release-identity.json \
              --changed-paths dependabot-changed-paths.txt \
              > capability-admission.json
            test "$(jq -r .decision.authorizationId capability-admission.json)" = "delegated-dependabot-codeql-v1"
          else
            python3 scripts/workflow_capability_admission.py \
              candidate-capability-source \
              --candidate-tree-sha "$TREE_SHA" \
              > capability-admission.json
          fi
          jq -e '.decision.allowed == true' capability-admission.json >/dev/null
          jq -cS '{decision: .decision, expansionCount: (.diff.expansions | length), reductionCount: (.diff.reductions | length)}' capability-admission.json

      - name: Publish exact candidate trusted admission check
        if: steps.candidate.outputs.dispatch == 'true' || steps.candidate.outputs.dependabot == 'true' || steps.candidate.outputs.spotlight == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          ORIGIN_RUN_ID: ${{ steps.candidate.outputs.origin_run_id }}
          DEPENDABOT: ${{ steps.candidate.outputs.dependabot }}
          SPOTLIGHT: ${{ steps.candidate.outputs.spotlight }}
          SPOTLIGHT_MODE: ${{ steps.candidate.outputs.spotlight_mode }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PR_NUMBER" -gt 0
          if [ "$DEPENDABOT" = "true" ]; then
            [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            test "$GITHUB_RUN_ATTEMPT" -le 20
            : > dependabot-prior-attempts.ndjson
            for HISTORY_ATTEMPT in $(seq 1 20); do
              if [ "$HISTORY_ATTEMPT" -ge "$GITHUB_RUN_ATTEMPT" ]; then
                break
              fi
              gh api "repos/${TARGET_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${HISTORY_ATTEMPT}" \
                | jq -c '.' >> dependabot-prior-attempts.ndjson
              sleep 1
            done
            jq -s '.' dependabot-prior-attempts.ndjson > dependabot-prior-attempts.json
            python3 scripts/dependabot_admission_proof.py build \
              --attempts dependabot-prior-attempts.json \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --base-sha "$BASE_SHA" \
              --summary-out dependabot-admission-proof-summary.json \
              --meta-out dependabot-admission-proof-meta.json
            SUMMARY="$(cat dependabot-admission-proof-summary.json)"
            SUMMARY_SHA256="$(jq -r .summarySha256 dependabot-admission-proof-meta.json)"
            [[ "$SUMMARY_SHA256" =~ ^[0-9a-f]{64}$ ]]
            EXTERNAL_ID="dependabot-delegated-admission:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${SUMMARY_SHA256}:${PR_NUMBER}:${BASE_SHA}:${HEAD_SHA}"
            CHECK_NAME="trusted-capability-admission-proof"
          elif [ "$SPOTLIGHT" = "true" ]; then
            test "$SPOTLIGHT_MODE" = "delegated" || test "$SPOTLIGHT_MODE" = "scheduled"
            [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            EXTERNAL_ID="spotlight-admission:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${PR_NUMBER}:${BASE_SHA}:${HEAD_SHA}"
            CHECK_NAME="trusted-capability-admission"
            SUMMARY="Trusted default-branch admission accepted the exact current-main deterministic README-only Spotlight bot candidate."
          else
            test "$ORIGIN_RUN_ID" -gt 0
            EXTERNAL_ID="codeql-autofix-admission:${ORIGIN_RUN_ID}:${PR_NUMBER}:${HEAD_SHA}"
            CHECK_NAME="trusted-capability-admission"
            SUMMARY="Trusted default-branch admission accepted the exact immutable CodeQL Autofix candidate."
          fi
          CHECK="$(gh api --method POST "repos/${TARGET_REPOSITORY}/check-runs" \
            -f name="$CHECK_NAME" \
            -f head_sha="$HEAD_SHA" \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f status=completed \
            -f conclusion=success \
            -f external_id="$EXTERNAL_ID" \
            -f 'output[title]=Trusted capability admission passed' \
            -f "output[summary]=$SUMMARY")"
          jq -e --arg name "$CHECK_NAME" --arg head "$HEAD_SHA" --arg external "$EXTERNAL_ID" --arg summary "$SUMMARY" '
            (type == "object") and
            (.id | type == "number" and . == floor and . > 0) and
            (.name | type == "string" and . == $name) and
            (.head_sha | type == "string" and test("^[0-9a-f]{40}$") and . == $head) and
            (.status | type == "string" and . == "completed") and
            (.conclusion | type == "string" and . == "success") and
            (.external_id | type == "string" and length > 0 and . == $external) and
            (.details_url | type == "string" and test("^https://github\\.com/portyu9/portyu9/runs/[1-9][0-9]*$")) and
            (.output | type == "object" and
              (.title | type == "string" and . == "Trusted capability admission passed") and
              (.summary | type == "string" and . == $summary)) and
            (.app | type == "object" and
              (.id | type == "number" and . == floor and . == 15368) and
              (.slug | type == "string" and . == "github-actions"))
          ' <<<"$CHECK" >/dev/null || {
            echo "ERROR: malformed or mismatched trusted capability-admission check-run creation response." >&2
            exit 1
          }
          [[ "$(jq -r .id <<<"$CHECK")" =~ ^[1-9][0-9]*$ ]]
          test "$(jq -r .name <<<"$CHECK")" = "$CHECK_NAME"
          test "$(jq -r .head_sha <<<"$CHECK")" = "$HEAD_SHA"
          test "$(jq -r .status <<<"$CHECK")" = "completed"
          test "$(jq -r .conclusion <<<"$CHECK")" = "success"
          test "$(jq -r .external_id <<<"$CHECK")" = "$EXTERNAL_ID"
          test "$(jq -r .app.id <<<"$CHECK")" = "15368"
