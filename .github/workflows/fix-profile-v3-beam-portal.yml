name: Fix profile V3 beam and portal precision

on:
  push:
    branches: [profile-animation-v3]

permissions:
  contents: write

jobs:
  fix-animation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-animation-v3
          fetch-depth: 1

      - name: Remove oversized beam and sharpen portal animation
        shell: bash
        run: |
          python -B - <<'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          v3_path = Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg')
          v2_path = Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v2.svg')
          workflow_path = Path('.github/workflows/fix-profile-v3-beam-portal.yml')

          v3 = v3_path.read_text(encoding='utf-8')
          v2 = v2_path.read_text(encoding='utf-8')

          counts_before = {
              'v3_circle': v3.count('<circle'),
              'v3_ellipse': v3.count('<ellipse'),
              'v2_circle': v2.count('<circle'),
              'v2_ellipse': v2.count('<ellipse'),
          }

          # Restore the original thin beam treatment on the existing path.
          beam_d = 'M0 595C150 650 290 560 470 598C620 630 700 705 835 754'
          beam_re = re.compile(
              r'<path id="v3-diagonal-evidence-beam" d="' + re.escape(beam_d) + r'".*?</path>',
              re.DOTALL,
          )
          beam_matches = beam_re.findall(v3)
          if len(beam_matches) != 1:
              raise SystemExit(f'Expected exactly one V3 diagonal beam, found {len(beam_matches)}')

          thin_beam = (
              f'<path id="v3-diagonal-evidence-beam" d="{beam_d}" fill="none" '
              'stroke="#E328FC" stroke-width="1.5" stroke-dasharray="12 24" opacity=".32">'
              '<animate attributeName="stroke-dashoffset" values="0;-168" dur="5.9s" '
              'begin="-0.0s" repeatCount="indefinite"/></path>'
          )
          v3 = beam_re.sub(thin_beam, v3, count=1)

          # Remove Gaussian filtering from the actual animated portal geometry.
          portal_old = '<g class="motion" transform="translate(972 790)" filter="url(#glow)">'
          portal_new = '<g class="motion" transform="translate(972 790)" shape-rendering="geometricPrecision">'
          packets_old = '<g class="motion" filter="url(#softGlow)">'
          packets_new = '<g class="motion" shape-rendering="geometricPrecision">'

          def sharpen_portal(text: str, label: str) -> str:
              if text.count(portal_old) != 1:
                  raise SystemExit(f'{label}: expected one blurred portal group, found {text.count(portal_old)}')
              if text.count(packets_old) != 1:
                  raise SystemExit(f'{label}: expected one blurred energy-packet group, found {text.count(packets_old)}')
              text = text.replace(portal_old, portal_new, 1)
              text = text.replace(packets_old, packets_new, 1)
              return text

          v3 = sharpen_portal(v3, 'desktop V3')
          v2 = sharpen_portal(v2, 'mobile V2')

          counts_after = {
              'v3_circle': v3.count('<circle'),
              'v3_ellipse': v3.count('<ellipse'),
              'v2_circle': v2.count('<circle'),
              'v2_ellipse': v2.count('<ellipse'),
          }
          if counts_after != counts_before:
              raise SystemExit(f'Circle/ellipse geometry changed: before={counts_before}, after={counts_after}')

          beam_check = beam_re.findall(v3)
          if len(beam_check) != 1:
              raise SystemExit('Thin V3 beam disappeared during patch')
          beam_markup = beam_check[0]
          required = ['stroke="#E328FC"', 'stroke-width="1.5"', 'stroke-dasharray="12 24"', 'opacity=".32"']
          for token in required:
              if token not in beam_markup:
                  raise SystemExit(f'Thin beam missing required token: {token}')
          if 'attributeName="stroke-width"' in beam_markup or 'url(#v3DataBeam)' in beam_markup:
              raise SystemExit('Oversized/animated V3 beam treatment still present')

          for label, text in [('desktop V3', v3), ('mobile V2', v2)]:
              if portal_old in text or packets_old in text:
                  raise SystemExit(f'{label}: blurred central animation filter still present')
              if text.count(portal_new) != 1 or text.count(packets_new) != 1:
                  raise SystemExit(f'{label}: crisp portal markers missing or duplicated')
              ET.fromstring(text)

          v3_path.write_text(v3, encoding='utf-8')
          v2_path.write_text(v2, encoding='utf-8')
          workflow_path.unlink()

          print('Desktop V3 beam restored to original thin 1.5px treatment.')
          print('Desktop V3 portal blur removed from rings and orbiting packets.')
          print('Mobile V2 portal received the same crisp vector treatment.')
          print('Circle/ellipse geometry preserved:', counts_after)
          PY

      - name: Validate profile
        shell: bash
        run: |
          git diff --check
          PYTHONDONTWRITEBYTECODE=1 python -B scripts/validate-profile-v4.py
          test ! -e .github/workflows/fix-profile-v3-beam-portal.yml
          grep -q 'id="v3-diagonal-evidence-beam"' assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg
          grep -q 'stroke-width="1.5" stroke-dasharray="12 24" opacity=".32"' assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg
          ! grep -q 'transform="translate(972 790)" filter="url(#glow)"' assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg
          ! grep -q 'transform="translate(972 790)" filter="url(#glow)"' assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v2.svg

      - name: Commit corrected animation
        shell: bash
        run: |
          git config user.name "Ƴunior Ƥortal"
          git config user.email "35150859+portyu9@users.noreply.github.com"
          git add -A
          git commit -m "fix(profile): remove duplicate beam and sharpen portal motion"
          git push origin HEAD:profile-animation-v3
