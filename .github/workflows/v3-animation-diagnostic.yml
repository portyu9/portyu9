name: V3 animation diagnostic

on:
  push:
    branches: [profile-animation-v3]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-animation-v3
      - name: Inspect V3 SVG target candidates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import re

          files = [
              Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg'),
              Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3-mobile.svg'),
          ]
          out = []
          for path in files:
              out.append(f'=== {path} ===')
              root = ET.parse(path).getroot()
              parent = {c: p for p in root.iter() for c in p}

              def ancestry(el):
                  bits=[]
                  cur=parent.get(el)
                  while cur is not None and cur is not root:
                      a=cur.attrib
                      useful=[]
                      for k in ('id','class','transform','opacity','fill','stroke'):
                          if a.get(k): useful.append(f'{k}={a[k]}')
                      if useful: bits.append('g[' + ', '.join(useful) + ']')
                      cur=parent.get(cur)
                  return ' <- '.join(bits[:5])

              out.append('--- elements carrying v3 ids/classes/refs ---')
              for el in root.iter():
                  attrs=' '.join(f'{k}={v}' for k,v in el.attrib.items())
                  if 'v3' in attrs.lower():
                      tag=el.tag.rsplit('}',1)[-1]
                      a=dict(el.attrib)
                      if 'd' in a and len(a['d'])>220: a['d']=a['d'][:220]+'...'
                      out.append(f'{tag}: {a} | ancestors: {ancestry(el)}')

              out.append('--- compact base vector candidates outside v3 refinement ---')
              v3group=next((e for e in root.iter() if e.attrib.get('id')=='v3-cinematic-refinement'),None)
              v3desc=set(v3group.iter()) if v3group is not None else set()
              for el in root.iter():
                  if el in v3desc: continue
                  tag=el.tag.rsplit('}',1)[-1]
                  a=el.attrib
                  if tag=='path':
                      d=a.get('d','')
                      if d and len(d)<=220:
                          nums=[float(x) for x in re.findall(r'-?\d+(?:\.\d+)?',d)]
                          if len(nums)>=4:
                              out.append(f'path d={d!r} attrs={dict(a)} | ancestors: {ancestry(el)}')
                  elif tag in {'circle','ellipse','line','polyline','polygon'}:
                      out.append(f'{tag} attrs={dict(a)} | ancestors: {ancestry(el)}')
              out.append('')

          Path('v3-animation-candidates.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit candidate report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3-animation-candidates.txt
          git commit -m "chore: capture v3 target candidates" || exit 0
          git push origin HEAD:profile-animation-v3
