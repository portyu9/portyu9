name: V3 animation diagnostic

on:
  push:
    branches: [profile-animation-v3]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-animation-v3
      - name: Shortlist original SVG targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          src = Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg')
          root = ET.parse(src).getroot()
          parent = {c:p for p in root.iter() for c in p}
          v3 = next((e for e in root.iter() if e.attrib.get('id') == 'v3-cinematic-refinement'), None)
          v3set = set(v3.iter()) if v3 is not None else set()
          rows=[]

          def tag(e): return e.tag.rsplit('}',1)[-1]
          def desc(e):
              a=dict(e.attrib)
              if 'd' in a and len(a['d']) > 180: a['d']=a['d'][:180]+'...'
              return f'{tag(e)} {a}'
          def pdesc(e):
              p=parent.get(e)
              return dict(p.attrib) if p is not None else {}

          rows.append('=== CIRCLE GROUPS WITH PATH/LINES (likely icon glyph containers) ===')
          for c in root.iter():
              if c in v3set or tag(c) != 'circle': continue
              try: r=float(c.attrib.get('r','0'))
              except: r=0
              if r < 8: continue
              p=parent.get(c)
              if p is None: continue
              siblings=[s for s in list(p) if s not in v3set and tag(s) in {'path','polyline','polygon','line','circle'}]
              glyphs=[s for s in siblings if s is not c and tag(s) in {'path','polyline','polygon','line'}]
              if glyphs:
                  rows.append(f'CIRCLE {desc(c)} | parent={pdesc(c)}')
                  for g in glyphs[:8]: rows.append('  sibling '+desc(g))

          rows.append('\n=== SHORT CYAN/GREEN DIAGONAL/STROKED PATHS OUTSIDE V3 ===')
          for e in root.iter():
              if e in v3set or tag(e)!='path': continue
              a=e.attrib; d=a.get('d',''); stroke=a.get('stroke','')
              if not d or len(d)>220: continue
              if stroke in {'#00E6FF','#00FBCC','url(#tri)','url(#triReverse)','url(#v2t)'}:
                  rows.append(desc(e)+' | parent='+str(pdesc(e)))

          Path('v3-target-shortlist.txt').write_text('\n'.join(rows[:220]), encoding='utf-8')
          PY
      - name: Commit shortlist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3-target-shortlist.txt
          git commit -m "chore: capture original v3 target shortlist" || exit 0
          git push origin HEAD:profile-animation-v3
