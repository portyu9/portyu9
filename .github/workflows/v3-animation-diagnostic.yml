name: V3 animation surgical cleanup

on:
  push:
    branches: [profile-animation-v3]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-animation-v3
          fetch-depth: 0

      - name: Remove synthetic V3 overlay geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          files = [
              Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg'),
              Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3-mobile.svg'),
          ]

          def remove_group_by_id(text: str, element_id: str):
              marker = f'id="{element_id}"'
              pos = text.find(marker)
              if pos < 0:
                  return text, False
              start = text.rfind('<g', 0, pos)
              if start < 0:
                  raise RuntimeError(f'opening group for {element_id} not found')
              token_re = re.compile(r'<g(?:\s|>)|</g>')
              depth = 0
              for m in token_re.finditer(text, start):
                  token = m.group(0)
                  if token.startswith('<g'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return text[:start] + text[m.end():], True
              raise RuntimeError(f'unbalanced group for {element_id}')

          for path in files:
              text = path.read_text(encoding='utf-8')
              text, removed = remove_group_by_id(text, 'v3-cinematic-refinement')
              if not removed:
                  raise RuntimeError(f'{path}: v3-cinematic-refinement not found')
              if 'v3-cinematic-refinement' in text:
                  raise RuntimeError(f'{path}: residual rendered V3 refinement group')
              path.write_text(text, encoding='utf-8')
              ET.parse(path)
              print(f'cleaned and parsed: {path}')
          PY

      - name: Restore unrelated files from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            assets/github-profile-top-nebula-animated.svg \
            assets/github-profile-bottom-nebula-animated.svg \
            assets/profile-badges/robotic-automation-neural-interface-nebula-portal-animated.svg \
            scripts/validate_profile_animation.py

      - name: Remove temporary diagnostics
        shell: bash
        run: |
          rm -f \
            .github/workflows/v3-animation-diagnostic.yml \
            v3-animation-diagnostic.txt \
            v3-animation-candidates.txt \
            v3-target-shortlist.txt \
            v3-exact-targets.txt \
            v3-hook-snippets.txt

      - name: Verify surgical scope and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in (
              Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg'),
              Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3-mobile.svg'),
          ):
              ET.parse(p)
              s = p.read_text(encoding='utf-8')
              assert 'v3-cinematic-refinement' not in s
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "Final branch diff paths:"
          git diff --cached --name-only
          git commit -m "fix(profile): remove duplicate v3 animation overlays"
          git push origin HEAD:profile-animation-v3
