name: V3 animation diagnostic

on:
  push:
    branches: [profile-animation-v3]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-animation-v3
      - name: Inspect status and beam hooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('assets/profile-badges/quality-engineering-automation-systems-nebula-portal-animated-v3.svg').read_text(encoding='utf-8')
          rows=[]
          for term in ('status','check','beam','data','beta','pi','v3-status','v3-data'):
              rows.append(f'=== {term} ===')
              seen=[]
              for m in re.finditer(term,src,re.I):
                  a=max(0,m.start()-420); b=min(len(src),m.end()+620)
                  snippet=src[a:b].replace('\n',' ')
                  if snippet not in seen:
                      rows.append(snippet)
                      seen.append(snippet)
                  if len(seen)>=8: break
          Path('v3-hook-snippets.txt').write_text('\n\n'.join(rows),encoding='utf-8')
          PY
      - name: Commit hook snippets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3-hook-snippets.txt
          git commit -m "chore: capture v3 status and beam hooks" || exit 0
          git push origin HEAD:profile-animation-v3
