version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    groups:
      codeql-action-release:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
