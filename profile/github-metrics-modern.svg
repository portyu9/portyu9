<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">GitHub metrics</title>
  <desc id="desc">Live GitHub metrics will populate after the generator runs.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="0.5" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#00aeef"/>
    </linearGradient>
  </defs>
  <rect width="900" height="150" rx="18" fill="#0d1117"/>
  <rect x="2" y="2" width="896" height="146" rx="16" fill="none" stroke="url(#g)" stroke-width="4"/>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#f0f6fc">GitHub Metrics · Modern Rich View</text>
  <text x="450" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#8b949e">Live activity, language, calendar and star signals populate after merge.</text>
</svg>
